/* ============================================================
   リアルタイム進行スケジューラ
   ============================================================ */
let isRunning = false;
let speed = 1;
let tickerSpeed = 1; // 1=標準。大きいほど速く流れる（0.5〜3）
let tickIntervalId = null;
const BASE_TICK_MS = 20000; // 1四半期あたりの基準時間（ミリ秒）。×1で20秒

function tickMs(){ return BASE_TICK_MS / speed; }

function runTickOnce(){
  if(!state || state.gameOver || modal) return;
  tick(state);
  mandaOffers = mandaOffers.filter(m=>m.expiresTurn >= state.turn);
  render();
  autoSave();
}

function startTimer(){
  if(tickIntervalId) clearInterval(tickIntervalId);
  isRunning = true;
  tickIntervalId = setInterval(runTickOnce, tickMs());
}
function stopTimer(){
  isRunning = false;
  if(tickIntervalId){ clearInterval(tickIntervalId); tickIntervalId = null; }
}
function toggleRun(){
  if(state.gameOver) return;
  if(isRunning) stopTimer(); else startTimer();
  render();
}
function setSpeed(mult){
  speed = mult;
  if(isRunning) startTimer();
  render();
}

/* ============================================================
   ユーティリティ
   ============================================================ */
function yen(n){
  n = Number(n);
  if(!isFinite(n)) return '—';
  n = Math.round(n);
  const neg = n < 0; n = Math.abs(n);
  let out;
  if(n >= 100000000){ out = (n/100000000).toFixed(2).replace(/\.00$/,'').replace(/(\.\d)0$/,'$1') + '億円'; }
  else if(n >= 10000){ out = Math.round(n/10000).toLocaleString('ja-JP') + '万円'; }
  else { out = n.toLocaleString('ja-JP') + '円'; }
  return (neg?'▲':'') + out;
}
function num(n){ n=Number(n); if(!isFinite(n)) return '—'; return Math.round(n).toLocaleString('ja-JP'); }
function pct(n,d){ d=d===undefined?1:d; n=Number(n); if(!isFinite(n)) return '—'; return (n*100).toFixed(d)+'%'; }
function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }

/* ---- アップグレード効果 ---- */
function techCapacityPerHead(s){
  let cap = C.TECH_CAPACITY;
  if(s.upgrades && s.upgrades.iot) cap += 12;
  if(s.upgrades && s.upgrades.training) cap += 18;
  if(s.executives && s.executives.hr_dir) cap += 8;
  const skill = (s.techSkill!=null ? s.techSkill : 50);
  cap += (skill - 50) * 0.45;
  const maxCap = C.TECH_CAPACITY_MAX || 150;
  return clamp(Math.round(cap), 40, maxCap);
}
function publicCapacity(s){
  return Math.max(0, s.inspectors||0) * techCapacityPerHead(s);
}
function ensureInspectors(s){
  if(s.inspectors == null) s.inspectors = Math.min(1, Math.max(0, s.techs||0));
  if((s.inspectors||0) > (s.techs||0)) s.inspectors = Math.max(0, s.techs||0);
  if(!s.inspectorPipeline) s.inspectorPipeline = [];
}
function repairPerTechAnnual(s){
  const skill = clamp(s.techSkill!=null ? s.techSkill : 50, 0, 100);
  const minR = C.REPAIR_PER_TECH_MIN || 1000000;
  const maxR = C.REPAIR_PER_TECH_MAX || 7000000;
  return minR + (skill/100) * (maxR - minR);
}
function repairRevenueAnnual(s){
  const techs = Math.max(0, s.techs||0);
  if(techs <= 0) return 0;
  const per = repairPerTechAnnual(s);
  const util = baseCapacity(s)>0 ? clamp(s.units / baseCapacity(s), 0.30, 1.20) : 0.5;
  const pog = (s.contractMix && s.contractMix.pog != null) ? s.contractMix.pog : 0.45;
  return techs * per * util * (0.50 + pog * 0.85);
}
function baseCapacity(s){
  // リニューアル専門部隊に配置した技術者は日常保守の定員から外す
  const generalTechs = Math.max(0, (s.techs||0) - (s.renewalSpecialists||0));
  return generalTechs * techCapacityPerHead(s);
}
function capacity(s){
  return baseCapacity(s) + (s.outsourceUnits||0) + (s.overtimeUnits||0);
}
/** 経過30年以上とみなす保有台数（平均年齢から推定） */
function unitsAgedForRenewal(s){
  const age = s.portfolioAge!=null ? s.portfolioAge : 4.5;
  const minAge = C.RENEWAL_MIN_AGE_YEARS || 30;
  // 平均が若いほど30年超は稀。平均が30に近づくと急増
  // age 20→約2%, 25→8%, 30→22%, 35→35%, 40→45%
  const ratio = clamp((age - (minAge - 12)) / 40, 0, 0.50);
  return Math.max(0, Math.round((s.units||0) * ratio));
}
/** 営業のリニューアル提案力（人数・質・負荷）。0に近いと受注不能 */
function renewalSalesPower(s){
  const staff = Math.max(0, s.salesStaff||0);
  const skill = clamp(s.salesSkill!=null ? s.salesSkill : 50, 0, 100);
  if(staff <= 0) return 0;
  // 質が低いと提案・クロージングがほぼできない
  if(skill < 32) return 0.05;
  let p = salesForceMult(s); // 人数・理想比・技能を織り込み済み
  // リニューアルは説明・合意形成が重いので技能の影響を強める
  p *= (0.55 + skill/100 * 0.70);
  const load = typeof salesLoad==='function' ? salesLoad(s) : 1;
  if(load > 1.25) p *= 0.75;
  if(load > 1.55) p *= 0.7;
  if(s.executives && s.executives.sales_dir) p *= 1.12;
  return clamp(p, 0, 1.8);
}
/** 今期追えるリニューアル台数の上限（技術キャパ×営業キャパの小さい方） */
function renewalChaseCapacity(s){
  const salesP = renewalSalesPower(s);
  if(salesP < 0.12) return 0; // 営業不足で提案自体が回らない
  const elite = Math.max(0, s.renewalSpecialists||0);
  const skill = clamp(s.techSkill!=null ? s.techSkill : 50, 0, 100);
  let techCap;
  if(elite > 0){
    techCap = elite * (C.RENEWAL_SPECIALIST_CAP_Q||14) * (0.85 + skill/100*0.35);
  } else {
    const general = Math.max(0, (s.techs||0));
    const soft = Math.max(0, (skill - 50) / 50);
    techCap = Math.min(12, general * (C.RENEWAL_GENERAL_CAP_Q||4) * (0.15 + soft * 0.35));
  }
  // 営業1人あたりの追客目安（技能で上下）。リニューアルは conserv より重い
  const staff = Math.max(0, s.salesStaff||0);
  const sSkill = clamp(s.salesSkill!=null ? s.salesSkill : 50, 0, 100);
  const salesCap = staff * (5 + sSkill/100 * 10) * clamp(salesP, 0.2, 1.5);
  return Math.max(0, Math.round(Math.min(techCap, salesCap)));
}
/* 事務員：契約管理・請求・定期検査報告・顧客窓口のバックオフィス能力 */
function adminCapacity(s){
  const heads = Math.max(0, s.admins||0);
  // 人事統括役員がいると事務効率がやや上がる
  const per = C.ADMIN_CAPACITY * (s.executives && s.executives.hr_dir ? 1.1 : 1);
  return Math.max(1, heads * per);
}
function adminLoad(s){
  // 官公庁・管理組合比率が高いと、台数以上に事務負荷が重い
  const factor = (typeof segmentAdminLoadFactor==='function') ? segmentAdminLoadFactor(s) : 1;
  const pmi = (s.pmiAdminMult!=null && s.pmiAdminMult>0) ? s.pmiAdminMult : 1;
  return (s.units * factor * pmi) / adminCapacity(s);
}
/** 1.0=標準。過負荷で低下、適正配置で最大約1.12 */
function adminSupportMult(s){
  const load = adminLoad(s);
  if(load > 1.5)  return 0.58;
  if(load > 1.3)  return 0.70;
  if(load > 1.15) return 0.80;
  if(load > 1.0)  return 0.90;
  if(load > 0.85) return 1.0;
  // 適正〜余裕：営業事務・契約管理の品質が上がる
  return clamp(1.0 + (0.85 - load) * 0.28, 1.0, 1.18);
}
/** 事務過負荷による販管費の膨張係数（請求遅延・派遣事務・督促・クレーム） */
function adminSgaMult(s){
  const load = adminLoad(s);
  if(load <= 0.9) return 0.90;
  if(load <= 1.0) return 0.96;
  return 1.0 + Math.min(0.85, (load - 1.0) * 0.65);
}
/** 入金・請求の健全性（1=正常、低いほど売掛回収が遅れる） */
function adminCollectionMult(s){
  const load = adminLoad(s);
  if(load <= 1.0) return 1.0;
  return clamp(1.0 - (load - 1.0) * 0.12, 0.70, 1.0);
}
/** 更新工事・大型提案の事務準備力 */
function adminProposalMult(s){
  return 0.85 + (adminSupportMult(s) - 0.85) * 0.9;
}

/** 顧客ポートフォリオの加重平均特性 */
function portfolioSegmentMix(s){
  const total = Math.max(1, SEGMENT_IDS.reduce((a,id)=>a+(s.segmentUnits[id]||0),0));
  const mix = {};
  SEGMENT_IDS.forEach(id=>{ mix[id] = (s.segmentUnits[id]||0)/total; });
  return mix;
}
function segmentAdminLoadFactor(s){
  const mix = portfolioSegmentMix(s);
  let f = 0;
  SEGMENT_IDS.forEach(id=>{ f += mix[id] * CUSTOMER_SEGMENTS[id].adminLoad; });
  return f || 1;
}
/** セグメント別の営業パワー（独立系視点） */
function segmentSalesPower(s, segId){
  const seg = CUSTOMER_SEGMENTS[segId];
  if(!seg) return 1;
  // 価格: 安いほど価格感応セグメントに効く
  if(segId === 'public'){
    ensureInspectors(s);
    if((s.inspectors||0) < 1) return 0.02;
    const pubCap = publicCapacity(s);
    const pubUnits = (s.segmentUnits && s.segmentUnits.public) || 0;
    if(pubCap <= pubUnits * 0.95) return 0.08;
  }
  const priceIndex = clamp(1.15 - (s.price / 240000), 0.4, 1.3);
  const pricePart = Math.pow(priceIndex, seg.priceSens);
  // 品質・評判: ブランド志向セグメントはメーカー系に流れやすい→品質と信用で対抗
  const trust = (s.quality/100)*0.5 + (s.reputation/100)*0.5;
  const brandPart = Math.pow(0.55 + trust*0.7, seg.brandPref);
  // 上場・信用
  const credit = s.isListed ? (s.exchange==='prime'?1.15:1.08) : 1.0;
  // 事務余力（官公庁・管理組合は特に必要）
  const adminPart = Math.pow(adminSupportMult(s), 0.6 + (seg.adminLoad-1)*0.5);
  // 独立系への開放度
  const open = 0.7 + seg.switchOpen * 0.5;
  return Math.max(0.05, pricePart * brandPart * credit * adminPart * open * seg.speed);
}
function syncSegmentUnitsTotal(s){
  // regionUnits合計とsegmentUnits合計を一致させる（差分は最大セグメントへ）
  const ru = Object.values(s.regionUnits||{}).reduce((a,b)=>a+b,0);
  const su = SEGMENT_IDS.reduce((a,id)=>a+(s.segmentUnits[id]||0),0);
  s.units = ru;
  if(su <= 0 && ru > 0){
    const w = SEGMENT_IDS.reduce((a,id)=>a+CUSTOMER_SEGMENTS[id].marketWeight,0);
    SEGMENT_IDS.forEach(id=>{ s.segmentUnits[id] = Math.round(ru * CUSTOMER_SEGMENTS[id].marketWeight / w); });
  } else if(su > 0 && ru !== su){
    const scale = ru / su;
    SEGMENT_IDS.forEach(id=>{ s.regionUnits; s.segmentUnits[id] = Math.max(0, Math.round((s.segmentUnits[id]||0)*scale)); });
    // 端数調整
    let su2 = SEGMENT_IDS.reduce((a,id)=>a+(s.segmentUnits[id]||0),0);
    const diff = ru - su2;
    if(diff !== 0){
      const top = SEGMENT_IDS.slice().sort((a,b)=>(s.segmentUnits[b]||0)-(s.segmentUnits[a]||0))[0];
      s.segmentUnits[top] = Math.max(0, (s.segmentUnits[top]||0) + diff);
    }
  }
}



/** 他社動向：スタイル別戦略・プレイヤー反応・業界再編をまとめて処理 */
function rivalIntelLevel(s){
  if(s.rivalIntel != null) return clamp(Math.round(s.rivalIntel), 1, 3);
  const dd = DIFFICULTIES[s.difficulty] || DIFFICULTIES.normal;
  return dd.rivalIntel != null ? dd.rivalIntel : 2;
}
function computePlayerThreat(s){
  let t = 0;
  t += clamp((s.units||0)/8000, 0, 0.35);
  t += s.isListed ? 0.12 : 0;
  t += (s.subsidiaries||[]).length * 0.06;
  t += (s.pmiJobs||[]).filter(j=>j.status==='active').length * 0.08;
  if(s.history && s.history.length>=2){
    const g = (s.history[s.history.length-1].units||0) - (s.history[s.history.length-2].units||0);
    if(g > 80) t += 0.1;
    if(g > 200) t += 0.08;
  }
  const avgRival = (s.rivals||[]).reduce((a,r)=>a+(r.units||0),0) / Math.max(1,(s.rivals||[]).length);
  if((s.units||0) > avgRival * 0.7) t += 0.1;
  return clamp(t, 0, 1);
}
function playerPmiRegions(s){
  const ids = {};
  (s.pmiJobs||[]).filter(j=>j.status==='active').forEach(j=>{
    if(j.regionId) ids[j.regionId] = true;
  });
  (s.subsidiaries||[]).filter(sub=>sub.integrating && sub.regionId).forEach(sub=>{
    ids[sub.regionId] = true;
  });
  return ids;
}
function analyzePlayerWeaknesses(s){
  const pmiRegs = typeof playerPmiRegions==='function' ? playerPmiRegions(s) : {};
  const util = (typeof baseCapacity==='function' && baseCapacity(s)>0) ? (s.units||0)/baseCapacity(s) : 1;
  const global = {
    quality: (s.quality||50) < 50,
    highPrice: (s.price||240000) > 280000,
    overUtil: util > 1.05,
    lowMorale: (s.morale||60) < 45,
    lowIntegrity: (s.integrity||50) < 35,
    thinStaff: util > 0.95,
  };
  const regions = {};
  REGIONS.forEach(rg=>{
    const mine = s.regionUnits[rg.id]||0;
    const mkt = (typeof regionMarket==='function' ? regionMarket(s, rg.id) : 0) || 1;
    const share = mkt > 0 ? mine / mkt : 0;
    let weak = 0;
    if(mine > 30 && share < 0.12) weak += 12;
    if(mine > 80 && share < 0.08) weak += 8;
    if(mine > 200 && (s.quality||50) < 55) weak += 10;
    if(pmiRegs[rg.id]) weak += 20;
    if(global.highPrice && (s.reputation||50) < 55 && mine > 40) weak += 8;
    if(global.overUtil && mine > 50) weak += 6;
    regions[rg.id] = weak;
  });
  return {global, regions, util};
}
function pickRivalTargetRegion(s, r, intel){
  const pmiRegs = playerPmiRegions(s);
  const weak = typeof analyzePlayerWeaknesses==='function' ? analyzePlayerWeaknesses(s) : {regions:{}, global:{}};
  let best = null, bestScore = -1e9;
  REGIONS.forEach(rg=>{
    const mine = s.regionUnits[rg.id]||0;
    const theirs = r.regionUnits[rg.id]||0;
    const mkt = regionMarket(s, rg.id) || 1;
    let score = 0;
    score += mkt * 0.00002;
    if(intel >= 2){
      score += mine * 0.015;
      if(mine > theirs) score += 8;
      score += (weak.regions[rg.id]||0) * (intel >= 3 ? 1.4 : 1.0);
    }
    if(theirs < mkt * 0.05) score += 6;
    if(intel <= 1 && rg.id === r.hq) score += 12;
    if(intel >= 3 && pmiRegs[rg.id]) score += 18;
    if(theirs > 0) score += 3;
    if(intel >= 3 && mine === Math.max(...REGIONS.map(x=>s.regionUnits[x.id]||0)) && mine > 100) score += 10;
    score += Math.random() * (intel >= 2 ? 4 : 10);
    if(score > bestScore){ bestScore = score; best = rg; }
  });
  return best || REGIONS[0];
}

/* ===== キー人材（軽量名簿） ===== */
function ensureKeyStaff(s){
  if(!s.keyStaff) s.keyStaff = {};
  if(!s.branchManagers) s.branchManagers = {};
  if(s.branchCampaign===undefined) s.branchCampaign = null;
  if(!s.branchAiBoost) s.branchAiBoost = {};
  Object.keys(s.branchManagers||{}).forEach(rid=>{ if(typeof ensureBranchManagerFields==='function') ensureBranchManagerFields(s.branchManagers[rid]); });
  if(s.ceoAge==null) s.ceoAge = 45;
  if(s.ceoHealth==null) s.ceoHealth = 80;
  if(s.isFounderCeo==null) s.isFounderCeo = true;
  if(!s.founderName) s.founderName = s.ceoName;
  if(s.tutorialStage==null) s.tutorialStage = 0;
  if(!s.unlockedTabs) s.unlockedTabs = ['overview','learn','management'];
  const ks = s.keyStaff;
  if((s.inspectors||0) >= 1 && !ks.chiefInspector){
    ks.chiefInspector = {id:'ci', name:randomPersonName(), role:'主任検査員', skill:55+Math.round(Math.random()*25), tenure:0};
  }
  if((s.techs||0) >= 3 && !ks.techLead){
    ks.techLead = {id:'tl', name:randomPersonName(), role:'技術主任', skill:52+Math.round(Math.random()*28), tenure:0};
  }
  if((s.salesStaff||0) >= 2 && !ks.salesLead){
    ks.salesLead = {id:'sl', name:randomPersonName(), role:'営業主任', skill:50+Math.round(Math.random()*25), tenure:0};
  }
  // 人数が足りなくなったら枠を外す
  if((s.inspectors||0) < 1) ks.chiefInspector = null;
  if((s.techs||0) < 2) ks.techLead = null;
  if((s.salesStaff||0) < 1) ks.salesLead = null;
}
function tickKeyStaff(s, logs){
  ensureKeyStaff(s);
  const ks = s.keyStaff || {};
  ['chiefInspector','techLead','salesLead'].forEach(k=>{
    const p = ks[k];
    if(!p) return;
    p.tenure = (p.tenure||0) + 1;
    if(Math.random() < 0.35) p.skill = clamp((p.skill||50) + 0.4 + Math.random()*0.8, 30, 95);
  });
  // 熟練の軽い全体効果
  if(ks.techLead && ks.techLead.skill >= 70){
    s.techSkill = clamp((s.techSkill||50) + 0.15, 5, 98);
  }
  if(ks.chiefInspector && ks.chiefInspector.skill >= 70){
    s.integrity = clamp((s.integrity||70) + 0.1, 5, 98);
  }
}
function listKeyStaff(s){
  ensureKeyStaff(s);
  const ks = s.keyStaff || {};
  return [ks.chiefInspector, ks.techLead, ks.salesLead].filter(Boolean);
}
function poachKeyStaff(s, rivalName, logs){
  ensureKeyStaff(s);
  const ks = s.keyStaff || {};
  const candidates = [];
  if(ks.techLead) candidates.push(['techLead', ks.techLead]);
  if(ks.chiefInspector) candidates.push(['chiefInspector', ks.chiefInspector]);
  if(ks.salesLead) candidates.push(['salesLead', ks.salesLead]);
  if(!candidates.length) return false;
  const [key, person] = candidates[Math.floor(Math.random()*candidates.length)];
  ks[key] = null;
  if(key === 'techLead'){
    s.techs = Math.max(1, (s.techs||1) - 1);
  } else if(key === 'chiefInspector'){
    s.inspectors = Math.max(0, (s.inspectors||0) - 1);
    s.techs = Math.max(1, (s.techs||1) - 1);
  } else if(key === 'salesLead'){
    s.salesStaff = Math.max(0, (s.salesStaff||0) - 1);
  }
  if(typeof ensureInspectors === 'function') ensureInspectors(s);
  s.morale = clamp((s.morale||60) - 5, 5, 95);
  s.hireCostMult = Math.min(1.9, (s.hireCostMult||1) * 1.08);
  logs.push({text:`【他社】${rivalName}がキー人材の${person.role} ${person.name}を引き抜き。現場に大きな穴が空いた。`, tag:'warn'});
  return true;
}

/* ===== ライバル予兆（pendingPlans） ===== */
function rivalPlanLabel(plan){
  const rg = plan.regionId ? (REGIONS.find(r=>r.id===plan.regionId)||{}).name : null;
  if(plan.type==='raid') return rg ? `${rg}での営業攻勢を準備中` : '営業攻勢を準備中';
  if(plan.type==='poach') return '人材引き抜きを準備中';
  if(plan.type==='price') return '価格改定を検討中';
  if(plan.type==='acquire') return rg ? `${rg}での買収を準備中` : '買収を準備中';
  return '動向を注視';
}
function scheduleRivalPlan(s, r, plan, logs, intel){
  if(!r.pendingPlans) r.pendingPlans = [];
  // 同種の未実行計画があれば上書きしない（溜め込み防止）
  if(r.pendingPlans.some(p=>p.type===plan.type && p.regionId===plan.regionId)) return false;
  if(r.pendingPlans.length >= (intel>=3?3:2)) return false;
  plan.id = 'rp'+Date.now()+Math.floor(Math.random()*99);
  r.pendingPlans.push(plan);
  r.intent = rivalPlanLabel(plan);
  const announce = intel >= 2 || Math.random() < 0.55;
  if(announce){
    const when = plan.ticksLeft <= 1 ? '近い四半期に' : '数四半期以内に';
    logs.push({text:`【予兆】${r.name}が${rivalPlanLabel(plan)}との情報（${when}顕在化する可能性）。`, tag:'warn'});
    r.lastMoves = r.lastMoves || [];
    r.lastMoves.push('予兆');
  }
  return true;
}
function executeRivalPlan(s, r, plan, logs, ctx){
  const power = ctx.power;
  const intel = ctx.intel;
  const threatAmp = ctx.threatAmp;
  const pmiRegs = ctx.pmiRegs;
  if(plan.type==='raid'){
    if(s.truceRivalId===r.id && (s.turn||0) <= (s.truceUntilTurn||0)){
      logs.push({text:`【他社】${r.name}との休戦中のため、営業攻勢は実行されなかった。`, tag:'info'});
      return;
    }
    const tgt = plan.regionId ? REGIONS.find(rg=>rg.id===plan.regionId) : pickRivalTargetRegion(s, r, intel);
    if(!tgt) return;
    let stealFrac = intel >= 3 ? 0.055 : (intel >= 2 ? 0.04 : 0.025);
    if(pmiRegs[tgt.id] && intel >= 3) stealFrac += 0.03;
    const steal = Math.round(Math.min((s.regionUnits[tgt.id]||0)*stealFrac, (50+Math.random()*100) * power * threatAmp * (plan.power||1)));
    if(steal > 0 && (s.regionUnits[tgt.id]||0) > steal){
      s.regionUnits[tgt.id] -= steal;
      s.units = Object.values(s.regionUnits).reduce((a,b)=>a+b,0);
      r.regionUnits[tgt.id] = (r.regionUnits[tgt.id]||0) + steal;
      r.units = Object.values(r.regionUnits).reduce((a,b)=>a+b,0);
      const pmiNote = (pmiRegs[tgt.id] && intel>=3) ? '（統合の隙を突いた攻勢）' : '';
      logs.push({text:`【他社】${r.name}が予告どおり${tgt.name}で御社から推定${num(steal)}台を奪取した${pmiNote}。`, tag:'warn'});
      r.lastMoves.push('地域侵食');
      r.intent = `${tgt.name}で攻勢を実行`;
    } else {
      logs.push({text:`【他社】${r.name}の${tgt.name}攻勢は目立った成果に結びつかなかった。`, tag:'info'});
    }
  } else if(plan.type==='poach'){
    if((s.techs||0) <= 3) return;
    const named = (intel >= 2 && Math.random() < (intel>=3?0.55:0.3)) ? poachKeyStaff(s, r.name, logs) : false;
    if(!named){
      const n = intel >= 3 ? (1 + (Math.random()<0.4?1:0)) : 1;
      const lost = Math.min(n, (s.techs||1) - 1);
      if(lost > 0){
        s.techs -= lost;
        if(typeof ensureInspectors === 'function') ensureInspectors(s);
        ensureKeyStaff(s);
        s.morale = clamp((s.morale||60) - 2 * lost, 5, 95);
        s.hireCostMult = Math.min(1.8, (s.hireCostMult||1) * (1 + 0.04 * lost));
        logs.push({text:`【他社】${r.name}が予告どおり御社の技術者${num(lost)}名を引き抜き。`, tag:'warn'});
      }
    }
    r.lastMoves.push('引き抜き');
    r.intent = '人材攻勢を実行';
  } else if(plan.type==='price'){
    const cut = (0.03 + Math.random()*0.05) * (intel>=3?1.35:intel>=2?1.15:1) * Math.min(1.2, power) * (plan.power||1);
    r.price = Math.max(150000, Math.round(r.price * (1 - cut)));
    r.vitality = clamp(r.vitality - 1, 5, 98);
    s.competitivePressure = clamp((s.competitivePressure||0.5) + 0.06 * power * (intel>=2?1.2:1), 0, 1.5);
    logs.push({text:`【他社】${r.name}が予告どおり保守料金を約${Math.round(cut*100)}%引き下げた。`, tag:'warn'});
    r.lastMoves.push('値下げ');
    r.intent = '価格攻勢を実行';
    if(intel >= 3 && Math.random() < 0.35){
      s.priceWarTicks = Math.max(s.priceWarTicks||0, 2 + Math.floor(Math.random()*2));
      logs.push({text:`【他社】${r.name}発の価格競争が続きそうだ。`, tag:'warn'});
    }
  } else if(plan.type==='acquire'){
    const target = plan.regionId ? REGIONS.find(rg=>rg.id===plan.regionId) : pickRivalTargetRegion(s, r, intel);
    if(!target) return;
    const grab = Math.round((regionPool(s,target.id)*0.10 + 150 + Math.random()*200) * power * (intel>=3?1.15:1) * (plan.power||1));
    r.regionUnits[target.id] = (r.regionUnits[target.id]||0) + grab;
    r.units = Object.values(r.regionUnits).reduce((a,b)=>a+b,0);
    r.quality = clamp(r.quality - (intel>=3?2:3), 15, 95);
    r.vitality = clamp(r.vitality - 2, 5, 98);
    const subName = MANDA_NAME_POOL[Math.floor(Math.random()*MANDA_NAME_POOL.length)];
    r.subsidiaries = r.subsidiaries || [];
    r.subsidiaries.push({name:subName, regionName:target.name, units:grab, acquiredYear:s.year, president:randomPersonName()});
    logs.push({text:`【他社】${r.name}が予告どおり${target.name}で${subName}を子会社化（推定+${num(grab)}台）。`, tag:'warn'});
    r.lastMoves.push('買収');
    r.intent = `${target.name}へ規模拡大を実行`;
  } else if(plan.type==='exploit'){
    // 弱み集中攻勢（通常raidより痛い）
    if(s.truceRivalId===r.id && (s.turn||0) <= (s.truceUntilTurn||0)){
      logs.push({text:`【他社】${r.name}との休戦中のため、弱点攻勢は実行されなかった。`, tag:'info'});
      return;
    }
    if(typeof isAlliedWith==='function' && isAlliedWith(s, r.id)){
      logs.push({text:`【他社】${r.name}とは業務提携中のため、弱点攻勢は自重された。`, tag:'info'});
      return;
    }
    const tgt = plan.regionId ? REGIONS.find(rg=>rg.id===plan.regionId) : pickRivalTargetRegion(s, r, intel);
    if(!tgt) return;
    let stealFrac = intel >= 3 ? 0.08 : 0.06;
    const weak = typeof analyzePlayerWeaknesses==='function' ? analyzePlayerWeaknesses(s) : null;
    if(weak && (weak.regions[tgt.id]||0) >= 12) stealFrac += 0.025;
    if(weak && weak.global.overUtil) stealFrac += 0.015;
    if(weak && weak.global.quality) stealFrac += 0.02;
    const steal = Math.round(Math.min((s.regionUnits[tgt.id]||0)*stealFrac, (70+Math.random()*140) * power * threatAmp * (plan.power||1)));
    if(steal > 0 && (s.regionUnits[tgt.id]||0) > steal){
      s.regionUnits[tgt.id] -= steal;
      s.units = Object.values(s.regionUnits).reduce((a,b)=>a+b,0);
      r.regionUnits[tgt.id] = (r.regionUnits[tgt.id]||0) + steal;
      r.units = Object.values(r.regionUnits).reduce((a,b)=>a+b,0);
      logs.push({text:`【他社】${r.name}が御社の弱み（${tgt.name}）を突き、推定${num(steal)}台を奪取した。`, tag:'bad'});
      r.lastMoves.push('弱点攻勢');
      r.intent = `${tgt.name}の隙を突いて実行`;
      s.competitivePressure = clamp((s.competitivePressure||0.5)+0.05, 0, 1.5);
    } else {
      logs.push({text:`【他社】${r.name}の弱点攻勢（${tgt.name}）は守り切った。`, tag:'info'});
    }
  } else if(plan.type==='maker'){
    // メーカー系列争奪：関係悪化・切替圧力
    const mid = plan.makerId || (typeof MAKER_IDS!=='undefined' ? MAKER_IDS[Math.floor(Math.random()*Math.min(5,MAKER_IDS.length))] : null);
    if(!mid || mid==='other') return;
    const brand = (typeof MAKER_BRANDS!=='undefined' && MAKER_BRANDS[mid]) ? MAKER_BRANDS[mid] : {label:mid, short:mid};
    if(!s.makerRelations) s.makerRelations = {};
    const prev = s.makerRelations[mid] != null ? s.makerRelations[mid] : 50;
    const drop = (intel>=3?8:5) + Math.round(Math.random()*6);
    s.makerRelations[mid] = clamp(prev - drop, 5, 98);
    s.partsSupplyMult = Math.min(1.25, (s.partsSupplyMult||1) * (1 + drop*0.004));
    // メーカー混在シェアの侵食
    if(s.makerMix && s.makerMix[mid] != null && s.makerMix[mid] > 0.05){
      const shift = Math.min(s.makerMix[mid]*0.08, 0.03);
      s.makerMix[mid] = Math.max(0, s.makerMix[mid] - shift);
      if(s.makerMix.other!=null) s.makerMix.other = (s.makerMix.other||0) + shift;
    }
    logs.push({text:`【他社】${r.name}が${brand.label}の系列・公共案件で先行し、御社の${brand.short}関係が悪化した（関係${Math.round(prev)}→${Math.round(s.makerRelations[mid])}）。部品・切替が不利になりやすい。`, tag:'warn'});
    r.lastMoves.push('系列争奪');
    r.intent = `${brand.short}系列で攻勢`;
    r.vitality = clamp((r.vitality||60)+1, 5, 98);
  } else if(plan.type==='break_truce'){
    if(s.truceRivalId===r.id && (s.turn||0) <= (s.truceUntilTurn||0)){
      s.truceRivalId = null;
      s.truceUntilTurn = null;
      s.reputation = clamp((s.reputation||50)-2, 5, 98);
      logs.push({text:`【外交】${r.name}が休戦協定を一方破棄した。業界の信用にも傷がつく。`, tag:'bad'});
      r.lastMoves.push('休戦破棄');
      r.intent = '休戦破棄後の再攻勢';
      // 直後に軽い攻勢
      executeRivalPlan(s, r, {type:'raid', regionId:plan.regionId, ticksLeft:0, power:1.15}, logs, ctx);
    }
  } else if(plan.type==='break_alliance'){
    if(s.alliances && s.alliances[r.id]){
      delete s.alliances[r.id];
      s.reputation = clamp((s.reputation||50)-1, 5, 98);
      logs.push({text:`【外交】${r.name}が業務提携の解消を通告した。提携メリットは失われる。`, tag:'warn'});
      r.lastMoves.push('提携解消');
      r.intent = '提携解消';
    }
  }
}
function processRivalPendingPlans(s, r, logs, ctx){
  if(!r.pendingPlans || !r.pendingPlans.length) return;
  const remain = [];
  r.pendingPlans.forEach(plan=>{
    plan.ticksLeft = (plan.ticksLeft||1) - 1;
    if(plan.ticksLeft <= 0){
      executeRivalPlan(s, r, plan, logs, ctx);
    } else {
      remain.push(plan);
      r.intent = rivalPlanLabel(plan) + `（あと${plan.ticksLeft}四半期）`;
    }
  });
  r.pendingPlans = remain;
}

/** 他社動向：難易度別インテル＋予兆＋スタイル戦略 */

/** 後期膠着の打破: 市場成熟・競合疲弊・部分譲受 */
function marketMaturity(s){
  const org = typeof totalOrganized==='function' ? totalOrganized(s) : (s.units||0);
  const tot = Math.max(1, s.marketTotal||1);
  return clamp(org / tot, 0, 1);
}

function ensureLateGameState(s){
  if(!s.lateGame) s.lateGame = {
    antitrustHeat: 0, instHeat: 0, postClear: false, regionFlags: {},
    lastInstDemandTurn: -99, dividendPolicy: 0, regionLeads: 0,
  };
  if(s.lateGame.antitrustHeat==null) s.lateGame.antitrustHeat = 0;
  if(s.lateGame.instHeat==null) s.lateGame.instHeat = 0;
  if(!s.lateGame.regionFlags) s.lateGame.regionFlags = {};
  if(s.lateGame.dividendPolicy==null) s.lateGame.dividendPolicy = 0;
}
function regionPlayerShare(s, rid){
  const mine = (s.regionUnits&&s.regionUnits[rid])||0;
  const mkt = typeof regionMarket==='function' ? regionMarket(s, rid) : 0;
  return mkt>0 ? mine/mkt : 0;
}
function countRegionLeads(s){
  let n = 0;
  REGIONS.forEach(rg=>{
    const mine = (s.regionUnits&&s.regionUnits[rg.id])||0;
    if(mine < 80) return;
    let bestRival = 0;
    (s.rivals||[]).forEach(r=>{ bestRival = Math.max(bestRival, (r.regionUnits&&r.regionUnits[rg.id])||0); });
    if(mine >= bestRival && regionPlayerShare(s, rg.id) >= 0.18) n++;
  });
  return n;
}
function approxROE(s){
  const equity = Math.max(1, (s.retainedEarnings||0) + (s.cash||0)*0.3);
  const profitY = (s.history||[]).slice(-4).reduce((a,f)=>a+(f.netProfit||0),0);
  return profitY / equity;
}
function processAntitrustPressure(s, logs){
  ensureLateGameState(s);
  if((s.units||0) < 8000) return;
  let heat = 0;
  const flagged = [];
  REGIONS.forEach(rg=>{
    const sh = regionPlayerShare(s, rg.id);
    const mine = (s.regionUnits&&s.regionUnits[rg.id])||0;
    if(mine < 120) return;
    if(sh >= (typeof LATE_SHARE_CAP!=='undefined'?LATE_SHARE_CAP:0.38)){
      heat += 2; flagged.push({id:rg.id, name:rg.name, sh, level:'high'});
      s.lateGame.regionFlags[rg.id] = 'cap';
    } else if(sh >= (typeof LATE_SHARE_WARN!=='undefined'?LATE_SHARE_WARN:0.28)){
      heat += 1; flagged.push({id:rg.id, name:rg.name, sh, level:'warn'});
      s.lateGame.regionFlags[rg.id] = 'warn';
    } else if(s.lateGame.regionFlags[rg.id]) delete s.lateGame.regionFlags[rg.id];
  });
  s.lateGame.antitrustHeat = clamp((s.lateGame.antitrustHeat||0)*0.85 + heat, 0, 20);
  if(!flagged.length) return;
  if(s.lateGame.antitrustHeat >= 6 && Math.random() < 0.35){
    const f = flagged[Math.floor(Math.random()*flagged.length)];
    const lose = Math.max(5, Math.round(((s.regionUnits[f.id]||0) * (f.level==='high'?0.02:0.012))));
    if(lose > 0 && (s.regionUnits[f.id]||0) > lose){
      s.regionUnits[f.id] -= lose;
      s.units = Object.values(s.regionUnits).reduce((a,b)=>a+b,0);
      if((s.rivals||[]).length){
        const r = s.rivals[Math.floor(Math.random()*s.rivals.length)];
        r.regionUnits[f.id] = (r.regionUnits[f.id]||0) + lose;
        r.units = Object.values(r.regionUnits).reduce((a,b)=>a+b,0);
      }
      logs.push({text:`【競争監視】${f.name}のシェア${pct(f.sh,0)}が高すぎるとして、切替・再入札で約${num(lose)}台が流出した。`, tag:'warn'});
    }
    s.reputation = clamp((s.reputation||50)-1, 5, 98);
    s.competitivePressure = clamp((s.competitivePressure||0.5)+0.04, 0, 1.5);
  } else if(Math.random() < 0.2){
    logs.push({text:`【競争監視】${flagged.map(f=>f.name).slice(0,3).join('・')}などでシェア集中が注目されている（熱量 ${s.lateGame.antitrustHeat.toFixed(0)}）。`, tag:'info'});
  }
}
function processInstitutionalPressure(s, logs){
  ensureLateGameState(s);
  if(!s.isListed) return;
  const rev = typeof annualRevenue==='function' ? annualRevenue(s) : 0;
  if(rev < (typeof LATE_INST_REV!=='undefined'?LATE_INST_REV:8e8) && marketShare(s.units,s) < 0.12) return;
  const roe = approxROE(s);
  const cash = s.cash||0;
  let heat = s.lateGame.instHeat||0;
  if(roe < (typeof LATE_ROE_TARGET!=='undefined'?LATE_ROE_TARGET:0.08)) heat += 1.2;
  if(cash > rev*0.35) heat += 0.8;
  if((s.lateGame.dividendPolicy||0)===0) heat += 0.6;
  if((s.lateGame.dividendPolicy||0)>=2) heat -= 0.8;
  s.lateGame.instHeat = clamp(heat*0.9, 0, 25);
  if((s.lateGame.dividendPolicy||0)>0 && (s.turn||0)%4===0){
    const rate = s.lateGame.dividendPolicy===2 ? 0.025 : 0.012;
    const pot = Math.max(0, (s.history||[]).slice(-4).reduce((a,f)=>a+Math.max(0,f.netProfit||0),0));
    const div = Math.min(cash*0.15, Math.round(pot*rate));
    if(div > 100000){
      s.cash -= div;
      s.marketTrust = clamp((s.marketTrust||50)+1.5, 5, 98);
      logs.push({text:`【還元】配当方針に基づき ${yen(div)} を還元した。`, tag:'info'});
    }
  }
  if((s.lateGame.instHeat||0) >= 8 && (s.turn||0)-(s.lateGame.lastInstDemandTurn||-99)>=5 && Math.random()<0.28){
    s.lateGame.lastInstDemandTurn = s.turn||0;
    const demand = Math.random()<0.5 ? 'dividend' : 'buyback';
    s._pendingInstDemand = {kind:demand, turn:s.turn||0};
    logs.push({text:`【機関投資家】${demand==='dividend'?'配当の安定化':'自社株買い・還元強化'}を求める声が強まっている。概要の終盤パネルで対応できる。`, tag:'warn'});
    if(s.stockPrice) s.stockPrice = Math.round(s.stockPrice*0.98);
    s.marketTrust = clamp((s.marketTrust||50)-2, 5, 98);
  }
  if((s.lateGame.instHeat||0)>=14 && Math.random()<0.15){
    s.marketTrust = clamp((s.marketTrust||50)-3, 5, 98);
    if(s.stockPrice) s.stockPrice = Math.round(s.stockPrice*0.97);
    logs.push({text:'【機関投資家】ROE・還元姿勢への不満から売りが先行した。', tag:'warn'});
  }
}
function doSetDividendPolicy(level){
  const s = state;
  ensureLateGameState(s);
  s.lateGame.dividendPolicy = Math.max(0, Math.min(2, level|0));
  const labels = ['無配寄り','低配当','標準配当'];
  pushLog(s, `株主還元方針を「${labels[s.lateGame.dividendPolicy]}」に設定した。`, 'info');
  if(s.lateGame.dividendPolicy>0){
    s.lateGame.instHeat = Math.max(0,(s.lateGame.instHeat||0)-2);
    s.marketTrust = clamp((s.marketTrust||50)+1, 5, 98);
  }
  render(); autoSave();
}
function doRespondInstDemand(accept){
  const s = state;
  const d = s._pendingInstDemand;
  if(!d) return;
  s._pendingInstDemand = null;
  ensureLateGameState(s);
  if(accept){
    if(d.kind==='dividend'){
      s.lateGame.dividendPolicy = Math.max(s.lateGame.dividendPolicy||0, 2);
      const pay = Math.min((s.cash||0)*0.08, 30000000);
      s.cash -= pay;
      s.lateGame.instHeat = Math.max(0,(s.lateGame.instHeat||0)-5);
      s.marketTrust = clamp((s.marketTrust||50)+3, 5, 98);
      pushLog(s, `機関要求を受け入れ、配当方針を強化（当面の還元 ${yen(pay)}）。`, 'good');
    } else {
      const pay = Math.min((s.cash||0)*0.1, 50000000);
      s.cash -= pay;
      s.lateGame.instHeat = Math.max(0,(s.lateGame.instHeat||0)-4);
      s.marketTrust = clamp((s.marketTrust||50)+2, 5, 98);
      if(s.stockPrice) s.stockPrice = Math.round(s.stockPrice*1.02);
      pushLog(s, `機関要求を受け入れ、還元 ${yen(pay)} を実施した。`, 'good');
    }
  } else {
    s.lateGame.instHeat = (s.lateGame.instHeat||0)+3;
    s.marketTrust = clamp((s.marketTrust||50)-4, 5, 98);
    if(s.stockPrice) s.stockPrice = Math.round(s.stockPrice*0.96);
    pushLog(s, '機関要求を拒否した。株価と信認に逆風。', 'warn');
  }
  render(); autoSave();
}
function processSpinoffResurgence(s, logs){
  const spins = s.independentSpinoffs || [];
  if(!spins.length || (s.units||0) < 3000) return;
  if(Math.random() > 0.12) return;
  const sp = spins[Math.floor(Math.random()*spins.length)];
  if(((s.turn||0)-(sp.turn||0)) < 4) return;
  const grow = Math.round((sp.units||10)*(0.15+Math.random()*0.35));
  sp.units = (sp.units||0)+grow;
  const lost = Math.min(Math.max(3, Math.round(grow*0.4)), Math.round((s.units||0)*0.008));
  if(lost>0 && typeof removeUnitsFromPortfolio==='function') removeUnitsFromPortfolio(s, lost, null);
  logs.push({text:`【新興勢力】「${sp.name}」が再拡張（+${num(grow)}台規模）。御社から約${num(lost)}台流出。`, tag:'warn'});
  s.competitivePressure = clamp((s.competitivePressure||0.5)+0.03, 0, 1.5);
  if(sp.units>=400 && Math.random()<0.15 && (s.rivals||[]).length<8){
    const hq = REGIONS[Math.floor(Math.random()*REGIONS.length)].id;
    const ru = {}; REGIONS.forEach(rg=>ru[rg.id]=0); ru[hq]=Math.round(sp.units*0.6);
    s.rivals.push({
      id:'spin'+Date.now(), name:sp.name, price:(s.price||240000)*0.95, reputation:48, quality:50,
      style:'discount', color:'#9b6b4a', hq, regionUnits:ru, units:sp.units,
      ceoName:sp.founder||randomPersonName(), shareholders:[], history:[], vitality:55,
      subsidiaries:[], lastMoves:[], intent:'新興勢力として拡大中',
    });
    logs.push({text:`【業界】「${sp.name}」が競合として台頭した。`, tag:'warn'});
    s.independentSpinoffs = spins.filter(x=>x!==sp);
  }
}
function processMakerSqueezeLate(s, logs){
  if((s.units||0)<10000 || Math.random()>0.1 || !s.makerRelations) return;
  const ids = (typeof MAKER_IDS!=='undefined'?MAKER_IDS:[]).filter(id=>id!=='other');
  if(!ids.length) return;
  const mid = ids[Math.floor(Math.random()*ids.length)];
  const brand = (MAKER_BRANDS&&MAKER_BRANDS[mid])?MAKER_BRANDS[mid]:{label:mid,short:mid};
  const rel = s.makerRelations[mid]!=null?s.makerRelations[mid]:50;
  if(rel<45 && Math.random()<0.55){
    s.makerRelations[mid]=clamp(rel-(3+Math.random()*4),5,98);
    s.partsSupplyMult=Math.min(1.3,(s.partsSupplyMult||1)*1.02);
    logs.push({text:`【系列】${brand.label}の部品・情報アクセスが厳しくなった（関係${Math.round(s.makerRelations[mid])}）。大規模網への牽制。`, tag:'warn'});
  } else if(rel>=70 && Math.random()<0.4){
    s.makerRelations[mid]=clamp(rel+1,5,98);
    logs.push({text:`【系列】${brand.short}系で関係良好を背景に情報共有が進んだ。`, tag:'good'});
  }
}

function processLateGameDynamics(s, logs){
  const mat = marketMaturity(s);
  if(mat < 0.45 || !(s.rivals||[]).length) return;

  // 成熟市場では競合の有機成長を抑制
  s._rivalGrowthDamp = clamp(1 - (mat - 0.45) * 1.1, 0.35, 1);

  // 大型プレイヤーの規模の利益
  if((s.units||0) >= 25000){
    s._scaleBidBoost = clamp(1 + Math.min(0.28, ((s.units||0)-25000)/120000), 1, 1.28);
  } else {
    s._scaleBidBoost = 1;
  }

  // 首位過大・市場成熟で活力がゆっくり低下
  s.rivals.forEach(r=>{
    if((r.units||0) > (s.units||0) * 1.2 && mat > 0.55){
      r.vitality = clamp((r.vitality||60) - (0.3 + Math.random()*0.5), 15, 95);
    }
    if(mat > 0.62){
      r.vitality = clamp((r.vitality||60) - 0.15, 15, 95);
    }
  });

  // ---- 終盤の単調さ対策 ----
  if(typeof processAntitrustPressure==='function') processAntitrustPressure(s, logs);
  if(typeof processInstitutionalPressure==='function') processInstitutionalPressure(s, logs);
  if(typeof processSpinoffResurgence==='function') processSpinoffResurgence(s, logs);
  if(typeof processMakerSqueezeLate==='function') processMakerSqueezeLate(s, logs);
  if(typeof processPostClearMode==='function') processPostClearMode(s, logs);
  if(typeof ensureLateGameState==='function'){
    ensureLateGameState(s);
    s.lateGame.regionLeads = typeof countRegionLeads==='function' ? countRegionLeads(s) : 0;
    if((s.lateGame.regionLeads||0) >= 3 && Math.random() < 0.05){
      logs.push({text:`【版図】地方首位級が${s.lateGame.regionLeads}エリア。制覇が進む一方、監視と新興勢力の標的にもなりやすい。`, tag:'info'});
    }
  }
}


function runRivalDynamics(s, logs){
  if(!s.rivals || !s.rivals.length) return;
  const power = s.rivalPowerMult || 1;
  const intel = rivalIntelLevel(s);
  const threat = computePlayerThreat(s);
  const playerShare = marketShare(s.units, s);
  const myPrice = s.price || C.UNIT_FEE_ANNUAL;
  const pmiRegs = playerPmiRegions(s);
  const threatAmp = intel >= 3 ? (1 + threat * 0.55) : (intel >= 2 ? (1 + threat * 0.25) : 1);
  const ctx = {power, intel, threatAmp, pmiRegs};

  ensureKeyStaff(s);
  tickKeyStaff(s, logs);

  s.rivals.forEach(r=>{
    r.vitality = r.vitality != null ? r.vitality : 60;
    r.lastMoves = r.lastMoves || [];
    r.intent = r.intent || '';
    if(!r.pendingPlans) r.pendingPlans = [];

    const defensive = (r.vitality||60) < (intel >= 3 ? 38 : 32);

    // 1) 予兆の消化（準備→実行）
    processRivalPendingPlans(s, r, logs, ctx);

    // 2) 有機成長（即時）
    const organicChance = (intel === 1 ? 0.45 : 0.55) * (defensive ? 0.7 : 1);
    if(Math.random() < organicChance){
      const damp = s._rivalGrowthDamp != null ? s._rivalGrowthDamp : 1;
      const organic = Math.round((8 + Math.random()*25 + r.units * 0.002 * damp) * power * threatAmp * (0.7 + (r.reputation||50)/200) * damp);
      const regions = REGIONS.filter(rg => (r.regionUnits[rg.id]||0) > 0);
      const pick = intel >= 2
        ? pickRivalTargetRegion(s, r, intel)
        : (regions.length ? regions[Math.floor(Math.random()*regions.length)] : (REGIONS.find(rg=>rg.id===r.hq)||REGIONS[0]));
      r.regionUnits[pick.id] = (r.regionUnits[pick.id]||0) + organic;
      r.units = Object.values(r.regionUnits).reduce((a,b)=>a+b,0);
    }

    // 3) 新規予兆の仕込み（intel1は即時実行寄り）
    const delay = () => intel <= 1 ? 0 : (Math.random() < (intel>=3?0.55:0.4) ? 2 : 1);

    // 買収
    let rollupChance = r.style==='rollup' ? (0.14 + intel * 0.05) * power : (intel >= 3 ? 0.04 * power : 0);
    if(defensive) rollupChance *= 0.4;
    if((r.style==='rollup' || (intel >= 3 && Math.random() < 0.15)) && Math.random() < rollupChance * threatAmp){
      const target = pickRivalTargetRegion(s, r, intel);
      const d = delay();
      if(d <= 0){
        executeRivalPlan(s, r, {type:'acquire', regionId:target.id, ticksLeft:0, power:1}, logs, ctx);
      } else {
        scheduleRivalPlan(s, r, {type:'acquire', regionId:target.id, ticksLeft:d, power:1}, logs, intel);
      }
    }

    // 値下げ
    let discChance = r.style==='discount' ? (0.12 + intel * 0.05) : (intel >= 2 && myPrice > r.price * 1.08 ? 0.08 : 0.02);
    if(intel >= 2 && myPrice > (r.price||1) * 1.12) discChance += 0.12;
    if(intel >= 3 && threat > 0.45) discChance += 0.1;
    if(Math.random() < discChance * (defensive?0.5:1)){
      const d = delay();
      if(d <= 0){
        executeRivalPlan(s, r, {type:'price', ticksLeft:0, power:1}, logs, ctx);
      } else {
        scheduleRivalPlan(s, r, {type:'price', ticksLeft:d, power:1}, logs, intel);
      }
    }

    // 品質投資（即時・予兆なし）
    if(r.style==='incumbent' || (intel>=3 && r.style!=='discount')){
      const qChance = r.style==='incumbent' ? (0.12 + intel*0.04) : 0.06;
      if(Math.random() < qChance){
        r.quality = clamp((r.quality||50) + 2 + (intel>=2?1:0), 15, 95);
        r.reputation = clamp((r.reputation||50) + 1, 20, 95);
        r.vitality = clamp(r.vitality + 1, 5, 98);
        r.lastMoves.push('品質投資');
        if(!r.pendingPlans.length) r.intent = '品質・信用強化';
        if(Math.random() < 0.4) logs.push({text:`【他社】${r.name}が保守品質と安全体制への投資を強化している。`, tag:'info'});
      }
    }

    // 侵食（弱みがあれば激化）
    const weakMap = typeof analyzePlayerWeaknesses==='function' ? analyzePlayerWeaknesses(s) : {global:{}, regions:{}};
    let raidChance = 0.06 * power;
    if(intel === 1) raidChance = 0.03 * power;
    if(intel === 2) raidChance = 0.10 * power + threat * 0.08;
    if(intel >= 3) raidChance = 0.14 * power + threat * 0.16;
    if(defensive) raidChance *= 0.45;
    if(weakMap.global.quality) raidChance += 0.06;
    if(weakMap.global.highPrice) raidChance += 0.04 * intel;
    if(weakMap.global.overUtil) raidChance += 0.05;
    if(weakMap.global.lowMorale) raidChance += 0.03;
    if(Math.random() < raidChance * threatAmp){
      const tgt = pickRivalTargetRegion(s, r, intel);
      const d = delay();
      if(d <= 0){
        executeRivalPlan(s, r, {type:'raid', regionId:tgt.id, ticksLeft:0, power:1}, logs, ctx);
      } else {
        scheduleRivalPlan(s, r, {type:'raid', regionId:tgt.id, ticksLeft:d, power:1}, logs, intel);
      }
    }

    // 弱点集中攻勢（intel2+、弱みスコアが高い地方）
    if(intel >= 2 && !defensive){
      const weakRegs = REGIONS.filter(rg=>(weakMap.regions[rg.id]||0) >= 10 && (s.regionUnits[rg.id]||0) > 40);
      if(weakRegs.length){
        let exploitChance = intel >= 3 ? (0.08 + threat * 0.12) * power : (0.04 + threat * 0.06) * power;
        if(weakMap.global.quality) exploitChance += 0.04;
        if(Math.random() < exploitChance * threatAmp){
          const tgt = weakRegs[Math.floor(Math.random()*weakRegs.length)];
          const d = delay();
          const plan = {type:'exploit', regionId:tgt.id, ticksLeft:d, power:1.1};
          if(d <= 0) executeRivalPlan(s, r, plan, logs, ctx);
          else scheduleRivalPlan(s, r, plan, logs, intel);
        }
      }
    }

    // メーカー系列争奪
    if(intel >= 2 && !defensive && Math.random() < (0.05 + intel*0.03) * power * threatAmp){
      const mids = (typeof MAKER_IDS!=='undefined' ? MAKER_IDS.filter(id=>id!=='other') : []);
      if(mids.length){
        // プレイヤーが関係を持っている／ミックスが多い系列を狙う
        let mid = mids[Math.floor(Math.random()*mids.length)];
        if(s.makerMix){
          let best=null, bs=-1;
          mids.forEach(id=>{
            const sc = (s.makerMix[id]||0)*100 + ((s.makerRelations&&s.makerRelations[id])||50)*0.2;
            if(sc>bs){bs=sc; best=id;}
          });
          if(best) mid = best;
        }
        const brand = MAKER_BRANDS[mid];
        const d = delay();
        const plan = {type:'maker', makerId:mid, makerLabel:brand?brand.label:mid, ticksLeft:d, power:1};
        if(d <= 0) executeRivalPlan(s, r, plan, logs, ctx);
        else scheduleRivalPlan(s, r, plan, logs, intel);
      }
    }

    // 休戦・提携の破棄圧力
    if(intel >= 2){
      if(s.truceRivalId===r.id && (s.turn||0) <= (s.truceUntilTurn||0)){
        // プレイヤーが強すぎる／相手が窮地で破棄
        let breakP = 0.02 * power;
        if(playerShare > 0.22) breakP += 0.04;
        if((r.vitality||60) < 40) breakP += 0.05;
        if(intel >= 3) breakP += 0.03;
        if(s._diplomacyRejectUntil && (s.turn||0) <= s._diplomacyRejectUntil) breakP += 0.08;
        if(Math.random() < breakP){
          const d = delay();
          const plan = {type:'break_truce', regionId:pickRivalTargetRegion(s,r,intel).id, ticksLeft:Math.max(1,d), power:1};
          scheduleRivalPlan(s, r, plan, logs, intel);
        }
      }
      if(s.alliances && s.alliances[r.id]){
        let breakA = 0.015 * power;
        if(playerShare > 0.25) breakA += 0.04;
        if(threat > 0.6) breakA += 0.03;
        if((r.vitality||60) < 35) breakA += 0.04;
        if(Math.random() < breakA){
          const d = delay();
          scheduleRivalPlan(s, r, {type:'break_alliance', ticksLeft:Math.max(1,d), power:1}, logs, intel);
        }
      }
    }

    // 引き抜き
    if(intel >= 2 && !defensive && (s.techs||0) > 3){
      let poachChance = intel >= 3 ? (0.07 + threat * 0.1) * power : 0.04 * power;
      if(s.morale < 45) poachChance += 0.06;
      if(Math.random() < poachChance){
        const d = delay();
        if(d <= 0){
          executeRivalPlan(s, r, {type:'poach', ticksLeft:0, power:1}, logs, ctx);
        } else {
          scheduleRivalPlan(s, r, {type:'poach', ticksLeft:d, power:1}, logs, intel);
        }
      }
    }

    // 活力
    let vitDelta = (Math.random()*4 - 1.5);
    if(defensive) vitDelta += 2;
    if(intel >= 3 && threat > 0.5) vitDelta -= 0.5;
    r.vitality = clamp(r.vitality + vitDelta, 5, 98);

    if(intel >= 2 && Math.random() < 0.2){
      const gap = myPrice - r.price;
      if(Math.abs(gap) > 15000){
        r.price = Math.round(r.price + gap * (intel>=3?0.08:0.05));
      }
    }

    if(r.lastMoves.length > 6) r.lastMoves = r.lastMoves.slice(-6);
  });

  if((s.priceWarTicks||0) > 0){
    s.priceWarTicks--;
    s.competitivePressure = clamp((s.competitivePressure||0.5) + 0.04, 0, 1.5);
    if(s.priceWarTicks <= 0){
      logs.push({text:'業界の価格競争が一段落しつつある。', tag:'info'});
    }
  }

  const newsBase = intel >= 3 ? 0.65 : (intel >= 2 ? 0.55 : 0.4);
  const newsCount = Math.random() < newsBase ? 1 : (Math.random() < 0.2 * intel ? 2 : 0);
  for(let i=0;i<newsCount;i++){
    const r = s.rivals[Math.floor(Math.random()*s.rivals.length)];
    const pool = RIVAL_FLAVOR_NEWS[r.style] || [];
    if(pool.length){
      const line = pool[Math.floor(Math.random()*pool.length)].replace(/\{name\}/g, r.name);
      logs.push({text:`【他社】${line}`, tag:'info'});
    }
  }

  const mergeChance = (0.05 + intel * 0.02) * power;
  if(s.rivals.length >= 2 && Math.random() < mergeChance){
    const sorted = s.rivals.slice().sort((a,b)=>(b.vitality||50)-(a.vitality||50));
    const strong = sorted[0];
    const weak = sorted[sorted.length-1];
    if(strong && weak && strong.id !== weak.id && (weak.vitality||50) < (intel>=3?45:40) && (strong.vitality||50) > 55){
      REGIONS.forEach(rg=>{
        strong.regionUnits[rg.id] = (strong.regionUnits[rg.id]||0) + (weak.regionUnits[rg.id]||0);
      });
      strong.units = Object.values(strong.regionUnits).reduce((a,b)=>a+b,0);
      strong.quality = clamp(strong.quality - 5, 15, 95);
      strong.vitality = clamp(strong.vitality - 5, 5, 98);
      logs.push({text:`【業界再編】${strong.name}が経営不振の${weak.name}を吸収合併した。独立系同士の再編が進んでいる。`, tag:'warn'});
      s.rivals = s.rivals.filter(x=>x.id !== weak.id);
      if(s.alliances && s.alliances[weak.id]){
        delete s.alliances[weak.id];
        logs.push({text:`${weak.name}の消滅に伴い、業務提携も解消された。`, tag:'warn'});
      }
    }
  }

  if(Math.random() < (0.15 + intel * 0.05) && s.rivals.length){
    const leader = s.rivals.slice().sort((a,b)=>b.units-a.units)[0];
    const pending = (leader.pendingPlans||[]).length;
    const intentLine = leader.intent ? `／意図: ${leader.intent}` : '';
    const pendLine = pending ? `／準備中の動き ${pending}件` : '';
    logs.push({text:`【他社動向】独立系有力は${leader.name}（推定 ${num(leader.units)}台）${intentLine}${pendLine}。貴社シェア ${pct(playerShare,1)}。`, tag:'info'});
  }
}


function competitivePressure(s){
  if(!s.rivals.length) return 0.2;
  const avgRivalPrice = s.rivals.reduce((a,r)=>a+r.price,0)/s.rivals.length;
  // 自社価格がライバル平均より高いほど圧力↑
  const ratio = s.price / Math.max(1, avgRivalPrice);
  return clamp(0.25 + (ratio-1)*1.2, 0.1, 0.95);
}
function computeAlerts(s){
  const alerts = [];
  const util = baseCapacity(s)>0 ? s.units/baseCapacity(s) : 9;
  if(s.quakeImpact && (s.quakeImpact.ticksLeft||0) > 0){

  if(s.morale < 35) alerts.push({sev:'crit', text:`従業員満足度 ${Math.round(s.morale)}。離職が加速する水準。`});
  if((s.integrity!=null ? s.integrity : 72) < 40) alerts.push({sev:'crit', text:`組織の誠実性 ${Math.round(s.integrity)}。不正・隠蔽が蔓延しやすい危険水域。`});
  else if((s.integrity!=null ? s.integrity : 72) < 52) alerts.push({sev:'warn', text:`組織の誠実性 ${Math.round(s.integrity)}。人材の質低下に伴う不正リスクに注意。`});
  const pendDisc = (s.discCases||[]).filter(c=>c.status==='pending').length;
  if(pendDisc > 0) alerts.push({sev:'warn', text:`懲罰委員会の未処理案件が${pendDisc}件ある。放置は信用を毀損する。`});
  else if(s.morale < 45) alerts.push({sev:'warn', text:`従業員満足度 ${Math.round(s.morale)}。福利厚生か稼働率の改善を。`});
  if(leverageRatio(s) > 2.0) alerts.push({sev:'crit', text:`レバレッジ ${leverageRatio(s).toFixed(2)}x。信用格付け・金利に悪影響。`});
  else if(leverageRatio(s) > 1.4) alerts.push({sev:'warn', text:`レバレッジ ${leverageRatio(s).toFixed(2)}x。有利子負債の抑制を検討。`});
  if(equityValue(s) < 0) alerts.push({sev:'crit', text:`債務超過。自己資本の回復が急務。`});
  const pressure = competitivePressure(s);
  if(pressure > 0.75) alerts.push({sev:'warn', text:`価格競争圧力が高水準（${pct(pressure,0)}）。値下げか差別化（品質・フルメン比率）が必要。`});
  if(s.midterm){
    const left = s.midterm.endTurn - s.turn;
    if(left>=0 && left<=4 && s.units < s.midterm.targetUnits*0.85)

  if(s.isListed && founderOwnershipPct(s) > 0.45 && annualRevenue(s) > 200000000)

  const aLoad = adminLoad(s);
  if(aLoad > 1.25) alerts.push({sev:'crit', text:`事務負荷 ${pct(aLoad,0)}（処理能力 ${num(adminCapacity(s))}台に対し契約 ${num(s.units)}台）。請求遅延・法定報告漏れ・解約増のリスク。事務員の増員を。`});
  const pmiActive = (s.pmiJobs||[]).filter(j=>j.status==='active');
  if(pmiActive.length){
    const names = pmiActive.map(j=>j.name).join('、');
    alerts.push({sev:'warn', text:`PMI進行中: ${names}（事務負荷×${(s.pmiAdminMult||1).toFixed(2)}）。組織・M&Aタブで統合方針を確認。`});
  }
  const rivalThreats = [];
  (s.rivals||[]).forEach(r=>{
    (r.pendingPlans||[]).forEach(p=>{

      rivalThreats.push(`${r.name}: ${lab}（あと${p.ticksLeft}Q）`);
    });
  });
  if(rivalThreats.length){
    alerts.push({sev:'warn', text:`競合の予兆 — ${rivalThreats.slice(0,3).join(' ／ ')}`});
  }
  const ks = listKeyStaff(s);
  if(ks.length && (s.morale||60) < 42){
    alerts.push({sev:'warn', text:`士気低下中。キー人材（${ks.map(p=>p.name).join('・')}）の引き抜きリスクに注意。`});
  }
  if(s.vicePresident){
    const vp = s.vicePresident;
    const left = vp.expiresTurn!=null ? Math.max(0, vp.expiresTurn-(s.turn||0)) : 0;
    if(vp.delegated){
      alerts.push({sev:'info', text:`副社長 ${vp.name} に経営一任中（手腕${Math.round(vp.skill)}／残任期${left}Q）。`});
    }
    if(left <= 2 && left > 0){
      alerts.push({sev:'warn', text:`副社長の任期満了が近い（残${left}四半期）。再任・後任の検討を。`});
    }
  }
  if(s.branchCampaign && (s.branchCampaign.ticksLeft||0)>0){
    const cr = REGIONS.find(r=>r.id===s.branchCampaign.regionId);
    alerts.push({sev:'info', text:`${cr?cr.name:'地方'}支社へ集中応援中（残${s.branchCampaign.ticksLeft}Q）。`});
  }
  if(typeof marketMaturity==='function'){
    const mat = marketMaturity(s);
    if(mat >= 0.55 && (s.units||0) >= 20000){
      alerts.push({sev:'info', text:`独立系市場の成熟度 ${pct(mat,0)}。有機成長は鈍く、競合からのブロック譲受・再編が主戦場。`});
    }
  }
  (s.subsidiaries||[]).forEach(sub=>{
    if(sub.integrating||sub.closed) return;
    if((sub.localMorale||60) < 35) alerts.push({sev:'warn', text:`子会社 ${sub.name} の士気が低い（${Math.round(sub.localMorale)}）。離反リスク。`});
    if((sub.localQuality||55) < 38) alerts.push({sev:'warn', text:`子会社 ${sub.name} の品質が危険水域（${Math.round(sub.localQuality)}）。`});
  });
  if((s.recallTicks||0) > 0){
    alerts.push({sev:'warn', text:`リコール／改修対応中（残り${s.recallTicks}四半期）。保守負荷と費用に注意。`});
  }
  if(s.makerCertHold && (s.makerCertHold.ticksLeft||0)>0){
    alerts.push({sev:'warn', text:`メーカー実務: ${s.makerCertHold.label||'供給・認定'}（残り${s.makerCertHold.ticksLeft}Q）／部品原価係数×${(s.partsSupplyMult||1).toFixed(2)}`});
  }
  if(s.truceRivalId && (s.turn||0) <= (s.truceUntilTurn||0)){
    const rr = (s.rivals||[]).find(x=>x.id===s.truceRivalId);

  }
  if(s.successionReady && !s.successionDone){
    alerts.push({sev:'crit', text:`世代交代の検討が必要（代表 約${Math.round(s.ceoAge||45)}歳／健康 ${Math.round(s.ceoHealth||50)}）。企業情報の社史年表から決断できる。`});
  } else if((s.ceoAge||0) >= 60 || (s.ceoHealth||100) < 45){
    alerts.push({sev:'warn', text:`代表の負担が高まっている（年齢・健康）。中長期の後継を意識しよう。`});
  }
  else if(aLoad > 1.05) alerts.push({sev:'warn', text:`事務負荷 ${pct(aLoad,0)}。顧客窓口と法定検査報告の余力が薄い。`});
  else if(aLoad < 0.45 && s.admins >= 4 && s.units < 500) alerts.push({sev:'warn', text:`事務員が契約規模に対して過剰（負荷 ${pct(aLoad,0)}）。固定費の見直し余地あり。`});
  const sLoad = typeof salesLoad==='function' ? salesLoad(s) : 1;
  if((s.salesStaff||0) <= 0) alerts.push({sev:'warn', text:'営業人員がいない。新規契約は紹介・自然流入にほぼ依存する。'});
  else if(sLoad > 1.4) alerts.push({sev:'warn', text:`営業が不足している（負荷 ${pct(sLoad,0)}）。管理会社開拓や地方展開が追いつかない。`});
  else if(sLoad < 0.4 && (s.salesStaff||0) >= 5 && s.units < 400) alerts.push({sev:'info', text:`営業人員が契約規模に対して多め（負荷 ${pct(sLoad,0)}）。人件費に注意。`});

  return alerts.slice(0,10);
}
function hasActiveMidterm(s){
  return !!(s.midterm && !s.midterm.closed && (s.midterm.endTurn==null || (s.turn||0) <= s.midterm.endTurn));
}
function midtermResultLabel(m){
  if(!m) return '—';
  const units = m.unitsHit ? '○' : '×';
  const share = m.shareHit ? '○' : '×';
  const ipo = m.targetIpo ? ('／上場'+(m.ipoHit?'○':'×')) : '';
  if(!m.closed) return `進行中（台数${units}／シェア${share}${ipo}）`;
  const hits = [m.unitsHit, m.shareHit, !m.targetIpo || m.ipoHit].filter(Boolean).length;
  const need = m.targetIpo ? 3 : 2;
  return hits >= need ? `達成（台数${units}／シェア${share}${ipo}）` : `未達（台数${units}／シェア${share}${ipo}）`;
}
function setMidtermPlan(targetUnits, targetSharePct, aimIpo){
  const s = state;
  s.midterm = {
    startTurn: s.turn,
    endTurn: s.turn + C.MIDTERM_HORIZON_Q,
    targetUnits: Math.max(100, Math.round(targetUnits)),
    targetShare: clamp(targetSharePct/100, 0.01, 0.5),
    targetIpo: !!aimIpo,
    unitsHit: false,
    shareHit: false,
    ipoHit: false,
    closed: false,
    achieved: null,
  };
  // 中期計画策定中は今期の通期業績予想は出さない
  s.guidance = {target:null, setYear:null};
  pushLog(s, `中期経営計画（5年・${C.MIDTERM_HORIZON_Q}四半期）を策定: 目標台数 ${num(s.midterm.targetUnits)}／シェア ${pct(s.midterm.targetShare,1)}${aimIpo?'／期間内上場':''}。計画期間中は通期業績予想を発表しない。`, 'good');
  pushCompanyChronicle(s, `中期経営計画を策定（5年）`, 'milestone');
  render(); autoSave();
}
function allianceCount(s){
  return Object.keys(s.alliances||{}).filter(id=>isAlliedWith(s, id)).length;
}
function effMaintCostPerUnit(s){
  const allianceDiscount = 1 - Math.min(0.15, allianceCount(s)*0.05);
  const parts = partsPolicyInfo(s);
  const rel = makerRelationAvg(s);
  // メーカー関係が悪いと調達が割高
  const relMult = rel < 40 ? 1.08 : rel > 70 ? 0.96 : 1;
  const supply = s.partsSupplyMult!=null ? s.partsSupplyMult : 1;
  return C.MAINT_COST_PER_UNIT * (s.upgrades.parts ? 0.85 : 1) * allianceDiscount * (parts.costMult||1) * relMult * supply;
}
function orgHireScale(s){
  // 規模が大きいほど良い人材の採用が難しく・高くなる
  return 1 + Math.max(0, (s.techs||0) - 10) * 0.03 + Math.max(0, (s.admins||0) - 4) * 0.02 + Math.max(0, (s.salesStaff||0) - 3) * 0.025;
}
function effHireCostMult(s){
  return s.hireCostMult * s.laborTightness * orgHireScale(s)
    * (s.upgrades.training ? 0.8 : 1) * (s.executives.hr_dir ? 0.85 : 1);
}
function accidentRiskMult(s){
  let m = 1;
  if(s.upgrades.iot) m *= 0.8;
  if(s.upgrades.ai_predict) m *= 0.65;
  if(s.executives.quality_officer) m *= 0.85;
  const parts = typeof partsPolicyInfo==='function' ? partsPolicyInfo(s) : null;
  if(parts && parts.accidentMult) m *= parts.accidentMult;
  // 事務過負荷は法定報告・点検スケジュール管理の抜けを招き事故・行政リスクを押し上げる
  const load = adminLoad(s);
  if(load > 1.2) m *= 1.0 + Math.min(0.45, (load - 1.2) * 0.6);
  else if(load < 0.8) m *= 0.92;
  // 組織誠実性の低下は隠蔽・手抜きを招き事故確率を押し上げる
  const integ = s.integrity!=null ? s.integrity : 72;
  if(integ < 55) m *= 1.0 + (55 - integ) * 0.012;
  if(integ < 40) m *= 1.15;
  return m;
}
function churnRiskMult(s){ return s.upgrades.ai_predict ? 0.85 : 1; }

function adChannelCostQ(s){
  let c = 0;
  AD_CHANNEL_IDS.forEach(id=>{
    const ch = AD_CHANNELS[id];
    if(!s.adActive || !s.adActive[id]) return;
    if(ch.listedOnly && !s.isListed) return;
    c += ch.costQ;
  });
  return c;
}
function adSalesBoost(s){
  let b = 0;
  AD_CHANNEL_IDS.forEach(id=>{
    const ch = AD_CHANNELS[id];
    if(!s.adActive || !s.adActive[id]) return;
    if(ch.listedOnly && !s.isListed) return;
    b += ch.salesBoost;
  });
  // 認知の蓄積でわずかに効率アップ
  b *= 1 + Math.min(0.25, (s.adAwareness||0)/200);
  return b;
}
function adSegmentMult(s, segId){
  let w = 0, n = 0;
  AD_CHANNEL_IDS.forEach(id=>{
    const ch = AD_CHANNELS[id];
    if(!s.adActive || !s.adActive[id]) return;
    if(ch.listedOnly && !s.isListed) return;
    w += (ch.segments[segId]||1) * ch.salesBoost;
    n += ch.salesBoost;
  });
  if(n <= 0) return 1;
  return clamp(w / n, 0.7, 1.6);
}
function adIrBoost(s){
  if(!s.isListed) return 0;
  let b = 0;
  AD_CHANNEL_IDS.forEach(id=>{
    const ch = AD_CHANNELS[id];
    if(!s.adActive || !s.adActive[id]) return;
    if(ch.listedOnly) b += (ch.irBoost||0);
  });
  return b;
}
function toggleAdChannel(id){
  const s = state;
  const ch = AD_CHANNELS[id];
  if(!ch) return;
  if(ch.listedOnly && !s.isListed){
    pushLog(s, 'この施策は上場後に利用できる（IR活動）。', 'info');
    render(); return;
  }
  s.adActive = s.adActive || {};
  s.adActive[id] = !s.adActive[id];
  pushLog(s, `${ch.label}を${s.adActive[id]?'有効化':'停止'}した（四半期コスト目安 ${yen(ch.costQ)}）。`, 'info');
  render(); autoSave();
}

function salesForceMult(s){
  const staff = Math.max(0, s.salesStaff||0);
  if(staff <= 0) return 0.42;
  const branches = REGIONS.filter(rg => (s.regionBranches[rg.id]||0) > 0).length;
  const ideal = Math.max(1.2, (s.units||0) / (C.SALES_CAPACITY||140) + branches * 0.35 + 0.5);
  const ratio = staff / ideal;
  const skill = (s.salesSkill!=null ? s.salesSkill : 50) / 50;
  const base = 0.50 + Math.pow(Math.min(ratio, 2.0), 0.65) * 0.75;
  return clamp(base * (0.88 + skill * 0.12), 0.42, 1.65);
}
function salesLoad(s){
  const staff = Math.max(0.25, s.salesStaff||0);
  const branches = REGIONS.filter(rg => (s.regionBranches[rg.id]||0) > 0).length;
  const ideal = Math.max(1, (s.units||0) / (C.SALES_CAPACITY||140) + branches * 0.35);
  return ideal / staff;
}
function salesPowerMult(s){
  return (s.executives.sales_dir ? 1.2 : 1) * adminSupportMult(s) * (1 + adSalesBoost(s)) * salesForceMult(s);
}
function loanRateExecAdj(s){ return s.executives.cfo ? -0.003 : 0; }
function psrExecBonus(s){ return s.executives.cfo ? 0.05 : 0; }

/* ---- 契約セグメント（構成比は目標へ緩やかに移行）---- */
function segPriceMult(s){
  return SEGMENTS.reduce((a,seg)=> a + (s.segmentMix[seg.id]||0)*seg.priceMult, 0);
}
function segChurnMult(s){
  return SEGMENTS.reduce((a,seg)=> a + (s.segmentMix[seg.id]||0)*seg.churnMult, 0);
}
function contractPriceMult(s){
  return CONTRACT_TYPES.full.priceMult*s.contractMix.full + CONTRACT_TYPES.pog.priceMult*s.contractMix.pog;
}
function contractChurnMult(s){
  return CONTRACT_TYPES.full.churnMult*s.contractMix.full + CONTRACT_TYPES.pog.churnMult*s.contractMix.pog;
}
function contractRepairExposure(s){
  return CONTRACT_TYPES.full.repairExposure*s.contractMix.full + CONTRACT_TYPES.pog.repairExposure*s.contractMix.pog;
}
function totalDebt(s){ return s.debt + s.bonds.reduce((a,b)=>a+b.principalRemaining,0); }
function leverageRatio(s){ return totalDebt(s) / Math.max(1, annualRevenue(s)); }
function creditRatingInfo(s){
  const lev = leverageRatio(s);
  if(lev < 0.3) return {label:'AA', adj:-0.002};
  if(lev < 0.8) return {label:'A', adj:0};
  if(lev < 1.5) return {label:'BBB', adj:0.003};
  if(lev < 2.5) return {label:'BB', adj:0.008};
  return {label:'B', adj:0.015};
}
function mainBankRateAdj(s){
  if(s.mainBankRelationship >= 70) return -0.002;
  if(s.mainBankRelationship < 30) return 0.003;
  return 0;
}
function dividendYield(s){
  if(!s.isListed || !s.stockPrice) return 0;
  const ttm = (s.dividendHistory||[]).reduce((a,b)=>a+b,0);
  const marketCap = s.stockPrice * s.shares;
  return marketCap>0 ? ttm/marketCap : 0;
}
/* ---- 株主構成・経営者資産 ---- */
function founderOwnershipPct(s){
  return clamp(s.founderShares / s.shares, 0, 1);
}
function esopOwnershipPct(s){
  return clamp(s.esopPct||0, 0, 0.15);
}
/** 流通株式比率（創業社長・持株会を除く） */
function freeFloatRatio(s){
  return Math.max(0, 1 - founderOwnershipPct(s) - esopOwnershipPct(s));
}
/** 分割でプラス・併合でマイナス。四半期ごとに減衰する流動性バイアス */
function shareLiquidityBias(s){
  return clamp(Number(s.shareLiquidityBias)||0, -0.45, 0.55);
}
/** 株価水準による個人の買いやすさ（数百〜千数百円帯が厚い） */
function priceAccessibilityScore(s){
  if(!s.stockPrice) return 0.5;
  const p = s.stockPrice;
  if(p < 50) return 0.25;
  if(p < 100) return 0.45;
  if(p <= 500) return 1.0;
  if(p <= 1500) return 0.85;
  if(p <= 3000) return 0.65;
  if(p <= 8000) return 0.40;
  return 0.22;
}
/** 知名度（広告・IR・上場市場の流動性）0〜100 */
function brandAwareness(s){
  let a = s.adAwareness||0;
  if(s.isListed){
    listedMarkets(s).forEach(k=>{
      if(EXCHANGES[k]) a += (EXCHANGES[k].liquidity||1) * 5;
    });
  }
  a += Math.min(15, (s.reputation||50) * 0.12);
  a += shareLiquidityBias(s) * 12; // 分割効果を認知・流動性側にも少し反映
  return clamp(a, 0, 100);
}
/**
 * 推定株主数（個人投資家の裾野）
 * 知名度・IR・流通比率・時価総額・株価の買いやすさ・分割/併合効果で増減。
 */
function estimatedShareholderCount(s){
  if(!s.isListed && !s._ipoPreview) return 1;
  const aw = brandAwareness(s) / 100;
  const fl = freeFloatRatio(s);
  const ir = typeof adIrBoost==='function' ? adIrBoost(s) : 0;
  const mcapYen = (s.stockPrice && s.shares) ? s.stockPrice * s.shares : annualRevenue(s) * 0.9;
  const mcapOku = Math.max(0, mcapYen / 1e8);
  const access = priceAccessibilityScore(s);
  const liq = shareLiquidityBias(s);
  let n = 40 + aw * 700 + fl * 500 + Math.sqrt(mcapOku) * 28 + ir * 1800;
  n *= (0.55 + access * 0.55);
  n *= (1 + liq * 0.9);
  if(s.isListed && s.exchange==='prime') n *= 1.15;
  if(s.isListed && (s.exchange==='sapporo'||s.exchange==='fukuoka')) n *= 0.75;
  return Math.max(1, Math.round(n));
}
/** 個人株主が流通株に占める比率（知名度・株価の買いやすさが高いほど個人が厚い） */
function retailShareOfFloat(s){
  const aw = brandAwareness(s) / 100;
  const access = priceAccessibilityScore(s);
  const liq = shareLiquidityBias(s);
  const retail = clamp(
    0.28 + aw * 0.42 + access * 0.12 + liq * 0.10 + (typeof adIrBoost==='function'?adIrBoost(s)*0.5:0),
    0.22, 0.78
  );
  return retail;
}
function soRemainingPool(s){
  return Math.max(0, (s.soPoolPct||0) - (s.soGrantedPct||0));
}
function soDilutionRiskPct(s){
  return clamp(s.soGrantedPct||0, 0, 0.2);
}

function playerShareholderStructure(s){
  const founder = founderOwnershipPct(s);
  const esop = esopOwnershipPct(s);
  const float = Math.max(0, 1 - founder - esop);
  const retail = s.isListed || s._ipoPreview ? retailShareOfFloat(s) : 0.45;
  const inst = 1 - retail;
  const rows = [
    {name:'創業社長', pct:founder},
    {name:'従業員持株会', pct:esop},
    {name:'機関投資家', pct: float * inst},
    {name:'個人株主・その他', pct: float * retail},
  ];
  if((s.soGrantedPct||0) > 0.001){
    rows.push({name:'SO潜在（未行使）', pct: s.soGrantedPct, soft:true});
  }
  return rows;
}
function playerNetWorth(s){
  const liquid = Math.max(0, Number(s.founderLiquid)||0);
  if(s.isListed && s.stockPrice){
    return (s.founderShares||0) * s.stockPrice + liquid;
  }
  // 未上場: 持分相当の簿価＋個人流動資産
  const book = equityValue(s) * founderOwnershipPct(s);
  return book + liquid;
}
function founderLiquidCap(s){
  return Math.max(0, Number(s.founderLiquid)||0);
}
function rivalNetWorth(rival){
  const impliedValue = rival.units * rival.price * 0.9; // 非上場ディスカウント込みの推定企業価値
  const founder = rival.shareholders.find(x=>x.name==='創業家');
  return impliedValue * (founder ? founder.pct : 0.3);
}
function companyBlurb(s, entity){
  if(entity.isPlayer){
    return `${entity.name.replace('株式会社','')}は関東を拠点に急成長する独立系エレベーター保守事業者。${s.isListed?listedMarkets(s).map(k=>EXCHANGES[k]?EXCHANGES[k].short:k).join('・')+'に上場。':'未上場。'}`;
  }
  return STYLE_BLURB[entity.style] || '独立系エレベーター保守事業者。';
}
function companyOutlookComment(entity){
  const h = entity.history||[];
  if(h.length<2) return 'データ収集中。';
  const prev = h[h.length-2], last = h[h.length-1];
  const growth = prev.units>0 ? (last.units-prev.units)/prev.units : 0;
  if(growth>0.05) return '新規契約の獲得が続き、拡大基調が鮮明。';
  if(growth<-0.03) return '解約が先行し、契約数はやや減少傾向。';
  return '横ばい圏で推移。';
}
/* ---- 貸借対照表（簡易） ---- */
function equityValue(s){ return (Number(s.paidInCapital)||0) + (Number(s.retainedEarnings)||0); }
function totalAssetsValue(s){ return equityValue(s) + totalDebt(s); }
function equityRatio(s){
  const eq = equityValue(s);
  const ta = totalAssetsValue(s);
  if(eq < 0) return eq / Math.max(1, Math.abs(ta)); // 純資産マイナス時は符号を保って明確に債務超過を示す
  return ta>0 ? eq/ta : 0;
}
function computeEndScore(s){
  const years = (s.year - 2026) + (s.quarter-1)/4;
  let score = 1000 - years*15;
  score += (RIVAL_TEMPLATES.length - s.rivals.length) * 80;
  score -= (s.accidentCount||0) * 40;
  score += Math.round((s.cumulativeDividends||0)/100000000)*5;
  score = Math.max(0, Math.round(score));
  let rank = 'D';
  if(score>=900) rank='S';
  else if(score>=700) rank='A';
  else if(score>=500) rank='B';
  else if(score>=300) rank='C';
  return {years, score, rank};
}
function takeoverEligible(s, rival){
  if(!rival || !(rival.units>0)) return false;
  // 従来: 2倍超
  if(rival.units < s.units * 0.5) return true;
  // 後期: 自社が相手の75%以上かつ相手が不振、または自社シェアが拮抗〜上回る
  const myShare = marketShare(s.units, s);
  const rShare = marketShare(rival.units, s);
  const vit = rival.vitality!=null ? rival.vitality : 60;
  if(s.units >= rival.units * 0.75 && vit < 48) return true;
  if(myShare >= rShare * 0.85 && (s.units||0) >= 20000 && vit < 55) return true;
  if(myShare >= 0.22 && s.units >= rival.units * 0.55 && (s.cash||0) > takeoverCost(s, rival) * 0.35) return true;
  return false;
}
function takeoverCost(s, rival){
  const distressMult = clamp(0.6 + (rival.vitality!=null ? rival.vitality : 60)/150, 0.6, 1.15);
  // 大型案件はプレミアム（規模が大きいほど割高）
  const sizePrem = 1 + clamp(((rival.units||0)/80000), 0, 0.45);
  return Math.round(rival.units * rival.price * 1.6 * distressMult * sizePrem);
}
function takeoverEligibilityHint(s, rival){
  if(takeoverEligible(s, rival)) return null;
  const need2x = Math.ceil((rival.units||0) * 2);
  const vit = rival.vitality!=null ? rival.vitality : 60;
  return `通常は自社が相手の2倍超（目安 ${num(need2x)}台）で解禁。後期は「相手の75%以上＋相手の経営不振」や「シェア拮抗＋資金力」でも可能。現状: 相手活力${Math.round(vit)}／自社${num(s.units)}台。`;
}
function independentRatio(s){
  const total = s.board.insiders + s.board.outsiders;
  return total>0 ? s.board.outsiders/total : 0;
}

function annualRevenue(s){ return s.units * s.price * segPriceMult(s) * contractPriceMult(s) + repairRevenueAnnual(s); }

/* ---- 地方市場 ---- */
function regionMarket(s, rid){
  const region = REGIONS.find(r=>r.id===rid);
  return s.marketTotal * region.weight;
}
function regionRivalTotal(s, rid){ return s.rivals.reduce((a,r)=>a+(r.regionUnits[rid]||0),0); }
function regionTotalOrganized(s, rid){ return (s.regionUnits[rid]||0) + regionRivalTotal(s, rid); }
function regionPool(s, rid){ return Math.max(0, regionMarket(s,rid) - regionTotalOrganized(s, rid)); }

function totalOrganized(s){ return s.units + s.rivals.reduce((a,r)=>a+r.units,0); }
function pool(s){ return Math.max(0, s.marketTotal - totalOrganized(s)); }
function marketShare(units,s){ return s.marketTotal>0 ? units/s.marketTotal : 0; }
function floorNumber(s){
  const sh = marketShare(s.units,s)*100;
  let f = Math.floor(sh) + 1;
  if(s.isListed) f += 3;
  return clamp(f, 1, 42);
}
function leaderShare(s){
  let best = marketShare(s.units,s);
  s.rivals.forEach(r=>{ best = Math.max(best, marketShare(r.units,s)); });
  return best;
}
function isPlayerLeader(s){
  const mine = marketShare(s.units,s);
  return s.rivals.every(r => mine > marketShare(r.units,s)) && mine > 0.30;
}

function pushLog(s,text,tag){
  s.log.unshift({q:`${s.year}Q${s.quarter}`, text, tag: tag||'info'});
  if(s.log.length>80) s.log.pop();
}

function pickCatalogEvent(){
  let total = 0;
  EVENT_CATALOG.forEach(e=>{ total += (e.w||1); });
  let r = Math.random() * total;
  for(const e of EVENT_CATALOG){
    r -= (e.w||1);
    if(r <= 0) return e;
  }
  return EVENT_CATALOG[EVENT_CATALOG.length-1];
}


/* ============================================================
   災害イベント（稀・構造的）
   大地震 / 大雨・浸水 — いずれもクールダウン付きの低確率
   ============================================================ */
function pickDisasterEpicenter(s){
  const weights = REGIONS.map(rg=>{
    const mine = s.regionUnits[rg.id]||0;
    const mkt = (typeof regionMarket==='function' ? regionMarket(s, rg.id) : (rg.weight||0.1)*(s.marketTotal||120000));
    return 0.35*(rg.weight||0.1) + 0.45*(s.units>0 ? mine/Math.max(1,s.units) : 0) + 0.20*(mkt/Math.max(1,s.marketTotal||1));
  });
  let total = weights.reduce((a,b)=>a+b,0);
  let r = Math.random()*total;
  for(let i=0;i<REGIONS.length;i++){
    r -= weights[i];
    if(r <= 0) return REGIONS[i];
  }
  return REGIONS[0];
}
function disasterMitigationFactor(s){
  let m = 0;
  if(s.upgrades && s.upgrades.iot) m += 0.12;
  if(s.upgrades && s.upgrades.ai_predict) m += 0.18;
  if(s.executives && s.executives.quality_officer) m += 0.05;
  m += clamp((s.quality||50)-50, -15, 30)*0.004;
  m += clamp((s.techSkill||50)-50, -20, 30)*0.003;
  return clamp(m, 0, 0.55);
}

/* ---- 大地震 ---- */
function applyMajorQuakeResponse(s, region, responseKey){
  const unitsHere = s.regionUnits[region.id]||0;
  const exposure = s.units>0 ? unitsHere/s.units : 0;
  const mitigate = disasterMitigationFactor(s);
  const util = capacity(s)>0 ? s.units/capacity(s) : 1.2;
  const spare = capacity(s)>0 ? Math.max(0,(capacity(s)-s.units)/capacity(s)) : 0;
  const fmExp = typeof contractRepairExposure==='function' ? contractRepairExposure(s) : 0.5;
  const ins = Math.min(INSURANCE_MAX_COVERAGE, Number(s.insuranceCoverage)||0);
  const RESP = {
    full:     {label:'全力動員', costMult:1.55, haircutMult:0.65, repDelta:4,  moraleDelta:-6, boostMult:2.1, boostTicks:5, lostFrac:0.008},
    standard: {label:'標準対応', costMult:1.0,  haircutMult:1.0,  repDelta:1,  moraleDelta:-3, boostMult:1.7, boostTicks:4, lostFrac:0.02},
    lean:     {label:'最小限対応', costMult:0.55, haircutMult:1.35, repDelta:-6, moraleDelta:-1, boostMult:1.25, boostTicks:3, lostFrac:0.045},
  };
  const resp = RESP[responseKey] || RESP.standard;
  const basePerUnit = 14000 + Math.random()*16000;
  let emergencyCost = unitsHere * basePerUnit * (0.55 + fmExp*0.9) * resp.costMult * (1 - mitigate*0.85);
  if(spare < 0.08) emergencyCost *= 1.25 + Math.min(0.5, (0.08-spare)*4);
  if(util > 1.05) emergencyCost *= 1.15;
  const insuredRelief = emergencyCost * ins * 0.85;
  emergencyCost = Math.max(0, Math.round(emergencyCost - insuredRelief));
  s.cash -= emergencyCost;
  const baseHaircut = clamp(0.04 + exposure*0.32, 0.04, 0.38) * (1 - mitigate*0.7) * resp.haircutMult;
  const disruptTicks = responseKey==='full' ? 1 : (responseKey==='lean' ? 3 : 2);
  s.quakeImpact = {
    regionId: region.id, regionName: region.name,
    ticksLeft: disruptTicks,
    revenueHaircut: clamp(baseHaircut, 0.02, 0.42),
    response: responseKey,
  };
  let lost = Math.round(unitsHere * resp.lostFrac * (1 - mitigate*0.6) * (util>1.1 ? 1.4 : 1));
  if(lost > 0 && unitsHere > 0){
    lost = Math.min(lost, unitsHere);
    s.regionUnits[region.id] = Math.max(0, unitsHere - lost);
    s.units = Object.values(s.regionUnits).reduce((a,b)=>a+b,0);
    if(s.segmentUnits){
      const segTotal = SEGMENT_IDS.reduce((a,id)=>a+(s.segmentUnits[id]||0),0) || 1;
      SEGMENT_IDS.forEach(id=>{
        const share = (s.segmentUnits[id]||0)/segTotal;
        s.segmentUnits[id] = Math.max(0, Math.round((s.segmentUnits[id]||0) - lost*share));
      });
    }
  }
  s.reputation = clamp((s.reputation||50)+resp.repDelta+(mitigate>0.25?1:0)+(spare>0.15?1:(spare<0.05?-2:0)), 5, 98);
  s.morale = clamp((s.morale||60)+resp.moraleDelta+(responseKey==='full'&&spare<0.1?-2:0), 5, 95);
  s.satisfaction = clamp((s.satisfaction||60)+(responseKey==='full'?3:responseKey==='lean'?-4:0), 5, 98);
  if(responseKey==='full'){ s.quality=clamp((s.quality||50)+1,5,98); s.techSkill=clamp((s.techSkill||50)+1.5,5,98); }
  else if(responseKey==='lean'){ s.quality=clamp((s.quality||50)-2,5,98); }
  s.regionBoost = {regionId: region.id, ticksLeft: resp.boostTicks, mult: resp.boostMult*(0.9+mitigate*0.25)};
  s.majorQuakeCooldown = 14 + Math.floor(Math.random()*10);
  s.majorQuakeCount = (s.majorQuakeCount||0)+1;
  const insNote = ins>0.05 ? `（保険で約${yen(Math.round(insuredRelief))}を軽減）` : '（保険付保が薄い／なし）';
  const lostNote = lost>0 ? `／契約喪失 ${num(lost)}台` : '／主要契約は維持';
  pushLog(s, `${region.name}の大地震に${resp.label}で臨んだ。緊急点検・応急費用 ${yen(emergencyCost)}${insNote}${lostNote}。運転再開まで売上の一部が停滞（減収率目安 ${pct(s.quakeImpact.revenueHaircut,0)}・${disruptTicks}四半期）。復旧需要は同地方で活発化。`, responseKey==='lean'?'warn':'info');
  if(s.rivals && s.rivals.length){
    const r = s.rivals[Math.floor(Math.random()*s.rivals.length)];
    if(r && (r.regionUnits[region.id]||0)>0) pushLog(s, `${r.name}も${region.name}で緊急点検対応に追われている。`, 'info');
  }
}

/* ---- 大雨・浸水災害（復旧作業に追われるが利益は出る） ---- */
function applyFloodResponse(s, region, responseKey){
  const unitsHere = s.regionUnits[region.id]||0;
  const exposure = s.units>0 ? unitsHere/s.units : 0;
  const mitigate = disasterMitigationFactor(s);
  const util = capacity(s)>0 ? s.units/capacity(s) : 1.2;
  const spare = capacity(s)>0 ? Math.max(0,(capacity(s)-s.units)/capacity(s)) : 0;
  const hasBranch = (s.regionBranches[region.id]||0)>0;
  const RESP = {
    full:     {label:'全力受注', feeMult:1.35, workMult:1.4,  repDelta:3,  moraleDelta:-7, boostMult:1.9, boostTicks:4},
    standard: {label:'標準対応', feeMult:1.0,  workMult:1.0,  repDelta:1,  moraleDelta:-4, boostMult:1.55, boostTicks:3},
    lean:     {label:'選別受注', feeMult:0.55, workMult:0.55, repDelta:-2, moraleDelta:-1, boostMult:1.2,  boostTicks:2},
  };
  const resp = RESP[responseKey] || RESP.standard;
  const ownRecoverUnits = Math.round(unitsHere * (0.08 + Math.random()*0.10) * resp.workMult);
  const externalPool = Math.round(
    ((typeof regionMarket==='function' ? regionMarket(s, region.id) : (region.weight||0.1)*(s.marketTotal||120000)) * 0.012)
    * (hasBranch ? 1.0 : 0.35) * resp.workMult * (0.7 + Math.random()*0.5)
  );
  const recoverUnits = ownRecoverUnits + externalPool;
  const feePer = 85000 + Math.random()*55000;
  let grossFee = Math.round(recoverUnits * feePer * resp.feeMult);
  let costRatio = 0.42 - mitigate*0.12 + (spare<0.08 ? 0.10 : 0) + (util>1.05 ? 0.08 : 0);
  costRatio = clamp(costRatio, 0.28, 0.62);
  if(!hasBranch && unitsHere>0) costRatio += 0.06;
  const directCost = Math.round(grossFee * costRatio);
  const netProfit = grossFee - directCost;
  s.cash += netProfit;
  const followTicks = responseKey==='full' ? 3 : (responseKey==='lean' ? 1 : 2);
  const followPerQ = Math.round(netProfit * (0.35 + Math.random()*0.25) / Math.max(1, followTicks));
  s.floodImpact = {
    regionId: region.id, regionName: region.name,
    ticksLeft: followTicks,
    bonusRevenuePerQ: followPerQ,
    strain: resp.workMult,
    response: responseKey,
  };
  s.morale = clamp((s.morale||60)+resp.moraleDelta+(spare<0.1?-2:0), 5, 95);
  s.reputation = clamp((s.reputation||50)+resp.repDelta+(hasBranch?1:0), 5, 98);
  if(responseKey==='full') s.techSkill = clamp((s.techSkill||50)+1, 5, 98);
  else s.satisfaction = clamp((s.satisfaction||60)+2, 5, 98);
  if(util>1.0 && responseKey==='full') s.quality = clamp((s.quality||50)-1, 5, 98);
  s.regionBoost = {regionId: region.id, ticksLeft: resp.boostTicks, mult: resp.boostMult * (0.95 + mitigate*0.15)};
  s.floodCooldown = 12 + Math.floor(Math.random()*10);
  s.floodDisasterCount = (s.floodDisasterCount||0)+1;
  pushLog(s,
    `${region.name}の大雨・浸水に${resp.label}で対応した。緊急復旧工事 約${num(recoverUnits)}台分を実施し、純益 ${yen(netProfit)}（売上 ${yen(grossFee)}／原価 ${yen(directCost)}）。現場は逼迫するが、続く復旧需要も見込まれる（四半期あたり約${yen(followPerQ)}・${followTicks}四半期）。`,
    'good'
  );
  if(s.rivals && s.rivals.length){
    const r = s.rivals[Math.floor(Math.random()*s.rivals.length)];
    if(r) pushLog(s, `${r.name}も${region.name}で浸水復旧の問い合わせ対応に追われている。`, 'info');
  }
}

/** 大型商談モーダルを開く。成功時 true */

/** 官公庁入札の勝率（検査員余力・事務・信用が鍵） */
function publicBidWinChance(s, stance){
  ensureInspectors(s);
  const insp = s.inspectors||0;
  if(insp < 1) return 0.02;
  const pubCap = publicCapacity(s);
  const pubUnits = (s.segmentUnits && s.segmentUnits.public) || 0;
  const spare = Math.max(0, pubCap - pubUnits);
  let p = 0.18;
  p += Math.min(0.22, spare / 80 * 0.22); // 資格者余力
  p += (s.reputation - 50) * 0.003;
  p += (s.quality - 50) * 0.0025;
  p += (adminSupportMult(s) - 1) * 0.2;
  if(s.isListed) p += 0.06;
  if(s.exchange === 'prime' || (s.listedOn||[]).includes('prime')) p += 0.04;
  if(s.adChannels && s.adChannels.public_bid) p += 0.08;
  if(s.executives && s.executives.sales_dir) p += 0.03;
  const skill = (s.salesSkill!=null?s.salesSkill:50);
  p += (skill - 50) * 0.002;
  if(stance === 'aggressive') p += 0.10; // 低価格・手厚い体制
  if(stance === 'lean') p -= 0.08;
  return clamp(p, 0.03, 0.82);
}
function resolvePublicBid(regionId, dealSize, stance){
  const s = state;
  const region = REGIONS.find(r=>r.id===regionId) || REGIONS[0];
  const winChance = publicBidWinChance(s, stance);
  const win = Math.random() < winChance;
  // 入札・書類費用
  let bidCost = 400000 + Math.round(dealSize * 8000);
  if(stance === 'aggressive') bidCost = Math.round(bidCost * 1.35);
  if(stance === 'lean') bidCost = Math.round(bidCost * 0.7);
  if(bidCost > s.cash){
    pushLog(s, `入札参加費用（${yen(bidCost)}）が不足し、辞退扱いになった。`, 'warn');
    modal = null;
    if(!s.gameOver) startTimer();
    render(); autoSave();
    return;
  }
  s.cash -= bidCost;
  ensureInspectors(s);
  if(win){
    const pubCap = publicCapacity(s);
    const pubUnits = (s.segmentUnits && s.segmentUnits.public) || 0;
    const spare = Math.max(0, pubCap - pubUnits);
    let won = Math.min(dealSize, Math.max(0, spare));
    // 定員全体も制約
    const spareCap = Math.max(0, capacity(s) - s.units);
    won = Math.min(won, spareCap);
    if(won <= 0){

      if(!s.segmentUnits) s.segmentUnits = {};
      s.segmentUnits.public = (s.segmentUnits.public||0) + won;
      s.reputation = clamp((s.reputation||50)+3, 5, 98);
      s.satisfaction = clamp((s.satisfaction||50)+1, 5, 98);

      }
      const stanceLabel = stance==='aggressive'?'積極（低価格・体制厚め）': stance==='lean'?'堅実（必要最小限）':'標準';
      pushLog(s, `官公庁入札に落札（${region.name}・${stanceLabel}・+${num(won)}台／参加費 ${yen(bidCost)}）。昇降機等検査員の枠内で履行する。`, 'good');

  if(!s.gameOver) startTimer();
  render(); autoSave();
}

function pickDominantMaker(s){
  if(!s.makerMix) return 'other';
  let best='other', bestW=-1;
  MAKER_IDS.forEach(id=>{
    const w = s.makerMix[id]||0;
    if(w>bestW){ bestW=w; best=id; }
  });
  return best;
}
function processMakerEffects(s, logs){
  if((s.recallTicks||0) > 0){
    s.recallTicks--;
    // リコール対応コストと品質圧力
    const cost = Math.round(80000 + (s.units||0) * 120);
    const paid = Math.min(Math.max(0,s.cash), cost);
    s.cash -= paid;
    s.quality = clamp((s.quality||50) - 0.4, 5, 98);
    if(s.recallTicks <= 0){
      logs.push({text:'リコール対応作業が一通り完了した。', tag:'info'});
      pushCompanyChronicle(s, 'リコール対応を完了', 'info');
    }
  }
  if(s.makerCertHold && (s.makerCertHold.ticksLeft||0) > 0){
    s.makerCertHold.ticksLeft--;
    s.partsSupplyMult = Math.max(s.partsSupplyMult||1, 1.12);
    if(s.makerCertHold.ticksLeft <= 0){
      logs.push({text:`${s.makerCertHold.label||'メーカー'}向け認定・供給制限が解除された。`, tag:'good'});
      s.makerCertHold = null;
      if((s.recallTicks||0)<=0) s.partsSupplyMult = 1;
    }
  } else if((s.recallTicks||0)<=0 && (s.partsSupplyMult||1) > 1 && !s.makerCertHold){
    s.partsSupplyMult = 1;
  }
  if((s.counterOfferCooldown||0) > 0) s.counterOfferCooldown--;
}

        }},

    };

        }},

  modal = {
