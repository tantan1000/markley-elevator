function resolveCeoDismissalVote(fought){
  const s = state;
  let approval = computeApprovalRate(s, 0.6);
  approval -= founderOwnershipPct(s) * 40;
  let cost = 0;
  if(fought){
    cost = Math.round(Math.max(0,s.cash) * 0.1);
    s.cash -= cost;
    approval -= 15;
  }
  approval = clamp(approval, 2, 95);
  const passed = Math.random()*100 < approval;
  if(passed){
    const oldName = s.ceoName;
    s.reputation = clamp(s.reputation-10, 5, 98);
    if(s.psr) s.psr *= 0.85;
    s.gameOver = true;
    s.victory = false;
    stopTimer();
    const score = computeEndScore(s);
    pushLog(s, `第3号議案「社長解任の件」は賛成${Math.round(approval)}％で可決。${oldName}氏は社長を解任された。`, 'warn');
    modal = {type:'over', title:'社長解任によるゲームオーバー', body:`株主総会にて${oldName}氏の解任動議が賛成${Math.round(approval)}％で可決された。持株比率の低下により経営権を維持できず、創業社長は${s.companyName}の経営から退くこととなった。\n\n在任期間 ${score.years.toFixed(2)}年／最終保有台数 ${num(s.units)}台／最終シェア ${pct(marketShare(s.units,s),2)}`};
  } else {
    s.reputation = clamp(s.reputation+2, 5, 98);
    const appr = Math.round(approval);
    pushLog(s, `第3号議案「社長解任の件」は賛成${appr}％にとどまり否決された。経営体制は維持される。${fought?`（防衛費用 ${yen(cost)}）`:''}`, 'good');
    showAgmVoteResult({
      name: '社長解任の件',
      stance: fought ? '委任状争奪戦で抗戦' : '静観',
      approval: appr,
      passed: false,
      detail: `経営体制は維持される。${fought?`防衛費用 ${yen(cost)}。`:''}`,
      after: ()=>{},
    });
    return;
  }
  render(); autoSave();
}

function doAppointOutsideDirector(){
  const s = state;
  if(s.board.outsiders>=5){ pushLog(s, 'これ以上、社外取締役を増員する必要性は乏しい。', 'warn'); render(); return; }

  s.board.outsiders += 1;

  }

}

function resolveDeal(regionId, dealSize, stance){
  const s = state;
  const region = REGIONS.find(r=>r.id===regionId);
  const branchOk = (s.regionBranches[regionId]||0) > 0;
  const coolerPerUnit = 180000; // カゴ内クーラー無料取付の台あたり経費
  // 通常 / 3ヶ月無料 / 3ヶ月無料+クーラー
  let winChance = branchOk ? 0.28 : 0.10;
  winChance += (s.reputation-50)*0.004;
  winChance += (s.quality-50)*0.002;
  let freeYears = 0;
  let withCooler = false;
  let stanceLabel = '通常条件';
  if(stance==='free3m' || stance==='free6m' || stance==='low'){
    winChance += 0.16;
    freeYears = 0.25; // 3ヶ月
    stanceLabel = '保守料金・3ヶ月無料';
  } else if(stance==='free3m_cooler' || stance==='free12m'){
    winChance += 0.28;
    freeYears = 0.25;
    withCooler = true;
    stanceLabel = '3ヶ月無料＋カゴ内クーラー無料取付';
  } else if(stance==='high'){
    winChance -= 0.10;
    stanceLabel = '高価格';
  }
  winChance = clamp(winChance, 0.05, 0.92);
  const win = Math.random() < winChance;
  if(win){
    const actualUnits = branchOk ? dealSize : Math.round(dealSize*0.6);
    s.regionUnits[regionId] = (s.regionUnits[regionId]||0) + actualUnits;
    s.units += actualUnits;
    if(s.segmentUnits){
      const half = Math.floor(actualUnits/2);
      s.segmentUnits.mgmt_company = (s.segmentUnits.mgmt_company||0) + half;
      s.segmentUnits.commercial = (s.segmentUnits.commercial||0) + (actualUnits - half);
    }
    let freeCost = 0;
    let coolerCost = 0;
    if(freeYears > 0){
      freeCost = Math.round(actualUnits * (s.price||C.UNIT_FEE_ANNUAL) * freeYears);
      s.cash -= freeCost;
      s.satisfaction = clamp((s.satisfaction||50)+2, 5, 98);
    } else {
      s.reputation = clamp((s.reputation||50)+1, 5, 98);
    }
    if(withCooler){
      coolerCost = Math.round(actualUnits * coolerPerUnit);
      s.cash -= coolerCost;
      s.satisfaction = clamp((s.satisfaction||50)+3, 5, 98);
      s.quality = clamp((s.quality||50)+1, 5, 98);
    }
    const costBits = [];
    if(freeCost>0) costBits.push(`無料期間相当 ${yen(freeCost)}`);
    if(coolerCost>0) costBits.push(`クーラー取付経費 ${yen(coolerCost)}`);
    pushLog(s,
      `${region.name}の大型商談を獲得した（${stanceLabel}・+${num(actualUnits)}台` +
      (costBits.length ? `／${costBits.join('・')}` : '') +
      `）。${!branchOk?'（現地拠点なしのため一部のみ対応）':''}`,
      'good');
  } else {
    pushLog(s, `${region.name}の大型商談は競合に競り負けた（${stanceLabel}で提案・受注確率目安 ${Math.round(winChance*100)}%）。`, 'warn');
  }
  modal = null;
  if(!s.gameOver) startTimer();
  render(); autoSave();
}
function baseLoanRate(s){
  const cycleAdj = s.cycle==='boom' ? -0.004 : s.cycle==='recession' ? 0.006 : 0;
  return C.LOAN_RATE + (s.rateAdj||0) + cycleAdj + loanRateExecAdj(s) + creditRatingInfo(s).adj + mainBankRateAdj(s);
}
function bankBorrowingLimit(s){
  const rev = Math.max(0, annualRevenue(s));
  const eq = Math.max(0, equityValue(s));
  const rating = creditRatingInfo(s);
  let mult = 0.55;
  const lab = rating.label||'';
  if(lab==='AAA'||lab==='AA') mult = 0.85;
  else if(lab==='A') mult = 0.70;
  else if(lab==='BBB') mult = 0.55;
  else if(lab==='BB') mult = 0.40;
  else mult = 0.28;
  const rel = (s.mainBankRelationship||50)/100;
  mult *= (0.75 + rel * 0.45);
  if(s.cycle==='recession') mult *= 0.82;
  if(s.cycle==='boom') mult *= 1.08;
  let limit = rev * mult + eq * 0.35;
  if(s.isListed) limit *= 1.12;
  return Math.max(0, limit);
}
function ensureLoanBook(s){
  if(!s.loans) s.loans = [];
  if((s.debt||0) > 0 && s.loans.length===0){
    s.loans.push({ id:'legacy'+Date.now(), type:'term', principal:s.debt, rate:baseLoanRate(s) });
  }
  s.debt = s.loans.reduce((a,L)=>a+(L.principal||0),0);
}
function weightedDebtUsed(s){
  ensureLoanBook(s);
  let w = 0;
  (s.loans||[]).forEach(L=>{
    const p = LOAN_PRODUCTS[L.type] || LOAN_PRODUCTS.term;
    w += (L.principal||0) * (p.capacityWeight!=null ? p.capacityWeight : 1);
  });
  (s.bonds||[]).forEach(b=>{
    const bp = BOND_PRODUCTS[b.product||'straight'] || BOND_PRODUCTS.straight;
    w += (b.principalRemaining||0) * (bp.capacityWeight!=null ? bp.capacityWeight : 0.9);
  });
  return w;
}
function bankBorrowingHeadroom(s){
  return Math.max(0, bankBorrowingLimit(s) - weightedDebtUsed(s));
}
function loanProductEligible(s, key){
  const p = LOAN_PRODUCTS[key];
  if(!p) return {ok:false, reason:'不明な商品'};
  if(p.minRev && annualRevenue(s) < p.minRev) return {ok:false, reason:`年換算売上 ${yen(p.minRev)} 以上が必要`};
  if(p.minUnits && (s.units||0) < p.minUnits) return {ok:false, reason:`保守台数 ${num(p.minUnits)}台以上が必要`};
  if(p.minRel && (s.mainBankRelationship||0) < p.minRel) return {ok:false, reason:`メインバンク関係 ${p.minRel} 以上が必要`};
  return {ok:true};
}
function maxLoanForProduct(s, key){
  const p = LOAN_PRODUCTS[key];
  if(!p) return 0;
  const head = bankBorrowingHeadroom(s);
  const weight = p.capacityWeight||1;
  const byHead = weight>0 ? head / weight : 0;
  const byFrac = bankBorrowingLimit(s) * (p.maxFrac||0.5);
  return Math.max(0, Math.min(byHead, byFrac));
}
function bondProductEligible(s, key){
  const p = BOND_PRODUCTS[key];
  if(!p) return {ok:false, reason:'不明'};
  if(p.requiresListed && !s.isListed) return {ok:false, reason:'上場後に利用可能'};
  if(p.minRev && annualRevenue(s) < p.minRev) return {ok:false, reason:`年換算売上 ${yen(p.minRev)} 以上`};
  return {ok:true};
}
function doIssueBond(amount, productKey){
  const s = state;
  amount = Math.round(amount||0);
  if(amount<=0) return;
  productKey = productKey || 'straight';
  const p = BOND_PRODUCTS[productKey] || BOND_PRODUCTS.straight;
  const elig = bondProductEligible(s, productKey);
  if(!elig.ok){ pushLog(s, `${p.label}は発行できない（${elig.reason}）。`, 'warn'); render(); return; }
  const head = bankBorrowingHeadroom(s);
  const need = amount * (p.capacityWeight||0.9);
  if(need > head + 1){
    pushLog(s, `${p.label}の余力が不足（希望 ${yen(amount)}／余力目安 ${yen(Math.floor(head/(p.capacityWeight||0.9)))}）。`, 'warn'); render(); return;
  }
  const term = p.termTicks || BOND_TERM_TICKS;
  const coupon = baseLoanRate(s) + (p.couponSpread!=null ? p.couponSpread : BOND_COUPON_SPREAD);
  s.bonds.push({
    id: 'bond'+Date.now(),
    product: productKey,
    principalRemaining: amount,
    couponRate: coupon,
    quarterlyPrincipal: amount / term,
    ticksLeft: term,
    convertible: productKey==='convertible',
  });
  s.cash += amount;
  pushLog(s, `${p.label}を ${yen(amount)} 発行した（表面利率 ${(coupon*100).toFixed(2)}%・${term}四半期償還）。`, 'info');
  render(); autoSave();
}
function doLoan(amount, productKey){
  const s = state;
  amount = Math.round(amount||0);
  if(amount<=0) return;
  productKey = productKey || 'term';
  const p = LOAN_PRODUCTS[productKey] || LOAN_PRODUCTS.term;
  ensureLoanBook(s);
  const elig = loanProductEligible(s, productKey);
  if(!elig.ok){ pushLog(s, `${p.label}は利用できない（${elig.reason}）。`, 'warn'); render(); return; }
  const cap = maxLoanForProduct(s, productKey);
  if(amount > cap + 1){
    pushLog(s, `${p.label}の借入余力が不足（希望 ${yen(amount)}／余力目安 ${yen(Math.floor(cap))}）。`, 'warn');
    render(); return;
  }
  const rate = baseLoanRate(s) + (p.rateSpread||0);
  s.loans.push({ id:'ln'+Date.now()+Math.floor(Math.random()*99), type:productKey, principal:amount, rate });
  ensureLoanBook(s);
  s.cash += amount;
  if(productKey==='syndicate') s.mainBankRelationship = clamp((s.mainBankRelationship||50)+2, 5, 98);
  if(productKey==='subordinated') s.mainBankRelationship = clamp((s.mainBankRelationship||50)-1, 5, 98);
  pushLog(s, `${p.label}で ${yen(amount)} を調達した（金利 ${(rate*100).toFixed(2)}%/年）。借入余力の残り ${yen(Math.floor(bankBorrowingHeadroom(s)))}。`, 'info');
  render(); autoSave();
}
function ownerIssuePrice(s){
  if(s.isListed && s.stockPrice){
    return Math.max(1, Math.round(s.stockPrice)); // 社長引受は時価近傍
  }
  // 未上場: 簿価ベースの簡易1株価値
  const book = Math.max(1, equityValue(s));
  return Math.max(100, Math.round(book / Math.max(1, s.shares)));
}
/** オーナー増資（社長が個人資金で新株を引き受ける） */
function doOwnerSubscribe(amount){
  const s = state;
  amount = Math.round(amount||0);
  if(amount < 1000000){
    pushLog(s, 'オーナー増資は100万円以上で指定してほしい。', 'warn');
    render(); return;
  }
  if(s.offeringFrozenTicksLeft>0){
    pushLog(s, `資本政策のクールダウン中（あと${s.offeringFrozenTicksLeft}四半期）。`, 'warn');
    render(); return;
  }
  if(s.founderLiquid==null) s.founderLiquid = 50000000;
  const liquid = founderLiquidCap(s);
  if(amount > liquid){
    pushLog(s, `社長個人の流動資産が不足している（目安 ${yen(liquid)}）。配当の蓄積や時間経過で増える。`, 'warn');
    render(); return;
  }
  const price = ownerIssuePrice(s);
  const newShares = Math.max(1, Math.round(amount / price));
  const proceeds = Math.round(newShares * price);
  if(proceeds > liquid){
    pushLog(s, `引受に必要な個人資金が不足している（必要 ${yen(proceeds)}／保有 ${yen(liquid)}）。`, 'warn');
    render(); return;
  }
  s.founderLiquid -= proceeds;
  s.shares += newShares;
  s.founderShares = (s.founderShares||0) + newShares;
  s.cash += proceeds;
  s.paidInCapital = (s.paidInCapital||0) + proceeds;
  s.offeringFrozenTicksLeft = 2;
  s.reputation = clamp((s.reputation||50)+0.8, 5, 98);
  const own = founderOwnershipPct(s);
  pushLog(s, `オーナー増資（社長引受）を実施した。社長個人から${yen(proceeds)}を払い込み、${num(newShares)}株を引き受けた（1株あたり約${num(price)}円）。会社現金が増加し、社長持分は約${pct(own,1)}。`, 'good');
  render(); autoSave();
}
function doOffering(amount, productKey){
  const s = state;
  amount = Math.round(amount||0);
  productKey = productKey || 'public';
  if(productKey === 'owner'){ doOwnerSubscribe(amount); return; }
  const ep = EQUITY_PRODUCTS[productKey] || EQUITY_PRODUCTS.public;
  if(!s.isListed || !s.stockPrice || amount<=0) return;
  if(s.offeringFrozenTicksLeft>0){ pushLog(s, `資本政策のクールダウン中（あと${s.offeringFrozenTicksLeft}四半期）。`, 'warn'); render(); return; }
  const issuePrice = Math.max(1, s.stockPrice * (1 - (ep.discount||0)));
  const newShares = Math.round(amount / issuePrice);
  if(newShares <= 0) return;
  const proceeds = Math.round(newShares * issuePrice);
  const founderBefore = founderOwnershipPct(s);
  if(ep.dilutFounder === false){
    const addFounder = Math.round(newShares * founderBefore);
    s.shares += newShares;
    s.founderShares = (s.founderShares||0) + addFounder;
  } else {
    s.shares += newShares;
  }
  s.cash += proceeds;
  s.paidInCapital = (s.paidInCapital||0) + proceeds;
  s.offeringFrozenTicksLeft = ep.freezeTicks!=null ? ep.freezeTicks : 3;
  if(ep.strategicBump){
    s.reputation = clamp(s.reputation+1.5, 5, 98);
    s.adAwareness = Math.min(100, (s.adAwareness||0)+3);
  }
  if(productKey==='public') s.adAwareness = Math.min(100, (s.adAwareness||0)+4);
  pushLog(s, `${ep.label}により ${yen(proceeds)} を調達（+${num(newShares)}株／発行価格 ${num(Math.round(issuePrice))}円）。創業社長持株 ${pct(founderOwnershipPct(s),1)}。`, 'info');
  render(); autoSave();
}
function doStockSplit(ratio){
  const s = state;
  if(!s.isListed || !s.stockPrice || !ratio || ratio<=1) return;
  ratio = Math.round(ratio);
  if(s.shareActionCooldown>0){
    pushLog(s, `株式分割・併合のクールダウン中（あと${s.shareActionCooldown}四半期）。頻繁な変更は市場の信認を損なう。`, 'warn');
    render(); return;
  }
  const priceBefore = s.stockPrice;
  const shBefore = estimatedShareholderCount(s);
  const accessBefore = priceAccessibilityScore(s);

  s.shares = Math.round(s.shares * ratio);
  s.founderShares = Math.round((s.founderShares||0) * ratio);
  s.stockPrice = Math.max(1, s.stockPrice / ratio);
  // SO行使価格も理論調整
  if(s.soStrike > 0) s.soStrike = Math.max(1, Math.round(s.soStrike / ratio));

  // --- 現実的効果 ---
  // 高位株を買いやすい帯へ落とすほど効果大。既に安い株の分割は効果が薄い
  const accessAfter = priceAccessibilityScore(s);
  const accessGain = Math.max(0, accessAfter - accessBefore);
  const ratioBoost = Math.min(0.28, 0.06 * Math.log2(ratio));
  const biasAdd = ratioBoost + accessGain * 0.35;
  s.shareLiquidityBias = clamp((s.shareLiquidityBias||0) + biasAdd, -0.45, 0.55);
  // 個人の買いやすさ向上 → 認知・信認の小幅改善（一時）
  s.adAwareness = clamp((s.adAwareness||10) + 2 + ratioBoost * 20 + accessGain * 8, 0, 100);
  s.marketTrust = clamp((s.marketTrust||50) + 1.5 + accessGain * 4, 5, 98);
  // 事務・証券代行コスト
  const adminCost = Math.round(800000 + s.shares * 0.4);
  s.cash -= adminCost;
  s.shareActionCooldown = 3;

  const shAfter = estimatedShareholderCount(s);
  pushLog(s,
    `1株を${ratio}株に分割する株式分割を実施した（${num(priceBefore)}円→${num(s.stockPrice)}円、発行済 ${num(s.shares)}株）。`+
    `最低投資額が下がり個人が入りやすくなった（推定株主 約${num(shBefore)}人→約${num(shAfter)}人）。`+
    `証券代行・事務コスト ${yen(adminCost)}。`,
    'good');
  render(); autoSave();
}
function doStockConsolidation(ratio){
  const s = state;
  if(!s.isListed || !s.stockPrice || !ratio || ratio<=1) return;
  ratio = Math.round(ratio);
  if(s.shareActionCooldown>0){
    pushLog(s, `株式分割・併合のクールダウン中（あと${s.shareActionCooldown}四半期）。`, 'warn');
    render(); return;
  }
  const priceBefore = s.stockPrice;
  const shBefore = estimatedShareholderCount(s);
  const accessBefore = priceAccessibilityScore(s);
  const wasPenny = priceBefore < 100;
  const wasDistressed = priceBefore < 50;

  s.shares = Math.max(1, Math.round(s.shares / ratio));
  s.founderShares = Math.max(1, Math.round((s.founderShares||0) / ratio));
  s.stockPrice = Math.max(1, s.stockPrice * ratio);
  if(s.soStrike > 0) s.soStrike = Math.max(1, Math.round(s.soStrike * ratio));

  // --- 現実的効果 ---
  const accessAfter = priceAccessibilityScore(s);
  const accessLoss = Math.max(0, accessBefore - accessAfter);
  // 低位株是正なら信認回復、そうでなければ「見栄えの操作」と見られやすい
  let trustDelta, biasAdd, tag, note;
  if(wasDistressed){
    trustDelta = 3.5;
    biasAdd = -0.04; // 併合自体の流動性マイナスは小さい
    tag = 'good';
    note = '著しい低位株を是正し、信用不安の緩和が期待される。';
  } else if(wasPenny){
    trustDelta = 1.5;
    biasAdd = -0.08 - accessLoss * 0.15;
    tag = 'info';
    note = '低位株水準を是正した。投資しやすさは一部低下する可能性がある。';
  } else {
    trustDelta = -2.5 - Math.min(3, Math.log2(ratio));
    biasAdd = -0.14 - accessLoss * 0.25 - Math.min(0.12, 0.04 * Math.log2(ratio));
    tag = 'warn';
    note = '株価水準に余裕がある中での併合は、市場からネガティブに解釈されやすい。';
  }
  s.shareLiquidityBias = clamp((s.shareLiquidityBias||0) + biasAdd, -0.45, 0.55);
  s.marketTrust = clamp((s.marketTrust||50) + trustDelta, 5, 98);
  s.adAwareness = clamp((s.adAwareness||10) - accessLoss * 6 - (wasPenny?0:3), 0, 100);
  if(s.psr && !wasPenny){
    s.psr = Math.max(0.2, s.psr * (1 - 0.02 * Math.min(3, Math.log2(ratio))));
  } else if(s.psr && wasDistressed){
    s.psr = Math.min(s.psr * 1.03, s.psr + 0.04);
  }
  const adminCost = Math.round(1200000 + (s.shares||0) * 0.5);
  s.cash -= adminCost;
  s.shareActionCooldown = 4;

  const shAfter = estimatedShareholderCount(s);
  pushLog(s,
    `${ratio}株を1株に併合する株式併合を実施した（${num(priceBefore)}円→${num(s.stockPrice)}円、発行済 ${num(s.shares)}株）。`+
    note +
    `推定株主 約${num(shBefore)}人→約${num(shAfter)}人。事務コスト ${yen(adminCost)}。`,
    tag);
  render(); autoSave();
}
function buyManda(id, typeKey, methodKey){
  const s = state;
  const m = mandaOffers.find(x=>x.id===id);
  if(!m) return;
  const ot = OWNERSHIP_TYPES[typeKey] || OWNERSHIP_TYPES.full;
  const cost = Math.round(m.price * ot.pct/100);
  methodKey = methodKey || (s.isListed && s.stockPrice ? 'mixed' : 'cash');
  const pay = applyDealPayment(s, cost, methodKey);
  if(!pay.ok){
    pushLog(s, `${m.name}を買収できない（${pay.reason}）。`, 'warn');
    render(); return;
  }
  pushLog(s, `${m.name}を${pay.label}により${ot.label}化した（${formatDealPayment(pay)}）。`, 'good');
  const region = REGIONS.find(rg=>rg.id===m.regionId);
  if(typeKey==='equity'){
    s.equityMethodHoldings.push({
      id: 'eq'+Date.now()+Math.floor(Math.random()*999),
      name: m.name,
      regionName: region ? region.name : m.regionId,
      units: m.units,
      ownershipPct: ot.pct,
      acquiredYear: s.year,
      president: randomPersonName(),
      rivalId: null,
    });
    pushLog(s, `${m.name}は持分法適用会社として自社グループに加わった（自社の台数・売上には計上されない）。`, 'good');
  } else {
    s.units += m.units;
    s.regionUnits[m.regionId] = (s.regionUnits[m.regionId]||0) + m.units;
    const gainedTechs2 = Math.round(m.units / C.TECH_CAPACITY * 0.9);
    s.techs += gainedTechs2;
    ensureInspectors(s);
    s.inspectors = Math.min(s.techs, (s.inspectors||0) + Math.round(gainedTechs2 * 0.4));
    s.branches += 1;
    s.regionBranches[m.regionId] = (s.regionBranches[m.regionId]||0) + 1;
    s.subsidiaries.push({
      id: 'sub'+Date.now()+Math.floor(Math.random()*999),
      name: m.name,
      regionId: m.regionId,
      regionName: region ? region.name : m.regionId,
      units: m.units,
      acquiredYear: s.year,
      president: randomPersonName(),
      ownershipType: typeKey,
      ownershipPct: ot.pct,
    });
    pushLog(s, `${m.name}は${ot.label}として${s.companyName.replace('株式会社','')}グループに加わった。`, 'good');
  }
  mandaOffers = mandaOffers.filter(x=>x.id!==m.id);
  render(); autoSave();
}

function tickerSignature(s){
  if(!s || !s.log || !s.log.length) return 'empty';
  return s.log.slice(0, 12).map(l => (l.q||'')+'|'+(l.tag||'')+'|'+(l.text||'')).join('||');
}
function tickerBaseDurationSec(itemCount){
  // 標準速度(tickerSpeed=1)の一周秒数。大きいほど遅い
  return Math.max(90, Math.min(200, (itemCount || 1) * 9));
}
function tickerSpeedToAngle(sp){
  // 0.35〜3.0 を 0〜270deg の円弧にマップ
  const t = (Math.max(0.12, Math.min(3, sp)) - 0.12) / (3 - 0.12);
  return Math.round(t * 270);
}
function angleToTickerSpeed(ang){
  const t = Math.max(0, Math.min(270, ang)) / 270;
  return 0.12 + t * (3 - 0.12);
}
function applyTickerSpeedToDom(){
  const sp = Math.max(0.12, Math.min(3, Number(tickerSpeed) || 1));
  const move = document.querySelector('#event-ticker .ticker-move');
  if(move){
    const n = parseInt(move.dataset.itemCount || '8', 10);
    const base = tickerBaseDurationSec(n);
    move.style.animationDuration = (base / sp) + 's';
  }
  const knob = document.querySelector('#event-ticker .ticker-knob');
  if(knob){
    const ang = tickerSpeedToAngle(sp);
    knob.style.setProperty('--knob-ang', ang + 'deg');
    const inner = knob.querySelector('.ticker-knob-inner');
    if(inner) inner.textContent = sp < 0.35 ? '微' : sp < 0.75 ? '遅' : sp < 1.3 ? '中' : sp < 2.2 ? '速' : '最';
  }
}
function setTickerSpeed(sp){
  tickerSpeed = Math.max(0.12, Math.min(3, Number(sp) || 1));
  try{ localStorage.setItem('mercury-ticker-speed', String(tickerSpeed)); }catch(e){}
  applyTickerSpeedToDom();
}
const TICKER_SPEED_STEPS = [0.12, 0.25, 0.4, 0.6, 0.85, 1.2, 1.7, 2.4, 3.0];
function cycleTickerSpeedUp(){
  const sp = Math.max(0.12, Math.min(3, Number(tickerSpeed) || 1));
  let idx = 0;
  for(let i=0;i<TICKER_SPEED_STEPS.length;i++){
    if(sp < TICKER_SPEED_STEPS[i] - 0.02){ idx = i; break; }
    idx = (i + 1) % TICKER_SPEED_STEPS.length; // 最後まで行ったら0へ
  }
  // 現在値に最も近いステップを探し、次へ
  let nearest = 0;
  let best = 99;
  for(let i=0;i<TICKER_SPEED_STEPS.length;i++){
    const d = Math.abs(TICKER_SPEED_STEPS[i] - sp);
    if(d < best){ best = d; nearest = i; }
  }
  const next = TICKER_SPEED_STEPS[(nearest + 1) % TICKER_SPEED_STEPS.length];
  setTickerSpeed(next);
}
function bindTickerKnob(knob){
  if(!knob || knob.dataset.bound) return;
  knob.dataset.bound = '1';
  knob.style.cursor = 'pointer';
  knob.title = 'タップで速度アップ（一周で最低速度に戻る）';
  let ignoreClickUntil = 0;
  knob.addEventListener('click', (ev)=>{
    if(Date.now() < ignoreClickUntil){ ev.preventDefault(); return; }
    ev.preventDefault();
    ev.stopPropagation();
    cycleTickerSpeedUp();
  });
  knob.addEventListener('touchend', (ev)=>{
    ev.preventDefault();
    ignoreClickUntil = Date.now() + 400;
    cycleTickerSpeedUp();
  }, {passive:false});
}
function buildTickerSpeedControls(){
  const wrap = el('div',{class:'ticker-speed'});
  const kw = el('div',{class:'ticker-knob-wrap'});
  const knob = el('div',{class:'ticker-knob', title:'ティッカー速度（ドラッグで調整）'});
  const ang = tickerSpeedToAngle(tickerSpeed);
  knob.style.setProperty('--knob-ang', ang + 'deg');
  const sp = tickerSpeed;
  const label = sp < 0.35 ? '微' : sp < 0.75 ? '遅' : sp < 1.3 ? '中' : sp < 2.2 ? '速' : '最';
  knob.appendChild(el('div',{class:'ticker-knob-inner'}, label));
  kw.appendChild(knob);
  wrap.appendChild(kw);
  // バインドはDOM追加後
  setTimeout(()=>bindTickerKnob(knob), 0);
  return wrap;
}
function ensureEventTicker(){
  const s = state;
  if(!gameStarted || !s){
    const old = document.getElementById('event-ticker');
    if(old && old.parentNode) old.parentNode.removeChild(old);
    try{ document.body.classList.remove('has-ticker'); }catch(e){}
    return;
  }
  try{ document.body.classList.add('has-ticker'); }catch(e){}
  const sig = tickerSignature(s);
  let bar = document.getElementById('event-ticker');
  if(bar && bar.dataset.sig === sig){
    // 内容同じ → 速度だけ同期
    applyTickerSpeedToDom();
    return;
  }
  if(bar && bar.parentNode) bar.parentNode.removeChild(bar);
  bar = el('div',{class:'event-ticker', id:'event-ticker'});
  bar.dataset.sig = sig;
  bar.appendChild(buildTickerSpeedControls());
  const track = el('div',{class:'ticker-track'});
  const items = (s.log && s.log.length) ? s.log.slice(0, 24) : [];
  if(items.length === 0){
    track.appendChild(el('div',{class:'ticker-empty'}, 'イベントログはまだありません'));
  } else {
    const move = el('div',{class:'ticker-move'});
    move.dataset.itemCount = String(items.length);
    const seq = items.concat(items);
    seq.forEach(l=>{
      const tag = l.tag==='warn'?'warn':(l.tag==='good'?'good':'');
      move.appendChild(el('span',{class:'ticker-item '+tag},
        el('span',{class:'tq'}, l.q||''),
        document.createTextNode(l.text||'')
      ));
    });
    track.appendChild(move);
  }
  bar.appendChild(track);
  document.body.appendChild(bar);
  applyTickerSpeedToDom();
}

function classifyModalAnim(m){
  if(!m) return {box:'', overlay:''};
  const t = m.type || '';
  const title = (m.title||'') + (m.body||'');
  if(t==='victory') return {box:' victory', overlay:' victory-bg'};
  if(t==='over') return {box:' over', overlay:' danger-bg'};
  if(t==='retire') return {box:' retire', overlay:' victory-bg'};
  if(t==='annual') return {box:' event-critical', overlay:' critical-bg'};
  if(t==='save' || t==='export_ios') return {box:'', overlay:''};
  // 選択肢・イベント系: タイトル文言から重要度推定
  const dangerKeys = ['倒産','破産','破綻','緊急融資','不正','不祥事','告発','逮捕','解約ラッシュ','倒産危機','資金ショート','債務超過'];
  const goodKeys = ['上場','IPO','大型受注','買収成功','勝利','黒字','快挙','記録'];
  const criticalKeys = ['株主総会','TOB','買収提案','M&A','敵対的','公開買付','合併','役員','辞任'];
  if(/大地震/.test(title)) return {box:' event-warn', overlay:' danger-bg'};
  if(/大雨|浸水/.test(title)) return {box:' event-critical', overlay:' critical-bg'};
  if(dangerKeys.some(k=>title.includes(k))) return {box:' event-warn', overlay:' danger-bg'};
  if(goodKeys.some(k=>title.includes(k))) return {box:' event-good', overlay:' critical-bg'};
  if(criticalKeys.some(k=>title.includes(k)) || t==='choice' || t==='event') return {box:' event-critical', overlay:' critical-bg'};
  return {box:'', overlay:''};
}

async function doSave(slot){
  if(!state){ alert('保存するゲームがありません。'); return; }
  slot = (slot == null) ? 1 : Math.max(0, Math.min(SAVE_SLOT_COUNT, Math.round(slot)));
  try{
    const ok = await writeSaveToSlot(slot, state, mandaOffers);
    // 互換: スロット1は旧キーにも書く
    if(slot === 1){
      await StorageAPI.set(SAVE_LEGACY_KEY, JSON.stringify({state, mandaOffers, version:2, meta:buildSaveMeta(state)}), false);
    }
    const label = slot === 0 ? 'オートセーブ' : `スロット${slot}`;
    if(!ok || !StorageAPI.canPersist()){
      if(gameStarted && state){
        pushLog(state, 'ブラウザへの保存に失敗しました。ヘッダーの「書出」でJSONを保存してください。', 'warn');
        render();
      }
      alert('この環境ではブラウザ保存が使えません。\n「書出」でJSONファイルを保存してください。ブラウザを閉じると消えます。');
    } else if(gameStarted && state){
      pushLog(state, `${label}に保存しました。`, 'good');
      render();
    }
  }catch(e){
    if(gameStarted && state) pushLog(state, '保存中にエラーが発生しました。', 'warn');
    else alert('保存中にエラーが発生しました。');
    render();
  }
}
async function autoSave(){
  if(!state || !gameStarted) return;
  try{
    const ok = await writeSaveToSlot(0, state, mandaOffers);
    // 互換キーにも書く
    try{
      await StorageAPI.set(SAVE_LEGACY_KEY, JSON.stringify({version:2, state, mandaOffers, meta:buildSaveMeta(state)}), false);
    }catch(e){}
    if(!ok && !window.__mercuryPersistWarned){
      window.__mercuryPersistWarned = true;
      pushLog(state, 'ブラウザ保存が無効です。進行を残すには「書出」でJSONを保存してください。', 'warn');
    }
  }catch(e){ /* 静かに失敗を許容 */ }
}
async function doLoad(slot){
  slot = (slot == null) ? 1 : Math.max(0, Math.min(SAVE_SLOT_COUNT, Math.round(slot)));
  stopTimer();
  try{
    const parsed = await readSaveFromSlot(slot);
    if(parsed && parsed.state){
      state = parsed.state;
      mandaOffers = parsed.mandaOffers || [];
      // 難易度補正フィールドの互換
      if(state.diffFixedMult == null) state.diffFixedMult = 1;
      if(state.diffLaborMult == null) state.diffLaborMult = 1;
      if(state.diffChurnMult == null) state.diffChurnMult = 1;
      if(state.diffMaintMult == null) state.diffMaintMult = 1;
      if(state.inspectors == null) state.inspectors = Math.min(1, state.techs||0);
      if(!state.inspectorPipeline) state.inspectorPipeline = [];
      modal = null;
      gameStarted = true;
      activeTab = 'overview';
      pushLog(state, `スロット${slot===0?'（オート）':slot}から読み込みました。`, 'good');
      render();
      if(!state.gameOver) startTimer();
      else stopTimer();
    } else {
      if(gameStarted && state){
        pushLog(state, '保存データが見つかりませんでした。', 'warn');
        render();
        if(!state.gameOver) startTimer();
      } else {
        alert('このスロットに保存データはありません。');
        render();
      }
    }
  }catch(e){
    if(gameStarted && state){
      pushLog(state, '読込中にエラーが発生しました。', 'warn');
      render();
      if(!state.gameOver) startTimer();
    } else {
      alert('読込中にエラーが発生しました。');
      render();
    }
  }
}

function isIOSDevice(){
  const ua = navigator.userAgent || '';
  return /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}

function buildExportPayload(){
  return {
    version: 2,
    exportedAt: new Date().toISOString(),
    state, mandaOffers,
    meta: buildSaveMeta(state),
  };
}

function buildExportFileName(){
  const name = (state.companyName||'mercury').replace(/[\\/:*?"<>|]/g,'_');
  return `${name}_${state.year}Q${state.quarter}_save.json`;
}

/** セーブデータをJSONファイルとして保存（iPhoneは共有シート対応） */
async function doExportSave(){
  if(!state){ alert('書き出すゲームがありません。'); return; }
  const fileName = buildExportFileName();
  const jsonText = JSON.stringify(buildExportPayload());
  const blob = new Blob([jsonText], {type:'application/json'});

  // 1) Web Share API（iPhone/iPad で「ファイルに保存」「AirDrop」などが使える）
  try{
    if(navigator.share && navigator.canShare){
      const file = new File([blob], fileName, {type:'application/json'});
      if(navigator.canShare({ files: [file] })){
        await navigator.share({
          files: [file],
          title: 'エレベーター経営セーブ',
          text: `${state.companyName||''} ${state.year}年Q${state.quarter}`,
        });
        if(gameStarted) pushLog(state, '共有シートを開きました。「ファイルに保存」でiPhoneに残してください。', 'good');
        render();
        return;
      }
    }
  }catch(e){
    // ユーザーが共有をキャンセルした場合は何もしない
    if(e && (e.name === 'AbortError' || e.name === 'NotAllowedError')) return;
  }

  // 2) 通常のダウンロード（PC・Android）
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{ try{ document.body.removeChild(a); URL.revokeObjectURL(url); }catch(e){} }, 800);
    if(gameStarted) pushLog(state, 'セーブデータをダウンロードしました。', 'good');
  }catch(e){}

  // 3) iOSフォールバック: モーダルでコピー／別タブ表示
  if(isIOSDevice()){
    openExportFallbackModal(jsonText, fileName);
    return;
  }
  render();
}

function openExportFallbackModal(jsonText, fileName){
  stopTimer();
  modal = {
    type: 'export_ios',
    title: 'iPhoneへの保存',
    fileName,
    jsonText,
  };
  render();
}

async function shareExportFromModal(){
  if(!modal || modal.type !== 'export_ios') return;
  const fileName = modal.fileName || 'mercury_save.json';
  const jsonText = modal.jsonText || '';
  const blob = new Blob([jsonText], {type:'application/json'});
  try{
    if(navigator.share){
      const file = new File([blob], fileName, {type:'application/json'});
      const data = navigator.canShare && navigator.canShare({files:[file]})
        ? { files:[file], title:'エレベーター経営セーブ' }
        : { text: jsonText, title:'エレベーター経営セーブ' };
      await navigator.share(data);
      return;
    }
  }catch(e){
    if(e && e.name === 'AbortError') return;
  }
  // テキスト共有もだめならコピー
  try{
    await navigator.clipboard.writeText(jsonText);
    alert('セーブ内容をクリップボードにコピーしました。\nメモアプリやファイルアプリに貼り付けて保存してください。');
  }catch(e){
    alert('共有に失敗しました。下のテキストを長押ししてコピーしてください。');
  }
}

async function copyExportText(){
  if(!modal || !modal.jsonText) return;
  try{
    await navigator.clipboard.writeText(modal.jsonText);
    alert('コピーしました。メモやファイルに貼り付けて保存してください。');
  }catch(e){
    // 古いWebView向け: 選択させる
    const ta = document.getElementById('export-json-ta');
    if(ta){ ta.focus(); ta.select(); alert('テキストを選択したので、コピーしてください。'); }
  }
}

/** JSONファイルから読込 */
function doImportSave(){
  stopTimer();
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json,.json';
  input.onchange = async function(){
    const file = input.files && input.files[0];
    if(!file){ if(gameStarted && state && !state.gameOver) startTimer(); return; }
    try{
      const text = await file.text();
      const parsed = JSON.parse(text);
      if(!parsed || !parsed.state){
        alert('このファイルは有効なセーブデータではありません。');
        if(gameStarted && state && !state.gameOver) startTimer();
        return;
      }
      state = parsed.state;
      mandaOffers = parsed.mandaOffers || [];
      if(state.diffFixedMult == null) state.diffFixedMult = 1;
      if(state.diffLaborMult == null) state.diffLaborMult = 1;
      if(state.diffChurnMult == null) state.diffChurnMult = 1;
      if(state.diffMaintMult == null) state.diffMaintMult = 1;
      if(state.inspectors == null) state.inspectors = Math.min(1, state.techs||0);
      if(!state.inspectorPipeline) state.inspectorPipeline = [];
      modal = null;
      gameStarted = true;
      activeTab = 'overview';
      pushLog(state, `ファイル「${file.name}」から読み込みました。`, 'good');
      // ブラウザ側にも複数箇所へ保存を試みる
      const ok1 = await writeSaveToSlot(1, state, mandaOffers);
      const ok0 = await writeSaveToSlot(0, state, mandaOffers);
      try{
        await StorageAPI.set(SAVE_LEGACY_KEY, JSON.stringify({version:2, state, mandaOffers, meta:buildSaveMeta(state)}), false);
      }catch(e){}
      const persisted = StorageAPI.canPersist() && (ok1 || ok0);
      if(!persisted){
        alert('読み込みは成功しましたが、この環境ではブラウザへの保存ができません。\n\nブラウザを閉じると消えます。\n必ずヘッダーの「書出」でJSONファイルを保存してください。');
        pushLog(state, '警告: ブラウザ保存不可。必ず「書出」でファイルバックアップを取ってください。', 'warn');
      } else {
        pushLog(state, 'ブラウザにも保存しました（スロット1／オート）。', 'good');
      }
      render();
      if(!state.gameOver) startTimer();
    }catch(e){
      alert('ファイルの読み込みに失敗しました。');
      if(gameStarted && state && !state.gameOver) startTimer();
    }
  };
  input.click();
}

async function openSaveModal(){
  stopTimer();
  const meta = await readSaveMetaAll();
  // スロット実在チェック
  const slots = [];
  for(let i=0;i<=SAVE_SLOT_COUNT;i++){
    const data = await readSaveFromSlot(i);
    slots.push({
      slot: i,
      label: i===0 ? 'オートセーブ' : `スロット ${i}`,
      meta: (data && data.meta) || meta[String(i)] || (data && data.state ? buildSaveMeta(data.state) : null),
      has: !!(data && data.state),
    });
  }
  modal = {
    type:'save',
    title:'セーブ / ロード',
    slots,
  };
  render();
}
function doReset(){
  stopTimer();
  gameStarted = false;
  mandaOffers = [];
  modal = null;
  speed = 1;
  render();
}
function doStartGame(name, difficultyKey){
  try{
    stopTimer();

    mandaOffers = [];
    modal = null;
    speed = 1;
    shareScope = 'national';

  }
}

/* ============================================================
   起動
   ============================================================ */
function boot(){
  try{
    const ts = parseFloat(localStorage.getItem('mercury-ticker-speed'));
    if(isFinite(ts) && ts >= 0.12 && ts <= 3) tickerSpeed = ts;
  }catch(e){}
  gameStarted = false;
  render();
  // 保存データがあれば自動読込を試みる
  (async ()=>{
    try{
      // オート → スロット1 → 旧キーの順で自動復帰を試行（タイトルは出すがデータ有無を内部確認）
      let parsed = await readSaveFromSlot(0);
      if(!parsed) parsed = await readSaveFromSlot(1);
      // メタだけ先に読んでタイトルに「再開可」を出す用途にも使えるが、ここでは自動開始しない
      // 自動でゲームに入らずタイトルを優先（誤ロード防止）。ユーザーが「再開」を押す。
    }catch(e){ /* セーブデータなし */ }
    render();
  })();
}

boot();

})();
</script>
</body>
</html>
