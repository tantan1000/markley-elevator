<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MARKLEY ELEVATORの野望</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --steel-900:#12161b;
    --steel-800:#1b212a;
    --steel-700:#262e39;
    --steel-600:#3a4451;
    --steel-500:#525f6f;
    --paper:#e8e2d0;
    --paper-dim:#c9c2ab;
    --amber:#ffb020;
    --amber-dim:#7a5518;
    --red:#e0524f;
    --red-dim:#5a2523;
    --green:#4fae7d;
    --green-dim:#245038;
    --ink:#181c22;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--steel-900);
    color:var(--paper);
    font-family:'Noto Sans JP',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--amber);color:var(--ink);}
  .mono{font-family:'JetBrains Mono',monospace;}
  .dot{font-family:'DotGothic16',monospace;}

  a,button{font-family:inherit;}
  button{cursor:pointer;}
  input[type=number]{font-family:'JetBrains Mono',monospace;}

  /* ===== layout shell ===== */
  #app{max-width:1180px;margin:0 auto;padding:14px 16px 60px;}

  /* ===== header (mobile-first, clear hierarchy) ===== */
  .shaft-header{
    display:flex;
    flex-direction:column;
    gap:10px;
    background:linear-gradient(180deg,var(--steel-800),var(--steel-900));
    border:1px solid var(--steel-600);
    border-radius:8px;
    padding:12px 14px;
    margin-bottom:12px;
    position:relative;
  }
  .header-top{
    display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
  }
  .company-name{
    font-family:'DotGothic16',monospace;
    font-size:18px;
    letter-spacing:0.5px;
    color:var(--amber);
    text-shadow:0 0 8px rgba(255,176,32,.35);
    line-height:1.25;
    word-break:break-all;
  }
  .company-sub{font-size:11px;color:var(--paper-dim);margin-top:4px;line-height:1.4;}
  .status-pill{
    flex:none;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    padding:6px 10px;
    border-radius:999px;
    border:1px solid var(--steel-600);
    background:var(--steel-900);
    color:var(--paper-dim);
    white-space:nowrap;
  }
  .status-pill.run{color:var(--green);border-color:var(--green-dim);}
  .status-pill.pause{color:var(--amber);border-color:var(--amber-dim);}
  .status-pill.over{color:var(--red);border-color:var(--red-dim);}

  .header-meta{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .meta-card{
    background:var(--steel-900);
    border:1px solid var(--steel-700);
    border-radius:6px;
    padding:8px 10px;
  }
  .meta-card .k{font-size:10px;color:var(--paper-dim);margin-bottom:2px;}
  .meta-card .v{
    font-family:'JetBrains Mono',monospace;
    font-size:15px;font-weight:700;color:var(--paper);
  }
  .meta-card .v.amber{color:var(--amber);}

  .header-controls{
    display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  }
  .header-controls .btn-play{
    flex:1 1 auto;
    min-width:120px;
    padding:12px 14px;
    font-size:14px;font-weight:700;
  }
  .header-controls .speed-group{
    display:flex;gap:4px;
  }
  .header-controls .util-group{
    display:flex;gap:4px;flex-wrap:wrap;
    width:100%;
  }
  @media (min-width:720px){
    .company-name{font-size:22px;}
    .header-meta{grid-template-columns:repeat(4,1fr);}
    .header-controls .util-group{width:auto;margin-left:auto;}
  }

  /* legacy names kept so old class refs don't break */
  .shaft-left{min-width:0;}
  .indicator-panel,.quarter-badge,.floor-digits,.floor-label,.shaft-track,.shaft-car{display:none;}
  .toplinks{display:contents;}

  /* ===== kpi strip ===== */
  .kpi-strip{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
    margin-bottom:14px;
  }
  @media (min-width:600px){
    .kpi-strip{grid-template-columns:repeat(4,1fr);}
  }
  @media (min-width:1000px){
    .kpi-strip{grid-template-columns:repeat(4,1fr);}
  }

  .alert-panel{
    background:var(--steel-800);
    border:1px solid var(--steel-700);
    border-radius:6px;
    padding:12px 14px;
    margin-bottom:14px;
  }
  .alert-panel h2{font-size:13px;letter-spacing:1px;color:var(--amber);margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid var(--steel-700);}
  .alert-item{
    display:flex;gap:10px;align-items:flex-start;
    font-size:12px;padding:8px 10px;margin-bottom:6px;
    background:var(--steel-900);border-radius:4px;border-left:3px solid var(--steel-600);
  }
  .alert-item.crit{border-left-color:var(--red);}
  .alert-item.warn{border-left-color:var(--amber);}
  .alert-item.ok{border-left-color:var(--green);}
  .alert-item .sev{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--paper-dim);min-width:42px;}
  .plan-bar{height:6px;background:var(--steel-900);border-radius:3px;overflow:hidden;margin-top:4px;}
  .plan-bar > div{height:100%;background:var(--amber);border-radius:3px;transition:width .4s;}

  .kpi{
    background:var(--steel-800);
    border:1px solid var(--steel-700);
    border-radius:6px;
    padding:10px 12px;
  }
  .kpi-label{font-size:10px;color:var(--paper-dim);letter-spacing:.5px;margin-bottom:4px;}
  .kpi-value{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;color:var(--paper);}
  .kpi-value.up{color:var(--green);}
  .kpi-value.down{color:var(--red);}
  .kpi-sub{font-size:10px;color:var(--paper-dim);margin-top:2px;}

  /* kpi responsive handled above */

  /* ===== main grid ===== */
  .main-grid{
    display:grid;
    grid-template-columns:1.15fr .85fr;
    gap:14px;
    align-items:start;
  }
  @media (max-width:860px){
    .main-grid{grid-template-columns:1fr;}
  }

  .panel{
    background:var(--steel-800);
    border:1px solid var(--steel-700);
    border-radius:6px;
    padding:16px;
    margin-bottom:14px;
  }
  .panel h2{
    font-size:13px;letter-spacing:1px;color:var(--amber);
    margin:0 0 12px;padding-bottom:8px;
    border-bottom:1px solid var(--steel-700);
    display:flex;align-items:center;justify-content:space-between;
  }
  .panel h2 .eyebrow{font-size:10px;color:var(--paper-dim);letter-spacing:.5px;}

  .field-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .field-row label{flex:0 0 132px;font-size:12px;color:var(--paper-dim);}
  .field-row input[type=number]{
    flex:1;background:var(--steel-900);border:1px solid var(--steel-600);
    color:var(--paper);border-radius:4px;padding:7px 9px;font-size:13px;width:100%;
  }
  .field-row .unit{font-size:11px;color:var(--paper-dim);width:34px;}
  .field-hint{font-size:10px;color:var(--steel-500);margin:-6px 0 10px 142px;}

  .btn{
    background:var(--steel-700);border:1px solid var(--steel-600);
    color:var(--paper);border-radius:4px;padding:9px 14px;
    font-size:13px;font-weight:500;transition:.15s;
  }
  .btn:hover{background:var(--steel-600);}
  .btn:disabled{opacity:.35;cursor:not-allowed;}
  .btn-primary{background:var(--amber);color:var(--ink);border-color:var(--amber);font-weight:700;}
  .btn-primary:hover{background:#ffc04d;}
  .btn-primary:disabled{background:var(--amber-dim);color:var(--paper-dim);border-color:var(--amber-dim);}
  .btn-danger{background:var(--red-dim);border-color:var(--red);}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
  .btn-small{padding:6px 10px;font-size:11px;}
  .btn-full{width:100%;padding:12px;font-size:14px;margin-top:6px;}

  .action-block{
    border:1px dashed var(--steel-600);border-radius:5px;
    padding:10px 12px;margin-top:10px;
   }
  .action-block .title{font-size:11px;color:var(--amber);letter-spacing:.5px;margin-bottom:6px;}
  .action-block .desc{font-size:11px;color:var(--paper-dim);margin-bottom:8px;line-height:1.5;}

  /* market share bars */
  .share-row{margin-bottom:10px;}
  .share-row .top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;}
  .share-row .top .name{color:var(--paper);}
  .share-row .top .name.me{color:var(--amber);font-weight:700;}
  .share-row .top .pct{font-family:'JetBrains Mono',monospace;color:var(--paper-dim);}
  .bar-track{height:8px;background:var(--steel-900);border-radius:4px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:4px;transition:width .5s ease;}

  /* financial statement */
  table.kessan{width:100%;border-collapse:collapse;font-size:12px;}
  table.kessan th,table.kessan td{
    padding:6px 8px;text-align:right;border-bottom:1px solid var(--steel-700);
    font-family:'JetBrains Mono',monospace;
  }
  table.kessan th:first-child,table.kessan td:first-child{text-align:left;font-family:'Noto Sans JP',sans-serif;color:var(--paper-dim);}
  table.kessan th{color:var(--paper-dim);font-weight:500;font-size:11px;}
  table.kessan td.pos{color:var(--green);}
  table.kessan td.neg{color:var(--red);}
  .paper-strip{
    background:var(--paper);color:var(--ink);border-radius:5px;padding:12px 14px;margin-top:10px;
  }
  .paper-strip .stitle{font-size:11px;letter-spacing:.5px;color:var(--steel-700);margin-bottom:8px;font-weight:700;}
  .paper-strip table.kessan td,.paper-strip table.kessan th{border-bottom:1px solid var(--paper-dim);}
  .paper-strip table.kessan td:first-child{color:#555;}
  .paper-strip table.kessan td.pos{color:#1c7a4d;}
  .paper-strip table.kessan td.neg{color:#b3312e;}

  /* event log */
  .log{max-height:230px;overflow-y:auto;padding-right:4px;}
  .log-entry{
    font-size:12px;padding:8px 10px;border-radius:4px;margin-bottom:6px;
    background:var(--steel-900);border-left:3px solid var(--steel-600);
  }
  .log-entry.warn{border-left-color:var(--red);}
  .log-entry.good{border-left-color:var(--green);}
  .log-entry .qtag{color:var(--paper-dim);font-family:'JetBrains Mono',monospace;font-size:10px;margin-right:6px;}

  /* 常時表示イベントティッカー */
  .event-ticker{
    position:fixed; left:0; right:0; bottom:0; z-index:40;
    height:36px;
    background:linear-gradient(180deg, rgba(18,22,28,.92), rgba(12,14,18,.97));
    border-top:1px solid var(--steel-600);
    box-shadow: 0 -4px 20px rgba(0,0,0,.35);
    display:flex; align-items:center;
    overflow:hidden;
    pointer-events:none;
  }
  .event-ticker .ticker-label{
    flex:0 0 auto;
    padding:0 10px;
    font-size:10px; font-weight:700; letter-spacing:0.08em;
    color:var(--amber);
    border-right:1px solid var(--steel-600);
    height:100%; display:flex; align-items:center;
    background:rgba(255,176,32,.08);
    pointer-events:none;
  }
  .event-ticker .ticker-speed{
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    padding:0 8px;
    border-right:1px solid var(--steel-600);
    height:100%;
    pointer-events:auto;
    gap:4px;
  }
  .event-ticker .ticker-knob-wrap{
    position:relative;
    width:28px; height:28px;
    flex-shrink:0;
  }
  .event-ticker .ticker-knob{
    width:28px; height:28px; border-radius:50%;
    background: conic-gradient(var(--amber) var(--knob-ang, 90deg), var(--steel-600) 0);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow: inset 0 0 0 2px var(--steel-800), 0 1px 3px rgba(0,0,0,.4);
    touch-action:none;
    user-select:none; -webkit-user-select:none;
  }
  .event-ticker .ticker-knob-inner{
    width:18px; height:18px; border-radius:50%;
    background:var(--steel-800);
    display:flex; align-items:center; justify-content:center;
    font-size:8px; font-weight:700; color:var(--amber);
    line-height:1;
    pointer-events:none;
  }
  .event-ticker .ticker-knob-hint{
    font-size:8px; color:var(--paper-dim); letter-spacing:0;
    line-height:1; white-space:nowrap;
  }
  .event-ticker .ticker-track{
    flex:1; overflow:hidden; height:100%;
    mask-image: linear-gradient(90deg, transparent, #000 3%, #000 97%, transparent);
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 3%, #000 97%, transparent);
  }
  .event-ticker .ticker-move{
    display:inline-flex; align-items:center; gap:28px;
    height:100%; white-space:nowrap;
    padding-left:100%;
    animation: tickerScroll 90s linear infinite;
  }
  .event-ticker .ticker-move:hover{
    animation-play-state: paused;
  }
  .event-ticker .ticker-item{
    display:inline-flex; align-items:center; gap:8px;
    font-size:12px; color:var(--paper);
    pointer-events:auto;
  }
  .event-ticker .ticker-item .tq{
    color:var(--paper-dim); font-size:10px;
    padding:1px 5px; border-radius:3px;
    background:rgba(255,255,255,.06);
  }
  .event-ticker .ticker-item.warn{ color:#f0a8a8; }
  .event-ticker .ticker-item.good{ color:#a8e0b8; }
  .event-ticker .ticker-item.warn .tq{ background:rgba(200,60,60,.25); color:#f0c0c0; }
  .event-ticker .ticker-item.good .tq{ background:rgba(60,140,80,.25); color:#c0f0d0; }
  .event-ticker .ticker-empty{
    font-size:12px; color:var(--paper-dim); padding-left:12px;
  }
  @keyframes tickerScroll{
    0%{ transform: translateX(0); }
    100%{ transform: translateX(-100%); }
  }
  /* ティッカー分の余白 */
  body.has-ticker #app{
    padding-bottom: 44px;
  }
  @media (prefers-reduced-motion: reduce){
    .event-ticker .ticker-move{
      animation: none;
      padding-left: 12px;
      flex-wrap: nowrap;
      overflow-x: auto;
    }
  }


  /* modal */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(10,12,15,.82);
    display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;
    animation: modalOverlayIn .28s ease-out both;
  }
  .modal{
    background:var(--steel-800);border:1px solid var(--steel-600);border-radius:8px;
    max-width:480px;width:100%;padding:22px;
    animation: modalPop .42s cubic-bezier(.22,1.4,.36,1) both;
    transform-origin: center center;
    box-shadow: 0 12px 40px rgba(0,0,0,.45);
  }
  .modal h3{margin:0 0 10px;color:var(--amber);font-size:16px;}
  .modal p{font-size:13px;line-height:1.7;color:var(--paper);margin:0 0 14px;white-space:pre-line;}
  .modal.victory{
    border-color:var(--amber);
    box-shadow: 0 0 0 1px rgba(232,185,74,.35), 0 16px 48px rgba(232,185,74,.25), 0 0 60px rgba(232,185,74,.12);
    animation: modalPopVictory .7s cubic-bezier(.22,1.5,.36,1) both;
  }
  .modal.victory h3{font-size:20px; animation: titleGlow 1.6s ease-in-out infinite alternate;}
  .modal.over{
    border-color:var(--red);
    box-shadow: 0 0 0 1px rgba(220,80,80,.4), 0 16px 48px rgba(180,40,40,.3);
    animation: modalShakeIn .55s cubic-bezier(.36,.07,.19,.97) both;
  }
  .modal.retire{
    border-color:#6bcb8a;
    box-shadow: 0 0 0 1px rgba(107,203,138,.35), 0 16px 48px rgba(60,140,90,.25);
    animation: modalPopVictory .65s cubic-bezier(.22,1.5,.36,1) both;
  }
  .modal.event-critical{
    border-color:var(--amber);
    animation: modalPopBig .5s cubic-bezier(.22,1.45,.36,1) both;
  }
  .modal.event-warn{
    border-color:#e8a05c;
    animation: modalPopWarn .48s cubic-bezier(.22,1.3,.36,1) both;
  }
  .modal.event-good{
    border-color:#6bcb8a;
    animation: modalPop .45s cubic-bezier(.22,1.4,.36,1) both;
  }

  @keyframes modalOverlayIn{
    from{ opacity:0; }
    to{ opacity:1; }
  }
  @keyframes modalPop{
    0%{ opacity:0; transform: scale(.86) translateY(18px); }
    70%{ opacity:1; transform: scale(1.03) translateY(-2px); }
    100%{ opacity:1; transform: scale(1) translateY(0); }
  }
  @keyframes modalPopBig{
    0%{ opacity:0; transform: scale(.7) translateY(28px); filter:blur(2px); }
    60%{ opacity:1; transform: scale(1.06) translateY(-4px); filter:blur(0); }
    100%{ opacity:1; transform: scale(1) translateY(0); }
  }
  @keyframes modalPopVictory{
    0%{ opacity:0; transform: scale(.55) rotate(-2deg); filter:brightness(1.4); }
    55%{ opacity:1; transform: scale(1.08) rotate(1deg); }
    75%{ transform: scale(.98) rotate(-.5deg); }
    100%{ opacity:1; transform: scale(1) rotate(0); filter:brightness(1); }
  }
  @keyframes modalShakeIn{
    0%{ opacity:0; transform: scale(.9) translateX(0); }
    20%{ opacity:1; transform: scale(1.04) translateX(-10px); }
    40%{ transform: scale(1.02) translateX(10px); }
    55%{ transform: scale(1.01) translateX(-6px); }
    70%{ transform: translateX(4px); }
    100%{ transform: scale(1) translateX(0); }
  }
  @keyframes modalPopWarn{
    0%{ opacity:0; transform: scale(.8) translateY(-12px); }
    50%{ transform: scale(1.05) translateY(2px); }
    100%{ opacity:1; transform: scale(1) translateY(0); }
  }
  @keyframes titleGlow{
    from{ text-shadow: 0 0 4px rgba(232,185,74,.3); }
    to{ text-shadow: 0 0 14px rgba(232,185,74,.85), 0 0 28px rgba(232,185,74,.35); }
  }
  /* 重要イベント時の背景パルス */
  .modal-overlay.critical-bg{
    animation: modalOverlayIn .28s ease-out both, criticalPulse 2.4s ease-in-out infinite;
  }
  @keyframes criticalPulse{
    0%,100%{ background:rgba(10,12,15,.82); }
    50%{ background:rgba(30,18,8,.88); }
  }
  .modal-overlay.danger-bg{
    animation: modalOverlayIn .28s ease-out both, dangerPulse 1.8s ease-in-out infinite;
  }
  @keyframes dangerPulse{
    0%,100%{ background:rgba(10,12,15,.82); }
    50%{ background:rgba(40,10,12,.9); }
  }
  .modal-overlay.victory-bg{
    animation: modalOverlayIn .28s ease-out both, victoryPulse 2.2s ease-in-out infinite;
  }
  @keyframes victoryPulse{
    0%,100%{ background:rgba(10,12,15,.82); }
    50%{ background:rgba(28,24,8,.9); }
  }

  /* ボタンも少し遅れて出現 */
  .modal .btn{
    animation: btnFadeUp .35s ease-out both;
    animation-delay: .18s;
  }
  .modal .btn:nth-of-type(2){ animation-delay: .26s; }
  .modal .btn:nth-of-type(3){ animation-delay: .32s; }
  .modal .btn:nth-of-type(4){ animation-delay: .38s; }
  @keyframes btnFadeUp{
    from{ opacity:0; transform: translateY(8px); }
    to{ opacity:1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    .modal-overlay, .modal, .modal.victory, .modal.over, .modal.retire,
    .modal.event-critical, .modal.event-warn, .modal.event-good,
    .modal h3, .modal .btn{
      animation: none !important;
    }
    .person-stage, .person, .person *{
      animation: none !important;
    }
  }

  /* ========== 人物アニメ ========== */
  .person-stage{
    display:flex; align-items:flex-end; justify-content:center;
    gap:10px; height:72px; margin:8px 0 4px; pointer-events:none;
    overflow:hidden;
  }
  .person-stage.sm{ height:48px; gap:6px; }
  .person-stage.lg{ height:96px; gap:14px; }
  .person-stage.header-stage{
    height:40px; margin:0 8px 0 0; flex-shrink:0;
  }
  .person{
    position:relative; width:28px; height:56px;
    transform-origin: 50% 100%;
  }
  .person-stage.sm .person{ width:20px; height:40px; }
  .person-stage.lg .person{ width:36px; height:72px; }
  .person-stage.header-stage .person{ width:18px; height:36px; }

  .person .p-head{
    position:absolute; left:50%; top:0; width:12px; height:12px;
    margin-left:-6px; border-radius:50%;
    background:#e8d5b0; border:1px solid rgba(0,0,0,.15);
  }
  .person-stage.sm .person .p-head{ width:9px; height:9px; margin-left:-4.5px; }
  .person-stage.header-stage .person .p-head{ width:8px; height:8px; margin-left:-4px; }
  .person .p-body{
    position:absolute; left:50%; top:12px; width:14px; height:18px;

<script>
(function(){

/* ============================================================
   ストレージ（window.storage が無い環境では localStorage にフォールバック）
   ============================================================ */
const StorageAPI = {
  // チャット埋め込みの window.storage はセッション限定のことがあるため、
  // 永続化の本命は常に localStorage。両方に書いて読める方を使う。
  async get(key, _flag){
    // 1) localStorage 優先
    try{
      const raw = localStorage.getItem(key);
      if(raw != null) return { value: raw };
    }catch(e){}
    // 2) ホスト storage フォールバック
    try{
      if(window.storage && typeof window.storage.get === 'function'){
        const res = await window.storage.get(key, _flag);
        if(res && res.value != null) return res;
      }
    }catch(e){}
    return null;
  },
  async set(key, value, _flag){
    let ok = false;
    try{
      localStorage.setItem(key, value);
      // 書き込み検証
      if(localStorage.getItem(key) === value) ok = true;
    }catch(e){ ok = false; }
    try{
      if(window.storage && typeof window.storage.set === 'function'){
        await window.storage.set(key, value, _flag);
      }
    }catch(e){}
    return ok;
  },
  async remove(key){
    try{ localStorage.removeItem(key); }catch(e){}
    try{
      if(window.storage && typeof window.storage.remove === 'function'){
        await window.storage.remove(key);
      }
    }catch(e){}
    return true;
  },
  /** localStorage が使えるか簡易チェック */
  canPersist(){
    try{
      const k = '__mercury_probe__';
      localStorage.setItem(k, '1');
      const ok = localStorage.getItem(k) === '1';
      localStorage.removeItem(k);
      return ok;
    }catch(e){ return false; }
  }
};

/* セーブスロット（0=オートセーブ, 1〜3=手動） */
const SAVE_SLOT_COUNT = 3;
const SAVE_KEY_PREFIX = 'mercury-save-slot-';
const SAVE_META_KEY = 'mercury-save-meta';
const SAVE_LEGACY_KEY = 'mercury-save'; // 旧単一セーブ互換

function saveSlotKey(slot){ return SAVE_KEY_PREFIX + String(slot); }

function buildSaveMeta(s){
  if(!s) return null;
  return {
    companyName: s.companyName || '',
    difficulty: s.difficulty || 'normal',
    year: s.year, quarter: s.quarter, turn: s.turn,
    units: s.units, cash: s.cash, techs: s.techs,
    isListed: !!s.isListed, gameOver: !!s.gameOver,
    savedAt: Date.now(),
  };
}

async function readSaveMetaAll(){
  try{
    const res = await StorageAPI.get(SAVE_META_KEY, false);
    if(res && res.value){
      const m = JSON.parse(res.value);
      if(m && typeof m === 'object') return m;
    }
  }catch(e){}
  return {};
}

async function writeSaveMetaAll(meta){
  try{
    await StorageAPI.set(SAVE_META_KEY, JSON.stringify(meta), false);
  }catch(e){}
}

async function writeSaveToSlot(slot, st, offers){
  const payload = JSON.stringify({
    version: 2,
    state: st,
    mandaOffers: offers || [],
    meta: buildSaveMeta(st),
  });
  const ok = await StorageAPI.set(saveSlotKey(slot), payload, false);
  if(ok){
    const all = await readSaveMetaAll();
    all[String(slot)] = buildSaveMeta(st);
    await writeSaveMetaAll(all);
  }
  return ok;
}

async function readSaveFromSlot(slot){
  try{
    let res = await StorageAPI.get(saveSlotKey(slot), false);
    // スロット1が空なら旧キーを互換読込
    if((!res || !res.value) && slot === 1){
      res = await StorageAPI.get(SAVE_LEGACY_KEY, false);
    }
    if(!res || !res.value) return null;
    const parsed = JSON.parse(res.value);
    if(!parsed || !parsed.state) return null;
    return parsed;
  }catch(e){ return null; }
}

async function deleteSaveSlot(slot){
  await StorageAPI.remove(saveSlotKey(slot));
  const all = await readSaveMetaAll();
  delete all[String(slot)];
  await writeSaveMetaAll(all);
  // 旧キーもスロット1削除時に消す
  if(slot === 1) await StorageAPI.remove(SAVE_LEGACY_KEY);
}

function formatSaveMetaLine(meta){
  if(!meta) return '（空）';
  const d = meta.savedAt ? new Date(meta.savedAt) : null;
  const when = d ? `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}` : '—';
  const diff = (DIFFICULTIES[meta.difficulty]||{}).label || meta.difficulty || '';
  const cash = typeof yen==='function' ? yen(meta.cash||0) : (meta.cash||0);
  return `${meta.companyName||'無題'}  ${meta.year||'?'}年Q${meta.quarter||'?'}  ${num(meta.units||0)}台  現金${cash}  ${diff}  [${when}]`;
}

const NAME_GIVEN = ['一郎','健太','正人','大輔','浩二','直樹','秀樹','和夫','隆','誠','昭雄','伸一','孝','守','明','勝','博','進','豊','茂','久美子','由美','恵子'];
function randomPersonName(){
  const sur = NAME_SURNAMES[Math.floor(Math.random()*NAME_SURNAMES.length)];
  const giv = NAME_GIVEN[Math.floor(Math.random()*NAME_GIVEN.length)];
  return sur + giv;

function genRivalShareholders(){
  const founderPct = 0.15 + Math.random()*0.32;
  const esopPct = 0.02 + Math.random()*0.06;
  const bankPct = 0.04 + Math.random()*0.12;
  const instPct = Math.max(0, 0.12 + Math.random()*0.22);
  let retailPct = 1 - founderPct - esopPct - bankPct - instPct;
  if(retailPct < 0.05){
    retailPct = 0.05;
  }
  // 正規化
  const raw = [founderPct, esopPct, bankPct, instPct, retailPct];
  const sum = raw.reduce((a,b)=>a+b,0);
  const n = raw.map(x=>x/sum);
  return [
    {name:'創業家', pct:n[0]},
    {name:'従業員持株会', pct:n[1]},
    {name:'メインバンク', pct:n[2]},
    {name:'機関投資家', pct:n[3]},
    {name:'個人株主・その他', pct:n[4]},
  ];
}

let bgmTrackIndex = 0; // デフォルトは希望の経営
function bgmCurrentScore(){
  const t = BGM_TRACKS[bgmTrackIndex % BGM_TRACKS.length];
  return t ? t.bars : BGM_TRACKS[0].bars;
}
function bgmCurrentName(){
  const t = BGM_TRACKS[bgmTrackIndex % BGM_TRACKS.length];
  return t ? t.name : '';
}

function ensureAudio(){
  if(!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
    bgmMaster = audioCtx.createGain();
    bgmMaster.gain.value = 1;
    bgmMaster.connect(audioCtx.destination);
  }
  if(!bgmHooked){
    bgmHooked = true;
    const kick = ()=>{
      if(!audioCtx) return;
      if(audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
      if(bgmOn) bgmFillSchedule();
    };
    document.addEventListener('visibilitychange', kick);
    window.addEventListener('focus', kick);
  }
}

/**
 * BGMバスを作り直す。既にスケジュールされた音は古いバスに繋がったまま無音化され、
 * 新しいバスだけが出力される（曲切替時の音の重なり防止）。
 */
function bgmResetBus(fadeIn){
  ensureAudio();
  if(bgmTimerId){ clearInterval(bgmTimerId); bgmTimerId = null; }
  try{
    if(bgmMaster){
      bgmMaster.gain.cancelScheduledValues(audioCtx.currentTime);
      bgmMaster.gain.value = 0;
      bgmMaster.disconnect();
    }
  }catch(_e){}
  bgmMaster = audioCtx.createGain();
  bgmMaster.gain.value = fadeIn ? 0.001 : 1;
  bgmMaster.connect(audioCtx.destination);
  if(fadeIn){
    const t = audioCtx.currentTime;
    bgmMaster.gain.setValueAtTime(0.001, t);
    bgmMaster.gain.linearRampToValueAtTime(1, t + 0.2);
  }
  bgmBarIndex = 0;
  bgmNextTime = audioCtx.currentTime + 0.05;
}

/** 木琴1音：基音+倍音、短い減衰 */
function bgmXylo(freq, when, vol, sustainSec){
  if(!audioCtx || !bgmMaster || !freq) return;
  const dur = sustainSec || 0.55;
  const partials = [
    { f: freq,       a: 1.0,  type: 'sine' },
    { f: freq * 3.0, a: 0.28, type: 'sine' },
    { f: freq * 5.1, a: 0.08, type: 'triangle' },
  ];
  partials.forEach(p=>{
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = p.type;
    osc.frequency.value = p.f;
    const peak = Math.max(0.0001, vol * p.a);
    g.gain.setValueAtTime(0.0001, when);
    g.gain.linearRampToValueAtTime(peak, when + 0.008);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0001, peak * 0.22), when + 0.11);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    osc.connect(g);
    g.connect(bgmMaster);
    osc.start(when);
    osc.stop(when + dur + 0.03);
  });
}

/** 鉄琴（グロッケン）: より高く・硬く・キラッと短く */
function bgmGlock(freq, when, vol, sustainSec){
  if(!audioCtx || !bgmMaster || !freq) return;
  const dur = sustainSec || 0.7;
  const partials = [
    { f: freq,       a: 1.0,  type: 'sine' },
    { f: freq * 2.0, a: 0.45, type: 'sine' },
    { f: freq * 4.0, a: 0.18, type: 'sine' },
    { f: freq * 6.2, a: 0.06, type: 'triangle' },
  ];
  partials.forEach(p=>{
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = p.type;
    osc.frequency.value = p.f;
    const peak = Math.max(0.0001, vol * p.a);
    g.gain.setValueAtTime(0.0001, when);
    g.gain.linearRampToValueAtTime(peak, when + 0.004); // より鋭いアタック
    g.gain.exponentialRampToValueAtTime(Math.max(0.0001, peak * 0.35), when + 0.08);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    osc.connect(g);
    g.connect(bgmMaster);
    osc.start(when);
    osc.stop(when + dur + 0.03);
  });
}

/** ストリングス風パッド: 遅いアタック・長い持続（saw + わずかなデチューン） */
function bgmStrings(freqs, when, dur, vol){
  if(!audioCtx || !bgmMaster || !freqs || !freqs.length) return;
  freqs.forEach((freq, idx)=>{
    // 2本デチューンで厚み
    [1, 1.004].forEach((det, di)=>{
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      const filt = audioCtx.createBiquadFilter();
      osc.type = 'sawtooth';
      osc.frequency.value = freq * det;
      filt.type = 'lowpass';
      filt.frequency.setValueAtTime(900 + vol * 2000, when);
      filt.frequency.linearRampToValueAtTime(1400 + vol * 2500, when + dur * 0.5);
      filt.Q.value = 0.7;
      const peak = vol * (0.55 + (idx === 0 ? 0.15 : 0.08)) * (di === 0 ? 1 : 0.7);
      g.gain.setValueAtTime(0.0001, when);
      g.gain.linearRampToValueAtTime(peak, when + 0.35); // 遅いアタック
      g.gain.setValueAtTime(peak, when + Math.max(0.4, dur - 0.4));
      g.gain.linearRampToValueAtTime(0.0001, when + dur);
      osc.connect(filt);
      filt.connect(g);
      g.connect(bgmMaster);
      osc.start(when);
      osc.stop(when + dur + 0.05);
    });
  });
}

function bgmPlayPulse(freq, when, vol){
  if(!audioCtx || !bgmMaster || !freq) return;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  g.gain.setValueAtTime(0.001, when);
  g.gain.linearRampToValueAtTime(vol, when + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, when + 0.2);
  osc.connect(g);
  g.connect(bgmMaster);
  osc.start(when);
  osc.stop(when + 0.24);
}

/* ---- ドラム（Web Audioで合成）---- */
function bgmKick(when, vol){
  if(!audioCtx || !bgmMaster) return;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(150, when);
  osc.frequency.exponentialRampToValueAtTime(45, when + 0.12);
  g.gain.setValueAtTime(0.0001, when);
  g.gain.linearRampToValueAtTime(vol, when + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, when + 0.28);
  osc.connect(g);
  g.connect(bgmMaster);
  osc.start(when);
  osc.stop(when + 0.32);
}
function bgmSnare(when, vol){
  if(!audioCtx || !bgmMaster) return;
  const len = Math.max(1, Math.floor(audioCtx.sampleRate * 0.12));
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<len;i++) data[i] = Math.random()*2 - 1;
  const noise = audioCtx.createBufferSource();
  noise.buffer = buf;
  const ng = audioCtx.createGain();
  const filt = audioCtx.createBiquadFilter();
  filt.type = 'highpass';
  filt.frequency.value = 1200;
  ng.gain.setValueAtTime(0.0001, when);
  ng.gain.linearRampToValueAtTime(vol, when + 0.008);
  ng.gain.exponentialRampToValueAtTime(0.0001, when + 0.1);
  noise.connect(filt);
  filt.connect(ng);
  ng.connect(bgmMaster);
  noise.start(when);
  noise.stop(when + 0.12);
  const osc = audioCtx.createOscillator();
  const og = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.value = 180;
  og.gain.setValueAtTime(0.0001, when);
  og.gain.linearRampToValueAtTime(vol * 0.45, when + 0.005);
  og.gain.exponentialRampToValueAtTime(0.0001, when + 0.08);
  osc.connect(og);
  og.connect(bgmMaster);
  osc.start(when);
  osc.stop(when + 0.1);
}
function bgmHat(when, vol, open){
  if(!audioCtx || !bgmMaster) return;
  const dur = open ? 0.14 : 0.045;
  const len = Math.max(1, Math.floor(audioCtx.sampleRate * dur));
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<len;i++) data[i] = Math.random()*2 - 1;
  const noise = audioCtx.createBufferSource();
  noise.buffer = buf;
  const filt = audioCtx.createBiquadFilter();
  filt.type = 'highpass';
  filt.frequency.value = open ? 6000 : 8000;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, when);
  g.gain.linearRampToValueAtTime(vol, when + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  noise.connect(filt);
  filt.connect(g);
  g.connect(bgmMaster);
  noise.start(when);
  noise.stop(when + dur + 0.02);
}

function bgmScheduleDrums(when, section, dens){
  const step = BGM_BAR_SEC / 8;
  const kVol = 0.11 * dens;
  const sVol = 0.07 * dens;
  const hVol = 0.028 * dens;

  if(section === 'A'){
    [0, 4].forEach(i => bgmKick(when + i*step, kVol));
    [2, 6].forEach(i => bgmSnare(when + i*step, sVol * 0.85));
    for(let i=0;i<8;i++) bgmHat(when + i*step, hVol * (i%2?0.7:1), false);
  } else if(section === 'B'){
    [0, 3, 4, 6].forEach(i => bgmKick(when + i*step, kVol * (i===0||i===4?1:0.75)));
    [2, 6].forEach(i => bgmSnare(when + i*step, sVol));
    for(let i=0;i<8;i++) bgmHat(when + i*step, hVol, false);
    bgmHat(when + 7*step, hVol * 1.2, true);
  } else if(section === 'S'){
    [0, 2, 4, 6].forEach(i => bgmKick(when + i*step, kVol * 1.05));
    [2, 6].forEach(i => bgmSnare(when + i*step, sVol * 1.15));
    [1, 3, 5, 7].forEach(i => bgmHat(when + i*step, hVol * 0.9, false));
    [0, 2, 4, 6].forEach(i => bgmHat(when + i*step, hVol * 1.1, false));
    bgmHat(when + 7*step, hVol * 1.4, true);
  } else {
    [0, 4].forEach(i => bgmKick(when + i*step, kVol * 0.7));
    [2, 6].forEach(i => bgmSnare(when + i*step, sVol * 0.55));
    for(let i=0;i<8;i+=2) bgmHat(when + i*step, hVol * 0.6, false);
  }
}

function bgmScheduleOneBar(when){
  const score = bgmCurrentScore();
  const bar = score[bgmBarIndex % score.length];
  bgmBarIndex++;
  const step = BGM_BAR_SEC / 4;
  const dens = bar.dens;
  const pulse = bar.pulse;
  const sec = bar.section;

  // ドラム（癒し曲はほぼ無し）
  if(sec !== 'H'){
    bgmScheduleDrums(when, sec, dens);
  } else if(dens > 0.4){
    // ごく薄いハイハットだけ
    bgmHat(when, 0.012, false);
    bgmHat(when + BGM_BAR_SEC * 0.5, 0.008, false);
  }

  // ストリングス：サビ、または癒し曲は薄いパッド
  if(sec === 'S'){
    const strFreqs = bar.chord.map(f => f * 0.5);
    bgmStrings(strFreqs, when, BGM_BAR_SEC + 0.15, 0.024);
  } else if(sec === 'H'){
    const strFreqs = bar.chord.map(f => f * 0.5);
    bgmStrings(strFreqs, when, BGM_BAR_SEC + 0.25, 0.014);
  }

  // 木琴：コードの土台（癒しはさらに小さく・長め）
  const chordVol = sec === 'H' ? 0.007 + dens * 0.004 : 0.010 + dens * 0.006;
  const chordSus = sec === 'H' ? 0.75 + dens * 0.15 : 0.55 + dens * 0.12;
  bar.chord.forEach((f, i)=>{
    bgmXylo(f, when + i * 0.03, chordVol, chordSus);
  });

  // 木琴メロディ
  bar.mel.forEach((f, i)=>{
    const melVol = sec === 'H' ? 0.012 + dens * 0.008 : 0.018 + dens * 0.012;
    const sus = sec === 'S' ? 0.55 : (sec === 'H' ? 0.65 : 0.45);
    bgmXylo(f, when + i * step, melVol, sus);
  });

  // 鉄琴
  if(sec === 'H'){
    // まばらなきらめきだけ
    bgmGlock(bar.mel[0] * 2, when + 0.04, 0.008, 0.85);
    if(dens > 0.35) bgmGlock(bar.mel[2] * 2, when + step * 2 + 0.05, 0.006, 0.7);
  } else if(sec === 'A'){
    bgmGlock(bar.mel[0] * 2, when, 0.012, 0.6);
    bgmGlock(bar.mel[2] * 2, when + step * 2, 0.010, 0.5);
  } else if(sec === 'B'){
    bar.mel.forEach((f, i)=>{
      if(i % 2 === 0) bgmGlock(f * 2, when + i * step + 0.03, 0.014, 0.55);
    });
  } else if(sec === 'S'){
    bar.mel.forEach((f, i)=>{
      bgmGlock(f * 2, when + i * step, 0.018 + dens * 0.006, 0.65);
    });
    const top = Math.max(...bar.chord);
    bgmGlock(top * 2, when + 0.05, 0.012, 0.7);
  } else {
    bgmGlock(bar.mel[0] * 2, when, 0.008, 0.5);
  }

  // 低音パルス（癒しはごく弱く）
  for(let i = 0; i < 4; i++){
    const base = sec === 'H' ? (i === 0 ? 0.016 : 0.008) : (i === 0 ? 0.032 : 0.018);
    bgmPlayPulse(bar.bass, when + i * step, base * pulse);
  }
}

function bgmFillSchedule(){
  if(!bgmOn || !audioCtx) return;
  if(audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
  const now = audioCtx.currentTime;
  if(bgmNextTime < now + 0.05) bgmNextTime = now + 0.08;
  let n = 0;
  while(bgmNextTime < now + BGM_AHEAD_SEC && n < 20){
    bgmScheduleOneBar(bgmNextTime);
    bgmNextTime += BGM_BAR_SEC;
    n++;
  }
}

function bgmStart(){
  if(bgmTimerId){ clearInterval(bgmTimerId); bgmTimerId = null; }
  bgmBarIndex = 0; // 曲の先頭から
  if(audioCtx){
    const now = audioCtx.currentTime;
    if(!bgmNextTime || bgmNextTime < now + 0.02 || bgmNextTime > now + BGM_AHEAD_SEC + 1){
      bgmNextTime = now + 0.05;
    }
  }
  bgmFillSchedule();
  bgmTimerId = setInterval(()=>{
    if(!bgmOn){
      if(bgmTimerId){ clearInterval(bgmTimerId); bgmTimerId = null; }
      return;
    }
    bgmFillSchedule();
  }, 400);
}

function bgmStop(){
  if(bgmTimerId){ clearInterval(bgmTimerId); bgmTimerId = null; }
  if(bgmMaster && audioCtx){
    const t = audioCtx.currentTime;
    bgmMaster.gain.cancelScheduledValues(t);
    bgmMaster.gain.setValueAtTime(bgmMaster.gain.value, t);
    bgmMaster.gain.linearRampToValueAtTime(0.001, t + 0.12);
  }
}

function cycleBgmTrack(){
  if(bgmToggleLock) return;
  bgmToggleLock = true;
  setTimeout(()=>{ bgmToggleLock = false; }, 280);

  ensureAudio();
  if(audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});

  bgmTrackIndex = (bgmTrackIndex + 1) % BGM_TRACKS.length;

  if(bgmOn){
    bgmResetBus(true);
    bgmStart();
  } else {
    bgmBarIndex = 0;
    bgmNextTime = 0;
  }
  try { render(); } catch(_e) {}
}
function toggleBgm(){
  if(bgmToggleLock) return;
  bgmToggleLock = true;
  setTimeout(()=>{ bgmToggleLock = false; }, 300);

  ensureAudio();
  if(audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});

  bgmOn = !bgmOn;
  if(bgmOn){
    bgmResetBus(true);
    bgmStart();
  } else {
    bgmStop();
    // 停止時もバスを切って予約音を無効化
    try{
      if(bgmMaster){
        bgmMaster.gain.value = 0;
        bgmMaster.disconnect();
      }
    }catch(_e){}
    bgmMaster = audioCtx.createGain();
    bgmMaster.gain.value = 0;
    bgmMaster.connect(audioCtx.destination);
    bgmNextTime = 0;
    bgmBarIndex = 0;
  }
  try { render(); } catch(_e) {}
}

  const diff = DIFFICULTIES[difficultyKey] || DIFFICULTIES.normal;

  REGIONS.forEach(r=>{ regionUnits[r.id] = 0; });
  regionUnits.kanto = startUnits;

/* ============================================================
   リアルタイム進行スケジューラ
   ============================================================ */
let isRunning = false;
let speed = 1;
let tickerSpeed = 1; // 1=標準。大きいほど速く流れる（0.5〜3）
let tickIntervalId = null;
const BASE_TICK_MS = 20000; // 1四半期あたりの基準時間（ミリ秒）。×1で20秒

function tickMs(){ return BASE_TICK_MS / speed; }

function runTickOnce(){
  if(!state || state.gameOver || modal) return;
  tick(state);
  mandaOffers = mandaOffers.filter(m=>m.expiresTurn >= state.turn);
  render();
  autoSave();
}

function startTimer(){
  if(tickIntervalId) clearInterval(tickIntervalId);
  isRunning = true;
  tickIntervalId = setInterval(runTickOnce, tickMs());
}
function stopTimer(){
  isRunning = false;
  if(tickIntervalId){ clearInterval(tickIntervalId); tickIntervalId = null; }
}
function toggleRun(){
  if(state.gameOver) return;
  if(isRunning) stopTimer(); else startTimer();
  render();
}
function setSpeed(mult){
  speed = mult;
  if(isRunning) startTimer();
  render();
}

/* ============================================================
   ユーティリティ
   ============================================================ */
function yen(n){
  n = Number(n);
  if(!isFinite(n)) return '—';
  n = Math.round(n);
  const neg = n < 0; n = Math.abs(n);
  let out;
  if(n >= 100000000){ out = (n/100000000).toFixed(2).replace(/\.00$/,'').replace(/(\.\d)0$/,'$1') + '億円'; }
  else if(n >= 10000){ out = Math.round(n/10000).toLocaleString('ja-JP') + '万円'; }
  else { out = n.toLocaleString('ja-JP') + '円'; }
  return (neg?'▲':'') + out;
}
function num(n){ n=Number(n); if(!isFinite(n)) return '—'; return Math.round(n).toLocaleString('ja-JP'); }
function pct(n,d){ d=d===undefined?1:d; n=Number(n); if(!isFinite(n)) return '—'; return (n*100).toFixed(d)+'%'; }
function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }

  if(s.upgrades && s.upgrades.training) cap += 18;
  if(s.executives && s.executives.hr_dir) cap += 8;
  const skill = (s.techSkill!=null ? s.techSkill : 50);
  cap += (skill - 50) * 0.45;
  const maxCap = C.TECH_CAPACITY_MAX || 150;
  return clamp(Math.round(cap), 40, maxCap);
}
function publicCapacity(s){
  return Math.max(0, s.inspectors||0) * techCapacityPerHead(s);
}
function ensureInspectors(s){
  if(s.inspectors == null) s.inspectors = Math.min(1, Math.max(0, s.techs||0));
  if((s.inspectors||0) > (s.techs||0)) s.inspectors = Math.max(0, s.techs||0);
  if(!s.inspectorPipeline) s.inspectorPipeline = [];
}
function repairPerTechAnnual(s){
  const skill = clamp(s.techSkill!=null ? s.techSkill : 50, 0, 100);
  const minR = C.REPAIR_PER_TECH_MIN || 1000000;
  const maxR = C.REPAIR_PER_TECH_MAX || 7000000;
  return minR + (skill/100) * (maxR - minR);
}
function repairRevenueAnnual(s){
  const techs = Math.max(0, s.techs||0);
  if(techs <= 0) return 0;
  const per = repairPerTechAnnual(s);
  const util = baseCapacity(s)>0 ? clamp(s.units / baseCapacity(s), 0.30, 1.20) : 0.5;
  const pog = (s.contractMix && s.contractMix.pog != null) ? s.contractMix.pog : 0.45;
  return techs * per * util * (0.50 + pog * 0.85);
}
function baseCapacity(s){
  // リニューアル専門部隊に配置した技術者は日常保守の定員から外す
  const generalTechs = Math.max(0, (s.techs||0) - (s.renewalSpecialists||0));
  return generalTechs * techCapacityPerHead(s);
}
function capacity(s){
  return baseCapacity(s) + (s.outsourceUnits||0) + (s.overtimeUnits||0);
}
/** 経過30年以上とみなす保有台数（平均年齢から推定） */
function unitsAgedForRenewal(s){
  const age = s.portfolioAge!=null ? s.portfolioAge : 4.5;
  const minAge = C.RENEWAL_MIN_AGE_YEARS || 30;
  // 平均が若いほど30年超は稀。平均が30に近づくと急増
  // age 20→約2%, 25→8%, 30→22%, 35→35%, 40→45%
  const ratio = clamp((age - (minAge - 12)) / 40, 0, 0.50);
  return Math.max(0, Math.round((s.units||0) * ratio));
}
/** 営業のリニューアル提案力（人数・質・負荷）。0に近いと受注不能 */
function renewalSalesPower(s){
  const staff = Math.max(0, s.salesStaff||0);
  const skill = clamp(s.salesSkill!=null ? s.salesSkill : 50, 0, 100);
  if(staff <= 0) return 0;
  // 質が低いと提案・クロージングがほぼできない
  if(skill < 32) return 0.05;
  let p = salesForceMult(s); // 人数・理想比・技能を織り込み済み
  // リニューアルは説明・合意形成が重いので技能の影響を強める
  p *= (0.55 + skill/100 * 0.70);
  const load = typeof salesLoad==='function' ? salesLoad(s) : 1;
  if(load > 1.25) p *= 0.75;
  if(load > 1.55) p *= 0.7;
  if(s.executives && s.executives.sales_dir) p *= 1.12;
  return clamp(p, 0, 1.8);
}
/** 今期追えるリニューアル台数の上限（技術キャパ×営業キャパの小さい方） */
function renewalChaseCapacity(s){
  const salesP = renewalSalesPower(s);
  if(salesP < 0.12) return 0; // 営業不足で提案自体が回らない
  const elite = Math.max(0, s.renewalSpecialists||0);
  const skill = clamp(s.techSkill!=null ? s.techSkill : 50, 0, 100);
  let techCap;
  if(elite > 0){
    techCap = elite * (C.RENEWAL_SPECIALIST_CAP_Q||14) * (0.85 + skill/100*0.35);
  } else {
    const general = Math.max(0, (s.techs||0));
    const soft = Math.max(0, (skill - 50) / 50);
    techCap = Math.min(12, general * (C.RENEWAL_GENERAL_CAP_Q||4) * (0.15 + soft * 0.35));
  }
  // 営業1人あたりの追客目安（技能で上下）。リニューアルは conserv より重い
  const staff = Math.max(0, s.salesStaff||0);
  const sSkill = clamp(s.salesSkill!=null ? s.salesSkill : 50, 0, 100);
  const salesCap = staff * (5 + sSkill/100 * 10) * clamp(salesP, 0.2, 1.5);
  return Math.max(0, Math.round(Math.min(techCap, salesCap)));
}
/* 事務員：契約管理・請求・定期検査報告・顧客窓口のバックオフィス能力 */
function adminCapacity(s){
  const heads = Math.max(0, s.admins||0);
  // 人事統括役員がいると事務効率がやや上がる
  const per = C.ADMIN_CAPACITY * (s.executives && s.executives.hr_dir ? 1.1 : 1);
  return Math.max(1, heads * per);
}
function adminLoad(s){
  // 官公庁・管理組合比率が高いと、台数以上に事務負荷が重い
  const factor = (typeof segmentAdminLoadFactor==='function') ? segmentAdminLoadFactor(s) : 1;
  return (s.units * factor) / adminCapacity(s);
}
/** 1.0=標準。過負荷で低下、適正配置で最大約1.12 */
function adminSupportMult(s){
  const load = adminLoad(s);
  if(load > 1.5)  return 0.58;
  if(load > 1.3)  return 0.70;
  if(load > 1.15) return 0.80;
  if(load > 1.0)  return 0.90;
  if(load > 0.85) return 1.0;
  // 適正〜余裕：営業事務・契約管理の品質が上がる
  return clamp(1.0 + (0.85 - load) * 0.28, 1.0, 1.18);
}
/** 事務過負荷による販管費の膨張係数（請求遅延・派遣事務・督促・クレーム） */
function adminSgaMult(s){
  const load = adminLoad(s);
  if(load <= 0.9) return 0.90;
  if(load <= 1.0) return 0.96;
  return 1.0 + Math.min(0.85, (load - 1.0) * 0.65);
}
/** 入金・請求の健全性（1=正常、低いほど売掛回収が遅れる） */
function adminCollectionMult(s){
  const load = adminLoad(s);
  if(load <= 1.0) return 1.0;
  return clamp(1.0 - (load - 1.0) * 0.12, 0.70, 1.0);
}
/** 更新工事・大型提案の事務準備力 */
function adminProposalMult(s){
  return 0.85 + (adminSupportMult(s) - 0.85) * 0.9;
}

/** 顧客ポートフォリオの加重平均特性 */
function portfolioSegmentMix(s){
  const total = Math.max(1, SEGMENT_IDS.reduce((a,id)=>a+(s.segmentUnits[id]||0),0));
  const mix = {};
  SEGMENT_IDS.forEach(id=>{ mix[id] = (s.segmentUnits[id]||0)/total; });
  return mix;
}
function segmentAdminLoadFactor(s){
  const mix = portfolioSegmentMix(s);
  let f = 0;
  SEGMENT_IDS.forEach(id=>{ f += mix[id] * CUSTOMER_SEGMENTS[id].adminLoad; });
  return f || 1;
}
/** セグメント別の営業パワー（独立系視点） */
function segmentSalesPower(s, segId){
  const seg = CUSTOMER_SEGMENTS[segId];
  if(!seg) return 1;
  // 価格: 安いほど価格感応セグメントに効く
  if(segId === 'public'){
    ensureInspectors(s);
    if((s.inspectors||0) < 1) return 0.02;
    const pubCap = publicCapacity(s);
    const pubUnits = (s.segmentUnits && s.segmentUnits.public) || 0;
    if(pubCap <= pubUnits * 0.95) return 0.08;
  }
  const priceIndex = clamp(1.15 - (s.price / 240000), 0.4, 1.3);
  const pricePart = Math.pow(priceIndex, seg.priceSens);
  // 品質・評判: ブランド志向セグメントはメーカー系に流れやすい→品質と信用で対抗
  const trust = (s.quality/100)*0.5 + (s.reputation/100)*0.5;
  const brandPart = Math.pow(0.55 + trust*0.7, seg.brandPref);
  // 上場・信用
  const credit = s.isListed ? (s.exchange==='prime'?1.15:1.08) : 1.0;
  // 事務余力（官公庁・管理組合は特に必要）
  const adminPart = Math.pow(adminSupportMult(s), 0.6 + (seg.adminLoad-1)*0.5);
  // 独立系への開放度
  const open = 0.7 + seg.switchOpen * 0.5;
  return Math.max(0.05, pricePart * brandPart * credit * adminPart * open * seg.speed);
}
function syncSegmentUnitsTotal(s){
  // regionUnits合計とsegmentUnits合計を一致させる（差分は最大セグメントへ）
  const ru = Object.values(s.regionUnits||{}).reduce((a,b)=>a+b,0);
  const su = SEGMENT_IDS.reduce((a,id)=>a+(s.segmentUnits[id]||0),0);
  s.units = ru;
  if(su <= 0 && ru > 0){
    const w = SEGMENT_IDS.reduce((a,id)=>a+CUSTOMER_SEGMENTS[id].marketWeight,0);
    SEGMENT_IDS.forEach(id=>{ s.segmentUnits[id] = Math.round(ru * CUSTOMER_SEGMENTS[id].marketWeight / w); });
  } else if(su > 0 && ru !== su){
    const scale = ru / su;
    SEGMENT_IDS.forEach(id=>{ s.regionUnits; s.segmentUnits[id] = Math.max(0, Math.round((s.segmentUnits[id]||0)*scale)); });
    // 端数調整
    let su2 = SEGMENT_IDS.reduce((a,id)=>a+(s.segmentUnits[id]||0),0);
    const diff = ru - su2;
    if(diff !== 0){
      const top = SEGMENT_IDS.slice().sort((a,b)=>(s.segmentUnits[b]||0)-(s.segmentUnits[a]||0))[0];
      s.segmentUnits[top] = Math.max(0, (s.segmentUnits[top]||0) + diff);
    }
  }
}



/** 他社動向：スタイル別戦略・プレイヤー反応・業界再編をまとめて処理 */
function runRivalDynamics(s, logs){
  if(!s.rivals || !s.rivals.length) return;
  const power = s.rivalPowerMult || 1;
  const playerShare = marketShare(s.units, s);
  const myGrowth = (s.history && s.history.length >= 2)
    ? (s.history[s.history.length-1].units - s.history[s.history.length-2].units)
    : 0;

  s.rivals.forEach(r=>{
    r.vitality = r.vitality != null ? r.vitality : 60;
    r.lastMoves = r.lastMoves || [];

    // --- 有機成長（全社共通・弱め）---
    if(Math.random() < 0.55){
      const organic = Math.round((8 + Math.random()*25 + r.units * 0.002) * power * (0.7 + (r.reputation||50)/200));
      // 地盤の強い地方に寄せて増加
      const regions = REGIONS.filter(rg => (r.regionUnits[rg.id]||0) > 0);
      const tgt = regions.length ? regions[Math.floor(Math.random()*regions.length)] : REGIONS.find(rg=>rg.id===r.hq) || REGIONS[0];
      r.regionUnits[tgt.id] = (r.regionUnits[tgt.id]||0) + organic;
      r.units = Object.values(r.regionUnits).reduce((a,b)=>a+b,0);
    }

    // --- ロールアップ型：M&A進出 ---
    if(r.style==='rollup' && Math.random() < 0.18 * power){
      const candidates = REGIONS.filter(rg => (r.regionUnits[rg.id]||0) < regionMarket(s,rg.id)*0.18);
      const target = candidates.length ? candidates[Math.floor(Math.random()*candidates.length)] : REGIONS[Math.floor(Math.random()*REGIONS.length)];
      const grab = Math.round((regionPool(s,target.id)*0.10 + 150 + Math.random()*200) * power);
      r.regionUnits[target.id] = (r.regionUnits[target.id]||0) + grab;
      r.units = Object.values(r.regionUnits).reduce((a,b)=>a+b,0);
      r.quality = clamp(r.quality - 3, 15, 95);
      r.vitality = clamp(r.vitality - 2, 5, 98);
      const subName = MANDA_NAME_POOL[Math.floor(Math.random()*MANDA_NAME_POOL.length)];
      r.subsidiaries = r.subsidiaries || [];
      r.subsidiaries.push({name:subName, regionName:target.name, units:grab, acquiredYear:s.year, president:randomPersonName()});
      logs.push({text:`【他社】${r.name}が${target.name}の${subName}を子会社化（推定+${num(grab)}台）。統合で一時的に品質が低下している。`, tag:'warn'});
      r.lastMoves.push('買収');
    }

    // --- 安値型：価格攻勢 ---
    if(r.style==='discount' && Math.random() < 0.16){
      const cut = 0.03 + Math.random()*0.06;
      r.price = Math.max(900000, Math.round(r.price * (1 - cut)));
      r.vitality = clamp(r.vitality - 1, 5, 98);
      logs.push({text:`【他社】${r.name}が保守料金を約${Math.round(cut*100)}%引き下げ、価格競争が激化した。`, tag:'warn'});
      s.competitivePressure = clamp((s.competitivePressure||0.5) + 0.04, 0.1, 0.95);
      r.lastMoves.push('値下げ');
    }

    // --- 地場大手：品質・ブランド投資 ---
    if(r.style==='incumbent' && Math.random() < 0.14){
      r.quality = clamp(r.quality + 2 + Math.random()*2, 15, 95);
      r.reputation = clamp(r.reputation + 2, 20, 95);
      r.price = Math.round(r.price * (1.005 + Math.random()*0.01)); // わずかに値上げ余力
      logs.push({text:`【他社】${r.name}が品質・安全投資を強化し、ブランド訴求を強めている。`, tag:'info'});
      r.lastMoves.push('品質強化');
    }

    // --- プレイヤーの伸びへの対抗 ---
    if(myGrowth > 30 && Math.random() < 0.22 * power){
      // 自社が伸びている地方で対抗営業
      const hot = REGIONS.filter(rg => (s.regionUnits[rg.id]||0) > 40).sort((a,b)=>(s.regionUnits[b.id]||0)-(s.regionUnits[a.id]||0));
      if(hot.length){
        const rg = hot[0];
        const counter = Math.round((20 + Math.random()*60) * power);
        r.regionUnits[rg.id] = (r.regionUnits[rg.id]||0) + counter;
        r.units = Object.values(r.regionUnits).reduce((a,b)=>a+b,0);
        if(r.style==='discount') r.price = Math.max(900000, Math.round(r.price * 0.97));
        logs.push({text:`【他社】${r.name}が貴社の成長を意識し、${rg.name}で対抗営業を強化した（推定+${num(counter)}台）。`, tag:'warn'});
        r.lastMoves.push('対抗');
      }
    }

    // --- プレイヤー参入地域の防衛（支店がある地方）---
    if(Math.random() < 0.12){
      REGIONS.forEach(rg=>{
        const mine = s.regionUnits[rg.id]||0;
        const theirs = r.regionUnits[rg.id]||0;
        if(mine > 50 && theirs > 100 && Math.random() < 0.35){
          const def = Math.round(15 + Math.random()*40);
          r.regionUnits[rg.id] = theirs + def;
          r.units = Object.values(r.regionUnits).reduce((a,b)=>a+b,0);
          logs.push({text:`【他社】${r.name}が${rg.name}の既存顧客の防衛に動いた（引き留め・条件改善の観測）。`, tag:'info'});
        }
      });
    }

    // --- 人材争奪（労働ひっ迫）---
    if(Math.random() < 0.10 * power){
      s.laborTightness = Math.min(2.8, (s.laborTightness||1) + 0.02 + Math.random()*0.03);
      logs.push({text:`【他社】${r.name}が技術者の積極採用を打ち出し、地域の労働需給がさらにひっ迫した。`, tag:'warn'});
      r.lastMoves.push('採用');
    }

    // --- 業績・バイタリティ ---
    const share = marketShare(r.units, s);
    let vitDelta = 0;
    if(share > playerShare) vitDelta += 1.5;
    if(r.price < s.price * 0.92) vitDelta += 0.5;
    if(r.quality < 40) vitDelta -= 2;
    if(r.style==='discount' && r.price < 1100000) vitDelta -= 0.8;
    r.vitality = clamp(r.vitality + vitDelta + (Math.random()-0.5)*2, 5, 98);
    if(r.vitality < 35 && Math.random() < 0.25){
      r.price = Math.max(850000, Math.round(r.price * 0.96));
      logs.push({text:`【他社】${r.name}は経営が厳しく、防衛的な値下げに踏み切った（活力 ${Math.round(r.vitality)}）。`, tag:'warn'});
    }
    if(r.vitality > 75 && Math.random() < 0.08){
      logs.push({text:`【他社】${r.name}の勢いが増している（推定シェア ${pct(share,1)}、活力 ${Math.round(r.vitality)}）。`, tag:'info'});
    }

    // 品質収束
    const qTarget = STYLE_QUALITY_TARGET[r.style] || 55;
    r.quality += (qTarget - r.quality) * 0.04;
    r.quality = clamp(r.quality, 15, 95);
    r.reputation = clamp((r.reputation||50) + (r.quality - 50) * 0.02 + (Math.random()-0.5)*1.5, 20, 95);

    
    // --- プレイヤー対抗：シェアが高い／同じ地方で強いと攻勢 ---
    const playerLed = REGIONS.filter(rg=>{
      const mine = s.regionUnits[rg.id]||0;
      const theirs = r.regionUnits[rg.id]||0;
      return mine > 80 && mine > theirs * 1.15;
    });
    if(playerShare > 0.12 || playerLed.length){
      // 値下げ攻勢
      if(Math.random() < 0.10 * power){
        const cut = 0.02 + Math.random()*0.05;
        r.price = Math.max(900000, Math.round(r.price * (1 - cut)));
        s.competitivePressure = clamp((s.competitivePressure||0.5)+0.05, 0.1, 0.95);
        logs.push({text:`【他社】${r.name}が御社の伸長を意識し、約${Math.round(cut*100)}%の値下げ攻勢をかけた。`, tag:'warn'});
        r.lastMoves.push('対抗値下げ');
      }
      // 技術者引き抜き
      if(Math.random() < 0.06 * power && (s.techs||0) > 3){
        const n = Math.random() < 0.35 ? 2 : 1;
        const lost = Math.min(n, Math.max(0, (s.techs||0) - (s.renewalSpecialists||0) - 1));
        if(lost > 0){
          s.techs = Math.max(0, s.techs - lost);
          if(s.renewalSpecialists > s.techs) s.renewalSpecialists = s.techs;
          s.morale = clamp((s.morale||60)-3, 5, 95);
          s.laborTightness = Math.min(2.8, (s.laborTightness||1)+0.04);
          logs.push({text:`【他社】${r.name}が好条件で技術者を引き抜き、${lost}名が離職した。`, tag:'warn'});
          r.lastMoves.push('引き抜き');
        }
      }
      // プレイヤーの強い地方へ侵食
      if(playerLed.length && Math.random() < 0.12 * power){
        const tgt = playerLed[Math.floor(Math.random()*playerLed.length)];
        const steal = Math.round(Math.min((s.regionUnits[tgt.id]||0)*0.04, 40+Math.random()*80) * power);
        if(steal > 0 && (s.regionUnits[tgt.id]||0) > steal){
          s.regionUnits[tgt.id] -= steal;
          s.units = Object.values(s.regionUnits).reduce((a,b)=>a+b,0);
          r.regionUnits[tgt.id] = (r.regionUnits[tgt.id]||0) + steal;
          r.units = Object.values(r.regionUnits).reduce((a,b)=>a+b,0);
          logs.push({text:`【他社】${r.name}が${tgt.name}で御社から推定${num(steal)}台を奪取した（営業攻勢）。`, tag:'warn'});
          r.lastMoves.push('地域侵食');
        }
      }
    }

    if(r.lastMoves.length > 5) r.lastMoves = r.lastMoves.slice(-5);
  });

  // フレーバーニュース（毎四半期 0〜2件）
  const newsCount = Math.random() < 0.55 ? 1 : (Math.random() < 0.25 ? 2 : 0);
  for(let i=0;i<newsCount;i++){
    const r = s.rivals[Math.floor(Math.random()*s.rivals.length)];
    const pool = RIVAL_FLAVOR_NEWS[r.style] || [];
    if(pool.length){
      const line = pool[Math.floor(Math.random()*pool.length)].replace(/\{name\}/g, r.name);
      logs.push({text:`【他社】${line}`, tag:'info'});
    }
  }

  // 業界再編：弱者が強者に吸収
  if(s.rivals.length >= 2 && Math.random() < 0.06 * power){
    const sorted = s.rivals.slice().sort((a,b)=>(b.vitality||50)-(a.vitality||50));
    const strong = sorted[0];
    const weak = sorted[sorted.length-1];
    if(strong && weak && strong.id !== weak.id && (weak.vitality||50) < 40 && (strong.vitality||50) > 55){
      REGIONS.forEach(rg=>{
        strong.regionUnits[rg.id] = (strong.regionUnits[rg.id]||0) + Math.round((weak.regionUnits[rg.id]||0)*0.85);
      });
      strong.units = Object.values(strong.regionUnits).reduce((a,b)=>a+b,0);
      strong.quality = clamp(strong.quality - 5, 15, 95);
      strong.vitality = clamp(strong.vitality - 5, 5, 98);
      logs.push({text:`【業界再編】${strong.name}が経営不振の${weak.name}を吸収合併した。独立系同士の再編が進んでいる。`, tag:'warn'});
      s.rivals = s.rivals.filter(x=>x.id !== weak.id);
      if(s.alliances && s.alliances[weak.id]){
        delete s.alliances[weak.id];
        logs.push({text:`${weak.name}の消滅に伴い、業務提携も解消された。`, tag:'warn'});
      }
    }
  }

  // 四半期末の他社動向サマリー（たまに）
  if(Math.random() < 0.2 && s.rivals.length){
    const leader = s.rivals.slice().sort((a,b)=>b.units-a.units)[0];
    logs.push({text:`【他社動向】独立系最大勢力は${leader.name}（推定 ${num(leader.units)}台、平均単価 ${yen(leader.price)}）。貴社シェア ${pct(playerShare,1)}。`, tag:'info'});
  }
}

function competitivePressure(s){
  if(!s.rivals.length) return 0.2;
  const avgRivalPrice = s.rivals.reduce((a,r)=>a+r.price,0)/s.rivals.length;
  // 自社価格がライバル平均より高いほど圧力↑
  const ratio = s.price / Math.max(1, avgRivalPrice);
  return clamp(0.25 + (ratio-1)*1.2, 0.1, 0.95);
}
function computeAlerts(s){
  const alerts = [];
  const util = baseCapacity(s)>0 ? s.units/baseCapacity(s) : 9;
  if(s.quakeImpact && (s.quakeImpact.ticksLeft||0) > 0){
    alerts.push({sev:'crit', text:`大地震の影響下（${s.quakeImpact.regionName||'被災地'}）。運転制限による減収 約${pct(s.quakeImpact.revenueHaircut||0,0)}・残${s.quakeImpact.ticksLeft}四半期。`});
  }
  if(s.floodImpact && (s.floodImpact.ticksLeft||0) > 0){
    alerts.push({sev:'warn', text:`大雨・浸水の復旧作業中（${s.floodImpact.regionName||'被災地'}）。臨時工事収入 約${yen(s.floodImpact.bonusRevenuePerQ||0)}/四半期・残${s.floodImpact.ticksLeft}四半期。現場は逼迫。`});
  }
  if(s.cash < 15000000) alerts.push({sev:'crit', text:`現金残高が逼迫（${yen(s.cash)}）。借入・増資・コスト削減を検討。`});
  if(util > 1.05) alerts.push({sev:'crit', text:`技術者定員を${pct(util-1,0)}超過。品質低下・事故リスク急増。採用・外注・残業枠の拡大を。`});
  else if(util > 0.92) alerts.push({sev:'warn', text:`稼働率 ${pct(util,0)}。余力薄く緊急対応が遅れる恐れ。`});
  else if(util < 0.55 && s.techs>=8) alerts.push({sev:'warn', text:`稼働率 ${pct(util,0)}。余剰人員の人件費が利益を圧迫し、士気も低下しやすい。営業・価格・M&Aで契約を積むか、採用を抑える判断が必要。`});
  if(s.quality < 38) alerts.push({sev:'crit', text:`品質スコア ${Math.round(s.quality)}。重大インシデント発生リスクが高い。`});
  else if(s.quality < 48) alerts.push({sev:'warn', text:`品質スコア ${Math.round(s.quality)}。品質投資の強化を推奨。`});
  if(s.morale < 35) alerts.push({sev:'crit', text:`従業員満足度 ${Math.round(s.morale)}。離職が加速する水準。`});
  if((s.integrity!=null ? s.integrity : 72) < 40) alerts.push({sev:'crit', text:`組織の誠実性 ${Math.round(s.integrity)}。不正・隠蔽が蔓延しやすい危険水域。`});
  else if((s.integrity!=null ? s.integrity : 72) < 52) alerts.push({sev:'warn', text:`組織の誠実性 ${Math.round(s.integrity)}。人材の質低下に伴う不正リスクに注意。`});
  const pendDisc = (s.discCases||[]).filter(c=>c.status==='pending').length;
  if(pendDisc > 0) alerts.push({sev:'warn', text:`懲罰委員会の未処理案件が${pendDisc}件ある。放置は信用を毀損する。`});
  else if(s.morale < 45) alerts.push({sev:'warn', text:`従業員満足度 ${Math.round(s.morale)}。福利厚生か稼働率の改善を。`});
  if(leverageRatio(s) > 2.0) alerts.push({sev:'crit', text:`レバレッジ ${leverageRatio(s).toFixed(2)}x。信用格付け・金利に悪影響。`});
  else if(leverageRatio(s) > 1.4) alerts.push({sev:'warn', text:`レバレッジ ${leverageRatio(s).toFixed(2)}x。有利子負債の抑制を検討。`});
  if(equityValue(s) < 0) alerts.push({sev:'crit', text:`債務超過。自己資本の回復が急務。`});
  const pressure = competitivePressure(s);
  if(pressure > 0.75) alerts.push({sev:'warn', text:`価格競争圧力が高水準（${pct(pressure,0)}）。値下げか差別化（品質・フルメン比率）が必要。`});
  if(s.midterm){
    const left = s.midterm.endTurn - s.turn;
    if(left>=0 && left<=4 && s.units < s.midterm.targetUnits*0.85)
      alerts.push({sev:'warn', text:`中期計画の残${left}四半期。目標台数 ${num(s.midterm.targetUnits)} に対し現在 ${num(s.units)}。`});
  }
  if(s.isListed && founderOwnershipPct(s) > 0.45 && annualRevenue(s) > 200000000)
    alerts.push({sev:'warn', text:`創業社長持株比率 ${pct(founderOwnershipPct(s),1)}。流動性・プライム基準の観点から希薄化を検討。`});
  const aLoad = adminLoad(s);
  if(aLoad > 1.25) alerts.push({sev:'crit', text:`事務負荷 ${pct(aLoad,0)}（処理能力 ${num(adminCapacity(s))}台に対し契約 ${num(s.units)}台）。請求遅延・法定報告漏れ・解約増のリスク。事務員の増員を。`});
  else if(aLoad > 1.05) alerts.push({sev:'warn', text:`事務負荷 ${pct(aLoad,0)}。顧客窓口と法定検査報告の余力が薄い。`});
  else if(aLoad < 0.45 && s.admins >= 4 && s.units < 500) alerts.push({sev:'warn', text:`事務員が契約規模に対して過剰（負荷 ${pct(aLoad,0)}）。固定費の見直し余地あり。`});
  const sLoad = typeof salesLoad==='function' ? salesLoad(s) : 1;
  if((s.salesStaff||0) <= 0) alerts.push({sev:'warn', text:'営業人員がいない。新規契約は紹介・自然流入にほぼ依存する。'});
  else if(sLoad > 1.4) alerts.push({sev:'warn', text:`営業が不足している（負荷 ${pct(sLoad,0)}）。管理会社開拓や地方展開が追いつかない。`});
  else if(sLoad < 0.4 && (s.salesStaff||0) >= 5 && s.units < 400) alerts.push({sev:'info', text:`営業人員が契約規模に対して多め（負荷 ${pct(sLoad,0)}）。人件費に注意。`});
  if(!alerts.length) alerts.push({sev:'ok', text:'重大な経営アラートはありません。現行方針を継続しつつ機会を窺う局面。'});
  return alerts.slice(0,6);
}
function setMidtermPlan(targetUnits, targetSharePct, aimIpo){
  const s = state;
  s.midterm = {
    startTurn: s.turn,
    endTurn: s.turn + C.MIDTERM_HORIZON_Q,
    targetUnits: Math.max(100, Math.round(targetUnits)),
    targetShare: clamp(targetSharePct/100, 0.01, 0.5),
    targetIpo: !!aimIpo,
    unitsHit: false,
    shareHit: false,
    ipoHit: false,
    closed: false,
  };
  pushLog(s, `中期経営計画を策定（${C.MIDTERM_HORIZON_Q}四半期）: 目標台数 ${num(s.midterm.targetUnits)}／シェア ${pct(s.midterm.targetShare,1)}${aimIpo?'／期間内上場':''}。`, 'good');
  render(); autoSave();
}
function allianceCount(s){ return Object.values(s.alliances||{}).filter(Boolean).length; }
function effMaintCostPerUnit(s){
  const allianceDiscount = 1 - Math.min(0.15, allianceCount(s)*0.05);
  const parts = partsPolicyInfo(s);
  const rel = makerRelationAvg(s);
  // メーカー関係が悪いと調達が割高
  const relMult = rel < 40 ? 1.08 : rel > 70 ? 0.96 : 1;
  return C.MAINT_COST_PER_UNIT * (s.upgrades.parts ? 0.85 : 1) * allianceDiscount * (parts.costMult||1) * relMult;
}
function orgHireScale(s){
  // 規模が大きいほど良い人材の採用が難しく・高くなる
  return 1 + Math.max(0, (s.techs||0) - 10) * 0.03 + Math.max(0, (s.admins||0) - 4) * 0.02 + Math.max(0, (s.salesStaff||0) - 3) * 0.025;
}
function effHireCostMult(s){
  return s.hireCostMult * s.laborTightness * orgHireScale(s)
    * (s.upgrades.training ? 0.8 : 1) * (s.executives.hr_dir ? 0.85 : 1);
}
function accidentRiskMult(s){
  let m = 1;
  if(s.upgrades.iot) m *= 0.8;
  if(s.upgrades.ai_predict) m *= 0.65;
  if(s.executives.quality_officer) m *= 0.85;
  const parts = typeof partsPolicyInfo==='function' ? partsPolicyInfo(s) : null;
  if(parts && parts.accidentMult) m *= parts.accidentMult;
  // 事務過負荷は法定報告・点検スケジュール管理の抜けを招き事故・行政リスクを押し上げる
  const load = adminLoad(s);
  if(load > 1.2) m *= 1.0 + Math.min(0.45, (load - 1.2) * 0.6);
  else if(load < 0.8) m *= 0.92;
  // 組織誠実性の低下は隠蔽・手抜きを招き事故確率を押し上げる
  const integ = s.integrity!=null ? s.integrity : 72;
  if(integ < 55) m *= 1.0 + (55 - integ) * 0.012;
  if(integ < 40) m *= 1.15;
  return m;
}
function churnRiskMult(s){ return s.upgrades.ai_predict ? 0.85 : 1; }

function adChannelCostQ(s){
  let c = 0;
  AD_CHANNEL_IDS.forEach(id=>{
    const ch = AD_CHANNELS[id];
    if(!s.adActive || !s.adActive[id]) return;
    if(ch.listedOnly && !s.isListed) return;
    c += ch.costQ;
  });
  return c;
}
function adSalesBoost(s){
  let b = 0;
  AD_CHANNEL_IDS.forEach(id=>{
    const ch = AD_CHANNELS[id];
    if(!s.adActive || !s.adActive[id]) return;
    if(ch.listedOnly && !s.isListed) return;
    b += ch.salesBoost;
  });
  // 認知の蓄積でわずかに効率アップ
  b *= 1 + Math.min(0.25, (s.adAwareness||0)/200);
  return b;
}
function adSegmentMult(s, segId){
  let w = 0, n = 0;
  AD_CHANNEL_IDS.forEach(id=>{
    const ch = AD_CHANNELS[id];
    if(!s.adActive || !s.adActive[id]) return;
    if(ch.listedOnly && !s.isListed) return;
    w += (ch.segments[segId]||1) * ch.salesBoost;
    n += ch.salesBoost;
  });
  if(n <= 0) return 1;
  return clamp(w / n, 0.7, 1.6);
}
function adIrBoost(s){
  if(!s.isListed) return 0;
  let b = 0;
  AD_CHANNEL_IDS.forEach(id=>{
    const ch = AD_CHANNELS[id];
    if(!s.adActive || !s.adActive[id]) return;
    if(ch.listedOnly) b += (ch.irBoost||0);
  });
  return b;
}
function toggleAdChannel(id){
  const s = state;
  const ch = AD_CHANNELS[id];
  if(!ch) return;
  if(ch.listedOnly && !s.isListed){
    pushLog(s, 'この施策は上場後に利用できる（IR活動）。', 'info');
    render(); return;
  }
  s.adActive = s.adActive || {};
  s.adActive[id] = !s.adActive[id];
  pushLog(s, `${ch.label}を${s.adActive[id]?'有効化':'停止'}した（四半期コスト目安 ${yen(ch.costQ)}）。`, 'info');
  render(); autoSave();
}

function salesForceMult(s){
  const staff = Math.max(0, s.salesStaff||0);
  if(staff <= 0) return 0.42;
  const branches = REGIONS.filter(rg => (s.regionBranches[rg.id]||0) > 0).length;
  const ideal = Math.max(1.2, (s.units||0) / (C.SALES_CAPACITY||140) + branches * 0.35 + 0.5);
  const ratio = staff / ideal;
  const skill = (s.salesSkill!=null ? s.salesSkill : 50) / 50;
  const base = 0.50 + Math.pow(Math.min(ratio, 2.0), 0.65) * 0.75;
  return clamp(base * (0.88 + skill * 0.12), 0.42, 1.65);
}
function salesLoad(s){
  const staff = Math.max(0.25, s.salesStaff||0);
  const branches = REGIONS.filter(rg => (s.regionBranches[rg.id]||0) > 0).length;
  const ideal = Math.max(1, (s.units||0) / (C.SALES_CAPACITY||140) + branches * 0.35);
  return ideal / staff;
}
function salesPowerMult(s){
  return (s.executives.sales_dir ? 1.2 : 1) * adminSupportMult(s) * (1 + adSalesBoost(s)) * salesForceMult(s);
}
function loanRateExecAdj(s){ return s.executives.cfo ? -0.003 : 0; }
function psrExecBonus(s){ return s.executives.cfo ? 0.05 : 0; }

/* ---- 契約セグメント（構成比は目標へ緩やかに移行）---- */
function segPriceMult(s){
  return SEGMENTS.reduce((a,seg)=> a + (s.segmentMix[seg.id]||0)*seg.priceMult, 0);
}
function segChurnMult(s){
  return SEGMENTS.reduce((a,seg)=> a + (s.segmentMix[seg.id]||0)*seg.churnMult, 0);
}
function contractPriceMult(s){
  return CONTRACT_TYPES.full.priceMult*s.contractMix.full + CONTRACT_TYPES.pog.priceMult*s.contractMix.pog;
}
function contractChurnMult(s){
  return CONTRACT_TYPES.full.churnMult*s.contractMix.full + CONTRACT_TYPES.pog.churnMult*s.contractMix.pog;
}
function contractRepairExposure(s){
  return CONTRACT_TYPES.full.repairExposure*s.contractMix.full + CONTRACT_TYPES.pog.repairExposure*s.contractMix.pog;
}
function totalDebt(s){ return s.debt + s.bonds.reduce((a,b)=>a+b.principalRemaining,0); }
function leverageRatio(s){ return totalDebt(s) / Math.max(1, annualRevenue(s)); }
function creditRatingInfo(s){
  const lev = leverageRatio(s);
  if(lev < 0.3) return {label:'AA', adj:-0.002};
  if(lev < 0.8) return {label:'A', adj:0};
  if(lev < 1.5) return {label:'BBB', adj:0.003};
  if(lev < 2.5) return {label:'BB', adj:0.008};
  return {label:'B', adj:0.015};
}
function mainBankRateAdj(s){
  if(s.mainBankRelationship >= 70) return -0.002;
  if(s.mainBankRelationship < 30) return 0.003;
  return 0;
}
function dividendYield(s){
  if(!s.isListed || !s.stockPrice) return 0;
  const ttm = (s.dividendHistory||[]).reduce((a,b)=>a+b,0);
  const marketCap = s.stockPrice * s.shares;
  return marketCap>0 ? ttm/marketCap : 0;
}
/* ---- 株主構成・経営者資産 ---- */
function founderOwnershipPct(s){
  return clamp(s.founderShares / s.shares, 0, 1);
}
function esopOwnershipPct(s){
  return clamp(s.esopPct||0, 0, 0.15);
}
/** 流通株式比率（創業社長・持株会を除く） */
function freeFloatRatio(s){
  return Math.max(0, 1 - founderOwnershipPct(s) - esopOwnershipPct(s));
}
/** 分割でプラス・併合でマイナス。四半期ごとに減衰する流動性バイアス */
function shareLiquidityBias(s){
  return clamp(Number(s.shareLiquidityBias)||0, -0.45, 0.55);
}
/** 株価水準による個人の買いやすさ（数百〜千数百円帯が厚い） */
function priceAccessibilityScore(s){
  if(!s.stockPrice) return 0.5;
  const p = s.stockPrice;
  if(p < 50) return 0.25;
  if(p < 100) return 0.45;
  if(p <= 500) return 1.0;
  if(p <= 1500) return 0.85;
  if(p <= 3000) return 0.65;
  if(p <= 8000) return 0.40;
  return 0.22;
}
/** 知名度（広告・IR・上場市場の流動性）0〜100 */
function brandAwareness(s){
  let a = s.adAwareness||0;
  if(s.isListed){
    listedMarkets(s).forEach(k=>{
      if(EXCHANGES[k]) a += (EXCHANGES[k].liquidity||1) * 5;
    });
  }
  a += Math.min(15, (s.reputation||50) * 0.12);
  a += shareLiquidityBias(s) * 12; // 分割効果を認知・流動性側にも少し反映
  return clamp(a, 0, 100);
}
/**
 * 推定株主数（個人投資家の裾野）
 * 知名度・IR・流通比率・時価総額・株価の買いやすさ・分割/併合効果で増減。
 */
function estimatedShareholderCount(s){
  if(!s.isListed && !s._ipoPreview) return 1;
  const aw = brandAwareness(s) / 100;
  const fl = freeFloatRatio(s);
  const ir = typeof adIrBoost==='function' ? adIrBoost(s) : 0;
  const mcapYen = (s.stockPrice && s.shares) ? s.stockPrice * s.shares : annualRevenue(s) * 0.9;
  const mcapOku = Math.max(0, mcapYen / 1e8);
  const access = priceAccessibilityScore(s);
  const liq = shareLiquidityBias(s);
  let n = 40 + aw * 700 + fl * 500 + Math.sqrt(mcapOku) * 28 + ir * 1800;
  n *= (0.55 + access * 0.55);
  n *= (1 + liq * 0.9);
  if(s.isListed && s.exchange==='prime') n *= 1.15;
  if(s.isListed && (s.exchange==='sapporo'||s.exchange==='fukuoka')) n *= 0.75;
  return Math.max(1, Math.round(n));
}
/** 個人株主が流通株に占める比率（知名度・株価の買いやすさが高いほど個人が厚い） */
function retailShareOfFloat(s){
  const aw = brandAwareness(s) / 100;
  const access = priceAccessibilityScore(s);
  const liq = shareLiquidityBias(s);
  const retail = clamp(
    0.28 + aw * 0.42 + access * 0.12 + liq * 0.10 + (typeof adIrBoost==='function'?adIrBoost(s)*0.5:0),
    0.22, 0.78
  );
  return retail;
}
function soRemainingPool(s){
  return Math.max(0, (s.soPoolPct||0) - (s.soGrantedPct||0));
}
function soDilutionRiskPct(s){
  return clamp(s.soGrantedPct||0, 0, 0.2);
}

function playerShareholderStructure(s){
  const founder = founderOwnershipPct(s);
  const esop = esopOwnershipPct(s);
  const float = Math.max(0, 1 - founder - esop);
  const retail = s.isListed || s._ipoPreview ? retailShareOfFloat(s) : 0.45;
  const inst = 1 - retail;
  const rows = [
    {name:'創業社長', pct:founder},
    {name:'従業員持株会', pct:esop},
    {name:'機関投資家', pct: float * inst},
    {name:'個人株主・その他', pct: float * retail},
  ];
  if((s.soGrantedPct||0) > 0.001){
    rows.push({name:'SO潜在（未行使）', pct: s.soGrantedPct, soft:true});
  }
  return rows;
}
function playerNetWorth(s){
  const liquid = Math.max(0, Number(s.founderLiquid)||0);
  if(s.isListed && s.stockPrice){
    return (s.founderShares||0) * s.stockPrice + liquid;
  }
  // 未上場: 持分相当の簿価＋個人流動資産
  const book = equityValue(s) * founderOwnershipPct(s);
  return book + liquid;
}
function founderLiquidCap(s){
  return Math.max(0, Number(s.founderLiquid)||0);
}
function rivalNetWorth(rival){
  const impliedValue = rival.units * rival.price * 0.9; // 非上場ディスカウント込みの推定企業価値
  const founder = rival.shareholders.find(x=>x.name==='創業家');
  return impliedValue * (founder ? founder.pct : 0.3);
}
function companyBlurb(s, entity){
  if(entity.isPlayer){
    return `${entity.name.replace('株式会社','')}は関東を拠点に急成長する独立系エレベーター保守事業者。${s.isListed?listedMarkets(s).map(k=>EXCHANGES[k]?EXCHANGES[k].short:k).join('・')+'に上場。':'未上場。'}`;
  }
  return STYLE_BLURB[entity.style] || '独立系エレベーター保守事業者。';
}
function companyOutlookComment(entity){
  const h = entity.history||[];
  if(h.length<2) return 'データ収集中。';
  const prev = h[h.length-2], last = h[h.length-1];
  const growth = prev.units>0 ? (last.units-prev.units)/prev.units : 0;
  if(growth>0.05) return '新規契約の獲得が続き、拡大基調が鮮明。';
  if(growth<-0.03) return '解約が先行し、契約数はやや減少傾向。';
  return '横ばい圏で推移。';
}
/* ---- 貸借対照表（簡易） ---- */
function equityValue(s){ return (Number(s.paidInCapital)||0) + (Number(s.retainedEarnings)||0); }
function totalAssetsValue(s){ return equityValue(s) + totalDebt(s); }
function equityRatio(s){
  const eq = equityValue(s);
  const ta = totalAssetsValue(s);
  if(eq < 0) return eq / Math.max(1, Math.abs(ta)); // 純資産マイナス時は符号を保って明確に債務超過を示す
  return ta>0 ? eq/ta : 0;
}
function computeEndScore(s){
  const years = (s.year - 2026) + (s.quarter-1)/4;
  let score = 1000 - years*15;
  score += (RIVAL_TEMPLATES.length - s.rivals.length) * 80;
  score -= (s.accidentCount||0) * 40;
  score += Math.round((s.cumulativeDividends||0)/100000000)*5;
  score = Math.max(0, Math.round(score));
  let rank = 'D';
  if(score>=900) rank='S';
  else if(score>=700) rank='A';
  else if(score>=500) rank='B';
  else if(score>=300) rank='C';
  return {years, score, rank};
}
function takeoverEligible(s, rival){
  return rival.units>0 && rival.units < s.units*0.5;
}
function takeoverCost(s, rival){
  const distressMult = clamp(0.6 + (rival.vitality!=null ? rival.vitality : 60)/150, 0.6, 1.15);
  return Math.round(rival.units * rival.price * 1.6 * distressMult);
}
function independentRatio(s){
  const total = s.board.insiders + s.board.outsiders;
  return total>0 ? s.board.outsiders/total : 0;
}

function annualRevenue(s){ return s.units * s.price * segPriceMult(s) * contractPriceMult(s) + repairRevenueAnnual(s); }

/* ---- 地方市場 ---- */
function regionMarket(s, rid){
  const region = REGIONS.find(r=>r.id===rid);
  return s.marketTotal * region.weight;
}
function regionRivalTotal(s, rid){ return s.rivals.reduce((a,r)=>a+(r.regionUnits[rid]||0),0); }
function regionTotalOrganized(s, rid){ return (s.regionUnits[rid]||0) + regionRivalTotal(s, rid); }
function regionPool(s, rid){ return Math.max(0, regionMarket(s,rid) - regionTotalOrganized(s, rid)); }

function totalOrganized(s){ return s.units + s.rivals.reduce((a,r)=>a+r.units,0); }
function pool(s){ return Math.max(0, s.marketTotal - totalOrganized(s)); }
function marketShare(units,s){ return s.marketTotal>0 ? units/s.marketTotal : 0; }
function floorNumber(s){
  const sh = marketShare(s.units,s)*100;
  let f = Math.floor(sh) + 1;
  if(s.isListed) f += 3;
  return clamp(f, 1, 42);
}
function leaderShare(s){
  let best = marketShare(s.units,s);
  s.rivals.forEach(r=>{ best = Math.max(best, marketShare(r.units,s)); });
  return best;
}
function isPlayerLeader(s){
  const mine = marketShare(s.units,s);
  return s.rivals.every(r => mine > marketShare(r.units,s)) && mine > 0.30;
}

function pushLog(s,text,tag){
  s.log.unshift({q:`${s.year}Q${s.quarter}`, text, tag: tag||'info'});
  if(s.log.length>80) s.log.pop();
}

function pickCatalogEvent(){
  let total = 0;
  EVENT_CATALOG.forEach(e=>{ total += (e.w||1); });
  let r = Math.random() * total;
  for(const e of EVENT_CATALOG){
    r -= (e.w||1);
    if(r <= 0) return e;
  }
  return EVENT_CATALOG[EVENT_CATALOG.length-1];
}


/* ============================================================
   災害イベント（稀・構造的）
   大地震 / 大雨・浸水 — いずれもクールダウン付きの低確率
   ============================================================ */
function pickDisasterEpicenter(s){
  const weights = REGIONS.map(rg=>{
    const mine = s.regionUnits[rg.id]||0;
    const mkt = (typeof regionMarket==='function' ? regionMarket(s, rg.id) : (rg.weight||0.1)*(s.marketTotal||120000));
    return 0.35*(rg.weight||0.1) + 0.45*(s.units>0 ? mine/Math.max(1,s.units) : 0) + 0.20*(mkt/Math.max(1,s.marketTotal||1));
  });
  let total = weights.reduce((a,b)=>a+b,0);
  let r = Math.random()*total;
  for(let i=0;i<REGIONS.length;i++){
    r -= weights[i];
    if(r <= 0) return REGIONS[i];
  }
  return REGIONS[0];
}
function disasterMitigationFactor(s){
  let m = 0;
  if(s.upgrades && s.upgrades.iot) m += 0.12;
  if(s.upgrades && s.upgrades.ai_predict) m += 0.18;
  if(s.executives && s.executives.quality_officer) m += 0.05;
  m += clamp((s.quality||50)-50, -15, 30)*0.004;
  m += clamp((s.techSkill||50)-50, -20, 30)*0.003;
  return clamp(m, 0, 0.55);
}

/* ---- 大地震 ---- */
function applyMajorQuakeResponse(s, region, responseKey){
  const unitsHere = s.regionUnits[region.id]||0;
  const exposure = s.units>0 ? unitsHere/s.units : 0;
  const mitigate = disasterMitigationFactor(s);
  const util = capacity(s)>0 ? s.units/capacity(s) : 1.2;
  const spare = capacity(s)>0 ? Math.max(0,(capacity(s)-s.units)/capacity(s)) : 0;
  const fmExp = typeof contractRepairExposure==='function' ? contractRepairExposure(s) : 0.5;
  const ins = Math.min(INSURANCE_MAX_COVERAGE, Number(s.insuranceCoverage)||0);
  const RESP = {
    full:     {label:'全力動員', costMult:1.55, haircutMult:0.65, repDelta:4,  moraleDelta:-6, boostMult:2.1, boostTicks:5, lostFrac:0.008},
    standard: {label:'標準対応', costMult:1.0,  haircutMult:1.0,  repDelta:1,  moraleDelta:-3, boostMult:1.7, boostTicks:4, lostFrac:0.02},
    lean:     {label:'最小限対応', costMult:0.55, haircutMult:1.35, repDelta:-6, moraleDelta:-1, boostMult:1.25, boostTicks:3, lostFrac:0.045},
  };
  const resp = RESP[responseKey] || RESP.standard;
  const basePerUnit = 14000 + Math.random()*16000;
  let emergencyCost = unitsHere * basePerUnit * (0.55 + fmExp*0.9) * resp.costMult * (1 - mitigate*0.85);
  if(spare < 0.08) emergencyCost *= 1.25 + Math.min(0.5, (0.08-spare)*4);
  if(util > 1.05) emergencyCost *= 1.15;
  const insuredRelief = emergencyCost * ins * 0.85;
  emergencyCost = Math.max(0, Math.round(emergencyCost - insuredRelief));
  s.cash -= emergencyCost;
  const baseHaircut = clamp(0.04 + exposure*0.32, 0.04, 0.38) * (1 - mitigate*0.7) * resp.haircutMult;
  const disruptTicks = responseKey==='full' ? 1 : (responseKey==='lean' ? 3 : 2);
  s.quakeImpact = {
    regionId: region.id, regionName: region.name,
    ticksLeft: disruptTicks,
    revenueHaircut: clamp(baseHaircut, 0.02, 0.42),
    response: responseKey,
  };
  let lost = Math.round(unitsHere * resp.lostFrac * (1 - mitigate*0.6) * (util>1.1 ? 1.4 : 1));
  if(lost > 0 && unitsHere > 0){
    lost = Math.min(lost, unitsHere);
    s.regionUnits[region.id] = Math.max(0, unitsHere - lost);
    s.units = Object.values(s.regionUnits).reduce((a,b)=>a+b,0);
    if(s.segmentUnits){
      const segTotal = SEGMENT_IDS.reduce((a,id)=>a+(s.segmentUnits[id]||0),0) || 1;
      SEGMENT_IDS.forEach(id=>{
        const share = (s.segmentUnits[id]||0)/segTotal;
        s.segmentUnits[id] = Math.max(0, Math.round((s.segmentUnits[id]||0) - lost*share));
      });
    }
  }
  s.reputation = clamp((s.reputation||50)+resp.repDelta+(mitigate>0.25?1:0)+(spare>0.15?1:(spare<0.05?-2:0)), 5, 98);
  s.morale = clamp((s.morale||60)+resp.moraleDelta+(responseKey==='full'&&spare<0.1?-2:0), 5, 95);
  s.satisfaction = clamp((s.satisfaction||60)+(responseKey==='full'?3:responseKey==='lean'?-4:0), 5, 98);
  if(responseKey==='full'){ s.quality=clamp((s.quality||50)+1,5,98); s.techSkill=clamp((s.techSkill||50)+1.5,5,98); }
  else if(responseKey==='lean'){ s.quality=clamp((s.quality||50)-2,5,98); }
  s.regionBoost = {regionId: region.id, ticksLeft: resp.boostTicks, mult: resp.boostMult*(0.9+mitigate*0.25)};
  s.majorQuakeCooldown = 14 + Math.floor(Math.random()*10);
  s.majorQuakeCount = (s.majorQuakeCount||0)+1;
  const insNote = ins>0.05 ? `（保険で約${yen(Math.round(insuredRelief))}を軽減）` : '（保険付保が薄い／なし）';
  const lostNote = lost>0 ? `／契約喪失 ${num(lost)}台` : '／主要契約は維持';
  pushLog(s, `${region.name}の大地震に${resp.label}で臨んだ。緊急点検・応急費用 ${yen(emergencyCost)}${insNote}${lostNote}。運転再開まで売上の一部が停滞（減収率目安 ${pct(s.quakeImpact.revenueHaircut,0)}・${disruptTicks}四半期）。復旧需要は同地方で活発化。`, responseKey==='lean'?'warn':'info');
  if(s.rivals && s.rivals.length){
    const r = s.rivals[Math.floor(Math.random()*s.rivals.length)];
    if(r && (r.regionUnits[region.id]||0)>0) pushLog(s, `${r.name}も${region.name}で緊急点検対応に追われている。`, 'info');
  }
}
function triggerMajorEarthquake(s, logs){
  const region = pickDisasterEpicenter(s);
  const unitsHere = s.regionUnits[region.id]||0;
  const exposure = s.units>0 ? unitsHere/s.units : 0;
  const util = capacity(s)>0 ? s.units/capacity(s) : 1;
  const spare = capacity(s)>0 ? Math.max(0,(capacity(s)-s.units)/capacity(s)) : 0;
  const hasBranch = (s.regionBranches[region.id]||0)>0;
  const prepLines = [];
  if(s.upgrades && s.upgrades.ai_predict) prepLines.push('AI予知保全が異常検知を支援');
  else if(s.upgrades && s.upgrades.iot) prepLines.push('IoT遠隔監視で停止状況を早期把握');
  else prepLines.push('遠隔監視は未整備で現地確認が中心');
  if((s.insuranceCoverage||0)>=0.3) prepLines.push(`保険付保率 ${pct(s.insuranceCoverage,0)}`);
  else prepLines.push('保険付保が手薄で自己負担が大きくなりやすい');
  if(spare>=0.12) prepLines.push(`技術余力あり（稼働 ${pct(util,0)}）`);
  else if(util>1.0) prepLines.push(`技術者は定員超過（稼働 ${pct(util,0)}）`);
