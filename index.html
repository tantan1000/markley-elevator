function removeUnitsFromPortfolio(s, n, regionId){
  n = Math.max(0, Math.round(n||0));
  if(n<=0 || (s.units||0)<=0) return 0;
  n = Math.min(n, s.units);
  let left = n;
  if(regionId && (s.regionUnits[regionId]||0)>0){
    const take = Math.min(left, s.regionUnits[regionId]);
    s.regionUnits[regionId] -= take;
    left -= take;
  }
  if(left>0){
    const ids = REGIONS.map(r=>r.id).filter(id=>(s.regionUnits[id]||0)>0);
    let guard = 0;
    while(left>0 && ids.length && guard++<80){
      const id = ids[guard % ids.length];
      if((s.regionUnits[id]||0)<=0){ ids.splice(ids.indexOf(id),1); continue; }
      s.regionUnits[id] -= 1;
      left -= 1;
    }
  }
  let segLeft = n;
  const segIds = SEGMENT_IDS.filter(id=>(s.segmentUnits[id]||0)>0);
  let i = 0;
  while(segLeft>0 && segIds.length && i<600){
    const id = segIds[i % segIds.length];
    if((s.segmentUnits[id]||0)>0){ s.segmentUnits[id]--; segLeft--; }
    i++;
  }
  s.units = Object.values(s.regionUnits).reduce((a,b)=>a+b,0);
  return n - left;
}
function generatePmiKeyPersons(units, hostile, presidentName){

    list.push({

      role,

      retained: false,
      quitChanceBase: role==='元社長' ? 0.22 : (role==='熟練検査員' ? 0.14 : 0.16),
    });
  }
  return list;
}
function estimatePmiSiteOverlap(s, regionId){
  if(!regionId){
    // 全国案件：既存拠点の多さから概算
    const branches = Math.max(0, s.branches||0);
    return clamp(0.15 + Math.min(0.7, branches * 0.06), 0.1, 0.85);
  }
  const existing = s.regionBranches[regionId]||0;
  // 買収で+1する直前の既存数で重複を見る（既に加算済みなら1を引く）
  const prior = Math.max(0, existing - 1);
  if(prior <= 0) return 0.12;
  return clamp(0.25 + prior * 0.28, 0.2, 1.0);
}

    regionName: sub.regionName||'—',
    units,
    techsAtStart: opts.techsGained!=null ? opts.techsGained : Math.round(units / C.TECH_CAPACITY * 0.9),
    tier: tt.tier,
    ticksTotal: tt.ticks,
    ticksLeft: tt.ticks,
    cultureFit: Math.round(hostile ? 25+Math.random()*18 : 40+Math.random()*22),
    systemSync: Math.round(15+Math.random()*18),
    brandPolicy: Math.round(10+Math.random()*12),
    resistance: Math.round(hostile ? 52+Math.random()*28 : 22+Math.random()*22),
    policy: 'stabilize',
    integrationCostPaid: 0,
    customersLost: 0,
    techsQuit: 0,
    status: 'active',
    startedLabel: `${s.year}Q${s.quarter}`,
    // Phase 2
    keyPersons: generatePmiKeyPersons(units, hostile, sub.president),
    siteOverlap,
    sitesToClose: 0,
    sitesClosed: 0,
    maxClosable,
    closeCostPerSite: Math.round(700000 + units * 800),
    synergyUnlocked: false,
    historyNotes: [],
    regionalChurnAcc: 0,
  };
  s.pmiJobs.push(job);
  sub.pmiId = job.id;
  sub.integrating = true;
  return job;
}
function pmiProgressPct(job){
  if(!job) return 0;
  const resistScore = 100 - (job.resistance||0);
  return clamp(Math.round(
    (job.systemSync||0)*0.35 + (job.cultureFit||0)*0.30 + resistScore*0.20 + (job.brandPolicy||0)*0.15
  ), 0, 100);
}
function pmiBudgetFor(job, pol){
  const tierMult = job.tier==='L' ? 1.45 : (job.tier==='M' ? 1.1 : 0.85);
  const sizeMult = clamp((job.units||100)/200, 0.4, 2.2);
  return Math.round((pol.budgetQ||0) * tierMult * sizeMult);
}
function doRetainKeyPerson(jobId, kpId){
  const s = state;
  ensurePmiState(s);
  const job = s.pmiJobs.find(j=>j.id===jobId && j.status==='active');
  if(!job || !job.keyPersons) return;
  const kp = job.keyPersons.find(k=>k.id===kpId);
  if(!kp || kp.retained) return;
  const cost = Math.round(kp.stayCost||0);
  if(cost > s.cash){
    pushLog(s, `${kp.name}の残留契約に必要な資金が不足している（${yen(cost)}）。`, 'warn');
    render(); return;
  }
  s.cash -= cost;
  kp.retained = true;
  job.integrationCostPaid = (job.integrationCostPaid||0) + cost;
  job.cultureFit = clamp((job.cultureFit||50)+5, 0, 100);
  job.resistance = clamp((job.resistance||50)-8, 0, 100);
  job.historyNotes.push(`${kp.role}${kp.name}と残留契約（${yen(cost)}）`);
  pushLog(s, `${job.name}：${kp.role} ${kp.name}と残留契約を結んだ（${yen(cost)}）。現場の安定に寄与する。`, 'good');
  render(); autoSave();
}
function doSetPmiSiteClosures(jobId, n){
  const s = state;
  ensurePmiState(s);
  const job = s.pmiJobs.find(j=>j.id===jobId && j.status==='active');
  if(!job) return;
  n = Math.max(0, Math.min(job.maxClosable||0, Math.round(n||0)));
  job.sitesToClose = n;
  pushLog(s, `${job.name}：重複拠点の閉鎖計画を${n}拠点に設定した。翌四半期以降に実行される。`, 'info');
  render(); autoSave();
}
function processPmiKeyPersons(s, job, logs){
  if(!job.keyPersons) return;
  job.keyPersons.forEach(kp=>{
    if(kp.retained || kp.quit) return;
    let rate = kp.quitChanceBase || 0.15;
    rate += (job.resistance||0)/400;
    rate -= (job.cultureFit||50)/500;
    if(job.policy==='rationalize') rate += 0.10;
    if(job.policy==='stabilize') rate -= 0.04;
    rate = clamp(rate, 0.04, 0.55);
    if(Math.random() < rate){
      kp.quit = true;
      const before = s.techs||0;
      const quitN = kp.role==='元社長' ? 1 : Math.max(1, Math.round(1 + (kp.skill||50)/80));
      s.techs = Math.max(1, before - quitN);
      if(kp.role==='熟練検査員'){
        s.inspectors = Math.max(0, Math.min(s.techs, (s.inspectors||0)-1));
      }
      ensureInspectors(s);
      job.techsQuit = (job.techsQuit||0) + Math.min(quitN, before);
      s.morale = clamp((s.morale||60)-3, 5, 95);
      // 追随解約
      const follow = Math.max(0, Math.round((job.units||0) * 0.008 * (kp.role==='元社長'?2:1)));
      const actual = removeUnitsFromPortfolio(s, follow, job.regionId);
      job.customersLost = (job.customersLost||0) + actual;
      job.units = Math.max(0, (job.units||0) - actual);
      logs.push({text:`${job.name}：${kp.role} ${kp.name}が退職した${actual?`（追随解約 約${num(actual)}台）`:''}。`, tag:'warn'});
      job.historyNotes.push(`${kp.name}退職`);
    }
  });
}
function processPmiSiteClosures(s, job, logs){
  const pending = Math.max(0, (job.sitesToClose||0) - (job.sitesClosed||0));
  if(pending <= 0) return;
  // 1四半期に最大1拠点ずつ実行
  const cost = Math.round(job.closeCostPerSite || 800000);
  if(cost > s.cash){
    logs.push({text:`${job.name}：拠点閉鎖費用が足りず、計画が先送りされた。`, tag:'warn'});
    return;
  }
  s.cash -= cost;
  job.integrationCostPaid = (job.integrationCostPaid||0) + cost;
  job.sitesClosed = (job.sitesClosed||0) + 1;
  job.siteOverlap = clamp((job.siteOverlap||0) - 0.28, 0, 1);
  job.resistance = clamp((job.resistance||50)+7, 0, 100);
  job.cultureFit = clamp((job.cultureFit||50)-3, 0, 100);
  // 実際の支店数を減らせる場合は減らす（最低1は残す）
  if(job.regionId && (s.regionBranches[job.regionId]||0) > 1){
    s.regionBranches[job.regionId] -= 1;
    s.branches = Math.max(1, (s.branches||1) - 1);
  } else if(!job.regionId && (s.branches||0) > 1){
    s.branches = Math.max(1, s.branches - 1);
  }
  // 短期の地域対応力低下
  if(job.regionId){
    s.pmiRegionBoost = s.pmiRegionBoost || {};
    s.pmiRegionBoost[job.regionId] = {
      ticksLeft: 1,
      acquireMult: 0.9,
      label: '拠点再編の過渡期'
    };
  }
  logs.push({text:`${job.name}：重複拠点を1つ閉鎖した（費用 ${yen(cost)}）。固定費は下がるが現場の反発が強まった。`, tag:'info'});
  job.historyNotes.push(`拠点閉鎖（累計${job.sitesClosed}）`);
}
function applyPmiCompletionBonuses(s, job, logs){
  if(job.synergyUnlocked) return;
  job.synergyUnlocked = true;
  const subDone = (s.subsidiaries||[]).find(x=>x.id===job.subId || x.pmiId===job.id);
  if(subDone){
    ensureSubsidiaryFields(subDone);
    subDone.localMorale = clamp((subDone.localMorale||60)+4, 15, 95);
    subDone.localQuality = clamp((subDone.localQuality||55)+3, 15, 95);
    subDone.autonomy = clamp(40 + (job.cultureFit||50)*0.3, 20, 80);
  }
  const retained = (job.keyPersons||[]).filter(k=>k.retained).length;
  s.reputation = clamp((s.reputation||50)+2, 5, 98);
  s.quality = clamp((s.quality||50)+1.5 + retained*0.5, 5, 98);
  s.satisfaction = clamp((s.satisfaction||60)+1, 5, 98);
  if(job.regionId){
    s.pmiRegionBoost = s.pmiRegionBoost || {};
    s.pmiRegionBoost[job.regionId] = {
      ticksLeft: 2,
      acquireMult: 1.05 + Math.min(0.05, retained*0.02),
      label: '統合シナジー'
    };
  }
  // システム統合が高いと事務負荷をわずかに改善（次四半期の係数）
  if((job.systemSync||0) >= 75){
    s.pmiAdminMult = Math.max(1, (s.pmiAdminMult||1) - 0.03);
  }
  const note = `${job.name}統合完了（進捗${pmiProgressPct(job)}%／費用${yen(job.integrationCostPaid||0)}／解約${num(job.customersLost||0)}台）`;
  job.historyNotes.push(note);
  pushCompanyChronicle(s, note, 'pmi');
}
function pushCompanyChronicle(s, text, kind){
  if(!s.companyChronicle) s.companyChronicle = [];
  s.companyChronicle.unshift({
    year: s.year,
    quarter: s.quarter,
    label: `${s.year}Q${s.quarter}`,
    text,
    kind: kind||'info'
  });
  if(s.companyChronicle.length > 60) s.companyChronicle.pop();
}
function processPmiJobs(s, logs){
  ensurePmiState(s);
  // 地域ブースト減衰
  if(s.pmiRegionBoost){
    Object.keys(s.pmiRegionBoost).forEach(rid=>{
      const b = s.pmiRegionBoost[rid];
      if(!b) return;
      b.ticksLeft--;
      if(b.ticksLeft<=0) delete s.pmiRegionBoost[rid];
    });
  }

  const active = s.pmiJobs.filter(j=>j.status==='active');
  if(!active.length){
    s.pmiAdminMult = 1;
    s.pmiChurnAdd = 0;
    return;
  }
  let adminExtra = 0;
  let churnAdd = 0;

  active.forEach(job=>{
    const pol = PMI_POLICIES[job.policy] || PMI_POLICIES.stabilize;
    const cost = pmiBudgetFor(job, pol);
    if(cost>0){
      const paid = Math.min(Math.max(0,s.cash), cost);
      s.cash -= paid;
      job.integrationCostPaid = (job.integrationCostPaid||0) + paid;
      const scale = paid < cost ? 0.4 : 1;
      if(paid < cost){
        logs.push({text:`${job.name}の統合予算が不足し、予定どおり進まなかった（必要 ${yen(cost)}）。`, tag:'warn'});
      }
      job.systemSync = clamp(job.systemSync + pol.systemDelta*scale, 0, 100);
      job.cultureFit = clamp(job.cultureFit + pol.cultureDelta*scale, 0, 100);
      job.brandPolicy = clamp(job.brandPolicy + pol.brandDelta*scale, 0, 100);
      job.resistance = clamp(job.resistance + pol.resistDelta*scale, 0, 100);
    } else {
      job.systemSync = clamp(job.systemSync + pol.systemDelta, 0, 100);
      job.cultureFit = clamp(job.cultureFit + pol.cultureDelta, 0, 100);
      job.brandPolicy = clamp(job.brandPolicy + pol.brandDelta, 0, 100);
      job.resistance = clamp(job.resistance + pol.resistDelta, 0, 100);
    }

    // 拠点閉鎖の実行
    processPmiSiteClosures(s, job, logs);
    // キーパーソン離職
    processPmiKeyPersons(s, job, logs);

    // 重複拠点の固定費ロス（現金で軽く徴収）
    const overlapCost = Math.round(C.BRANCH_FIXED_COST * (job.siteOverlap||0) * 0.25 / 4);
    if(overlapCost > 0){
      const paid = Math.min(Math.max(0,s.cash), overlapCost);
      s.cash -= paid;
      job.integrationCostPaid = (job.integrationCostPaid||0) + paid;
    }

    // 摩擦イベント
    if(job.systemSync < 48 && Math.random() < 0.38){
      s.satisfaction = clamp((s.satisfaction||60)-2, 5, 98);
      logs.push({text:`${job.name}：請求・保守履歴の突合で混乱し、顧客満足が下がった。`, tag:'warn'});
    }
    if((job.policy==='rationalize' || job.resistance>55) && Math.random() < 0.28){
      const quit = Math.max(1, Math.round((job.techsAtStart||4) * (job.policy==='rationalize'?0.05:0.025)));
      const before = s.techs||0;
      s.techs = Math.max(1, before - quit);
      ensureInspectors(s);
      job.techsQuit = (job.techsQuit||0) + Math.min(quit, before);
      s.morale = clamp((s.morale||60)-2, 5, 95);
      logs.push({text:`${job.name}の統合過程で一般技術者${num(Math.min(quit,before))}名が離職した。`, tag:'warn'});
    }
    if(job.policy==='rebrand' && job.brandPolicy > 35 && Math.random() < 0.34){
      const lost = Math.max(1, Math.round(job.units * 0.015 * (1+(job.resistance||0)/100)));
      const actual = removeUnitsFromPortfolio(s, lost, job.regionId);
      job.customersLost = (job.customersLost||0) + actual;
      job.units = Math.max(0, (job.units||0) - actual);
      job.regionalChurnAcc = (job.regionalChurnAcc||0) + actual;
      if(actual>0) logs.push({text:`${job.name}のブランド統一に不安を示した顧客から約${num(actual)}台が解約された。`, tag:'warn'});
    }
    if(job.policy==='systems' && job.systemSync < 55 && Math.random() < 0.28){
      s.integrity = clamp((s.integrity||70)-1.5, 5, 98);
      logs.push({text:`${job.name}：データ移行の不整合が発覚し、内部管理の信頼性に傷が付いた。`, tag:'warn'});
    }

    // 未統合による継続負荷
    const incomplete = clamp((100 - (job.systemSync||0))/100, 0, 1);
    const weight = (job.units||0) / Math.max(1, s.units||1);
    const overlap = job.siteOverlap||0;
    adminExtra += weight * (0.06 + incomplete * 0.22 + overlap * 0.05);
    churnAdd += weight * incomplete * 0.012 + weight * overlap * 0.004;
    if(incomplete > 0.4){
      s.quality = clamp((s.quality||50) - incomplete * 0.35, 5, 98);
    }

    if(job.policy==='rationalize' && Math.random() < 0.35){
      s.cash += Math.round(120000 * (job.tier==='L'?1.4:1));
    }

    job.ticksLeft = (job.ticksLeft||1) - 1;
    const doneEarly = (job.systemSync||0)>=70 && (job.cultureFit||0)>=60 && (job.resistance||0)<=35;
    const timeUp = job.ticksLeft <= 0;
    if(doneEarly || timeUp){
      const sub = (s.subsidiaries||[]).find(x=>x.id===job.subId || x.pmiId===job.id);
      const failed = (job.customersLost||0) > Math.max(8, (job.units + (job.customersLost||0)) * 0.12)
        || ((job.resistance||0)>72 && (job.cultureFit||0)<32)
        || ((job.systemSync||0)<40 && timeUp && !doneEarly);
      if(failed){
        job.status = 'failed';
        const extraLost = Math.max(0, Math.round((job.units||0) * 0.04));
        const actual = removeUnitsFromPortfolio(s, extraLost, job.regionId);
        job.customersLost += actual;
        s.reputation = clamp((s.reputation||50)-3, 5, 98);
        s.morale = clamp((s.morale||60)-2, 5, 95);
        const failNote = `${job.name}統合失敗（解約累計${num(job.customersLost)}／離職${num(job.techsQuit)}／費用${yen(job.integrationCostPaid||0)}）`;
        job.historyNotes.push(failNote);
        pushCompanyChronicle(s, failNote, 'pmi_fail');
        logs.push({text:`【PMI失敗】${job.name}の統合は不調に終わった（累計解約 ${num(job.customersLost)}台／離職 ${num(job.techsQuit)}名／費用 ${yen(job.integrationCostPaid||0)}）。`, tag:'warn'});
      } else {
        job.status = 'done';
        applyPmiCompletionBonuses(s, job, logs);
        logs.push({text:`【PMI完了】${job.name}の統合が一段落した（進捗 ${pmiProgressPct(job)}%／費用 ${yen(job.integrationCostPaid||0)}／解約累計 ${num(job.customersLost||0)}台／残留キーパーソン ${(job.keyPersons||[]).filter(k=>k.retained).length}名）。`, tag:'good'});
      }
      if(sub){
        sub.integrating = false;
        sub.pmiStatus = job.status;
      }
    } else {
      logs.push({text:`【PMI】${job.name}：方針「${pol.label}」で統合中（残り${job.ticksLeft}四半期／進捗 ${pmiProgressPct(job)}%／拠点重複 ${Math.round((job.siteOverlap||0)*100)}%）。`, tag:'info'});
    }
  });

  s.pmiAdminMult = clamp(1 + Math.min(0.38, adminExtra), 1, 1.4);
  s.pmiChurnAdd = clamp(Math.min(0.018, churnAdd), 0, 0.02);
  if(!s.pmiJobs.some(j=>j.status==='active')){
    s.pmiAdminMult = 1;
    s.pmiChurnAdd = 0;
  }
}
function buildPmiModal(job){
  if(!job) return null;
  const kpLine = (job.keyPersons||[]).map(k=>`${k.role} ${k.name}${k.retained?'（残留済）':''}`).join('／') || '—';
  const body =
`買収した「${job.name}」の統合（PMI）を進めます。
規模: ${job.tier}（${num(job.units)}台）／期間目安 ${job.ticksTotal}四半期（残り${job.ticksLeft}）

進捗 ${pmiProgressPct(job)}%
システム ${Math.round(job.systemSync)}／文化 ${Math.round(job.cultureFit)}／抵抗 ${Math.round(job.resistance)}／ブランド ${Math.round(job.brandPolicy)}
拠点重複 ${Math.round((job.siteOverlap||0)*100)}%（閉鎖可能 最大${job.maxClosable||0}）
キーパーソン: ${kpLine}

買収で台数は増えても、請求・部品・現場が一つになるまでその台数はまだ完全な自社資産ではありません。
今四半期の方針を選んでください（詳細は組織・M&AタブのPMIパネルでも変更・残留契約・拠点閉鎖を設定できます）。`;
  const options = Object.values(PMI_POLICIES).map(pol=>({
    label: `${pol.label}（目安 ${yen(pmiBudgetFor(job, pol))}/四半期）`,
    onClick: ()=>{ doSetPmiPolicy(job.id, pol.id); }
  }));
  return {type:'choice', title:`PMI：${job.name}の統合方針`, body, options};
}
function doSetPmiPolicy(jobId, policyId){
  const s = state;
  ensurePmiState(s);
  const job = s.pmiJobs.find(j=>j.id===jobId && j.status==='active');
  if(job){
    job.policy = policyId;
    const pol = PMI_POLICIES[policyId];
    pushLog(s, `${job.name}の統合方針を「${pol?pol.label:policyId}」に設定した。`, 'info');
  }
  const next = s.pmiJobs.find(j=>j.status==='active' && j._needsModal);
  if(next){
    next._needsModal = false;
    modal = buildPmiModal(next);
  } else {
    modal = null;
    if(!s.gameOver) startTimer();
  }
  render(); autoSave();
}
function openPmiModalFor(jobId){
  const s = state;
  ensurePmiState(s);
  const job = s.pmiJobs.find(j=>j.id===jobId && j.status==='active');
  if(!job) return;
  stopTimer();
  modal = buildPmiModal(job);
  render();
}

function buyManda(id, typeKey, methodKey){
  const s = state;
  const m = mandaOffers.find(x=>x.id===id);
  if(!m) return;
  const ot = OWNERSHIP_TYPES[typeKey] || OWNERSHIP_TYPES.full;
  const cost = Math.round(m.price * ot.pct/100);
  methodKey = methodKey || 'cash';
  const pay = applyDealPayment(s, cost, methodKey);
  if(!pay.ok){
    pushLog(s, `${m.name}を買収できない（${pay.reason}）。`, 'warn');
    render(); return;
  }
  pushLog(s, `${m.name}を${pay.label}により${ot.label}化した（${formatDealPayment(pay)}）。`, 'good');
  const region = REGIONS.find(rg=>rg.id===m.regionId);
  if(typeKey==='equity'){
    s.equityMethodHoldings.push({
      id: 'eq'+Date.now()+Math.floor(Math.random()*999),
      name: m.name,
      regionName: region ? region.name : m.regionId,
      units: m.units,
      ownershipPct: ot.pct,
      acquiredYear: s.year,
      president: randomPersonName(),
      rivalId: null,
    });
    pushLog(s, `${m.name}は持分法適用会社として自社グループに加わった（自社の台数・売上には計上されない）。`, 'good');
  } else {
    s.units += m.units;
    s.regionUnits[m.regionId] = (s.regionUnits[m.regionId]||0) + m.units;
    const gainedTechs2 = Math.round(m.units / C.TECH_CAPACITY * 0.9);
    s.techs += gainedTechs2;
    ensureInspectors(s);
    s.inspectors = Math.min(s.techs, (s.inspectors||0) + Math.round(gainedTechs2 * 0.4));
    s.branches += 1;
    s.regionBranches[m.regionId] = (s.regionBranches[m.regionId]||0) + 1;
    const gainedTechsBuy = gainedTechs2;
    const sub = {
      id: 'sub'+Date.now()+Math.floor(Math.random()*999),
      name: m.name,
      regionId: m.regionId,
      regionName: region ? region.name : m.regionId,
      units: m.units,
      acquiredYear: s.year,
      president: randomPersonName(),
      ownershipType: typeKey,
      ownershipPct: ot.pct,
    };
    s.subsidiaries.push(sub);
    pushLog(s, `${m.name}は${ot.label}として${s.companyName.replace('株式会社','')}グループに加わった。`, 'good');
    const pmi = createPmiJob(s, sub, {techsGained: gainedTechsBuy, hostile:false});
    pmi._needsModal = false;
    stopTimer();
    modal = buildPmiModal(pmi);
  }
  mandaOffers = mandaOffers.filter(x=>x.id!==m.id);
  render(); autoSave();
}

/* ============================================================
   子会社運営（PMI後）
   ============================================================ */
const SUB_POLICIES = {
  balanced: {id:'balanced', label:'バランス', blurb:'成長と回収の中庸。標準的なグループ運営。'},
  growth:   {id:'growth', label:'成長重視', blurb:'地元での拡販を優先。親会社からの投資が増える。'},
  harvest:  {id:'harvest', label:'回収重視', blurb:'現地への圧力を強める。士気・品質が落ちやすい。連結子会社では少数株主への配当流出が起きうる。'},
  quality:  {id:'quality', label:'品質重視', blurb:'現地品質を上げ、解約を抑える。短期は投資が必要。'},
  absorb:   {id:'absorb', label:'本体吸収', blurb:'独自色を消し本体に寄せる。抵抗が残ると士気が下がる。'},
};
function ensureSubsidiaryFields(sub){
  if(!sub) return;
  if(sub.policy==null) sub.policy = sub.integrating ? 'balanced' : 'balanced';
  if(sub.localMorale==null) sub.localMorale = 58 + Math.round(Math.random()*12);
  if(sub.localQuality==null) sub.localQuality = 50 + Math.round(Math.random()*16);
  if(sub.mgmtFeeRate==null) sub.mgmtFeeRate = 0.025;
  if(sub.autonomy==null) sub.autonomy = sub.integrating ? 40 : 55;
  if(sub.lastDividend==null) sub.lastDividend = 0;
  if(sub.closed==null) sub.closed = false;
  // 子会社反発・統治
  if(sub.resentment==null) sub.resentment = 10 + Math.round(Math.random()*15); // 0-100 反発度
  if(sub.expatPresident==null) sub.expatPresident = true; // 出向社長（親会社派）
  if(sub.presidentStyle==null) sub.presidentStyle = sub.expatPresident ? (Math.random()<0.4?'autocrat':'hq') : 'local';
  // autocrat=ワンマン, hq=本社追従, local=現地寄り, bridge=橋渡し
  if(sub.parentPressure==null) sub.parentPressure = 0; // 今期の親会社圧力加算
  if(sub.backlashCooldown==null) sub.backlashCooldown = 0;
  if(sub.welfareBoostQ==null) sub.welfareBoostQ = 0;
  if(sub.autonomyGrantQ==null) sub.autonomyGrantQ = 0;
}

function processSubsidiaryBacklash(s, sub, logs, pressureExtra){
  ensureSubsidiaryFields(sub);
  if(sub.closed || sub.integrating) return;
  let pressure = (pressureExtra||0) + (sub.parentPressure||0);
  sub.parentPressure = 0;

  // 方針・管理料・自律度による構造的圧力
  const pol = sub.policy||'balanced';
  if(pol==='harvest') pressure += 8;
  if(pol==='absorb') pressure += 6;
  if(pol==='growth') pressure += 2;
  if((sub.mgmtFeeRate||0.025) > 0.035) pressure += 5;
  if((sub.autonomy||50) < 35) pressure += 4;
  if((sub.autonomy||50) < 20) pressure += 5;

  // 出向ワンマン社長
  if(sub.expatPresident){
    pressure += 2;
    if(sub.presidentStyle==='autocrat') pressure += 6;
    else if(sub.presidentStyle==='hq') pressure += 3;
  } else if(sub.presidentStyle==='local'){
    pressure -= 2;
  } else if(sub.presidentStyle==='bridge'){
    pressure -= 3;
  }

  if(sub.welfareBoostQ > 0){ pressure -= 4; sub.welfareBoostQ--; }
  if(sub.autonomyGrantQ > 0){ pressure -= 5; sub.autonomyGrantQ--; }

  // 反発度の更新
  const drift = pressure * 0.35 + (Math.random()*3 - 1) - ((sub.localMorale||60)-50)*0.04;
  sub.resentment = clamp((sub.resentment||20) + drift, 0, 100);
  sub.localMorale = clamp((sub.localMorale||60) - pressure*0.12, 10, 95);

  if(sub.backlashCooldown > 0) sub.backlashCooldown--;

  // 段階的な離職・反発イベント
  if(sub.resentment >= 55 && sub.backlashCooldown <= 0 && Math.random() < 0.22 + (sub.resentment-55)*0.008){
    const severity = sub.resentment >= 80 ? 'severe' : (sub.resentment >= 68 ? 'hard' : 'soft');
    const units = sub.units||0;
    let lostShare = severity==='severe' ? 0.04+Math.random()*0.05 : (severity==='hard' ? 0.02+Math.random()*0.03 : 0.01+Math.random()*0.015);
    if(sub.presidentStyle==='autocrat') lostShare *= 1.25;
    const lost = Math.max(1, Math.round(units * lostShare));
    const removed = Math.min(units, lost);
    if(removed > 0 && typeof removeUnitsFromPortfolio==='function'){
      removeUnitsFromPortfolio(s, removed, sub.regionId||null);
      sub.units = Math.max(0, (sub.units||0) - removed);
    } else if(removed > 0){
      sub.units = Math.max(0, units - removed);
      s.units = Math.max(0, (s.units||0) - removed);
    }
    sub.localQuality = clamp((sub.localQuality||55) - (severity==='severe'?6:3), 10, 95);
    sub.localMorale = clamp((sub.localMorale||50) - 8, 10, 95);
    sub.resentment = clamp(sub.resentment - 8, 0, 100);
    sub.backlashCooldown = severity==='severe' ? 3 : 2;

    const styleNote = sub.expatPresident
      ? (sub.presidentStyle==='autocrat' ? '出向社長のワンマン経営に現場が反発し、' : '本社出向社長の統治に疲れ、')
      : '親会社の要求が積み重なり、';
    const tag = severity==='soft' ? 'warn' : 'bad';
    logs.push({text:`【子会社反発】${sub.name}：${styleNote}熟練社員が離職。契約 ${num(removed)}台が流出した（反発度 ${Math.round(sub.resentment)}）。`, tag});
    if(severity==='severe'){
      logs.push({text:`【子会社】${sub.name}で集団離職に近い事態。サービス品質が急落。現地の自律と処遇の見直しが急務。`, tag:'bad'});
      s.reputation = clamp((s.reputation||50)-1.5, 5, 98);
    }
  } else if(sub.resentment >= 40 && Math.random() < 0.12){
    logs.push({text:`【子会社】${sub.name}で「本社の無理難題が多い」との声が強い（反発度 ${Math.round(sub.resentment)}／士気 ${Math.round(sub.localMorale)}）。`, tag:'warn'});
  }
}

function doSubLocalWelfare(subId){
  const s = state;
  const sub = (s.subsidiaries||[]).find(x=>x.id===subId);
  if(!sub) return;
  ensureSubsidiaryFields(sub);
  const cost = Math.round(1200000 + (sub.units||0)*400);
  if(cost > s.cash){ pushLog(s, '現地処遇改善の予算が不足。', 'warn'); render(); return; }
  s.cash -= cost;
  sub.welfareBoostQ = Math.max(sub.welfareBoostQ||0, 4);
  sub.resentment = clamp((sub.resentment||30)-12, 0, 100);
  sub.localMorale = clamp((sub.localMorale||50)+8, 10, 95);
  pushLog(s, `${sub.name}の現地処遇・残業規制・手当を改善した（${yen(cost)}）。反発が和らぎやすい。`, 'good');
  render(); autoSave();
}
function doSubGrantAutonomy(subId){
  const s = state;
  const sub = (s.subsidiaries||[]).find(x=>x.id===subId);
  if(!sub) return;
  ensureSubsidiaryFields(sub);
  // 管理料を下げ、自律を返す
  sub.mgmtFeeRate = Math.max(0.012, (sub.mgmtFeeRate||0.025)*0.75);
  sub.autonomy = clamp((sub.autonomy||50)+15, 5, 95);
  sub.autonomyGrantQ = Math.max(sub.autonomyGrantQ||0, 5);
  sub.resentment = clamp((sub.resentment||30)-10, 0, 100);
  if(sub.policy==='harvest' || sub.policy==='absorb'){
    sub.policy = 'balanced';
    pushLog(s, `${sub.name}の運営方針を「バランス」に戻し、現地裁可を拡大した。`, 'info');
  }
  pushLog(s, `${sub.name}に自律運営を付与（管理料率低下・現地決裁の拡大）。反発度が低下しやすい。`, 'good');
  render(); autoSave();
}
function doSubPromoteLocalPresident(subId){
  const s = state;
  const sub = (s.subsidiaries||[]).find(x=>x.id===subId);
  if(!sub) return;
  ensureSubsidiaryFields(sub);
  const cost = 2500000;
  if(cost > s.cash){ pushLog(s, '現地社長登用の費用が不足。', 'warn'); render(); return; }
  s.cash -= cost;
  const old = sub.president;
  sub.president = randomPersonName();
  sub.expatPresident = false;
  sub.presidentStyle = Math.random()<0.5 ? 'local' : 'bridge';
  sub.resentment = clamp((sub.resentment||40)-18, 0, 100);
  sub.localMorale = clamp((sub.localMorale||50)+10, 10, 95);
  sub.autonomy = clamp((sub.autonomy||50)+8, 5, 95);
  // 本社コントロールは弱まる
  s.quality = clamp((s.quality||50)-0.3, 5, 98);
  pushLog(s, `${sub.name}の社長を現地人材に交代（${old}→${sub.president}）。ワンマン出向体制を解き、現場の納得を優先。`, 'good');
  render(); autoSave();
}

function doSubRestrainParent(subId){
  const s = state;
  const sub = (s.subsidiaries||[]).find(x=>x.id===subId);
  if(!sub) return;
  ensureSubsidiaryFields(sub);
  // 親会社が一歩引く：短期の管理料減・圧力リセット
  sub.mgmtFeeRate = Math.max(0.015, (sub.mgmtFeeRate||0.025)*0.85);
  sub.parentPressure = -6;
  sub.resentment = clamp((sub.resentment||40)-7, 0, 100);
  if(sub.presidentStyle==='autocrat'){
    sub.presidentStyle = 'hq';
    pushLog(s, `${sub.name}の出向社長に「現場協議」を指示。ワンマン運営を抑制した。`, 'info');
  }
  pushLog(s, `${sub.name}への本社要求を抑制した（管理料もやや減）。反発の沈静化を優先。`, 'good');
  render(); autoSave();
}

function ensureAllSubsidiaries(s){
  (s.subsidiaries||[]).forEach(ensureSubsidiaryFields);
}
function subImpliedQuarterlyRev(sub){
  return Math.max(0, (sub.units||0) * SUBSIDIARY_ASSUMED_FEE / 4);
}
function processSubsidiaries(s, logs){
  ensureAllSubsidiaries(s);
  let mgmtIncome = 0;
  (s.subsidiaries||[]).forEach(sub=>{
    if(sub.closed) return;
    ensureSubsidiaryFields(sub);
    if(sub.integrating){
      // PMI中は運営方針の効果を弱める
      sub.localMorale = clamp((sub.localMorale||60) - 0.5, 20, 95);
      return;
    }
    const pol = SUB_POLICIES[sub.policy] || SUB_POLICIES.balanced;
    const rev = subImpliedQuarterlyRev(sub);
    let feeRate = sub.mgmtFeeRate||0.025;
    let unitDelta = 0;
    let moraleD = 0, qualD = 0, autoD = 0;

    if(pol.id==='growth'){
      feeRate *= 0.7;
      unitDelta = Math.round((sub.units||0) * (0.008 + Math.random()*0.012));
      moraleD = 0.5; autoD = 1; qualD = -0.3;
      // 成長投資コスト
      const inv = Math.round(rev * 0.04);
      s.cash -= Math.min(Math.max(0,s.cash), inv);
    } else if(pol.id==='harvest'){
      feeRate *= 1.55;
      unitDelta = -Math.round((sub.units||0) * (0.006 + Math.random()*0.01));
      moraleD = -2.2; qualD = -1.2; autoD = -2;
    } else if(pol.id==='quality'){
      feeRate *= 0.85;
      unitDelta = Math.round((sub.units||0) * 0.002);
      moraleD = 1.0; qualD = 1.8; autoD = 0.5;
      const inv = Math.round(rev * 0.03);
      s.cash -= Math.min(Math.max(0,s.cash), inv);
    } else if(pol.id==='absorb'){
      feeRate *= 1.1;
      unitDelta = Math.round((sub.units||0) * 0.001);
      moraleD = -1.5; autoD = -4; qualD = 0.2;
      // 本体品質へわずかに寄与
      s.quality = clamp((s.quality||50) + 0.15, 5, 98);
    } else {
      // balanced
      unitDelta = Math.round((sub.units||0) * (0.003 + Math.random()*0.006));
      moraleD = -0.2; qualD = 0.1;
    }

    // 管理料率は統治・反発の指標として残す。
    // 連結・完全子会社の契約台数は既に本体売上に含まれるため、
    // 管理料を現金加算すると二重計上になる（内部取引は連結上相殺）。
    const notionalFee = Math.round(rev * feeRate);
    sub.lastDividend = notionalFee;
    sub.mgmtFeeRate = feeRate; // 方針反映後の実効レートを保持

    const ot = sub.ownershipType || 'full';
    const pctOwn = (sub.ownershipPct != null ? sub.ownershipPct : 100) / 100;

    // 連結子会社（持分<100%）で回収重視のとき: 非支配株主への配当が外部流出
    // （グループ全体の営業CFは本体損益に既に含まれる。NCI配当だけがグループ外への現金減）
    if(ot === 'consolidated' && pctOwn < 0.995 && pol.id === 'harvest'){
      const subQProfit = Math.max(0, rev * SUBSIDIARY_ASSUMED_MARGIN);
      const nciDiv = Math.round(subQProfit * (1 - pctOwn) * 0.55);
      if(nciDiv > 0){
        const pay = Math.min(Math.max(0, s.cash), nciDiv);
        s.cash -= pay;
        mgmtIncome -= pay; // ログ用に純額を記録（負＝外部流出）
      }
    }
    // 完全子会社・通常の連結: 管理料の現金加算なし（相殺）

    sub.localMorale = clamp((sub.localMorale||60) + moraleD + (Math.random()*1.2-0.4), 15, 95);
    sub.localQuality = clamp((sub.localQuality||55) + qualD + (Math.random()*0.8-0.3), 15, 95);
    sub.autonomy = clamp((sub.autonomy||50) + autoD, 5, 95);

    // 親会社圧力（回収方針・高い管理料）を反発システムへ
    let pExtra = 0;
    if(pol.id==='harvest') pExtra += 3;
    if(pol.id==='absorb') pExtra += 2;
    if(feeRate > 0.04) pExtra += 2;
    if(typeof processSubsidiaryBacklash==='function') processSubsidiaryBacklash(s, sub, logs, pExtra);

    // 台数増減を本体ポートフォリオへ反映
    if(unitDelta > 0){
      const rid = sub.regionId || (REGIONS[0]&&REGIONS[0].id);
      if(rid){
        s.regionUnits[rid] = (s.regionUnits[rid]||0) + unitDelta;
        s.units = Object.values(s.regionUnits).reduce((a,b)=>a+b,0);
        sub.units = (sub.units||0) + unitDelta;
      }
    } else if(unitDelta < 0){
      const lost = Math.min(sub.units||0, -unitDelta);
      if(lost>0){
        if(typeof removeUnitsFromPortfolio==='function'){
          removeUnitsFromPortfolio(s, lost, sub.regionId||null);
        }
        sub.units = Math.max(0, (sub.units||0) - lost);
      }
    }

    // 現地品質が本体に波及（規模加重）
    const w = clamp((sub.units||0) / Math.max(1, s.units||1), 0, 0.25);
    if((sub.localQuality||50) < 40){
      s.quality = clamp((s.quality||50) - w*1.2, 5, 98);
      s.satisfaction = clamp((s.satisfaction||60) - w*0.8, 5, 98);
    } else if((sub.localQuality||50) > 70){
      s.quality = clamp((s.quality||50) + w*0.4, 5, 98);
    }

    // 低士気イベント
    if((sub.localMorale||60) < 32 && Math.random() < 0.28){
      const quitU = Math.max(1, Math.round((sub.units||0)*0.015));
      if(typeof removeUnitsFromPortfolio==='function') removeUnitsFromPortfolio(s, quitU, sub.regionId||null);
      sub.units = Math.max(0, (sub.units||0) - quitU);
      logs.push({text:`【子会社】${sub.name}で現場の離反が起き、約${num(quitU)}台が流出した。`, tag:'warn'});
    }
    if((sub.localMorale||60) < 28 && Math.random() < 0.12){
      logs.push({text:`【子会社】${sub.name}の${sub.president||'社長'}周辺で内部不満が表面化している。`, tag:'warn'});
    }
  });
  if(mgmtIncome < 0 && Math.random() < 0.5){
    logs.push({text:`連結子会社の非支配株主へ配当相当 ${yen(Math.round(-mgmtIncome))} を支払い、グループ外へ現金が流出した。`, tag:'warn'});
  }

  // 持分法適用会社の台数は本体に取り込まない（関連会社としてオフバランス成長）
  (s.equityMethodHoldings||[]).forEach(eq=>{
    if(Math.random() < 0.4){
      const baseU = eq.units || 0;
      // ライバルが存続していればその成長に追随
      const liveRival = eq.rivalId ? (s.rivals||[]).find(r=>r.id===eq.rivalId) : null;
      if(liveRival && liveRival.units != null){
        eq.units = liveRival.units;
      } else {
        const g = Math.round(baseU * (0.004 + Math.random()*0.01));
        eq.units = baseU + g;
      }
    }
  });
}
function doSetSubPolicy(subId, policyId){
  const s = state;
  const sub = (s.subsidiaries||[]).find(x=>x.id===subId);
  if(!sub || !SUB_POLICIES[policyId]) return;
  if(sub.integrating){
    pushLog(s, `${sub.name}は統合中のため、本格的な運営方針はPMI完了後に効く。仮設定は可能。`, 'info');
  }
  sub.policy = policyId;
  pushLog(s, `${sub.name}の運営方針を「${SUB_POLICIES[policyId].label}」にした。`, 'info');
  render(); autoSave();
}
function doReplaceSubPresident(subId){
  const s = state;
  const sub = (s.subsidiaries||[]).find(x=>x.id===subId);
  if(!sub) return;
  const cost = 2000000;
  if(cost > s.cash){ pushLog(s, '社長交代の費用が不足している。', 'warn'); render(); return; }
  s.cash -= cost;
  const old = sub.president;
  ensureSubsidiaryFields(sub);
  sub.president = randomPersonName();
  // 従来の「社長交代」は本社派遣寄り
  sub.expatPresident = true;
  sub.presidentStyle = Math.random()<0.4 ? 'autocrat' : 'hq';
  sub.resentment = clamp((sub.resentment||20)+6, 0, 100);
  sub.localMorale = clamp((sub.localMorale||60) - 6, 15, 95);
  sub.autonomy = clamp((sub.autonomy||50) - 5, 5, 95);
  pushLog(s, `${sub.name}の社長を${old}から${sub.president}に交代した（費用 ${yen(cost)}）。現場に一時的な動揺。`, 'info');
  pushCompanyChronicle(s, `${sub.name}社長交代 ${old}→${sub.president}`, 'info');
  render(); autoSave();
}
function doInjectSubCapital(subId){
  const s = state;
  const sub = (s.subsidiaries||[]).find(x=>x.id===subId);
  if(!sub) return;
  const amount = Math.round(Math.max(1500000, subImpliedQuarterlyRev(sub) * 0.8));
  if(amount > s.cash){ pushLog(s, '増強資金が不足している。', 'warn'); render(); return; }
  s.cash -= amount;
  sub.localMorale = clamp((sub.localMorale||60)+4, 15, 95);
  sub.localQuality = clamp((sub.localQuality||55)+2, 15, 95);
  const add = Math.max(3, Math.round((sub.units||0)*0.02));
  const rid = sub.regionId || REGIONS[0].id;
  s.regionUnits[rid] = (s.regionUnits[rid]||0) + add;
  s.units = Object.values(s.regionUnits).reduce((a,b)=>a+b,0);
  sub.units = (sub.units||0) + add;
  pushLog(s, `${sub.name}に ${yen(amount)} を投じ、営業・品質を補強した（+${num(add)}台相当）。`, 'good');
  render(); autoSave();
}
function doExtractSubDividend(subId){
  const s = state;
  const sub = (s.subsidiaries||[]).find(x=>x.id===subId);
  if(!sub) return;
  ensureSubsidiaryFields(sub);
  const amount = Math.round(subImpliedQuarterlyRev(sub) * 0.35);
  const ot = sub.ownershipType || 'full';
  const pctOwn = (sub.ownershipPct != null ? sub.ownershipPct : 100) / 100;

  // 連結上、子会社の営業CFは既に本体現金に含まれている。
  // 特別配当の経済効果:
  // - 完全子会社: グループ内振替のため連結現金は増えない（反発のみ）
  // - 連結子会社: 親の持分はグループ内、非支配株主持分相当が外部流出
  if(ot === 'full' || pctOwn >= 0.995){
    sub.lastDividend = (sub.lastDividend||0) + amount;
    sub.localMorale = clamp((sub.localMorale||60)-5, 15, 95);
    sub.autonomy = clamp((sub.autonomy||50)-3, 5, 95);
    sub.resentment = clamp((sub.resentment||20)+12, 0, 100);
    sub.parentPressure = (sub.parentPressure||0)+8;
    pushLog(s, `${sub.name}（完全子会社）へ特別配当を指示した。グループ内振替のため連結現金は増えず、現地の反発だけが残った。`, 'warn');
  } else {
    const nciOut = Math.round(amount * (1 - pctOwn));
    const pay = Math.min(Math.max(0, s.cash), nciOut);
    s.cash -= pay;
    sub.lastDividend = (sub.lastDividend||0) + amount;
    sub.localMorale = clamp((sub.localMorale||60)-5, 15, 95);
    sub.autonomy = clamp((sub.autonomy||50)-3, 5, 95);
    sub.resentment = clamp((sub.resentment||20)+12, 0, 100);
    sub.parentPressure = (sub.parentPressure||0)+8;
    pushLog(s, `${sub.name}で特別配当を実施。親会社持分はグループ内、非支配株主持分相当 ${yen(pay)} が外部へ流出した。現地の反発が強まった。`, 'warn');
  }
  render(); autoSave();
}
function doMergeSubsidiary(subId){
  const s = state;
  const sub = (s.subsidiaries||[]).find(x=>x.id===subId);
  if(!sub) return;
  // 統合中でも吸収可能（コスト増・士気低下）
  let cost = Math.round(800000 + (sub.units||0)*200);
  if(sub.integrating){
    cost = Math.round(cost * 1.6);
  }
  // 連結持分が100%未満でも吸収可能（少数株主の現金対価を加算）
  const pct = sub.ownershipPct!=null ? sub.ownershipPct : 100;
  if(pct < 99){
    const minorityBuy = Math.round((sub.units||0) * (SUBSIDIARY_ASSUMED_FEE||1400000) * ((100-pct)/100) * 0.5);
    cost += minorityBuy;
  }
  if(cost > s.cash){
    pushLog(s, `吸収合併の費用が不足（必要 ${yen(cost)}）。現金を確保してから実行。`, 'warn');
    render(); return;
  }
  s.cash -= cost;
  s.morale = clamp((s.morale||60) - (sub.integrating?5:2), 5, 95);
  // 統合中フラグ解除
  sub.integrating = false;
  if(s.pmiJobs){
    s.pmiJobs.forEach(j=>{
      if(j.subId===subId && j.status==='active') j.status = 'done';
    });
  }
  pushLog(s, `${sub.name}を本体に吸収合併した（費用 ${yen(cost)}）。契約は本体直轄として存続し、子会社としての独立運営は終了。`, 'good');
  pushCompanyChronicle(s, `${sub.name}を吸収合併`, 'milestone');
  s.subsidiaries = (s.subsidiaries||[]).filter(x=>x.id!==subId);
  if(typeof s.lastKeyword!=='undefined') s.lastKeyword = 'ロールアップ';
  render(); autoSave();
}
function estimateSubsidiarySalePrice(s, sub){
  ensureSubsidiaryFields(sub);
  const units = Math.max(0, sub.units||0);
  const fee = SUBSIDIARY_ASSUMED_FEE || 1400000;
  // 台数×想定年額×倍率（品質・士気・持分・統合状況で補正）
  let mult = 0.55;
  mult += ((sub.localQuality||55) - 50) / 200;
  mult += ((sub.localMorale||60) - 50) / 250;
  const ot = OWNERSHIP_TYPES[sub.ownershipType||'full'];
  const ownPct = ot && ot.pct != null ? ot.pct/100 : 1;
  mult *= (0.55 + ownPct * 0.45); // 持分が薄いと安い
  if(sub.integrating) mult *= 0.72;
  if(sub.policy==='harvest') mult *= 0.9;
  if(sub.policy==='quality') mult *= 1.05;
  if(sub.policy==='growth') mult *= 1.03;
  // 本体の評判・市況
  mult *= (0.9 + ((s.reputation||50)/100)*0.2);
  if(s.isListed) mult *= 1.04;
  const price = Math.round(units * fee * mult);
  return Math.max(500000, price);
}
function doSellSubsidiary(subId, opts){
  opts = opts||{};
  const s = state;
  const sub = (s.subsidiaries||[]).find(x=>x.id===subId);
  if(!sub) return;
  if((sub.units||0) <= 0){
    pushLog(s, `${sub.name}に売却可能な契約台数がほぼない。`, 'warn');
    render(); return;
  }
  const price = estimateSubsidiarySalePrice(s, sub);
  const units = sub.units||0;
  // 確認はUI側。ここは実行
  // 台数を本体から切り離す
  const removed = (typeof removeUnitsFromPortfolio==='function')
    ? removeUnitsFromPortfolio(s, units, sub.regionId||null)
    : units;
  if(!(typeof removeUnitsFromPortfolio==='function')){
    s.units = Math.max(0, (s.units||0) - units);
  }
  // セグメント側のずれを抑えるため、removeが一部だけならログ
  s.cash += price;
  // 事務・仲介の軽い費用
  const fee = Math.round(price * 0.02 + 300000);
  s.cash -= Math.min(s.cash, fee);
  const net = price - Math.min(price, fee);

  // PMI中ならジョブ終了
  if(s.pmiJobs){
    s.pmiJobs.forEach(j=>{
      if(j.subId===subId || j.id===sub.pmiId){
        if(j.status==='active') j.status = 'done';
      }
    });
  }
  // 競合が買うこともある（世界感）
  let buyerNote = '独立系・投資ファンド等の買い手';
  if((s.rivals||[]).length && Math.random() < 0.45){
    const buyer = s.rivals[Math.floor(Math.random()*s.rivals.length)];
    const gain = Math.round(units * 0.9);
    const rid = sub.regionId || (REGIONS[0]&&REGIONS[0].id);
    if(rid){
      buyer.regionUnits = buyer.regionUnits || {};
      buyer.regionUnits[rid] = (buyer.regionUnits[rid]||0) + gain;
      buyer.units = Object.values(buyer.regionUnits).reduce((a,b)=>a+b,0);
    } else {
      buyer.units = (buyer.units||0) + gain;
    }
    buyer.vitality = clamp((buyer.vitality||60)+3, 5, 98);
    buyerNote = buyer.name;
    pushLog(s, `売却した契約の受け皿として${buyer.name}が台数を伸ばした。`, 'warn');
  }

  s.reputation = clamp((s.reputation||50) - (sub.integrating?2:1), 5, 98);
  s.morale = clamp((s.morale||60) - 1, 5, 95);
  if(s.marketTrust!=null) s.marketTrust = clamp(s.marketTrust - (s.isListed?1:0), 5, 98);

  pushLog(s, `${sub.name}を売却した（契約 約${num(units)}台／売却額 ${yen(price)}／諸費用 ${yen(fee)}／手取り目安 ${yen(net)}／買い手: ${buyerNote}）。`, 'good');
  pushCompanyChronicle(s, `${sub.name}を売却（${num(units)}台・${yen(price)}）`, 'milestone');

  s.subsidiaries = (s.subsidiaries||[]).filter(x=>x.id!==subId);
  render(); autoSave();
}
function openSellSubsidiaryModal(subId){
  const s = state;
  const sub = (s.subsidiaries||[]).find(x=>x.id===subId);
  if(!sub) return;
  const price = estimateSubsidiarySalePrice(s, sub);
  const fee = Math.round(price * 0.02 + 300000);
  const ot = OWNERSHIP_TYPES[sub.ownershipType||'full'];
  stopTimer();
  modal = {
    type:'choice',
    title:`子会社売却：${sub.name}`,
    body:`${sub.name}（${sub.regionName||'—'}・${num(sub.units)}台・${ot?ot.label:'子会社'}）をグループ外に売却する。

想定売却額 ${yen(price)}
仲介・事務費用 約 ${yen(fee)}
手取り目安 ${yen(price-fee)}

売却すると当該契約台数は本体の保有・連結から外れる。${sub.integrating?'統合中のため估值は割り引かれている。':''}
買い手は市場または競合になる場合がある。`,
    options:[
      {label:`売却を実行する（手取り目安 ${yen(price-fee)}）`, onClick:()=>{
        modal = null;
        doSellSubsidiary(subId);
        if(!state.gameOver) startTimer();
      }},
      {label:'キャンセル', onClick:()=>{
        modal = null;
        if(!state.gameOver) startTimer();
        render();
      }},
    ]
  };
  render();
}



function estimateEquityUpgradeCost(s, eq, targetKey){
  const target = OWNERSHIP_TYPES[targetKey];
  if(!target || targetKey==='equity') return null;
  const cur = Math.max(0, eq.ownershipPct||30);
  const need = Math.max(0, target.pct - cur);
  if(need <= 0) return null;
  // ライブの競合台数があればそれを使う
  let units = Math.max(0, eq.units||0);
  if(eq.rivalId){
    const live = (s.rivals||[]).find(r=>r.id===eq.rivalId);
    if(live) units = live.units||units;
  }
  const base = units * (SUBSIDIARY_ASSUMED_FEE||1400000);
  // 追加持分の対価（企業価値×追加比率）。以前より現実的に圧縮
  let mult = 0.45 + need/100 * 0.35;
  if(targetKey==='full') mult *= 1.08;
  if(eq.rivalId && (s.rivals||[]).some(r=>r.id===eq.rivalId)) mult *= 1.05;
  return Math.round(base * (need/100) * mult);
}
function dedupeEquityHoldings(s){
  if(!s.equityMethodHoldings || !s.equityMethodHoldings.length) return;
  const map = {};
  const out = [];
  s.equityMethodHoldings.forEach(eq=>{
    const key = eq.rivalId || ('name:'+eq.name);
    if(map[key]){
      const a = map[key];
      a.ownershipPct = Math.min(49, (a.ownershipPct||0) + (eq.ownershipPct||0));
      a.units = Math.max(a.units||0, eq.units||0);
      if(eq.rivalId) a.rivalId = eq.rivalId;
    } else {
      map[key] = eq;
      out.push(eq);
    }
  });
  // 49%超は持分法のまま残さず、表示上は49%キャップ（引き上げは連結化ボタンへ）
  out.forEach(eq=>{ if((eq.ownershipPct||0)>49) eq.ownershipPct = 49; });
  s.equityMethodHoldings = out;
}
/** 持分法適用会社 → 連結子会社 / 完全子会社 */
function doUpgradeEquityHolding(eqId, targetKey){
  const s = state;
  const eq = (s.equityMethodHoldings||[]).find(x=>x.id===eqId);
  if(!eq) return;
  if(targetKey!=='consolidated' && targetKey!=='full'){
    pushLog(s, '連結子会社または完全子会社のみ選択できる。', 'warn');
    render(); return;
  }
  const target = OWNERSHIP_TYPES[targetKey];
  const cost = estimateEquityUpgradeCost(s, eq, targetKey);
  if(cost==null){
    pushLog(s, 'これ以上の持分引き上げは不要、または対象外。', 'info');
    render(); return;
  }
  if(cost > s.cash){
    pushLog(s, `追加取得に必要な資金が不足している（必要 ${yen(cost)}）。`, 'warn');
    render(); return;
  }
  s.cash -= cost;

  // 競合として残っている場合は市場から退場させ、台数を取り込む
  let units = eq.units||0;
  let regionId = null;
  const rival = eq.rivalId ? (s.rivals||[]).find(r=>r.id===eq.rivalId) : null;
  if(rival){
    units = rival.units||units;
    // 地域配分を取り込み
    REGIONS.forEach(rg=>{
      const u = rival.regionUnits[rg.id]||0;
      if(u>0){
        s.regionUnits[rg.id] = (s.regionUnits[rg.id]||0) + u;
        if((s.regionBranches[rg.id]||0)===0) s.regionBranches[rg.id] = 1;
      }
    });
    s.units = Object.values(s.regionUnits).reduce((a,b)=>a+b,0);
    // 最大拠点を regionId に
    let bestU=0;
    REGIONS.forEach(rg=>{
      const u = rival.regionUnits[rg.id]||0;
      if(u>bestU){ bestU=u; regionId=rg.id; }
    });
    s.rivals = s.rivals.filter(r=>r.id!==rival.id);
    if(s.alliances && s.alliances[rival.id]) delete s.alliances[rival.id];
    pushLog(s, `${rival.name}は連結・完全子会社化に伴い競合としては市場から退場した。`, 'info');
  } else {
    // 台数はこれまでオフバランス → オンバランス化
    const rg = REGIONS.find(r=>r.name===eq.regionName) || REGIONS[Math.floor(Math.random()*REGIONS.length)];
    regionId = rg.id;
    s.regionUnits[regionId] = (s.regionUnits[regionId]||0) + units;
    s.units = Object.values(s.regionUnits).reduce((a,b)=>a+b,0);
    if((s.regionBranches[regionId]||0)===0){
      s.regionBranches[regionId] = 1;
      s.branches = (s.branches||0) + 1;
    }
    // セグメントへ薄く配分
    const segIds = typeof SEGMENT_IDS!=='undefined' ? SEGMENT_IDS : Object.keys(s.segmentUnits||{});
    if(segIds.length){
      segIds.forEach((id,i)=>{
        const add = Math.floor(units / segIds.length) + (i===0 ? units % segIds.length : 0);
        s.segmentUnits[id] = (s.segmentUnits[id]||0) + add;
      });
    }
  }

  const techsGained = Math.round(units / (C.TECH_CAPACITY||40) * 0.75);
  s.techs += techsGained;
  if(typeof ensureInspectors==='function'){
    ensureInspectors(s);
    s.inspectors = Math.min(s.techs, (s.inspectors||0) + Math.round(techsGained * 0.35));
  }

  const region = REGIONS.find(r=>r.id===regionId);
  const sub = {
    id: 'sub'+Date.now()+Math.floor(Math.random()*999),
    name: eq.name,
    regionId: regionId,
    regionName: region ? region.name : (eq.regionName||'—'),
    units: units,
    acquiredYear: s.year,
    president: eq.president || randomPersonName(),
    ownershipType: targetKey,
    ownershipPct: target.pct,
  };
  if(typeof ensureSubsidiaryFields==='function') ensureSubsidiaryFields(sub);
  s.subsidiaries = s.subsidiaries || [];
  s.subsidiaries.push(sub);
  // 同一社の重複持分法エントリもまとめて除去
  s.equityMethodHoldings = (s.equityMethodHoldings||[]).filter(x=>{
    if(x.id===eqId) return false;
    if(eq.rivalId && x.rivalId===eq.rivalId) return false;
    if(x.name===eq.name) return false;
    return true;
  });

  pushLog(s, `${eq.name}を追加取得し、${target.label}とした（追加出資 ${yen(cost)}／台数 約${num(units)}台を連結）。`, 'good');
  pushCompanyChronicle(s, `${eq.name}を${target.label}へ引き上げ`, 'milestone');

  if(typeof createPmiJob==='function'){
    const pmi = createPmiJob(s, sub, {techsGained, hostile:false});
    stopTimer();
    modal = buildPmiModal(pmi);
    if(modal){
      modal.title = `持分引き上げ → PMI：${sub.name}`;
      modal.body = `${eq.name}を持分法から${target.label}へ移行した。` + (modal.body||'');
    }
  }
  render(); autoSave();
}
/** 連結子会社（51%）→ 完全子会社（100%） */
function doUpgradeSubsidiaryToFull(subId){
  const s = state;
  const sub = (s.subsidiaries||[]).find(x=>x.id===subId);
  if(!sub) return;
  if((sub.ownershipType||'full')==='full' || (sub.ownershipPct||100) >= 100){
    pushLog(s, 'すでに完全子会社である。', 'info');
    render(); return;
  }
  const units = sub.units||0;
  const needPct = 100 - (sub.ownershipPct||51);
  const cost = Math.round(units * (SUBSIDIARY_ASSUMED_FEE||1400000) * (needPct/100) * 0.75);
  if(cost > s.cash){
    pushLog(s, `完全子会社化の追加取得資金が不足（必要 ${yen(cost)}）。`, 'warn');
    render(); return;
  }
  s.cash -= cost;
  sub.ownershipType = 'full';
  sub.ownershipPct = 100;
  pushLog(s, `${sub.name}の残持分を取得し、完全子会社とした（${yen(cost)}）。`, 'good');
  pushCompanyChronicle(s, `${sub.name}を完全子会社化`, 'milestone');
  render(); autoSave();
}

/** 市場分析インテリジェンス */
function computeMarketIntel(s){
  const mat = typeof marketMaturity==='function' ? marketMaturity(s) : 0;
  const tot = Math.max(1, s.marketTotal||1);
  const myShare = marketShare(s.units, s);
  const freePool = typeof pool==='function' ? pool(s) : Math.max(0, tot - (s.units||0));
  const rivals = (s.rivals||[]).slice().sort((a,b)=>(b.units||0)-(a.units||0));
  const leader = rivals[0];
  const leaderUnits = leader ? leader.units : 0;
  const leaderShare = leader ? marketShare(leaderUnits, s) : 0;
  const gapToLeader = Math.max(0, leaderUnits - (s.units||0));
  const rank = 1 + rivals.filter(r=>(r.units||0) > (s.units||0)).length;
  const rivalPrices = rivals.map(r=>r.price||0).filter(p=>p>0);
  const avgRivalPrice = rivalPrices.length ? rivalPrices.reduce((a,b)=>a+b,0)/rivalPrices.length : (s.price||0);
  const pricePos = avgRivalPrice>0 ? (s.price||0)/avgRivalPrice : 1;
  const pressure = s.competitivePressure!=null ? s.competitivePressure : (typeof competitivePressure==='function'?competitivePressure(s):0.5);
  const cycle = s.cycle || 'normal';

  // 地方別
  const regions = REGIONS.map(rg=>{
    const rid = rg.id;
    const mine = s.regionUnits[rid]||0;
    const mkt = typeof regionMarket==='function' ? regionMarket(s, rid) : (rg.weight||0.1)*tot;
    let rivalU = 0, topRival = null, topU = 0;
    rivals.forEach(r=>{
      const u = (r.regionUnits&&r.regionUnits[rid])||0;
      rivalU += u;
      if(u > topU){ topU = u; topRival = r; }
    });
    const org = mine + rivalU;
    const free = Math.max(0, mkt - org);
    const myRShare = mkt>0 ? mine/mkt : 0;
    const gap = Math.max(0, topU - mine);
    const hasBranch = (s.regionBranches[rid]||0)>0;
    const mgr = s.branchManagers && s.branchManagers[rid];
    // 機会スコア: 空き＋自社シェア低＋支店ありで伸びしろ
    let opp = free/Math.max(1,mkt) * 40 + (0.35 - Math.min(0.35, myRShare)) * 80;
    if(hasBranch) opp += 8;
    if(mgr) opp += 4 + (mgr.skill||50)*0.05;
    if(gap > mine && mine > 0) opp += 6; // 首位との差が攻めどころ
    if(!hasBranch && free > 500) opp += 5;
    // 脅威: 予兆・大競合の厚み
    let threat = 0;
    rivals.forEach(r=>{
      const u = (r.regionUnits&&r.regionUnits[rid])||0;
      if(u <= 0) return;
      threat += u / Math.max(1,mkt) * 20;
      (r.pendingPlans||[]).forEach(p=>{
        if(p.regionId===rid || !p.regionId) threat += 8;
      });
    });
    return {
      id: rid, name: rg.name, mine, mkt, free, myRShare, gap, topRival, topU,
      hasBranch, mgr, opp: Math.round(opp), threat: Math.round(threat),
    };
  });
  regions.sort((a,b)=>b.opp-a.opp);

  // 脅威ライバル
  const threats = rivals.map(r=>{
    let score = 0;
    score += marketShare(r.units,s) * 40;
    if((r.vitality||60) > 65) score += 8;
    if(r.style==='discount') score += 6;
    if(r.style==='rollup') score += 7;
    score += (r.pendingPlans||[]).length * 10;
    if(typeof isAlliedWith==='function' && isAlliedWith(s, r.id)) score -= 15;
    if(s.truceRivalId===r.id && (s.turn||0)<=(s.truceUntilTurn||0)) score -= 12;
    return {r, score: Math.round(clamp(score,0,100))};
  }).sort((a,b)=>b.score-a.score);

  // 推奨
  const tips = [];
  if(mat >= 0.55) tips.push('市場は成熟。有機成長よりブロック譲受・M&A・首位の弱い地方の侵食が主戦場。');
  if(pricePos > 1.12) tips.push(`単価が競合平均より約${pct(pricePos-1,0)}高い。競争圧力${pct(pressure,0)}と解約に注意。`);
  else if(pricePos < 0.92) tips.push('単価は競合より低い。利益率を犠牲にしている可能性がある。');
  if(pressure > 0.75) tips.push('価格競争圧力が高い。品質・フルメンテ比率・提携で差別化を。');
  if(regions[0] && regions[0].opp >= 25) tips.push(`機会の大きい地方: ${regions.slice(0,2).map(x=>x.name).join('・')}（支店・集中応援・営業投資の候補）。`);
  if(threats[0] && threats[0].score >= 40) tips.push(`最大の脅威: ${threats[0].r.name}（脅威指数${threats[0].score}）。予兆と単価を監視。`);
  if(gapToLeader > 5000 && rank===2) tips.push(`首位${leader?leader.name:''}まであと約${num(gapToLeader)}台。地方の厚みか再編が鍵。`);
  if(freePool < tot * 0.08) tips.push('未組織プールが細い。成長は競合からの奪取が中心になる。');
  if(!tips.length) tips.push('大きな歪みは見えない。品質と地方の積み上げを継続。');

  // 自社トレンド
  let unitTrend = 0, shareTrend = 0;
  if((s.history||[]).length >= 4){
    const h = s.history;
    unitTrend = (h[h.length-1].units||0) - (h[h.length-4].units||0);
    // share approx
  }

  return {
    mat, freePool, myShare, leader, leaderShare, gapToLeader, rank,
    avgRivalPrice, pricePos, pressure, cycle, regions, threats, tips, unitTrend,
  };
}

function marketResearchLevel(s){
  const b = Math.max(0, s.marketResearchBudget||0);
  if(b >= 4000000) return 3;
  if(b >= 1500000) return 2;
  if(b >= 500000) return 1;
  return 0;
}
function marketResearchLevelLabel(lv){
  return ({0:'調査なし', 1:'基礎調査', 2:'標準調査', 3:'深層調査'})[lv] || '調査なし';
}
function marketResearchLevelDesc(lv){
  return ({
    0: '社名とおおよその規模感のみ（公開情報レベル）',
    1: '推定台数・シェア・経営スタイル・単価',
    2: '＋品質・活力・提携／休戦・大まかな意図',
    3: '＋予兆・直近の動き・子会社・脅威指数の詳細',
  })[lv] || '';
}

function renderRivalWatchPanel(){
  const s = state;
  if(s.marketResearchBudget==null) s.marketResearchBudget = 0;
  const lv = marketResearchLevel(s);
  const panel = el('div',{class:'panel'});
  panel.appendChild(el('h2',{}, '他社動向', el('span',{class:'eyebrow'}, 'マーケット調査班')));
  panel.appendChild(el('div',{class:'desc'},
    '調査班への四半期予算で、競合の開示深度が変わる。予算は毎四半期現金から差し引かれる。競合は品質・稼働・単価・薄地の弱みを突いてくる。休戦・提携の破棄やメーカー系列争奪も起こる。'));

  // 外交通告
  if(s._pendingDiplomacy){
    const p = s._pendingDiplomacy;
    const rival = (s.rivals||[]).find(r=>r.id===p.rivalId);
    const box = el('div',{class:'action-block', style:'border-color:var(--amber);'});
    box.appendChild(el('div',{class:'title'}, '外交通告（要対応）'));
    box.appendChild(el('div',{class:'desc'},
      `${rival?rival.name:'相手'}が${p.kind==='truce'?'休戦':'業務提携'}条件の見直しを要求（${yen(p.demand)}）。拒否すると破棄リスクが上がる。`));
    const row = el('div',{class:'btn-row'});
    row.appendChild(el('button',{class:'btn btn-small btn-primary', onclick:()=>doRespondDiplomacy(true)}, '受け入れる'));
    row.appendChild(el('button',{class:'btn btn-small', onclick:()=>doRespondDiplomacy(false)}, '拒否する'));
    box.appendChild(row);
    panel.appendChild(box);
  }

  // 自社の弱み（プレイヤー向けヒント）
  if(typeof analyzePlayerWeaknesses==='function'){
    const w = analyzePlayerWeaknesses(s);
    const tips = [];
    if(w.global.quality) tips.push('品質低め');
    if(w.global.overUtil) tips.push('稼働超過');
    if(w.global.highPrice) tips.push('高単価');
    if(w.global.lowMorale) tips.push('士気低め');
    const weakRegs = REGIONS.filter(rg=>(w.regions[rg.id]||0)>=10).map(rg=>rg.name);
    if(tips.length || weakRegs.length){
      const box = el('div',{class:'action-block'});
      box.appendChild(el('div',{class:'title'}, '競合から見た御社の隙'));
      box.appendChild(el('div',{class:'field-hint'},
        (tips.length?('全体: '+tips.join('・')+'。 '):'') +
        (weakRegs.length?('狙われやすい地方: '+weakRegs.join('、')+'。'):'大きな地方弱点は見えていない。')
      ));
      panel.appendChild(box);
    }
  }

  // 予算設定
  const budgetSel = el('select',{style:'margin:4px 0;'});
  [
    [0, '調査なし（0円/四半期）'],
    [500000, '基礎調査（50万円/四半期）'],
    [1500000, '標準調査（150万円/四半期）'],
    [4000000, '深層調査（400万円/四半期）'],
  ].forEach(([v,lab])=>{
    budgetSel.appendChild(el('option',{value:String(v)}, lab));
  });
  budgetSel.value = String(
    (s.marketResearchBudget||0) >= 4000000 ? 4000000 :
    (s.marketResearchBudget||0) >= 1500000 ? 1500000 :
    (s.marketResearchBudget||0) >= 500000 ? 500000 : 0
  );
  budgetSel.onchange = ()=>{
    s.marketResearchBudget = Number(budgetSel.value)||0;
    pushLog(s, `マーケット調査班の予算を「${marketResearchLevelLabel(marketResearchLevel(s))}」に設定した（${yen(s.marketResearchBudget)}/四半期）。`, 'info');
    render(); autoSave();
  };
  panel.appendChild(el('div',{class:'field-row'}, el('label',{},'調査予算'), budgetSel));
  panel.appendChild(el('div',{class:'field-hint'},
    `現在: ${marketResearchLevelLabel(lv)} — ${marketResearchLevelDesc(lv)}`));

  if(!s.rivals.length){
    panel.appendChild(el('div',{class:'field-hint'}, '主要な独立系競合は市場から退場済み。'));
    return panel;
  }

  const intel = (lv >= 2 && typeof computeMarketIntel==='function') ? computeMarketIntel(s) : null;
  const threatMap = {};
  if(intel) intel.threats.forEach(t=>{ threatMap[t.r.id] = t.score; });

  s.rivals.slice().sort((a,b)=>b.units-a.units).forEach(r=>{
    const card = el('div',{class:'action-block'});
    const styleLabel = ({incumbent:'地場大手型', rollup:'M&A成長型', discount:'価格訴求型'})[r.style] || r.style;
    if(lv === 0){
      // 公開情報レベル
      const rough = (r.units||0) >= 50000 ? '大型' : (r.units||0) >= 15000 ? '中堅' : '中小';
      card.appendChild(el('div',{class:'title'}, r.name));
      card.appendChild(el('div',{class:'desc'}, `規模感: ${rough}クラス（詳細は調査予算が必要）`));
      panel.appendChild(card);
      return;
    }
    // level 1+
    const th = lv >= 3 ? threatMap[r.id] : null;
    card.appendChild(el('div',{class:'title'}, `${r.name}　${styleLabel}`+(th!=null?`　脅威${th}`:'')));
    const vs = (s.units||0) - (r.units||0);
    let line = `推定台数 ${num(r.units)}（自社比 ${vs>=0?'+':''}${num(vs)}）／シェア ${pct(marketShare(r.units,s),1)}／単価 ${yen(r.price)}`;
    if(lv >= 2){
      line += `／品質 ${Math.round(r.quality)}／活力 ${Math.round(r.vitality||60)}`;
    }
    card.appendChild(el('div',{class:'desc'}, line));
    if(lv >= 2){
      const allied = typeof isAlliedWith==='function' && isAlliedWith(s, r.id);
      const truce = s.truceRivalId===r.id && (s.turn||0)<=(s.truceUntilTurn||0);
      if(allied || truce){
        card.appendChild(el('div',{class:'field-hint'}, (allied?'業務提携中':'')+(allied&&truce?'／':'')+(truce?'休戦協定中':'')));
      }
      if(r.intent){
        card.appendChild(el('div',{class:'field-hint', style:'color:var(--amber);'}, `意図（推定）: ${r.intent}`));
      }
    }
    if(lv >= 3){
      if(r.pendingPlans && r.pendingPlans.length){
        const prep = r.pendingPlans.map(p=>{
          const lab = (typeof rivalPlanLabel==='function') ? rivalPlanLabel(p) : p.type;
          return `${lab}（あと${p.ticksLeft}Q）`;
        }).join('／');
        card.appendChild(el('div',{class:'field-hint', style:'color:#e8a05c;'}, `予兆: ${prep}`));
      }
      if(r.lastMoves && r.lastMoves.length){
        card.appendChild(el('div',{class:'field-hint'}, `直近の動き: ${r.lastMoves.join('、')}`));
      }
      if(r.subsidiaries && r.subsidiaries.length){
        card.appendChild(el('div',{class:'field-hint'}, `子会社・統合 ${r.subsidiaries.length}件（直近: ${r.subsidiaries[r.subsidiaries.length-1].name}）`));
      }
    } else if(lv === 2){
      card.appendChild(el('div',{class:'field-hint'}, '予兆・子会社の詳細は深層調査（400万円/四半期）で開示。'));
    } else {
      card.appendChild(el('div',{class:'field-hint'}, '品質・活力・意図は標準調査以上で開示。'));
    }
    panel.appendChild(card);
  });
  return panel;
}

      el('td',{style:'font-size:10px;'}, leaderName.replace('株式会社','')),
      el('td',{}, myBranchCount>0?(myBranchCount+'拠点'):'未進出'),

    // シェア表と同じ地方順（REGIONS順）で表示

      else if(row.opp >= 30) comment = '拡大候補';
      else if(row.threat >= 25) comment = '防衛優先';
      else if(!row.hasBranch && row.free > 400) comment = '進出検討';
      ot.appendChild(el('tr',{},
        el('td',{}, row.name),
        el('td',{}, num(Math.round(row.free))+'台'),
        el('td',{}, row.gap>0?num(row.gap)+'台':'—'),
        el('td',{style: row.opp>=30?'color:var(--green)':''}, String(row.opp)),
        el('td',{style: row.threat>=25?'color:var(--red)':''}, String(row.threat)),
        el('td',{style:'font-size:10px;'}, comment),
      ));
    });
    panel.appendChild(ot);
    panel.appendChild(el('div',{class:'field-hint'}, '機会が高い地方は集中応援・支店・営業の候補。脅威が高い地方は品質と防衛を優先。'));
  }
  return panel;
}

function tickerSignature(s){
  if(!s || !s.log || !s.log.length) return 'empty';
  return s.log.slice(0, 12).map(l => (l.q||'')+'|'+(l.tag||'')+'|'+(l.text||'')).join('||');
}
function tickerBaseDurationSec(itemCount){
  // 標準速度(tickerSpeed=1)の一周秒数。大きいほど遅い
  return Math.max(90, Math.min(200, (itemCount || 1) * 9));
}
function tickerSpeedToAngle(sp){
  // 0.35〜3.0 を 0〜270deg の円弧にマップ
  const t = (Math.max(0.12, Math.min(3, sp)) - 0.12) / (3 - 0.12);
  return Math.round(t * 270);
}
function angleToTickerSpeed(ang){
  const t = Math.max(0, Math.min(270, ang)) / 270;
  return 0.12 + t * (3 - 0.12);
}
function applyTickerSpeedToDom(){
  const sp = Math.max(0.12, Math.min(3, Number(tickerSpeed) || 1));
  const move = document.querySelector('#event-ticker .ticker-move');
  if(move){
    const n = parseInt(move.dataset.itemCount || '8', 10);
    const base = tickerBaseDurationSec(n);
    move.style.animationDuration = (base / sp) + 's';
  }
  const knob = document.querySelector('#event-ticker .ticker-knob');
  if(knob){
    const ang = tickerSpeedToAngle(sp);
    knob.style.setProperty('--knob-ang', ang + 'deg');
    const inner = knob.querySelector('.ticker-knob-inner');
    if(inner) inner.textContent = sp < 0.35 ? '微' : sp < 0.75 ? '遅' : sp < 1.3 ? '中' : sp < 2.2 ? '速' : '最';
  }
}
function setTickerSpeed(sp){
  tickerSpeed = Math.max(0.12, Math.min(3, Number(sp) || 1));
  try{ localStorage.setItem('mercury-ticker-speed', String(tickerSpeed)); }catch(e){}
  applyTickerSpeedToDom();
}
const TICKER_SPEED_STEPS = [0.12, 0.25, 0.4, 0.6, 0.85, 1.2, 1.7, 2.4, 3.0];
function cycleTickerSpeedUp(){
  const sp = Math.max(0.12, Math.min(3, Number(tickerSpeed) || 1));
  let idx = 0;
  for(let i=0;i<TICKER_SPEED_STEPS.length;i++){
    if(sp < TICKER_SPEED_STEPS[i] - 0.02){ idx = i; break; }
    idx = (i + 1) % TICKER_SPEED_STEPS.length; // 最後まで行ったら0へ
  }
  // 現在値に最も近いステップを探し、次へ
  let nearest = 0;
  let best = 99;
  for(let i=0;i<TICKER_SPEED_STEPS.length;i++){
    const d = Math.abs(TICKER_SPEED_STEPS[i] - sp);
    if(d < best){ best = d; nearest = i; }
  }
  const next = TICKER_SPEED_STEPS[(nearest + 1) % TICKER_SPEED_STEPS.length];
  setTickerSpeed(next);
}
function bindTickerKnob(knob){
  if(!knob || knob.dataset.bound) return;
  knob.dataset.bound = '1';
  knob.style.cursor = 'pointer';
  knob.title = 'タップで速度アップ（一周で最低速度に戻る）';
  let ignoreClickUntil = 0;
  knob.addEventListener('click', (ev)=>{
    if(Date.now() < ignoreClickUntil){ ev.preventDefault(); return; }
    ev.preventDefault();
    ev.stopPropagation();
    cycleTickerSpeedUp();
  });
  knob.addEventListener('touchend', (ev)=>{
    ev.preventDefault();
    ignoreClickUntil = Date.now() + 400;
    cycleTickerSpeedUp();
  }, {passive:false});
}
function buildTickerSpeedControls(){
  const wrap = el('div',{class:'ticker-speed'});
  const kw = el('div',{class:'ticker-knob-wrap'});
  const knob = el('div',{class:'ticker-knob', title:'ティッカー速度（ドラッグで調整）'});
  const ang = tickerSpeedToAngle(tickerSpeed);
  knob.style.setProperty('--knob-ang', ang + 'deg');
  const sp = tickerSpeed;
  const label = sp < 0.35 ? '微' : sp < 0.75 ? '遅' : sp < 1.3 ? '中' : sp < 2.2 ? '速' : '最';
  knob.appendChild(el('div',{class:'ticker-knob-inner'}, label));
  kw.appendChild(knob);
  wrap.appendChild(kw);
  // バインドはDOM追加後
  setTimeout(()=>bindTickerKnob(knob), 0);
  return wrap;
}
function ensureEventTicker(){
  const s = state;
  if(!gameStarted || !s){
    const old = document.getElementById('event-ticker');
    if(old && old.parentNode) old.parentNode.removeChild(old);
    try{ document.body.classList.remove('has-ticker'); }catch(e){}
    return;
  }
  try{ document.body.classList.add('has-ticker'); }catch(e){}
  const sig = tickerSignature(s);
  let bar = document.getElementById('event-ticker');
  if(bar && bar.dataset.sig === sig){
    // 内容同じ → 速度だけ同期
    applyTickerSpeedToDom();
    return;
  }
  if(bar && bar.parentNode) bar.parentNode.removeChild(bar);
  bar = el('div',{class:'event-ticker', id:'event-ticker'});
  bar.dataset.sig = sig;
  bar.appendChild(buildTickerSpeedControls());
  const track = el('div',{class:'ticker-track'});
  const items = (s.log && s.log.length) ? s.log.slice(0, 24) : [];
  if(items.length === 0){
    track.appendChild(el('div',{class:'ticker-empty'}, 'イベントログはまだありません'));
  } else {
    const move = el('div',{class:'ticker-move'});
    move.dataset.itemCount = String(items.length);
    const seq = items.concat(items);
    seq.forEach(l=>{
      const tag = l.tag==='warn'?'warn':(l.tag==='good'?'good':'');
      move.appendChild(el('span',{class:'ticker-item '+tag},
        el('span',{class:'tq'}, l.q||''),
        document.createTextNode(l.text||'')
      ));
    });
    track.appendChild(move);
  }
  bar.appendChild(track);
  document.body.appendChild(bar);
  applyTickerSpeedToDom();
}

function classifyModalAnim(m){
  if(!m) return {box:'', overlay:''};
  const t = m.type || '';
  const title = (m.title||'') + (m.body||'');
  if(t==='victory') return {box:' victory', overlay:' victory-bg'};
  if(t==='over') return {box:' over', overlay:' danger-bg'};
  if(t==='retire') return {box:' retire', overlay:' victory-bg'};
  if(t==='annual') return {box:' event-critical', overlay:' critical-bg'};
  if(t==='save' || t==='export_ios') return {box:'', overlay:''};
  // 選択肢・イベント系: タイトル文言から重要度推定
  const dangerKeys = ['倒産','破産','破綻','緊急融資','不正','不祥事','告発','逮捕','解約ラッシュ','倒産危機','資金ショート','債務超過'];
  const goodKeys = ['上場','IPO','大型受注','買収成功','勝利','黒字','快挙','記録'];
  const criticalKeys = ['株主総会','TOB','買収提案','M&A','敵対的','公開買付','合併','役員','辞任'];
  if(/大地震/.test(title)) return {box:' event-warn', overlay:' danger-bg'};
  if(/大雨|浸水/.test(title)) return {box:' event-critical', overlay:' critical-bg'};
  if(dangerKeys.some(k=>title.includes(k))) return {box:' event-warn', overlay:' danger-bg'};
  if(goodKeys.some(k=>title.includes(k))) return {box:' event-good', overlay:' critical-bg'};
  if(criticalKeys.some(k=>title.includes(k)) || t==='choice' || t==='event') return {box:' event-critical', overlay:' critical-bg'};
  return {box:'', overlay:''};
}

async function doSave(slot){
  if(!state){ alert('保存するゲームがありません。'); return; }
  slot = (slot == null) ? 1 : Math.max(0, Math.min(SAVE_SLOT_COUNT, Math.round(slot)));
  try{
    const ok = await writeSaveToSlot(slot, state, mandaOffers);
    // 互換: スロット1は旧キーにも書く
    if(slot === 1){
      await StorageAPI.set(SAVE_LEGACY_KEY, JSON.stringify({state, mandaOffers, version:2, meta:buildSaveMeta(state)}), false);
    }
    const label = slot === 0 ? 'オートセーブ' : `スロット${slot}`;
    if(!ok || !StorageAPI.canPersist()){
      if(gameStarted && state){
        pushLog(state, 'ブラウザへの保存に失敗しました。ヘッダーの「書出」でJSONを保存してください。', 'warn');
        render();
      }
      alert('この環境ではブラウザ保存が使えません。\n「書出」でJSONファイルを保存してください。ブラウザを閉じると消えます。');
    } else if(gameStarted && state){
      pushLog(state, `${label}に保存しました。`, 'good');
      render();
    }
  }catch(e){
    if(gameStarted && state) pushLog(state, '保存中にエラーが発生しました。', 'warn');
    else alert('保存中にエラーが発生しました。');
    render();
  }
}
async function autoSave(){
  if(!state || !gameStarted) return;
  try{
    const ok = await writeSaveToSlot(0, state, mandaOffers);
    // 互換キーにも書く
    try{
      await StorageAPI.set(SAVE_LEGACY_KEY, JSON.stringify({version:2, state, mandaOffers, meta:buildSaveMeta(state)}), false);
    }catch(e){}
    if(!ok && !window.__mercuryPersistWarned){
      window.__mercuryPersistWarned = true;
      pushLog(state, 'ブラウザ保存が無効です。進行を残すには「書出」でJSONを保存してください。', 'warn');
    }
  }catch(e){ /* 静かに失敗を許容 */ }
}

function ensureEduState(s){
  if(s.goodwill==null) s.goodwill = 0;
  if(s.goodwillImpairCum==null) s.goodwillImpairCum = 0;
  if(s.contractMetrics==null) s.contractMetrics = {churnQ:0, renewEligible:0, renewKept:0, renewRate:0, arpu:0};
  if(s.lastFcf==null) s.lastFcf = 0;
  if(s.lastKeyword==null) s.lastKeyword = null;
  if(s.partsInventory==null) s.partsInventory = 0; // 簡易在庫（円）
  if(s.depreciationQ==null) s.depreciationQ = 0;
}
function bookValueOfUnits(units){
  // 台数に対応する「引き継ぎ純資産」の粗い近似（年料金の一定割合）
  return Math.round((units||0) * (SUBSIDIARY_ASSUMED_FEE||1400000) * 0.35);
}
function addGoodwillFromDeal(s, paid, units, logs){
  ensureEduState(s);
  const book = bookValueOfUnits(units);
  const gw = Math.max(0, Math.round((paid||0) - book * Math.min(1, (paid||0)/(book+1))));
  // より単純: 支払いが簿価超なら超過分をのれん
  const premium = Math.max(0, Math.round((paid||0) - book));
  if(premium > 0){
    s.goodwill = (s.goodwill||0) + premium;
    if(logs) logs.push({text:`【会計】買収に伴いのれん 約${yen(premium)} を計上（取得価額−引き継ぎ資産の目安）。`, tag:'info'});
    s.lastKeyword = 'のれん';
  }
}
function processGoodwill(s, logs){
  ensureEduState(s);
  if((s.goodwill||0) <= 0) return 0;
  // 四半期償却（20年相当=80四半期）
  const amort = Math.round(s.goodwill / 80);
  let impair = 0;
  // 品質・士気が低い、または監視熱が高いと減損リスク
  const risk = ((s.quality||50)<45?0.08:0) + ((s.morale||60)<40?0.05:0) + ((s.lateGame&&s.lateGame.antitrustHeat||0)>10?0.04:0);
  if(s.goodwill > 50000000 && Math.random() < risk){
    impair = Math.round(s.goodwill * (0.08 + Math.random()*0.12));
    s.goodwillImpairCum = (s.goodwillImpairCum||0) + impair;
    if(logs) logs.push({text:`【会計】のれんの減損 約${yen(impair)} を計上した。買収シナジーの見直し。`, tag:'warn'});
    s.lastKeyword = '減損';
  }
  const total = amort + impair;
  s.goodwill = Math.max(0, s.goodwill - total);
  s.depreciationQ = (s.depreciationQ||0)*0.5 + amort; // 表示用
  return total;
}
function processPartsInventory(s, logs){
  ensureEduState(s);
  // 部品在庫：規模に応じた適正在庫、過多は資金拘束、不足は品質リスク
  const target = Math.round((s.units||0) * 800); // 台あたり簡易
  const inv = s.partsInventory||0;
  if(inv < target * 0.7){
    const buy = Math.min(s.cash*0.02, Math.round(target * 0.15));
    if(buy > 0){ s.cash -= buy; s.partsInventory = inv + buy; }
  } else if(inv > target * 1.4 && Math.random() < 0.2){
    // 在庫圧縮
    const sell = Math.round((inv - target) * 0.2);
    s.partsInventory = inv - sell;
    s.cash += Math.round(sell * 0.85);
    if(logs) logs.push({text:`【原価】過剰部品在庫を一部現金化（${yen(Math.round(sell*0.85))}）。運転資本の調整。`, tag:'info'});
    s.lastKeyword = '運転資本';
  }
  // 在庫不足ペナルティ
  if((s.partsInventory||0) < target * 0.5){
    s.quality = Math.max(5, (s.quality||50) - 0.3);
  }
}
function calcFcf(s, netProfit, nonCash, capexLike){
  // FCF ≒ 純利益 + 非現金費用 − 投資的支出 − 運転資本増
  const invDelta = 0; // 在庫増は process 側で現金に反映済み
  return Math.round((netProfit||0) + (nonCash||0) - (capexLike||0));
}
function calcProductivity(s){
  const heads = Math.max(1, (s.techs||0)+(s.salesStaff||0)+(s.admins||0)+1);
  const revY = typeof annualRevenue==='function' ? annualRevenue(s) : (s.units||0)*(s.price||0);
  const laborY = ((s.techs||0)*1200000 + (s.salesStaff||0)*1100000 + (s.admins||0)*1000000) * 4; // 粗い年換算
  return {
    heads,
    revPerHead: revY / heads,
    unitsPerTech: (s.techs||0)>0 ? (s.units||0)/(s.techs||1) : 0,
    laborRatio: revY>0 ? laborY / revY : 0,
  };
}
function calcContractMetrics(s, churnedUnits, renewEligible, renewKept){
  ensureEduState(s);
  const arpu = s.price || 0;
  const elig = Math.max(0, renewEligible||0);
  const kept = Math.max(0, renewKept||0);
  const renewRate = elig>0 ? kept/elig : (s.contractMetrics&&s.contractMetrics.renewRate)||0.85;
  const churnQ = (s.units||0)>0 ? (churnedUnits||0)/(s.units||1) : 0;
  s.contractMetrics = {churnQ, renewEligible:elig, renewKept:kept, renewRate, arpu};
  return s.contractMetrics;
}
function doRaiseContractPrice(pct){
  const s = state;
  pct = Math.max(0.01, Math.min(0.08, pct||0.03));
  const old = s.price||0;
  s.price = Math.round(old * (1+pct));
  // 値上げは解約圧力・競争圧力
  s.competitivePressure = clamp((s.competitivePressure||0.5)+pct*2, 0, 1.5);
  s.morale = clamp((s.morale||60)-1, 5, 95);
  // 短期的にARPU改善、更新率は翌期に効く
  pushLog(s, `保守契約の値上げを実施（${yen(old)}→${yen(s.price)}、+${(pct*100).toFixed(1)}%）。解約圧力がやや高まる。`, 'info');
  s.lastKeyword = 'ARPU';
  render(); autoSave();
}
function pickEduKeyword(s, logs){
  ensureEduState(s);
  if(s.lastKeyword) return s.lastKeyword;
  const m = s.contractMetrics||{};
  if((m.churnQ||0) > 0.02) return 'チャーン（解約率）';
  if((s.goodwill||0) > 100000000) return 'のれん';
  if((s.lastFcf||0) < 0 && (s.history&&s.history.length)) return 'フリーキャッシュフロー（FCF）';
  const prod = calcProductivity(s);
  if(prod.unitsPerTech > 55) return '稼働率';
  if(prod.laborRatio > 0.55) return '人件費率';
  if((logs||[]).some(l=>/買収|M&A/.test(l.text||''))) return 'ロールアップ';
  return '競争優位';
}
