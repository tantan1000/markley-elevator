/* ---- 大雨・浸水災害（復旧作業に追われるが利益は出る） ---- */
function applyFloodResponse(s, region, responseKey){
  const unitsHere = s.regionUnits[region.id]||0;
  const exposure = s.units>0 ? unitsHere/s.units : 0;
  const mitigate = disasterMitigationFactor(s);
  const util = capacity(s)>0 ? s.units/capacity(s) : 1.2;
  const spare = capacity(s)>0 ? Math.max(0,(capacity(s)-s.units)/capacity(s)) : 0;
  const hasBranch = (s.regionBranches[region.id]||0)>0;
  const RESP = {
    full:     {label:'全力受注', feeMult:1.35, workMult:1.4,  repDelta:3,  moraleDelta:-7, boostMult:1.9, boostTicks:4},
    standard: {label:'標準対応', feeMult:1.0,  workMult:1.0,  repDelta:1,  moraleDelta:-4, boostMult:1.55, boostTicks:3},
    lean:     {label:'選別受注', feeMult:0.55, workMult:0.55, repDelta:-2, moraleDelta:-1, boostMult:1.2,  boostTicks:2},
  };
  const resp = RESP[responseKey] || RESP.standard;
  const ownRecoverUnits = Math.round(unitsHere * (0.08 + Math.random()*0.10) * resp.workMult);
  const externalPool = Math.round(
    ((typeof regionMarket==='function' ? regionMarket(s, region.id) : (region.weight||0.1)*(s.marketTotal||120000)) * 0.012)
    * (hasBranch ? 1.0 : 0.35) * resp.workMult * (0.7 + Math.random()*0.5)
  );
  const recoverUnits = ownRecoverUnits + externalPool;
  const feePer = 85000 + Math.random()*55000;
  let grossFee = Math.round(recoverUnits * feePer * resp.feeMult);
  let costRatio = 0.42 - mitigate*0.12 + (spare<0.08 ? 0.10 : 0) + (util>1.05 ? 0.08 : 0);
  costRatio = clamp(costRatio, 0.28, 0.62);
  if(!hasBranch && unitsHere>0) costRatio += 0.06;
  const directCost = Math.round(grossFee * costRatio);
  const netProfit = grossFee - directCost;
  s.cash += netProfit;
  const followTicks = responseKey==='full' ? 3 : (responseKey==='lean' ? 1 : 2);
  const followPerQ = Math.round(netProfit * (0.35 + Math.random()*0.25) / Math.max(1, followTicks));
  s.floodImpact = {
    regionId: region.id, regionName: region.name,
    ticksLeft: followTicks,
    bonusRevenuePerQ: followPerQ,
    strain: resp.workMult,
    response: responseKey,
  };
  s.morale = clamp((s.morale||60)+resp.moraleDelta+(spare<0.1?-2:0), 5, 95);
  s.reputation = clamp((s.reputation||50)+resp.repDelta+(hasBranch?1:0), 5, 98);
  if(responseKey==='full') s.techSkill = clamp((s.techSkill||50)+1, 5, 98);
  else s.satisfaction = clamp((s.satisfaction||60)+2, 5, 98);
  if(util>1.0 && responseKey==='full') s.quality = clamp((s.quality||50)-1, 5, 98);
  s.regionBoost = {regionId: region.id, ticksLeft: resp.boostTicks, mult: resp.boostMult * (0.95 + mitigate*0.15)};
  s.floodCooldown = 12 + Math.floor(Math.random()*10);
  s.floodDisasterCount = (s.floodDisasterCount||0)+1;
  pushLog(s,
    `${region.name}の大雨・浸水に${resp.label}で対応した。緊急復旧工事 約${num(recoverUnits)}台分を実施し、純益 ${yen(netProfit)}（売上 ${yen(grossFee)}／原価 ${yen(directCost)}）。現場は逼迫するが、続く復旧需要も見込まれる（四半期あたり約${yen(followPerQ)}・${followTicks}四半期）。`,
    'good'
  );
  if(s.rivals && s.rivals.length){
    const r = s.rivals[Math.floor(Math.random()*s.rivals.length)];
    if(r) pushLog(s, `${r.name}も${region.name}で浸水復旧の問い合わせ対応に追われている。`, 'info');
  }
}

/** 官公庁入札の勝率（検査員余力・事務・信用が鍵） */
function publicBidWinChance(s, stance){
  ensureInspectors(s);
  const insp = s.inspectors||0;
  if(insp < 1) return 0.02;
  const pubCap = publicCapacity(s);
  const pubUnits = (s.segmentUnits && s.segmentUnits.public) || 0;
  const spare = Math.max(0, pubCap - pubUnits);
  let p = 0.18;
  p += Math.min(0.22, spare / 80 * 0.22); // 資格者余力
  p += (s.reputation - 50) * 0.003;
  p += (s.quality - 50) * 0.0025;
  p += (adminSupportMult(s) - 1) * 0.2;
  if(s.isListed) p += 0.06;
  if(s.exchange === 'prime' || (s.listedOn||[]).includes('prime')) p += 0.04;
  if(s.adChannels && s.adChannels.public_bid) p += 0.08;
  if(s.executives && s.executives.sales_dir) p += 0.03;
  const skill = (s.salesSkill!=null?s.salesSkill:50);
  p += (skill - 50) * 0.002;
  if(stance === 'aggressive') p += 0.10; // 低価格・手厚い体制
  if(stance === 'lean') p -= 0.08;
  return clamp(p, 0.03, 0.82);
}
function resolvePublicBid(regionId, dealSize, stance){
  const s = state;
  const region = REGIONS.find(r=>r.id===regionId) || REGIONS[0];
  const winChance = publicBidWinChance(s, stance);
  const win = Math.random() < winChance;
  // 入札・書類費用
  let bidCost = 400000 + Math.round(dealSize * 8000);
  if(stance === 'aggressive') bidCost = Math.round(bidCost * 1.35);
  if(stance === 'lean') bidCost = Math.round(bidCost * 0.7);
  if(bidCost > s.cash){
    pushLog(s, `入札参加費用（${yen(bidCost)}）が不足し、辞退扱いになった。`, 'warn');
    modal = null;
    if(!s.gameOver) startTimer();
    render(); autoSave();
    return;
  }
  s.cash -= bidCost;
  ensureInspectors(s);
  if(win){
    const pubCap = publicCapacity(s);
    const pubUnits = (s.segmentUnits && s.segmentUnits.public) || 0;
    const spare = Math.max(0, pubCap - pubUnits);
    let won = Math.min(dealSize, Math.max(0, spare));
    // 定員全体も制約
    const spareCap = Math.max(0, capacity(s) - s.units);
    won = Math.min(won, spareCap);
    if(won <= 0){
      pushLog(s, `入札は落札したが、昇降機等検査員の余力または技術定員が足りず履行できず辞退した（参加費 ${yen(bidCost)} は戻らない）。官公庁は検査員のみが担当可能。`, 'warn');
      s.reputation = clamp((s.reputation||50)-2, 5, 98);
    } else {
      s.regionUnits[regionId] = (s.regionUnits[regionId]||0) + won;
      s.units = Object.values(s.regionUnits).reduce((a,b)=>a+b,0);
      if(!s.segmentUnits) s.segmentUnits = {};
      s.segmentUnits.public = (s.segmentUnits.public||0) + won;
      s.reputation = clamp((s.reputation||50)+3, 5, 98);
      s.satisfaction = clamp((s.satisfaction||50)+1, 5, 98);
      if(stance === 'aggressive'){
        // 低価格約束 → 一時的な収益圧迫は価格圧力で表現
        s.competitivePressure = clamp((s.competitivePressure||0.5)+0.03, 0.1, 0.95);
      }
      const stanceLabel = stance==='aggressive'?'積極（低価格・体制厚め）': stance==='lean'?'堅実（必要最小限）':'標準';
      pushLog(s, `官公庁入札に落札（${region.name}・${stanceLabel}・+${num(won)}台／参加費 ${yen(bidCost)}）。昇降機等検査員の枠内で履行する。`, 'good');
    }
  } else {
    pushLog(s, `官公庁入札は他社に敗れた（${region.name}・提案 ${num(dealSize)}台・落札率目安 ${pct(winChance,0)}／参加費 ${yen(bidCost)}）。検査員余力・事務・信用・入札情報体制が鍵。`, 'warn');
  }
  s.publicBidCooldown = 3 + Math.floor(Math.random()*5);
  modal = null;
  if(!s.gameOver) startTimer();
  render(); autoSave();
}

function runSpecialStructuralEvent(s, logs){
  // 大地震（稀）
  if((s.majorQuakeCooldown||0) <= 0 && Math.random() < 0.012){
    triggerMajorEarthquake(s, logs);
    if(!s.majorQuakeCooldown) s.majorQuakeCooldown = 16;
    return true;
  }
  // 大雨・浸水（稀）
  if((s.floodCooldown||0) <= 0 && Math.random() < 0.015){
    triggerFloodDisaster(s, logs);
    if(!s.floodCooldown) s.floodCooldown = 14;
    return true;
  }

  // 大型商談：ノーマル／ハードは約10年（40四半期）に1回ベースの超稀イベント
  // イージーは従来どおり下のロール帯で出現
  {
    const diff = s.difficulty || 'normal';
    if(diff !== 'easy' && (s.majorDealCooldown||0) <= 0 && Math.random() < 0.022){
      if(openMajorDealModal(s)){
        // 次回まで 40〜56 四半期（10〜14年）
        s.majorDealCooldown = 40 + Math.floor(Math.random()*17);
        logs.push({text:'大型物件からの相見積もり依頼が届いた。条件を選んで提案する。', tag:'info'});
        return true;
      }
    }
  }

  // 官公庁入札公告（通常営業では取れない）
  if(tryTriggerPublicBid(s, logs)) return true;

  // 既存の重要イベント（事故・M&A・アクティビスト等）を一定確率で優先
  const roll = Math.random();
  if(roll < 0.07){

    const accidentChance = clamp((60-s.quality)/100 * accidentRiskMult(s), 0.03, 0.6);
    if(Math.random() < accidentChance){
      const lost = Math.round(s.units*0.05);
      if(lost>0 && s.units>0){
        const ratio = lost/s.units;
        REGIONS.forEach(rg=>{ s.regionUnits[rg.id] = Math.max(0, Math.round((s.regionUnits[rg.id]||0)*(1-ratio))); });
        s.units = Object.values(s.regionUnits).reduce((a,b)=>a+b,0);
      }
      s.reputation -= 14;
      const fine = (8000000 + Math.random()*10000000) * (0.5 + contractRepairExposure(s)*0.9) * (1 - s.insuranceCoverage*INSURANCE_MAX_COVERAGE);
      s.cash -= fine;
      logs.push({text:`保守物件で重大インシデントが発生。契約${num(lost)}台を喪失し、対応費用${yen(fine)}が発生（フルメンテナンス比率が高いほど自社負担が増える）。評判が大きく悪化した。`, tag:'warn'});
      s.accidentCount = (s.accidentCount||0) + 1;
      modal = {type:'event', title:'重大インシデント発生', body:`品質投資の不足が響き、担当物件で重大な保守インシデントが発生した。喪失契約：${num(lost)}台／対応費用：${yen(fine)}／評判：-14`};
    } else {
      logs.push({text:'ヒヤリハット報告があったが、大事には至らなかった。', tag:'info'});
    }
    return true;
  }
  if(roll < 0.12){
    s.hireCostMult = 1.6;
    logs.push({text:'業界的な技術者不足で、次期の採用コストが上昇する見込み。', tag:'warn'});
    return true;
  }
  if(roll < 0.16){
    s.rateAdj = (Math.random()<0.5?1:-1)*0.005;
    logs.push({text:`金融環境の変化により借入金利が${s.rateAdj>0?'上昇':'低下'}した。`, tag:'info'});
    return true;
  }
  if(roll < 0.22 && mandaOffers.length<3){
    const t = spawnMandaOffer(s);
    logs.push({text:`M&A候補として「${t.name}」（${t.regionName}）の情報が入った。`, tag:'info'});
    return true;
  }
  if(roll < 0.26 && s.isListed){
    modal = buildActivistModal(s);
    return true;
  }
  if(roll < 0.30){
    const region = REGIONS[Math.floor(Math.random()*REGIONS.length)];
    s.regionBoost = {regionId: region.id, ticksLeft: 3, mult: 1.6};
    logs.push({text:`${region.name}で中規模地震が発生。緊急点検と復旧に伴う商談が増えている（同地方の新規契約が当面活発化）。`, tag:'warn'});
    return true;
  }
  if(roll < 0.33){
    s.nationalBoost = {ticksLeft: 4, mult: 1.25};
    logs.push({text:'保守点検の義務化を強化する法改正が行われた。全国的に新規契約の商談が増加している。', tag:'good'});
    return true;
  }
  if(roll < 0.38 && s.units > 200){
    const ownedRegions = REGIONS.filter(rg=>(s.regionUnits[rg.id]||0) > 50);
    if(ownedRegions.length > 0){
      const region = ownedRegions[Math.floor(Math.random()*ownedRegions.length)];
      const projectUnits = Math.round(Math.min(s.regionUnits[region.id]*0.3, 50+Math.random()*150));
      const feePerUnit = 2200000 + Math.random()*800000;
      modal = {
        type:'choice',
        title:'更新工事の提案機会',
        body:`${region.name}の保有物件で、経年設備の更新工事（約${num(projectUnits)}台）の提案余地がある。受注活動を行うか？`,
        options:[
          {label:'提案する', onClick:()=>resolveRenewal(region.id, projectUnits, feePerUnit)},
          {label:'見送り', onClick:()=>{ pushLog(state,'更新工事の提案を見送った。','info'); modal=null; if(!state.gameOver) startTimer(); render(); }},
        ]
      };
      return true;
    }
  }
  // イージーのみ：ロール帯で大型商談（ノーマル／ハードは上記の超稀枠）
  if(roll < 0.43 && (s.difficulty||'normal')==='easy'){
    if(openMajorDealModal(s)){
      logs.push({text:'大型物件からの相見積もり依頼が届いた。条件を選んで提案する。', tag:'info'});
      return true;
    }
  }
  if(roll < 0.48){
    const spareRatio = capacity(s)>0 ? (capacity(s)-s.units)/capacity(s) : 0;
    if(spareRatio > 0.12){
      s.reputation = clamp(s.reputation+2, 5, 98);
      s.satisfaction = clamp(s.satisfaction+3, 5, 98);
      logs.push({text:'エレベーター閉じ込め事故が発生したが、技術者の余力があり迅速に救出対応。24時間対応の信頼性が評価された。', tag:'good'});
    } else {
      const emergencyFine = (2000000 + Math.random()*4000000) * (1 - s.insuranceCoverage*INSURANCE_MAX_COVERAGE*0.6);
      s.cash -= emergencyFine;
      s.satisfaction = clamp(s.satisfaction-8, 5, 98);
      s.reputation = clamp(s.reputation-6, 5, 98);
      logs.push({text:`エレベーター閉じ込め事故が発生。技術者が逼迫しており救出対応が遅れ、苦情対応費用${yen(emergencyFine)}が発生。評判が悪化した。`, tag:'warn'});
    }
    return true;
  }
  if(roll < 0.52){
    const candidates = s.rivals.filter(r=>(r.vitality!=null?r.vitality:60) < 45 && !(s.alliances && s.alliances[r.id]));
    if(candidates.length > 0){
      const r = candidates[Math.floor(Math.random()*candidates.length)];
      modal = {
        type:'choice',
        title:'ライバル企業からの業務提携の打診',
        body:`経営不振に陥っている${r.name}側から、業務提携の打診があった。応じれば提携金なしで協力関係を築ける（部品調達・技術ノウハウの相互協力、正面衝突の回避）。`,
        options:[
          {label:'提携を受け入れる', onClick:()=>{
            state.alliances = state.alliances || {};
            state.alliances[r.id] = true;
            pushLog(state, `${r.name}からの業務提携の打診を受け入れた。`, 'good');
            modal = null; if(!state.gameOver) startTimer(); render();
          }},
          {label:'断る', onClick:()=>{
            pushLog(state, `${r.name}からの業務提携の打診を断った。`, 'info');
            modal = null; if(!state.gameOver) startTimer(); render();
          }},
        ]
      };
      return true;
    }
  }
  if(roll < 0.56 && s.board.outsiders > 0){
    const advice = generateBoardAdvice(s);
    if(advice){
      modal = {
        type:'choice',
        title:'社外取締役からの助言',
        body:`社外取締役から、経営の現状を踏まえた助言があった。\n\n「${advice.issue}」`,
        options:[
          {label:`助言を取り入れる（${advice.actionLabel}）`, onClick:()=>{
            advice.apply();
            state.reputation = clamp(state.reputation+1, 5, 98);
            modal = null; if(!state.gameOver) startTimer(); render(); autoSave();
          }},
          {label:'助言を見送る', onClick:()=>{
            pushLog(state, '社外取締役の助言を見送った。', 'info');
            modal = null; if(!state.gameOver) startTimer(); render();
          }},
        ]
      };
      return true;
    }
  }
  return false;
}

function runQuarterEvents(s, logs){
  // 毎四半期 2〜4件のカタログイベント + 低確率で構造イベント
  if(!runSpecialStructuralEvent(s, logs)){
    // 構造イベントが無い四半期はカタログを多めに
  }
  const n = 2 + Math.floor(Math.random()*3); // 2〜4件
  const used = new Set();
  for(let i=0;i<n;i++){
    let e = pickCatalogEvent();
    let guard=0;
    while(used.has(e.t) && guard++<20) e = pickCatalogEvent();
    used.add(e.t);
    if(e.apply){
      try{ e.apply(s); }catch(_err){}
    }
    logs.push({text:e.t, tag:e.tag||'info'});
  }
}

/* ============================================================
   ターン処理
   ============================================================ */
function tick(s){
  const logs = [];
  // セーブ互換: 新フィールドのデフォルト
  if(s.techSkill==null) s.techSkill = 50;
  if(s.portfolioAge==null) s.portfolioAge = 4.5;
  if(s.renewalSpecialists==null) s.renewalSpecialists = 0;
  if(!s.renewalJobs) s.renewalJobs = [];
  if(!s.partsPolicy) s.partsPolicy = 'mixed';
  if(!s.makerMix){
    s.makerMix = {};
    MAKER_IDS.forEach(id=>{ s.makerMix[id] = MAKER_BRANDS[id].weight; });
  }
  if(!s.makerRelations){
    s.makerRelations = {};
    MAKER_IDS.forEach(id=>{ s.makerRelations[id] = 50; });
  }
  if(s.outsourceUnits==null) s.outsourceUnits = 0;
  if(s.overtimeUnits==null) s.overtimeUnits = 0;
  if(s.cumulativeRenewalUnits==null) s.cumulativeRenewalUnits = 0;
  if(s.utilStreak==null) s.utilStreak = 0;
  if(s.competitivePressure==null) s.competitivePressure = 0.5;
  if(!s.recruitPipeline) s.recruitPipeline = [];
  if(s.salesStaff==null){ s.salesStaff = 2; s.salesSkill = s.salesSkill||48; }
  if(s.referralHires==null) s.referralHires = 0;
  if(!s.loans) s.loans = [];
  if(s.integrity==null) s.integrity = 72;
  if(s.fraudPressure==null) s.fraudPressure = 0;
  if(!s.discCases) s.discCases = [];
  if(s.misconductCount==null) s.misconductCount = 0;
  if(s.soGrantedPct==null){ s.soPoolPct=0; s.soGrantedPct=0; s.soVestedPct=0; s.soStrike=0; s.soPlanYear=null; }
  if(s.founderLiquid==null) s.founderLiquid = 50000000;
  if(s.shareLiquidityBias==null) s.shareLiquidityBias = 0;
  if(!s.earnoutLiabilities) s.earnoutLiabilities = [];
  if(s.shareActionCooldown==null) s.shareActionCooldown = 0;
  if(!s.adActive) s.adActive = {};
  if(!s.listedOn) s.listedOn = s.isListed && s.exchange ? [s.exchange] : [];
  if(!s.annualReports) s.annualReports = [];
  if(s.adAwareness==null) s.adAwareness = 10;
  if(s.quakeImpact===undefined) s.quakeImpact = null;
  if(s.majorQuakeCooldown==null) s.majorQuakeCooldown = 0;
  if(s.majorQuakeCount==null) s.majorQuakeCount = 0;
  if(s.floodImpact===undefined) s.floodImpact = null;
  if(s.floodCooldown==null) s.floodCooldown = 0;
  if(s.majorDealCooldown==null) s.majorDealCooldown = 0;
  if(s.publicBidCooldown==null) s.publicBidCooldown = 0;
  if(s.floodDisasterCount==null) s.floodDisasterCount = 0;
  if(!s.segmentUnits){
    s.segmentUnits = {condo_union:0,mgmt_company:0,private_owner:0,commercial:0,public:0};
    // 既存セーブは概況から按分
    const w = SEGMENT_IDS.reduce((a,id)=>a+CUSTOMER_SEGMENTS[id].marketWeight,0);
    SEGMENT_IDS.forEach(id=>{ s.segmentUnits[id] = Math.round((s.units||0) * CUSTOMER_SEGMENTS[id].marketWeight / w); });
  }

  if(!s.newHireCohorts) s.newHireCohorts = [];

  // ---- マクロ経済サイクル（好況・平常・不況）----
  s.cycleTicksLeft--;
  if(s.cycleTicksLeft<=0){
    const cr = Math.random();
    s.cycle = cr<0.55 ? 'normal' : cr<0.78 ? 'boom' : 'recession';
    s.cycleTicksLeft = 4 + Math.floor(Math.random()*6);
    if(s.cycle==='boom') logs.push({text:'国内景気が拡大局面に入った。新築需要が伸び、資金調達環境も良好。', tag:'good'});
    if(s.cycle==='recession') logs.push({text:'景気後退局面入り。新築需要が鈍化し、借入金利は上昇傾向。', tag:'warn'});
  }
  const cycleGrowthMult = s.cycle==='boom' ? 2.2 : s.cycle==='recession' ? 0.2 : 1;
  const cycleRateAdj = s.cycle==='boom' ? -0.004 : s.cycle==='recession' ? 0.006 : 0;
  const cyclePoolMult = s.cycle==='boom' ? 1.25 : s.cycle==='recession' ? 0.75 : 1;

  // ---- 労働需給のひっ迫（少子高齢化による技術者不足の長期トレンド）----
  // 少子高齢化トレンド + 自社が市場の技術者を抱え込むほど需給がさらにひっ迫
  s.laborTightness += 0.0008 + Math.max(0, (s.techs||0) - 15) * 0.00004;
  s.laborTightness = Math.min(2.8, s.laborTightness);

  // ---- 0. 継続方針支出（営業投資・品質投資）をキャッシュと照合 ----
  let salesInv = Math.max(0, Number(s.salesBudget)||0);
  let qualInv = Math.max(0, Number(s.qualityBudget)||0);
  let welfareInv = Math.max(0, Number(s.welfareBudget)||0);
  let esgInv = Math.max(0, Number(s.esgBudget)||0);
  let adPaid = 0;
  const budgetSpend = salesInv + qualInv + welfareInv + esgInv;
  if(budgetSpend > s.cash){
    const scale = s.cash>0 ? s.cash/budgetSpend : 0;
    salesInv *= scale; qualInv *= scale; welfareInv *= scale; esgInv *= scale;
    if(budgetSpend>0) logs.push({text:'資金不足のため営業・品質・福利厚生・ESG投資が自動的に縮小された。', tag:'warn'});
  }
  s.cash -= salesInv;
  s.cash -= qualInv;
  s.cash -= welfareInv;
  s.cash -= esgInv;
  // 広告・販促・IRチャネル費用
  const adCost = adChannelCostQ(s);
  if(adCost > 0){
    if(adCost > s.cash){
      // 資金不足時は高コスト施策から自動停止
      const order = AD_CHANNEL_IDS.slice().sort((a,b)=>AD_CHANNELS[b].costQ-AD_CHANNELS[a].costQ);
      for(const id of order){
        if(adChannelCostQ(s) <= s.cash) break;
        if(s.adActive[id]){ s.adActive[id]=false; logs.push({text:`資金不足のため「${AD_CHANNELS[id].label}」を停止した。`, tag:'warn'}); }
      }
    }
    const paid = Math.min(s.cash, adChannelCostQ(s));
    adPaid = paid;
    s.cash -= paid;
    if(paid > 0){
      let repGain = 0;
      AD_CHANNEL_IDS.forEach(id=>{
        const ch = AD_CHANNELS[id];
        if(!s.adActive[id]) return;
        if(ch.listedOnly && !s.isListed) return;
        repGain += ch.rep * 0.15;
        s.adAwareness = Math.min(100, (s.adAwareness||0) + ch.salesBoost * 8);
      });
      s.reputation = clamp(s.reputation + repGain, 5, 98);
      const ir = adIrBoost(s);
      if(ir > 0 && s.psr){
        s.psr = Math.min((s.psr||1) * (1 + ir * 0.15), (s.psr||1) + 0.15);
        logs.push({text:`IR施策により市場の注目度が上がった（PSRにプラス）。広告・販促費 ${yen(paid)}。`, tag:'good'});
      } else if(paid > 500000){
        logs.push({text:`広告・販促・広報活動に ${yen(paid)} を投じた（有効チャネルによる新規獲得ブースト約+${Math.round(adSalesBoost(s)*100)}%）。`, tag:'info'});
      }
    }
  }

  // ESGスコアの更新（緩やかに目標値へ収束）
  const esgTarget = clamp(20 + esgInv/250000, 0, 95);
  s.esgScore += (esgTarget - s.esgScore) * 0.15;
  s.esgScore = clamp(s.esgScore, 5, 98);

  // 品質・評判の更新（緩やかに目標値へ収束）
  const qualityTarget = clamp(40 + qualInv/300000 + (s.executives.quality_officer?10:0) + allianceCount(s)*3, 0, 98);
  s.quality += (qualityTarget - s.quality) * 0.25;
  s.quality = clamp(s.quality, 5, 98);
  const repTarget = clamp(s.quality*0.7 + (s.price<1400000?8:0), 0, 98);
  s.reputation += (repTarget - s.reputation) * 0.2;
  s.reputation = clamp(s.reputation, 5, 98);

  // 従業員満足度（福利厚生投資と稼働率から形成）と技術者の離職
  const utilization = capacity(s)>0 ? s.units/capacity(s) : 0;
  const overworkPenalty = Math.max(0, (utilization-0.9)*100);
  // 遊休人員が多いと士気・キャリア不安で満足度が下がる（「雇えば勝つ」の抑制）
  const underworkPenalty = (utilization < 0.55 && s.techs >= 8) ? (0.55 - utilization) * 50 : 0;
  const moraleTarget = clamp(40 + welfareInv/200000 - overworkPenalty - underworkPenalty, 5, 95);
  s.morale += (moraleTarget - s.morale) * 0.2;
  s.morale = clamp(s.morale, 5, 95);
  // 従業員持株会：上場後、士気・福利厚生が高いほど持株比率が緩やかに上昇（上限あり）
  if(s.isListed){
    if(s.esopPct==null) s.esopPct = 0.03;
    const esopTarget = clamp(
      0.02
      + Math.max(0, (s.morale-45)) * 0.0006
      + Math.min(0.03, (s.welfareBudget||0) / 12000000 * 0.03)
      + (s.techs + s.admins > 40 ? 0.01 : 0),
      0.015, 0.12
    );
    s.esopPct += (esopTarget - s.esopPct) * 0.06;
    s.esopPct = clamp(s.esopPct, 0, 0.12);
    // 持株会があるほど定着に寄与（離職率をわずかに抑制）
    s.morale = clamp(s.morale + Math.min(1.5, s.esopPct * 8), 5, 95);
  }
  if((s.soGrantedPct||0) > 0){
    const vestAdd = Math.min(s.soGrantedPct - (s.soVestedPct||0), s.soGrantedPct * 0.08);
    s.soVestedPct = clamp((s.soVestedPct||0) + Math.max(0, vestAdd), 0, s.soGrantedPct);
    if(s.isListed && s.stockPrice && s.soStrike > 0 && s.stockPrice > s.soStrike * 1.05 && (s.soVestedPct||0) > 0){
      const exerciseFrac = Math.min(s.soVestedPct, s.soVestedPct * (0.08 + Math.random()*0.12));
      if(exerciseFrac > 0.0005){
        const newShares = Math.round(s.shares * exerciseFrac);
        if(newShares > 0){
          const proceeds = Math.round(newShares * s.soStrike);
          const prevShares = s.shares;
          s.shares += newShares;
          s.cash += proceeds;
          const scale = s.shares / prevShares;
          s.soGrantedPct = Math.max(0, (s.soGrantedPct - exerciseFrac) / scale);
          s.soVestedPct = Math.max(0, (s.soVestedPct - exerciseFrac) / scale);
          s.esopPct = (s.esopPct||0) / scale;
          logs.push({text:`ストックオプションの権利行使により${num(newShares)}株が発行された（払込 ${yen(proceeds)}）。潜在的な希薄化が進んだ。`, tag:'info'});
        }
      }
    }
    s.morale = clamp(s.morale + Math.min(1.2, (s.soGrantedPct||0)*6), 5, 95);
  }
  const esopRetention = s.isListed ? clamp(1 - esopOwnershipPct(s)*0.35 - (s.soGrantedPct||0)*0.25, 0.80, 1) : clamp(1 - (s.soGrantedPct||0)*0.2, 0.85, 1);
  const turnoverRate = clamp((0.02 - s.morale*0.0002) * esopRetention, 0.001, 0.05);
  const lostTechs = Math.round(s.techs * turnoverRate);
  if(lostTechs > 0){
    s.techs = Math.max(0, s.techs - lostTechs);
    ensureInspectors(s);
    logs.push({text:`技術者${lostTechs}名が離職した（従業員満足度 ${Math.round(s.morale)}/100）。`, tag: s.morale<35 ? 'warn' : 'info'});
  }
  // 事務員も士気が低いと離職。過負荷だとさらに加速
  const adminTurnover = clamp(turnoverRate * (adminLoad(s) > 1.1 ? 1.4 : 1.0), 0.001, 0.06);
  const lostAdmins = Math.round((s.admins||0) * adminTurnover * 0.7);
  if(lostAdmins > 0){
    s.admins = Math.max(0, s.admins - lostAdmins);
    logs.push({text:`事務員${lostAdmins}名が離職した（負荷 ${pct(adminLoad(s),0)}／満足度 ${Math.round(s.morale)}）。`, tag: 'warn'});
  }
  const salesTurnover = clamp(turnoverRate * (salesLoad(s) > 1.2 ? 1.35 : 1.0), 0.001, 0.055);
  const lostSales = Math.round((s.salesStaff||0) * salesTurnover * 0.75);
  if(lostSales > 0){
    s.salesStaff = Math.max(0, (s.salesStaff||0) - lostSales);
    logs.push({text:`営業${lostSales}名が離職した（営業負荷 ${pct(salesLoad(s),0)}／士気 ${Math.round(s.morale)}）。`, tag: 'warn'});
  }

  // ---- 採用パイプラインの入社 & 試用期コホートの早期離職 ----
  resolveRecruitPipeline(s, logs);
  processFraudAndDiscipline(s, logs);
  processNewHireCohorts(s, logs);
  resolveInspectorPipeline(s, logs);
  ensureInspectors(s);

  const adminSvc = (adminSupportMult(s) - 1) * 25; // 適正事務で顧客対応が向上
  const disp = typeof dispatchScore==='function' ? dispatchScore(s) : 55;
  const dispSvc = (disp - 55) * 0.25; // 出動の速さは満足度に直結
  const satisfactionTarget = clamp(30 + s.quality*0.55 + (s.reputation-50)*0.15 + adminSvc + dispSvc, 0, 98);
  s.satisfaction += (satisfactionTarget - s.satisfaction) * 0.2;
  s.satisfaction = clamp(s.satisfaction, 5, 98);

  // メインバンクとの関係（過剰debtでない健全な経営を続けると深まる）
  const bankRelTarget = clamp(70 - leverageRatio(s)*15, 10, 90);
  s.mainBankRelationship += (bankRelTarget - s.mainBankRelationship) * 0.05;
  s.mainBankRelationship = clamp(s.mainBankRelationship, 5, 98);

  s.hireCostMult = 1; // リセット（イベントで一時上昇）

  // ---- 競争圧力・技術熟練度・ポートフォリオ年齢 ----
  s.competitivePressure = competitivePressure(s);
  // 熟練度: 品質投資と研修・稼働の安定で緩やかに上昇、酷使で低下
  const utilBase = baseCapacity(s)>0 ? s.units/baseCapacity(s) : 1;
  let skillDelta = 0.15 + (s.upgrades.training ? 0.25 : 0) + (s.qualityBudget>2000000 ? 0.1 : 0);
  if(utilBase > 1.0) skillDelta -= 0.35;
  if((s.overtimeUnits||0) > 0) skillDelta -= 0.1;
  s.techSkill = clamp((s.techSkill!=null?s.techSkill:50) + skillDelta, 20, 98);
  // 部品方針の品質ドリフトとメーカー関係
  if(typeof partsPolicyInfo==='function'){
    const pp = partsPolicyInfo(s);
    s.quality = clamp(s.quality + (pp.qualityBoost||0)*0.35, 5, 98);
    if(!s.makerRelations) s.makerRelations = {};
    MAKER_IDS.forEach(id=>{
      const cur = s.makerRelations[id]!=null ? s.makerRelations[id] : 50;
      s.makerRelations[id] = clamp(cur + (pp.relationGain||0)*0.4, 5, 95);
    });
  }
  // 保有契約の平均経過年数（新規獲得で若返り、時間経過で上昇）
  s.portfolioAge = (s.portfolioAge!=null?s.portfolioAge:4.5) + 0.25;
  // 更新工事パイプライン生成（対象は経過30年超の推定台数が中心）
  const aged = unitsAgedForRenewal(s);
  const ageFactor = clamp((s.portfolioAge||4.5)/12, 0.4, 2.2);
  // 候補は「30年超台数」と全台ベースの小さい方を加味（若すぎるポートフォリオではほぼ出ない）
  const baseCand = Math.round(Math.max(aged, 0) * 0.08 * ageFactor * (0.85+Math.random()*0.35));
  const legacyCand = Math.round(s.units * C.RENEWAL_BASE_RATE * ageFactor * (0.85+Math.random()*0.3) * clamp(aged/Math.max(1,s.units)*2.5, 0.05, 1));
  s.renewalPipeline = Math.max(0, Math.min(aged, Math.max(baseCand, legacyCand)));
  processRenewalJobs(s, logs);


  // ---- 外注・残業コストと士気への影響 ----
  const outU = Math.max(0, Math.round(s.outsourceUnits||0));
  const otU = Math.max(0, Math.round(s.overtimeUnits||0));
  const flexCost = outU * C.OUTSOURCE_COST_PER_UNIT_Q + otU * C.OVERTIME_COST_PER_UNIT_Q;
  if(flexCost > 0){
    if(flexCost > s.cash){
      // 支払不能なら枠を縮小
      const scale = s.cash>0 ? s.cash/flexCost : 0;
      s.outsourceUnits = Math.round(outU*scale);
      s.overtimeUnits = Math.round(otU*scale);
      logs.push({text:'資金不足のため外注・残業枠が自動縮小された。', tag:'warn'});
    }
    const actualFlex = (s.outsourceUnits||0)*C.OUTSOURCE_COST_PER_UNIT_Q + (s.overtimeUnits||0)*C.OVERTIME_COST_PER_UNIT_Q;
    s.cash -= actualFlex;
  }
  if(otU > 0 && baseCapacity(s)>0){
    const otRatio = otU / baseCapacity(s);
    s.morale = clamp(s.morale - otRatio * C.OVERTIME_MORALE_PENALTY * 100, 5, 95);
  }

  // ---- 契約セグメント構成比を目標へ緩やかに移行 ----
  SEGMENTS.forEach(seg=>{
    const cur = s.segmentMix[seg.id]||0;
    const tgt = s.segmentTarget[seg.id]||0;
    s.segmentMix[seg.id] = cur + (tgt-cur)*0.15;
  });
  const segSum = SEGMENTS.reduce((a,seg)=>a+s.segmentMix[seg.id],0) || 1;
  SEGMENTS.forEach(seg=>{ s.segmentMix[seg.id] = s.segmentMix[seg.id]/segSum; });

  // ---- 契約タイプ構成比（POG／フルメンテナンス）を目標へ緩やかに移行 ----
  s.contractMix.full += (s.contractTarget.full - s.contractMix.full) * 0.15;
  s.contractMix.pog = Math.max(0, 1 - s.contractMix.full);

  // ---- 一時的な地域・全国ブースト（地震・法改正イベントの残存効果）を減衰 ----
  if(s.regionBoost){ s.regionBoost.ticksLeft--; if(s.regionBoost.ticksLeft<=0) s.regionBoost=null; }
  if(s.nationalBoost){ s.nationalBoost.ticksLeft--; if(s.nationalBoost.ticksLeft<=0) s.nationalBoost=null; }
  if(s.quakeImpact){
    s.quakeImpact.ticksLeft--;
    if(s.quakeImpact.ticksLeft<=0){
      logs.push({text:`${s.quakeImpact.regionName||'被災地'}の大地震に伴う運転制限が概ね解除され、売上への直接的な減収圧力が和らいだ。`, tag:'good'});
      s.quakeImpact = null;
    }
  }
  if(s.floodImpact){
    s.floodImpact.ticksLeft--;
    if(s.floodImpact.ticksLeft<=0){
      logs.push({text:`${s.floodImpact.regionName||'被災地'}の浸水復旧需要が一巡し、臨時工事の特需が収束した。`, tag:'info'});
      s.floodImpact = null;
    } else if((s.floodImpact.strain||0) > 1.1){
      s.morale = clamp((s.morale||60) - 0.8, 5, 95);
    }
  }
  if((s.majorQuakeCooldown||0) > 0) s.majorQuakeCooldown--;
  if((s.floodCooldown||0) > 0) s.floodCooldown--;
  if((s.majorDealCooldown||0) > 0) s.majorDealCooldown--;
  if((s.publicBidCooldown||0) > 0) s.publicBidCooldown--;
  if(s.offeringFrozenTicksLeft>0) s.offeringFrozenTicksLeft--;
  if(s.shareActionCooldown>0) s.shareActionCooldown--;
  // 分割/併合の流動性効果は徐々に剥落
  if(s.shareLiquidityBias){
    s.shareLiquidityBias *= 0.88;
    if(Math.abs(s.shareLiquidityBias) < 0.01) s.shareLiquidityBias = 0;
  }

  // ---- 4. 市場規模の成長 ----
  s.marketTotal *= (1 + C.MARKET_GROWTH_Q*cycleGrowthMult);

  // ---- 5〜6. 地方ごとの解約とプール入札（新規獲得競争）----
  function churnRate(rep,qual){
    const pricePressure = (s.competitivePressure||0.5) * 0.008;
    // 事務過負荷は請求・苦情対応の遅れとして解約を押し上げ、適正配置は維持に寄与
    const adminChurn = (1.20 - adminSupportMult(s)) * 0.018;
    // 管理組合・官公庁は説明不足や書類遅延で解約しやすい
    const segChurnBoost = 1 + (portfolioSegmentMix(s).condo_union||0)*0.15 + (portfolioSegmentMix(s).public||0)*0.20 + (portfolioSegmentMix(s).mgmt_company||0)*0.10;
    const dChurn = (s.diffChurnMult != null ? s.diffChurnMult : 1);
    return clamp((C.CHURN_BASE*churnRiskMult(s)*segChurnMult(s)*contractChurnMult(s)+(typeof dispatchChurnAdj==='function'?dispatchChurnAdj(s):0) - (rep-50)*0.00012 - (qual-50)*0.00006 - (s.satisfaction-50)*0.00015 + pricePressure + adminChurn) * segChurnBoost * dChurn, 0.003, 0.055);
  }

  const desiredGains = {};      // region -> 自社の希望獲得台数（容量制約前）
  const rivalGainsByRegion = {}; // region -> {rivalId: 獲得台数}
  let totalDesiredMy = 0;

  REGIONS.forEach(region=>{
    const rid = region.id;
    const myUnitsHere = s.regionUnits[rid]||0;
    const myChurnHere = Math.round(myUnitsHere*churnRate(s.reputation,s.quality));
    s.regionUnits[rid] = myUnitsHere - myChurnHere;

    let rivalChurnHereTotal = 0;
    s.rivals.forEach(r=>{
      const u = r.regionUnits[rid]||0;
      const rc = Math.round(u*churnRate(r.reputation,r.quality));
      r.regionUnits[rid] = u - rc;
      rivalChurnHereTotal += rc;
    });

    const regionBoostMult = (s.regionBoost && s.regionBoost.regionId===rid && s.regionBoost.ticksLeft>0) ? s.regionBoost.mult : 1;
    const nationalBoostMult = (s.nationalBoost && s.nationalBoost.ticksLeft>0) ? s.nationalBoost.mult : 1;
    const availHere = Math.round(regionPool(s,rid)*C.POOL_RELEASE_RATE*cyclePoolMult*regionBoostMult*nationalBoostMult) + myChurnHere + rivalChurnHereTotal;
    if(availHere<=0) return;

    const bidders = [];
    const myBranches = s.regionBranches[rid]||0;
    if(myBranches>0){
      const branchBonus = 1 + C.BRANCH_BONUS_PER_EXTRA*(myBranches-1);
      const activeRegionsCount = Math.max(1, REGIONS.filter(rg=>(s.regionBranches[rg.id]||0)>0).length);
      const perRegionSalesInv = salesInv/activeRegionsCount;
      const mgr = s.branchManagers[rid];
      const managerMult = mgr ? clamp(0.85 + mgr.skill*0.003, 0.85, 1.15) : 1;
      const myPower = (perRegionSalesInv/1500000 + 0.3) * (0.5+s.reputation/100) * (1500000/s.price) * branchBonus * salesPowerMult(s) * managerMult;
      bidders.push({kind:'me', power: Math.max(0.01,myPower)});
    }
    s.rivals.forEach(r=>{
      if((r.regionUnits[rid]||0) <= 0) return; // 未進出の地方では入札しない
      const effort = r.style==='discount' ? 1.4 : r.style==='rollup' ? 0.9 : 0.7;
      const allianceMult = (s.alliances && s.alliances[r.id]) ? 0.5 : 1;
      const power = effort * (0.5+r.reputation/100) * (1500000/r.price) * (s.rivalPowerMult||1) * allianceMult;
      bidders.push({kind:'rival', id:r.id, power: Math.max(0.01,power)});
    });

    const totalPower = bidders.reduce((a,b)=>a+b.power,0);
    if(totalPower<=0) return;
    bidders.forEach(b=>{
      const g = Math.round(availHere*(b.power/totalPower));
      if(b.kind==='me'){
        desiredGains[rid] = (desiredGains[rid]||0)+g;
        totalDesiredMy += g;
      } else {
        rivalGainsByRegion[rid] = rivalGainsByRegion[rid]||{};
        rivalGainsByRegion[rid][b.id] = g;
      }
    });
  });

  // キャパシティ制約：自社の獲得希望合計が定員を超える場合は比例縮小
  const totalAfterChurn = Object.values(s.regionUnits).reduce((a,b)=>a+b,0);
  const spareCapacity = Math.max(0, capacity(s) - totalAfterChurn);
  // 定員があっても品質・事務・ブランドが弱いと獲得効率が落ちる（人員増だけで市場を取れない）
  const convertEff = clamp(
    0.55
    + (s.quality-50)*0.004
    + (s.reputation-50)*0.003
    + (adminSupportMult(s)-1)*0.5
    + (s.satisfaction-50)*0.002,
    0.35, 0.95
  );
  let scaleMy = totalDesiredMy > spareCapacity ? (spareCapacity>0 ? spareCapacity/totalDesiredMy : 0) : 1;
  scaleMy *= convertEff;
  let actualGainTotal = 0;
  Object.keys(desiredGains).forEach(rid=>{
    const g = Math.round(desiredGains[rid]*scaleMy);
    s.regionUnits[rid] = (s.regionUnits[rid]||0) + g;
    actualGainTotal += g;
  });
  // 新規獲得台数を顧客セグメントに配分（官公庁は入札イベント専任のため通常獲得から除外）
  if(actualGainTotal > 0){
    let powers = {};
    let psum = 0;
    SEGMENT_IDS.forEach(id=>{
      if(id === 'public'){ powers[id] = 0; return; }
      powers[id] = CUSTOMER_SEGMENTS[id].marketWeight * segmentSalesPower(s, id);
      psum += powers[id];
    });
    let assigned = 0;
    const allocIds = SEGMENT_IDS.filter(id=>id!=='public');
    allocIds.forEach((id, idx)=>{
      let add = (idx === allocIds.length-1)
        ? (actualGainTotal - assigned)
        : Math.round(actualGainTotal * (powers[id]/Math.max(0.01,psum)));
      add = Math.max(0, add);
      s.segmentUnits[id] = (s.segmentUnits[id]||0) + add;
      assigned += add;
    });
  }
  Object.entries(rivalGainsByRegion).forEach(([rid, byRival])=>{
    Object.entries(byRival).forEach(([rivalId, g])=>{
      const r = s.rivals.find(x=>x.id===rivalId);
      if(r) r.regionUnits[rid] = (r.regionUnits[rid]||0) + g;
    });
  });

  s.units = Object.values(s.regionUnits).reduce((a,b)=>a+b,0);
  s.rivals.forEach(r=>{ r.units = Object.values(r.regionUnits).reduce((a,b)=>a+b,0); });

  if(actualGainTotal > 0){
    logs.push({text:`新規契約 ${num(actualGainTotal)}台を獲得（保有 ${num(s.units)}台）。`, tag:'good'});
    // 新規契約でポートフォリオ平均年齢を若干若返らせる
    const w = s.units > 0 ? actualGainTotal/s.units : 0;
    s.portfolioAge = Math.max(1.5, s.portfolioAge * (1-w) + 1.0*w);
  }

  // 容量オーバーの安全弁チェック
  if(s.units > capacity(s)){
    const overflow = s.units - capacity(s);
    logs.push({text:`技術者不足で対応しきれず${num(overflow)}台分のサービス品質が低下。評判に悪影響。`, tag:'warn'});
    s.reputation -= Math.min(8, overflow/50);
  }

  // ---- 7. ライバルの自律行動（強化版）----
  runRivalDynamics(s, logs);

  // ---- 支社長の経験値上昇と本社栄転 ----
  Object.keys(s.branchManagers).forEach(rid=>{
    const mgr = s.branchManagers[rid];
    mgr.skill = clamp(mgr.skill + BRANCH_MANAGER_SKILL_GROWTH, 0, 99);
    mgr.tenureTicks = (mgr.tenureTicks||0) + 1;
    if(mgr.skill >= BRANCH_MANAGER_PROMOTE_SKILL && mgr.tenureTicks >= BRANCH_MANAGER_PROMOTE_TENURE){
      const region = REGIONS.find(rg=>rg.id===rid);
      s.reputation = clamp(s.reputation+2, 5, 98);
      s.quality = clamp(s.quality+2, 5, 98);
      logs.push({text:`${region?region.name:rid}支社長の${mgr.name}氏が優れた実績により本社に栄転した。現場のノウハウが全社に波及している。後任の支社長選任が必要。`, tag:'good'});
      delete s.branchManagers[rid];
    }
  });


  // ---- 8. ランダムイベント（カタログ＋重要構造イベント）----
  runQuarterEvents(s, logs);

  // セグメント台数を地域合計に同期
  if(typeof syncSegmentUnitsTotal==='function') syncSegmentUnitsTotal(s);

  // ---- 8b. 事務オペレーション効果（請求・報告・回収）----
  {
    const aLoad = adminLoad(s);
    if(aLoad > 1.15){
      // 法定報告・契約更改の遅延リスク
      if(Math.random() < Math.min(0.45, (aLoad-1.15)*0.5)){
        const penalty = Math.round(1500000 + Math.random()*3500000);
        s.cash -= penalty;
        s.reputation = clamp(s.reputation - 2, 5, 98);
        logs.push({text:`事務負荷の高さから定期報告・契約書類の処理が遅れ、督促対応と信用補完に${yen(penalty)}を要した。`, tag:'warn'});
      }
    }
    if(aLoad > 1.25 && s.units > 300){
      const lost = Math.max(1, Math.round(s.units * 0.004 * (aLoad-1)));
      // 解約が事務起因で追加発生
      if(lost > 0 && s.units > lost){
        const ratio = lost / s.units;
        REGIONS.forEach(rg=>{ s.regionUnits[rg.id] = Math.max(0, Math.round((s.regionUnits[rg.id]||0)*(1-ratio))); });
        s.units = Object.values(s.regionUnits).reduce((a,b)=>a+b,0);
        logs.push({text:`請求ミス・対応遅延への不満から、追加で約${num(lost)}台が解約された（事務体制の不足が主因）。`, tag:'warn'});
      }
    }
    if(aLoad < 0.8 && s.admins >= 2){
      // 余裕のある事務は回収・更新提案の質が上がる
      s.satisfaction = clamp(s.satisfaction + 1, 5, 98);
      if(Math.random() < 0.25){
        logs.push({text:'事務部門の契約管理が順調で、更新時期の先回り提案と入金確認が安定している。', tag:'good'});
      }
    }
  }

  processPublicInspectorConstraint(s, logs);

  // ---- 9. 財務計算 ----
  let revenue = annualRevenue(s)/4;
  if(s.quakeImpact && (s.quakeImpact.ticksLeft||0) > 0 && s.quakeImpact.revenueHaircut > 0){
    revenue *= (1 - clamp(s.quakeImpact.revenueHaircut, 0, 0.5));
  }
  if(s.floodImpact && (s.floodImpact.ticksLeft||0) > 0 && (s.floodImpact.bonusRevenuePerQ||0) > 0){
    revenue += Math.round(s.floodImpact.bonusRevenuePerQ);
  }
  const directCost = s.units * effMaintCostPerUnit(s) * (s.diffMaintMult != null ? s.diffMaintMult : 1) / 4;
  const execSalaryTotal = EXECUTIVES.reduce((a,ex)=> a + (s.executives[ex.id] ? ex.salary : 0), 0);
  const laborTight = Number(s.laborTightness)||1;
  const salesSal = (C.SALES_SALARY!=null ? C.SALES_SALARY : 5200000);
  const dLabor = (s.diffLaborMult != null ? s.diffLaborMult : 1);
  const dFixed = (s.diffFixedMult != null ? s.diffFixedMult : 1);
  const laborCost = ((s.techs||0)*C.TECH_SALARY*laborTight + (s.admins||0)*C.ADMIN_SALARY*laborTight + (s.salesStaff||0)*salesSal*laborTight + execSalaryTotal) * dLabor / 4;
  const branchManagerSalaryTotal = Object.keys(s.branchManagers||{}).length * BRANCH_MANAGER_SALARY;
  const fixedCost = (s.branches*C.BRANCH_FIXED_COST + C.HQ_FIXED_COST + s.board.outsiders*BOARD_OUTSIDER_COMP + branchManagerSalaryTotal) * dFixed / 4;
  const sga = revenue * C.SGA_RATE * adminSgaMult(s);
  const insurancePremium = s.units * (Number(s.insuranceCoverage)||0) * INSURANCE_PREMIUM_PER_UNIT / 4;
  // 営業・品質・福利・ESG・広告は既にcash減額済み → 営業費用として損益にも計上（利益率の水増し防止）
  const periodOpex = (typeof salesInv==='number'?salesInv:0)
    + (typeof qualInv==='number'?qualInv:0)
    + (typeof welfareInv==='number'?welfareInv:0)
    + (typeof esgInv==='number'?esgInv:0)
    + (typeof adPaid==='number'?adPaid:0);
  // 外注・残業費は既にcashから控除済み。損益にも計上し、後でcashを戻してからnetで一括反映
  const flexCostAccounted = (s.outsourceUnits||0)*C.OUTSOURCE_COST_PER_UNIT_Q + (s.overtimeUnits||0)*C.OVERTIME_COST_PER_UNIT_Q;
  const opProfit = revenue - directCost - laborCost - fixedCost - sga - insurancePremium - flexCostAccounted - periodOpex;
  // 冒頭で既に cash から引いた flex / opex を一旦戻す。
  // これらは opProfit→netProfit に含まれているため、この後の cash += netProfit で一度だけ反映される。
  // （以前は opex を戻していなかったため、黒字なのに現金だけ減り続ける二重計上バグがあった）
  s.cash += flexCostAccounted + periodOpex;
  ensureLoanBook(s);
  let bankInterest = 0;
  if(s.loans && s.loans.length){
    bankInterest = s.loans.reduce((a,L)=>a + (L.principal||0) * (L.rate!=null?L.rate:baseLoanRate(s)), 0) / 4;
  } else {
    bankInterest = s.debt * (C.LOAN_RATE + s.rateAdj + cycleRateAdj + loanRateExecAdj(s) + creditRatingInfo(s).adj + mainBankRateAdj(s)) / 4;
  }
  let bondInterest = 0, bondPrincipalPay = 0;
  s.bonds.forEach(b=>{
    bondInterest += b.principalRemaining * b.couponRate / 4;
    bondPrincipalPay += Math.min(b.quarterlyPrincipal, b.principalRemaining);
  });
  const interest = bankInterest + bondInterest;
  const preTax = opProfit - interest;
  let taxableIncome = preTax;
  if(preTax < 0){
    s.taxLossCarryforward = (s.taxLossCarryforward||0) + (-preTax);
  } else if(s.taxLossCarryforward > 0){
    const offset = Math.min(taxableIncome, s.taxLossCarryforward);
    taxableIncome -= offset;
    s.taxLossCarryforward -= offset;
  }
  const tax = Math.max(0, taxableIncome*C.TAX_RATE);
  let netProfit = preTax - tax;

  // 非支配株主持分（連結子会社のうち完全所有でない分の利益を控除）
  let minorityInterest = 0;
  s.subsidiaries.forEach(sub=>{
    if(sub.ownershipType==='consolidated'){
      const subQuarterlyProfit = sub.units * SUBSIDIARY_ASSUMED_FEE * SUBSIDIARY_ASSUMED_MARGIN / 4;
      minorityInterest += subQuarterlyProfit * (1 - sub.ownershipPct/100);
    }
  });
  netProfit -= minorityInterest;

  // 持分法による投資利益（持分法適用会社の持分相当利益を計上）
  let equityMethodIncome = 0;
  s.equityMethodHoldings.forEach(eq=>{
    const liveRival = eq.rivalId ? s.rivals.find(r=>r.id===eq.rivalId) : null;
    const unitsForCalc = liveRival ? liveRival.units : eq.units;
    const eqQuarterlyProfit = unitsForCalc * SUBSIDIARY_ASSUMED_FEE * SUBSIDIARY_ASSUMED_MARGIN / 4;
    equityMethodIncome += eqQuarterlyProfit * (eq.ownershipPct/100);
  });
  netProfit += equityMethodIncome;

  // 事務過負荷時は売掛回収が遅れ、今四半期の手元現金化が目減りする
  const collect = adminCollectionMult(s);
  if(collect < 0.999){
    const lag = Math.max(0, revenue * (1 - collect));
    s.cash -= lag;
    logs.push({text:`請求・入金管理の遅延により、今四半期の現金化が約${yen(lag)}相当遅れた（事務負荷 ${pct(adminLoad(s),0)}）。`, tag:'warn'});
  }
  if(!isFinite(netProfit)) netProfit = 0;
  if(!isFinite(opProfit)) { /* already computed */ }
  if(!isFinite(s.cash)) s.cash = 0;
  // 持分法利益・非支配持分は会計上の純利益に含めるが、現金の増減ではない
  const nonCashProfit = (equityMethodIncome||0) - (minorityInterest||0);
  s.cash += netProfit - nonCashProfit;
  // 社債元本返済は損益を通らないキャッシュアウト
  s.cash -= bondPrincipalPay;
  // アーンアウト後払い
  if(s.earnoutLiabilities && s.earnoutLiabilities.length){
    let eoPaid = 0;
    s.earnoutLiabilities.forEach(eo=>{
      const pay = Math.min(eo.remaining, eo.perQuarter||0);
      if(pay > 0){
        s.cash -= pay;
        eo.remaining -= pay;
        eoPaid += pay;
      }
      eo.ticksLeft = (eo.ticksLeft||0) - 1;
    });
    if(eoPaid > 0) logs.push({text:`アーンアウト条項に基づく後払い ${yen(eoPaid)} を支払った。`, tag:'info'});
    s.earnoutLiabilities = s.earnoutLiabilities.filter(eo=>eo.remaining>0 && eo.ticksLeft>0);
  }
  s.bonds.forEach(b=>{ b.principalRemaining -= Math.min(b.quarterlyPrincipal, b.principalRemaining); b.ticksLeft--; });
  const maturedBonds = s.bonds.filter(b=>b.ticksLeft<=0 || b.principalRemaining<=0);
  if(maturedBonds.length>0) logs.push({text:`社債${maturedBonds.length}件が完済・満期を迎えた。`, tag:'info'});
  s.bonds = s.bonds.filter(b=>b.ticksLeft>0 && b.principalRemaining>0);

  // ---- 配当 ----
  let dividendPaid = 0;
  if(s.isListed && s.dividendPayoutRatio>0 && netProfit>0){
    dividendPaid = netProfit * s.dividendPayoutRatio;
    s.cash -= dividendPaid;
    if(s.psr) s.psr += s.dividendPayoutRatio*0.03;
  }
  s.dividendHistory.push(dividendPaid);
  s.cumulativeDividends = (s.cumulativeDividends||0) + dividendPaid;
  if(s.dividendHistory.length>4) s.dividendHistory.shift();
  s.retainedEarnings += netProfit - dividendPaid;
  // 社長個人流動資産: 持株分の配当＋未上場時の役員報酬的な蓄積
  if(s.founderLiquid==null) s.founderLiquid = 50000000;
  if(dividendPaid > 0 && s.isListed){
    s.founderLiquid += Math.round(dividendPaid * founderOwnershipPct(s));
  } else if(!s.isListed){
    s.founderLiquid += 1200000; // 四半期あたりの個人貯蓄目安
  }

  if(netProfit>0) s.profitStreak++; else s.profitStreak = 0;

  const fin = {
    turn:s.turn, label:`${s.year}Q${s.quarter}`,
    revenue: isFinite(revenue)?revenue:0,
    opProfit: isFinite(opProfit)?opProfit:0,
    netProfit: isFinite(netProfit)?netProfit:0,
    cash: isFinite(s.cash)?s.cash:0, units:s.units,
    directCost: isFinite(directCost)?directCost:0,
    laborCost: isFinite(laborCost)?laborCost:0,
    fixedCost: isFinite(fixedCost)?fixedCost:0,
    sga: isFinite(sga)?sga:0,
    periodOpex: isFinite(periodOpex)?periodOpex:0,
    flexCost: isFinite(flexCostAccounted)?flexCostAccounted:0,
    share: marketShare(s.units,s), debt:totalDebt(s),
    stockPrice:s.stockPrice, psr:s.psr,
  };
  s.history.push(fin);
  if(s.history.length>60) s.history.shift();

  s.rivals.forEach(r=>{
    const rrev = r.units * r.price / 4;
    const rmargin = MARGIN_BY_STYLE[r.style] || 0.08;
    r.history = r.history || [];
    r.history.push({label:`${s.year}Q${s.quarter}`, revenue:rrev, opProfit:rrev*rmargin, units:r.units});
    if(r.history.length>60) r.history.shift();
    if(r.history.length>=2){
      const prev = r.history[r.history.length-2], last = r.history[r.history.length-1];
      const growth = prev.units>0 ? (last.units-prev.units)/prev.units : 0;
      const vitalityTarget = clamp(50 + growth*300 + (r.reputation-50)*0.3, 5, 95);
      r.vitality = (r.vitality!=null ? r.vitality : 60) + (vitalityTarget - (r.vitality!=null ? r.vitality : 60))*0.2;
      r.vitality = clamp(r.vitality, 5, 95);
    }
  });

  // ---- 稼働率ストリーク・中期計画進捗 ----
  const utilNow = baseCapacity(s)>0 ? s.units/baseCapacity(s) : 0;
  if(utilNow >= 0.70 && utilNow <= 0.90) s.utilStreak = (s.utilStreak||0)+1;
  else s.utilStreak = 0;

  if(s.midterm && !s.midterm.closed){
    if(s.units >= s.midterm.targetUnits) s.midterm.unitsHit = true;
    if(marketShare(s.units,s) >= s.midterm.targetShare) s.midterm.shareHit = true;
    if(s.midterm.targetIpo && s.isListed) s.midterm.ipoHit = true;
    if(s.turn >= s.midterm.endTurn){
      s.midterm.closed = true;
      const hits = [s.midterm.unitsHit, s.midterm.shareHit, !s.midterm.targetIpo || s.midterm.ipoHit].filter(Boolean).length;
      const need = s.midterm.targetIpo ? 3 : 2;
      if(hits >= need){
        s.reputation = clamp(s.reputation+5, 5, 98);
        s.marketTrust = clamp(s.marketTrust+4, 5, 98);
        logs.push({text:`中期経営計画を達成した（台数${s.midterm.unitsHit?'○':'×'}／シェア${s.midterm.shareHit?'○':'×'}${s.midterm.targetIpo?('／上場'+(s.midterm.ipoHit?'○':'×')):''}）。`, tag:'good'});
      } else {
        s.reputation = clamp(s.reputation-3, 5, 98);
        if(s.isListed) s.marketTrust = clamp(s.marketTrust-3, 5, 98);
        logs.push({text:`中期経営計画は未達に終わった（台数${s.midterm.unitsHit?'○':'×'}／シェア${s.midterm.shareHit?'○':'×'}${s.midterm.targetIpo?('／上場'+(s.midterm.ipoHit?'○':'×')):''}）。`, tag:'warn'});
      }
    }
  }

  // 経営レビュー要約（ログ用）
  s.lastBriefing = {
    revenue, opProfit, netProfit, util: utilNow,
    pressure: s.competitivePressure, skill: s.techSkill, age: s.portfolioAge,
    renewal: s.renewalPipeline||0,
  };

  // ---- 10. 上場後の株価更新 ----
  if(s.isListed){
    const growthQ = s.history.length>=2 ? (s.units - s.history[s.history.length-2].units)/Math.max(1,s.history[s.history.length-2].units) : 0.01;
    const profitability = clamp(netProfit/(revenue||1), -0.2, 0.3);
    const ex = EXCHANGES[s.exchange];
    let targetPsr = ex.psrBase + growthQ*6 + profitability*1.2 + psrExecBonus(s) + (s.marketTrust-50)*0.006 + (s.esgScore-50)*0.005;
    if(annualRevenue(s) > GOVERNANCE_SCRUTINY_REVENUE && independentRatio(s) < (1/3)){
      targetPsr -= 0.08; // 独立社外取締役比率がコーポレートガバナンス・コードの目安(1/3)未満によるディスカウント
    }
    if(equityValue(s) < 0){
      targetPsr -= 0.25; // 債務超過による大幅ディスカウント
      if(!s.insolvencyWarned){
        s.insolvencyWarned = true;
        logs.push({text:'純資産がマイナスとなり債務超過に陥った。上場維持基準への抵触リスクが高まっている。', tag:'warn'});
      }
    } else {
      s.insolvencyWarned = false;
    }
    targetPsr = clamp(targetPsr, 0.25, 3.2);
    // 分割直後は流動性期待でわずかにPSR上振れ、併合は逆（一時効果はbiasに載せる）
    const liqBias = shareLiquidityBias(s);
    targetPsr = clamp(targetPsr + liqBias * 0.08, 0.25, 3.4);
    s.psr += (targetPsr - s.psr)*0.35;
    s.stockPrice = Math.max(10, (annualRevenue(s) * s.psr) / s.shares);
    fin.stockPrice = s.stockPrice; fin.psr = s.psr;
  }

  // ---- 11. 勝敗判定 ----
  if(s.cash < 0){
    if(s.lastEventTag==='cash_negative'){
      s.gameOver = true;
      modal = {type:'over', title:'資金繰り破綻', body:`現金残高がマイナスとなり、${s.companyName}は資金繰りに行き詰まった。ゲームオーバー。`};
    } else {
      s.lastEventTag = 'cash_negative';
      if(s.mainBankRelationship >= 45){
        const rescueAmount = Math.round(Math.abs(s.cash) + 20000000);
        modal = {
          type:'choice',
          title:'メインバンクからの緊急融資打診',
          body:`資金繰りが悪化している。長年の取引関係にあるメインバンクから、緊急融資（${yen(rescueAmount)}・金利${((C.LOAN_RATE+0.01)*100).toFixed(2)}%）の打診があった。`,
          options:[
            {label:'緊急融資を受け入れる', onClick:()=>{
              state.debt += rescueAmount;
              state.cash += rescueAmount;
              state.mainBankRelationship = clamp(state.mainBankRelationship-5, 5, 98);
              state.lastEventTag = null;
              pushLog(state, `メインバンクから${yen(rescueAmount)}の緊急融資を受けた。資金繰りが安定した。`, 'good');
              modal = null; if(!state.gameOver) startTimer(); render();
            }},
            {label:'融資を断り、自力で乗り切る', onClick:()=>{
              pushLog(state, '緊急融資を断った。現金残高がマイナスのままなら、次期に経営破綻するリスクがある。', 'warn');
              modal = null; if(!state.gameOver) startTimer(); render();
            }},
          ]
        };
      } else {
        logs.push({text:'現金残高がマイナスに転落。次期も改善しなければ経営破綻する。', tag:'warn'});
      }
    }
  } else {
    s.lastEventTag = null;
  }

  if(!s.gameOver && !s.victoryAcknowledged && clearConditionsMet(s)){
    s.victory = true;
    s.gameOver = true;
    const score = computeEndScore(s);
    const instPct = playerShareholderStructure(s).find(x=>x.name==='機関投資家').pct;
    modal = {type:'victory', title:'クリア条件達成', body:`${s.companyName}は東証プライムへの市場区分変更を果たし、創業社長の持株比率を${pct(founderOwnershipPct(s),1)}まで引き下げて流通株式を確保、機関投資家保有比率${pct(instPct,1)}のカバレッジを獲得するに至った。上場企業としての成熟をここに達成し、創業社長の個人資産は ${yen(playerNetWorth(s))} に達した。\n\n所要年数 ${score.years.toFixed(2)}年／買収社数 ${RIVAL_TEMPLATES.length-s.rivals.length}社／重大事故 ${s.accidentCount||0}件\n経営者評価スコア ${score.score}点　ランク【${score.rank}】`};
  }
  if(s.gameOver) stopTimer();

  // ---- 本決算チェック（第4四半期終了時。勝敗確定時は優先して勝敗モーダルを表示）----
  if(s.quarter===4 && !modal){
    const last4 = s.history.slice(-4);
    const fyRevenue = last4.reduce((a,f)=>a+f.revenue,0);
    const fyNetProfit = last4.reduce((a,f)=>a+f.netProfit,0);
    const startUnits = s.fyStartUnits||s.units;
    const startShare = s.fyStartShare!=null ? s.fyStartShare : marketShare(s.units,s);
    const endShare = marketShare(s.units,s);
    let guidanceLine = '通期業績予想は未発表だった。';
    if(s.guidance.target && s.guidance.setYear===s.year){
      const stance = GUIDANCE_STANCES[s.guidance.stance];
      const stanceLabel = stance ? `（${stance.label}予想）` : '';
      const missMult = stance ? stance.missPenaltyMult : 1.0;
      const achievement = fyRevenue / s.guidance.target;
      if(achievement >= 1.05){
        s.reputation = clamp(s.reputation+3, 5, 98);
        s.marketTrust = clamp(s.marketTrust+4, 5, 98);
        if(s.psr) s.psr *= 1.06;
        guidanceLine = `通期予想${stanceLabel} ${yen(s.guidance.target)} に対し実績 ${yen(fyRevenue)}（達成率 ${pct(achievement,1)}）。予想を上回る決算として好感された。`;
        logs.push({text:'通期業績予想を上回る決算となり、市場から好感された。', tag:'good'});
      } else if(achievement < 1.0){
        const severe = achievement < 0.85;
        const repPenalty = Math.round((severe?5:2) * missMult);
        const trustPenalty = Math.round((severe?7:3) * missMult);
        const psrPenalty = severe ? 0.92 : 0.97;
        s.reputation = clamp(s.reputation-repPenalty, 5, 98);
        s.marketTrust = clamp(s.marketTrust-trustPenalty, 5, 98);
        if(s.psr) s.psr *= psrPenalty;
        guidanceLine = `通期予想${stanceLabel} ${yen(s.guidance.target)} に対し実績 ${yen(fyRevenue)}（達成率 ${pct(achievement,1)}）。${severe?'大幅な未達により信認が大きく低下した。':'未達により信認がやや低下した。'}`;
        logs.push({text: severe ? '通期業績予想を大きく下回り、市場の信認が低下した。' : '通期業績予想に届かず、市場の信認がやや低下した。', tag:'warn'});
      } else {
        guidanceLine = `通期予想${stanceLabel} ${yen(s.guidance.target)} に対し実績 ${yen(fyRevenue)}（達成率 ${pct(achievement,1)}）。ほぼ計画通りの着地。`;
      }
    }
    let complianceLine = '法定点検報告は適正に完了している。';
    if(s.quality < 35){
      const complianceFine = (3000000 + Math.random()*5000000) * (1 - clamp(s.esgScore,0,80)*0.004);
      s.cash -= complianceFine;
      s.reputation = clamp(s.reputation-4, 5, 98);
      complianceLine = `法定点検報告に不備が確認され、特定行政庁より行政指導を受けた（対応費用 ${yen(complianceFine)}）。`;
      logs.push({text:'法定点検報告の不備により行政指導を受けた。', tag:'warn'});
    }
    // 上場維持費用（年次・四半期レビューとは別枠）
    const maintainFee = (typeof listingMaintainFeeAnnual==='function') ? listingMaintainFeeAnnual(s) : 0;
    if(maintainFee > 0 && s.isListed){
      s.cash -= maintainFee;
      logs.push({text:`上場維持費用 ${yen(maintainFee)} を納付した（${listedMarkets(s).map(k=>EXCHANGES[k]?EXCHANGES[k].short:k).join('・')}）。`, tag:'info'});
    }
    const fyOp = last4.reduce((a,f)=>a+(f.opProfit||0),0);
    // 一年を振り返る業績レポート（毎四半期の lastBriefing とは別に保存）
    const report = {
      year: s.year,
      revenue: fyRevenue,
      opProfit: fyOp,
      netProfit: fyNetProfit,
      unitsStart: startUnits,
      units: s.units,
      shareStart: startShare,
      share: endShare,
      cash: s.cash,
      listedOn: (typeof listedMarkets==='function'?listedMarkets(s):[]).slice(),
      shareholders: s.isListed ? estimatedShareholderCount(s) : 1,
      awareness: typeof brandAwareness==='function'?brandAwareness(s):0,
      maintainFee,
      quality: s.quality,
      reputation: s.reputation,
      guidanceLine,
      complianceLine,
      quarters: last4.map(f=>({label:f.label, revenue:f.revenue, netProfit:f.netProfit, units:f.units})),
    };
    s.annualReports = s.annualReports || [];
    s.annualReports.unshift(report);
    if(s.annualReports.length > 12) s.annualReports.pop();
    logs.push({text:`【${s.year}年 年次業績レポート】通期売上 ${yen(fyRevenue)}／純利益 ${yen(fyNetProfit)}／台数 ${num(startUnits)}→${num(s.units)}。一年の振り返りを記録した。`, tag: fyNetProfit>=0?'good':'warn'});

    modal = {
      type:'annual',
      title:`${s.year}年度 年次業績レポート`,
      body:`■ 通期業績（一年の振り返り）
売上高 ${yen(fyRevenue)}／営業利益 ${yen(fyOp)}／当期純利益 ${yen(fyNetProfit)}

■ 契約・シェア
保守台数 ${num(startUnits)}台 → ${num(s.units)}台
市場シェア ${pct(startShare,2)} → ${pct(endShare,2)}
品質 ${Math.round(s.quality)}／評判 ${Math.round(s.reputation)}

■ 四半期の推移
${last4.map(f=>`${f.label}: 売上 ${yen(f.revenue)}／純利益 ${yen(f.netProfit)}`).join('\n')}

■ 財務・ガバナンス
信用格付け ${creditRatingInfo(s).label}／自己資本比率 ${pct(equityRatio(s),1)}／現金 ${yen(s.cash)}
取締役会 社内${s.board.insiders}名／社外${s.board.outsiders}名（独立社外 ${pct(independentRatio(s),0)}）
${s.isListed?`上場: ${listedMarkets(s).map(k=>EXCHANGES[k].short).join('・')}／推定株主 約${num(estimatedShareholderCount(s))}人／知名度 ${Math.round(brandAwareness(s))}`:'（未上場）'}
${maintainFee>0?`上場維持費用 ${yen(maintainFee)}`:''}

■ コンプライアンス・予想
${complianceLine}
${guidanceLine}`,
    };
    s.guidance = {target:null, setYear:null};
  }

  // ---- 実績チェック ----
  ACHIEVEMENTS.forEach(ach=>{
    if(!s.achievements[ach.id] && ach.check(s)){
      s.achievements[ach.id] = true;
      logs.push({text:`実績解除: ${ach.name}`, tag:'good'});
    }
  });

  logs.forEach(l=>pushLog(s,l.text,l.tag));

  // ---- 12. ターン進行 ----
  s.quarter++;
  if(s.quarter>4){ s.quarter=1; s.year++; }
  s.turn++;
  if(s.quarter===1){
    s.fyStartUnits = s.units;
    s.fyStartShare = marketShare(s.units, s);
  }
}

function spawnMandaOffer(s){
  const name = MANDA_NAME_POOL[Math.floor(Math.random()*MANDA_NAME_POOL.length)] + (Math.random()<0.3?'2':'');
  const region = REGIONS[Math.floor(Math.random()*REGIONS.length)];
  const units = Math.round(300 + Math.random()*2600);
  const rev = units * (1100000+Math.random()*500000);
  const mult = 0.9 + Math.random()*0.5;
  const offer = {
    id: 'm'+Date.now()+Math.floor(Math.random()*999),
    name, units,
    regionId: region.id,
    regionName: region.name,
    price: Math.round(rev*mult),
    acceptShares: s.isListed,
    expiresTurn: s.turn+4,
  };
  mandaOffers.push(offer);
  return offer;
}

/* ---- 円グラフ描画（SVG文字列をinnerHTML経由で挿入し、名前空間問題を回避）---- */
function pieToXY(cx,cy,r,angleDeg){
  const a = angleDeg * Math.PI/180;
  return { x: cx + r*Math.sin(a), y: cy - r*Math.cos(a) };
}
function pieSlicePath(cx,cy,r,startDeg,endDeg){
  const p1 = pieToXY(cx,cy,r,startDeg);
  const p2 = pieToXY(cx,cy,r,endDeg);
  const largeArc = (endDeg-startDeg) > 180 ? 1 : 0;
  return `M ${cx} ${cy} L ${p1.x.toFixed(2)} ${p1.y.toFixed(2)} A ${r} ${r} 0 ${largeArc} 1 ${p2.x.toFixed(2)} ${p2.y.toFixed(2)} Z`;
}
function escapeXml(str){
  return String(str).replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function buildPieSvg(entries, size){
  size = size || 190;
  const total = entries.reduce((a,e)=>a+Math.max(0,e.units),0) || 1;
  const cx = size/2, cy = size/2, r = size/2 - 3;
  let angle = 0;
  const parts = [];
  entries.forEach(e=>{
    const share = Math.max(0,e.units)/total;
    if(share <= 0.0005) return;
    const sweep = share*360;
    const clampedSweep = Math.min(sweep, 359.99); // 完全な360度だとパスが潰れるため
    const path = pieSlicePath(cx,cy,r,angle, angle+clampedSweep);
    parts.push(`<path d="${path}" fill="${e.color}" stroke="#12161b" stroke-width="1"><title>${escapeXml(e.name)}: ${pct(share,1)}</title></path>`);
    angle += sweep;
  });
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="display:block;margin:0 auto;">${parts.join('')}</svg>`;
}

function el(tag, attrs, ...children){
  const e = document.createElement(tag);
  if(attrs) Object.entries(attrs).forEach(([k,v])=>{
    if(k==='class') e.className=v;
    else if(k==='html') e.innerHTML=v;
    else if(k.startsWith('on') && typeof v === 'function'){
      const type = k.slice(2).toLowerCase(); // onclick -> click
      // addEventListener のみ（プロパティにも代入すると同一ハンドラが二重発火する）
      e.addEventListener(type, v);
    }
    else if(v===null||v===undefined||v===false){ /* 属性を付けない（disabled誤爆防止）*/ }
    else if(v===true) e.setAttribute(k,'');
    else e.setAttribute(k, String(v));
  });
  children.flat().forEach(c=>{
    if(c===null||c===undefined) return;
    if(typeof c==='string'||typeof c==='number') e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  });
  return e;
}


/** 小さな人物スプライト（CSSアニメ用） */
function buildPerson(role, anim, opts){
  opts = opts || {};
  const p = el('div',{class:'person '+(role||'tech')+' '+(anim||'idle'), title: opts.title||''});
  p.appendChild(el('div',{class:'p-head'}));
  p.appendChild(el('div',{class:'p-arm-l'}));
  p.appendChild(el('div',{class:'p-arm-r'}));
  p.appendChild(el('div',{class:'p-body'}));
  p.appendChild(el('div',{class:'p-leg-l'}));
  p.appendChild(el('div',{class:'p-leg-r'}));
  if(role==='tech' || role==='inspector' || opts.tool){
    p.appendChild(el('div',{class:'p-tool'}));
  }
  return p;
}
function buildPersonStage(people, stageClass){
  const stage = el('div',{class:'person-stage '+(stageClass||'')});
  (people||[]).forEach(spec=>{
    if(typeof spec === 'string'){
      // "tech:repair" or "sales:walk"
      const parts = spec.split(':');
      stage.appendChild(buildPerson(parts[0], parts[1]||'idle'));
    } else {
      stage.appendChild(buildPerson(spec.role, spec.anim, spec));
    }
  });
  return stage;
}
function peopleForModal(m){
  if(!m) return ['tech:idle'];
  const t = m.type||'';
  if(t==='victory' || t==='retire') return ['ceo:cheer','sales:cheer','tech:cheer','admin:cheer'];
  if(t==='over') return ['ceo:panic','admin:panic','tech:panic'];
  if(t==='annual') return ['ceo:wave','admin:idle','sales:phone'];
  const title = (m.title||'')+(m.body||'');
  if(/倒産|破産|緊急融資|資金ショート|不正|不祥事/.test(title)) return ['ceo:panic','admin:panic'];
  if(/上場|IPO|買収成功|大型受注|快挙/.test(title)) return ['ceo:cheer','sales:cheer','tech:wave'];
  if(/大地震/.test(title)) return ['tech:repair','inspector:repair','tech:panic','admin:phone'];
  if(/大雨|浸水/.test(title)) return ['tech:repair','tech:walk','inspector:repair','tech:repair'];
  if(/検査|保守|故障|修理|現場/.test(title)) return ['tech:repair','inspector:repair','tech:walk'];
  if(/採用|人事|研修/.test(title)) return ['admin:wave','tech:idle','sales:idle'];
  if(/営業|契約|入札/.test(title)) return ['sales:phone','sales:walk','admin:idle'];
  if(t==='choice' || t==='event') return ['ceo:idle','admin:wave'];
  return ['tech:idle','admin:idle'];
}

  panel.appendChild(el('div',{class:'desc', style:'font-size:11px;line-height:1.7;margin-bottom:12px;'},
    '関東を拠点に、独立系エレベーター保守事業者としてスタートする。営業・品質・人員・資金・M&A・上場まで、現実に近い制約の中で判断する経営シミュレーションです。\nゲーム内の「学習」タブで用語と原則を学びながら進められます。クリア条件は市場独占ではなく、プライム上場・流通株式・機関投資家カバレッジ、および創業社長の個人資産2000億円の達成です。'
  ));

  panel.appendChild(el('button',{class:'btn btn-primary btn-full', onclick:()=>doStartGame(nameInp.value, selectedDiff)}, '創業する ▶'));
  panel.appendChild(el('button',{class:'btn btn-full', style:'margin-top:8px;', onclick:()=>openSaveModal()}, 'セーブデータから再開する'));
  panel.appendChild(el('button',{class:'btn btn-full', style:'margin-top:6px;', onclick:doImportSave}, 'ファイルから読み込む'));

  // 保存状態・永続化可否の表示
  const saveStatus = el('div',{id:'save-status-box', style:'margin-top:14px;padding:10px 12px;background:rgba(0,0,0,0.25);border-radius:8px;font-size:12px;line-height:1.55;color:var(--paper-dim);'});
  saveStatus.textContent = 'セーブ状態を確認中…';
  panel.appendChild(saveStatus);
  // 非同期でスロットを走査
  (async ()=>{
    try{
      const can = StorageAPI.canPersist();
      const lines = [];
      if(!can){
        lines.push('⚠ この環境ではブラウザ保存が使えません。閉じると消えます。必ず「ファイルに書き出し」でバックアップしてください。');
      } else {
        lines.push('ブラウザ保存: 利用可能（同じファイル・同じブラウザなら閉じても残ります）');
      }
      let any = false;
      for(let i=0;i<=SAVE_SLOT_COUNT;i++){
        const data = await readSaveFromSlot(i);
        if(data && data.state){
          any = true;
          const meta = data.meta || buildSaveMeta(data.state);
          const label = i===0 ? 'オート' : `スロット${i}`;
          lines.push(`・${label}: ${formatSaveMetaLine(meta)}`);
        }
      }
      if(!any) lines.push('保存データ: なし（ファイルから読み込むか、新規創業してください）');
      saveStatus.innerHTML = '';
      lines.forEach((ln,idx)=>{
        const d = el('div',{style: idx===0 && !can ? 'color:#f0a0a0;font-weight:600;' : ''}, ln);
        saveStatus.appendChild(d);
      });
      if(!can){
        saveStatus.appendChild(el('div',{style:'margin-top:6px;color:var(--amber);'}, '推奨: プレイの区切りごとに「書出」でJSONを保存'));
      }
    }catch(e){
      saveStatus.textContent = 'セーブ状態の確認に失敗しました。ファイル読み込みを利用してください。';
    }
  })();

  wrap.appendChild(panel);
  wrap.appendChild(el('div',{class:'footer-note'},
    '本ゲームはフィクションです。登場する企業・数値は実在の企業とは関係ありません。セーブはブラウザに保存されますが、環境によっては消えることがあります。重要な進行は「書出」でファイル保存してください。'
  ));
  return wrap;
}

function render(){
  const app = document.getElementById('app');
  if(!gameStarted){
    try{ document.body.classList.remove('has-ticker'); }catch(e){}
    const oldT = document.getElementById('event-ticker');
    if(oldT && oldT.parentNode) oldT.parentNode.removeChild(oldT);
    app.innerHTML = '';
    app.appendChild(renderStartScreen());
    return;
  }
  // ティックの自動再描画でフォーカス中の入力欄が消えないよう、フィールドを記憶して復元する
  const active = document.activeElement;
  const activeField = (active && active.dataset) ? active.dataset.field : null;
  const selStart = (activeField && active.selectionStart!=null) ? active.selectionStart : null;

  app.innerHTML = '';
  app.appendChild(renderHeader());
  app.appendChild(renderKpiStrip());
  app.appendChild(renderTabBar());

  if(activeTab==='overview'){
    app.appendChild(renderLogPanel());
    app.appendChild(renderQuickBar());
    app.appendChild(renderCoachPanel());
    app.appendChild(renderAlertsPanel());
    app.appendChild(renderCustomerPortfolioPanel());
    app.appendChild(renderMidtermPanel());
    app.appendChild(renderClearConditionsPanel());
  } else if(activeTab==='market'){
    app.appendChild(renderQualityPanel());
    app.appendChild(renderMarketPanel());
  } else if(activeTab==='management'){
    app.appendChild(renderCoachPanel());
    app.appendChild(renderManagementPanel());
  } else if(activeTab==='finance'){
    app.appendChild(renderFinancingPanel());
    app.appendChild(renderFinancePanel());
  } else if(activeTab==='orgdeals'){
    app.appendChild(renderUpgradesPanel());
    app.appendChild(renderExecutivesPanel());
    app.appendChild(renderBoardPanel());
    app.appendChild(renderSubsidiariesPanel());
    app.appendChild(renderMandaPanel());
    app.appendChild(renderAlliancePanel());
    app.appendChild(renderTakeoverPanel());
  } else if(activeTab==='company'){
    app.appendChild(renderShikihoPanel());
    app.appendChild(renderShareholdersPanel());
    app.appendChild(renderAchievementsPanel());
  } else if(activeTab==='learn'){
    app.appendChild(renderLearnPanel());
  }

  app.appendChild(el('div',{class:'footer-note'},
    '本ゲームはフィクションです。登場する企業・数値は実在の企業とは関係ありません。実在企業データの数値感を参考にしたバランス設計を行っています。',
    el('br'), 'MARKLEY ELEVATORの野望'
  ));

  ensureEventTicker();

  if(modal){
    app.appendChild(renderModal());
  }

  if(activeField){
    const revived = app.querySelector(`[data-field="${activeField}"]`);
    if(revived){
      revived.focus();
      if(selStart!=null){
        try{ revived.setSelectionRange(selStart, selStart); }catch(e){ /* type=numberでは非対応な場合がある */ }
      }
    }
  }
}

function renderHeader(){
  const s = state;
  const header = el('div',{class:'shaft-header'});

  // 1行目: 社名 + 進行ステータス
  const statusClass = s.gameOver ? 'over' : (isRunning ? 'run' : 'pause');
  const statusText = s.gameOver ? '終了' : (isRunning ? '進行中' : '一時停止');
  const top = el('div',{class:'header-top'});
  const left = el('div',{class:'shaft-left'},
    el('div',{class:'company-name dot'}, s.companyName.replace('株式会社','')),
    el('div',{class:'company-sub'}, s.isListed
      ? `${EXCHANGES[s.exchange].name} ／ 株価 ${s.stockPrice?num(s.stockPrice):'-'}円 ／ PSR ${s.psr?s.psr.toFixed(2):'-'}倍`
      : '未上場の独立系エレベーター保守会社')
  );
  top.appendChild(left);
  // 状況に応じた人物アニメ
  let headerPeople = ['tech:repair','admin:idle'];
  if(s.gameOver) headerPeople = ['ceo:panic','admin:panic'];
  else if((s.profitStreak||0) >= 4) headerPeople = ['tech:wave','sales:cheer'];
  else if((s.morale||50) < 35) headerPeople = ['tech:panic','admin:idle'];
  else if((s.techs||0) >= 3) headerPeople = ['tech:repair','tech:walk','inspector:idle'];
  else if((s.salesStaff||0) >= 1) headerPeople = ['sales:phone','tech:repair'];
  top.appendChild(buildPersonStage(headerPeople, 'sm header-stage'));
  top.appendChild(el('div',{class:'status-pill '+statusClass}, statusText));
  header.appendChild(top);

  // 2行目: いま知るべき数字（期・台数・現金・稼働）
  const util = capacity(s)>0 ? s.units/capacity(s) : 0;
  const meta = el('div',{class:'header-meta'});
  meta.appendChild(el('div',{class:'meta-card'},
    el('div',{class:'k'}, '会計期'),
    el('div',{class:'v amber'}, `${s.year}年 Q${s.quarter}`)
  ));
  meta.appendChild(el('div',{class:'meta-card'},
    el('div',{class:'k'}, '保守契約'),
    el('div',{class:'v'}, num(s.units)+'台')
  ));
  meta.appendChild(el('div',{class:'meta-card'},
    el('div',{class:'k'}, '現金'),
    el('div',{class:'v'+(s.cash<15000000?' amber':'')}, yen(s.cash))
  ));
  meta.appendChild(el('div',{class:'meta-card'},
    el('div',{class:'k'}, '稼働率'),
    el('div',{class:'v'+(util>0.95?' amber':'')}, pct(util,0))
  ));
  header.appendChild(meta);

  // 3行目: 操作（再生を大きく、速度・保存は小さく）
  const controls = el('div',{class:'header-controls'});
  controls.appendChild(el('button',{
    class:'btn btn-play '+(isRunning?'btn-primary':'btn-danger'),
    onclick:toggleRun,
    disabled:s.gameOver
  }, isRunning ? '⏸ 一時停止' : '▶ 再開する'));

  const speedG = el('div',{class:'speed-group'});
  [1,2,4].forEach(sp=>{
    speedG.appendChild(el('button',{
      class:'btn btn-small'+(speed===sp?' btn-primary':''),
      onclick:()=>setSpeed(sp)
    }, '×'+sp));
  });
  controls.appendChild(speedG);

  const utilG = el('div',{class:'util-group'});
  utilG.appendChild(el('button',{class:'btn btn-small'+(bgmOn?' btn-primary':''), onclick:toggleBgm, title:bgmCurrentName()}, bgmOn?('♪ '+bgmCurrentName()):'♪'));
  utilG.appendChild(el('button',{class:'btn btn-small', onclick:cycleBgmTrack, title:'曲を切り替え: '+bgmCurrentName()}, '曲'+((bgmTrackIndex%BGM_TRACKS.length)+1)));
  utilG.appendChild(el('button',{class:'btn btn-small', onclick:()=>openSaveModal()}, 'セーブ'));
  utilG.appendChild(el('button',{class:'btn btn-small', onclick:doExportSave}, '書出'));
  utilG.appendChild(el('button',{class:'btn btn-small', onclick:doImportSave}, '読込'));
  utilG.appendChild(el('button',{class:'btn btn-small btn-danger', onclick:()=>{
    if(confirm('最初からやり直しますか？進捗は失われます。')) doReset();
  }}, 'リセット'));
  controls.appendChild(utilG);
  header.appendChild(controls);

  return header;
}

      panel.appendChild(row);
    }
    panel.appendChild(el('button',{class:'btn btn-primary btn-full', onclick:()=>{
      setMidtermPlan(Number(uInp.value)||s.units, Number(shInp.value)||5, !s.isListed && ipoChk.checked);
    }}, '中期計画を策定する'));
    return panel;
  }
  const m = s.midterm;
  const left = Math.max(0, m.endTurn - s.turn);
  const uProg = clamp(s.units / m.targetUnits, 0, 1.2);
  const sProg = clamp(marketShare(s.units,s) / m.targetShare, 0, 1.2);
  panel.appendChild(el('div',{class:'desc', style:'font-size:12px;margin-bottom:8px;'},
    m.closed
      ? `計画期間終了。結果: 台数${m.unitsHit?'達成':'未達'}／シェア${m.shareHit?'達成':'未達'}${m.targetIpo?('／上場'+(m.ipoHit?'達成':'未達')):''}`
      : `残 ${left} 四半期（〜${m.endTurn}ターン）。コミットメント中。`));
  const rowU = el('div',{style:'margin-bottom:8px;font-size:12px;'});
  rowU.appendChild(el('div',{}, `台数 ${num(s.units)} / ${num(m.targetUnits)} ${m.unitsHit?'✓':''}`));
  rowU.appendChild(el('div',{class:'plan-bar'}, el('div',{style:`width:${Math.min(100,uProg*100)}%;`})));
  panel.appendChild(rowU);
  const rowS = el('div',{style:'margin-bottom:8px;font-size:12px;'});
  rowS.appendChild(el('div',{}, `シェア ${pct(marketShare(s.units,s),2)} / ${pct(m.targetShare,1)} ${m.shareHit?'✓':''}`));
  rowS.appendChild(el('div',{class:'plan-bar'}, el('div',{style:`width:${Math.min(100,sProg*100)}%;`})));
  panel.appendChild(rowS);
  if(m.targetIpo){
    panel.appendChild(el('div',{style:'font-size:12px;margin-bottom:6px;'}, `上場目標: ${m.ipoHit||s.isListed?'達成済':'未達'}`));
  }
  if(m.closed){
    panel.appendChild(el('button',{class:'btn btn-small', onclick:()=>{ state.midterm=null; render(); autoSave(); }}, '新しい計画を立てる'));
  }
  return panel;
}

function renderQualityPanel(){
  const s = state;
  const panel = el('div',{class:'panel'});
  panel.appendChild(el('h2',{}, '品質・顧客満足度'));

  function gaugeColor(v){
    if(v<35) return 'var(--red)';
    if(v<65) return 'var(--amber)';
    return 'var(--green)';
  }
  function gaugeRow(label, value, hint){
    const row = el('div',{style:'margin-bottom:10px;'});
    const top = el('div',{style:'display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;'});
    top.appendChild(el('span',{style:'color:var(--paper-dim);'}, label));

    row.appendChild(top);
    const track = el('div',{class:'bar-track'});
    track.appendChild(el('div',{class:'bar-fill', style:`width:${clamp(value,0,100)}%;background:${gaugeColor(value)};`}));
    row.appendChild(track);
    if(hint) row.appendChild(el('div',{class:'field-hint', style:'margin-top:3px;'}, hint));

  panel.appendChild(gaugeRow('品質スコア', s.quality, '品質投資で向上。事故発生確率・解約率に影響。'));
  panel.appendChild(gaugeRow('評判', s.reputation, '新規契約の獲得力に影響。'));
  panel.appendChild(gaugeRow('顧客満足度', s.satisfaction, '品質・評判・緊急対応の実績から形成。既存契約の解約率に直結。'));
  panel.appendChild(gaugeRow('従業員満足度', s.morale, '福利厚生投資と稼働率で形成。低いと離職する。'));
  panel.appendChild(gaugeRow('事務余力', clamp(100*(2-adminLoad(s)), 0, 100), `負荷 ${pct(adminLoad(s),0)}。請求・法定報告・顧客窓口の余力。低いと解約・回収遅延・事故リスク。`));
  panel.appendChild(gaugeRow('技術者熟練度', s.techSkill!=null?s.techSkill:50, '1人あたり対応台数（上限150）とリペア売上に影響。研修・安定稼働で上昇、酷使で低下。'));
  panel.appendChild(gaugeRow('価格競争圧力', (s.competitivePressure||0)*100, '自社単価がライバル平均より高いと上昇。解約率に影響。'));
  panel.appendChild(gaugeRow('メインバンクとの関係', s.mainBankRelationship, '過剰債務でない健全経営で深まる。深いほど借入金利が有利になり、資金繰り悪化時に緊急融資を受けやすい。'));
  if(s.isListed){
    panel.appendChild(gaugeRow('ESGスコア', s.esgScore, 'ESG投資で向上。株価評価にプラスに働き、行政指導時の対応費用を軽減する。'));
  }
  if(s.isListed){
    panel.appendChild(gaugeRow('株式市場信頼度', s.marketTrust, '弱気予想の発表や業績予想未達で低下。株価評価に持続的な影響を与える。'));
  }
  return panel;
}

function renderKpiStrip(){
  const s = state;
  const share = marketShare(s.units,s);
  const strip = el('div',{class:'kpi-strip'});
  // スマホで最初に目に入る4指標に絞り、続けて補足
  strip.appendChild(kpi('市場シェア', pct(share,2), `首位 ${pct(leaderShare(s),1)}`, isPlayerLeader(s)?'up':''));
  strip.appendChild(kpi('従業員', num(s.techs+(s.admins||0)+(s.salesStaff||0))+'名', `技術${s.techs}／営業${s.salesStaff||0}／事務${s.admins||0}`));
  strip.appendChild(kpi('組織誠実性', Math.round(s.integrity!=null?s.integrity:72)+'', `人材質 ${Math.round(staffQualityIndex(s))}／不正圧力 ${Math.round(s.fraudPressure||0)}`, (s.integrity||72)>=55?'up':(s.integrity||72)<40?'down':''));
  strip.appendChild(kpi('事務負荷', pct(adminLoad(s),0), `処理能力 ${num(adminCapacity(s))}台／支援指数 ${adminSupportMult(s).toFixed(2)}`, adminLoad(s)>1.1?'down':adminLoad(s)<0.85?'up':''));
  strip.appendChild(kpi('信用格付', creditRatingInfo(s).label, `負債/売上 ${leverageRatio(s).toFixed(2)}x`));
  strip.appendChild(kpi('自己資本比率', pct(equityRatio(s),1), equityValue(s)<0?'債務超過':'健全', equityValue(s)<0?'down':'up'));
  const lastOp = s.history.length ? s.history[s.history.length-1].opProfit : 0;
  const lastRev = s.history.length ? s.history[s.history.length-1].revenue : 0;
  strip.appendChild(kpi('営業利益率', lastRev?pct(lastOp/lastRev,1):'—', '売上−原価・人件費・販管・投資・広告', lastOp>=0?'up':'down'));
  strip.appendChild(kpi('競争圧力', pct(s.competitivePressure||competitivePressure(s),0), `年額 ${yen(s.price)}/台`));
  strip.appendChild(s.isListed
    ? kpi('時価総額', yen(s.stockPrice*s.shares), `株価 ${num(s.stockPrice)}円`)
    : kpi('上場', ipoEligible(s)?'基準達成':'未上場', ipoEligible(s)?'申請可能':'条件不足'));
  strip.appendChild(kpi('支店', num(s.branches)+'拠点', totalDebt(s)>0?`負債 ${yen(totalDebt(s))}`:'無借金'));
  return strip;
}

function field(label, inputEl, hint){
  const row = el('div',{class:'field-row'}, el('label',{}, label), inputEl);
  const wrap = el('div',{});
  wrap.appendChild(row);
  if(hint) wrap.appendChild(el('div',{class:'field-hint'}, hint));
  return wrap;
}

function numberInput(value, min, max, step, onChange){
  const inp = el('input',{type:'number', value:String(Math.round(value)), min:String(min), max:String(max), step:String(step)});
  inp.addEventListener('input', ()=>{ onChange(Number(inp.value)||0); });
  return inp;
}

    const otInp = numberInput(s.overtimeUnits||0,0,3000,10,v=>{ s.overtimeUnits=Math.max(0,Math.round(v)); });
    otInp.dataset.field = 'overtimeUnits';
    block.appendChild(field('残業枠（台）', otInp, `四半期コスト 約 ${yen((s.overtimeUnits||0)*C.OVERTIME_COST_PER_UNIT_Q)}／士気への負荷あり`));

    const aged = unitsAgedForRenewal(s);
    const cand = Math.max(0, Math.round(s.renewalPipeline||0));
    const chase = renewalChaseCapacity(s);
    const elite = s.renewalSpecialists||0;
    const skill = Math.round(s.techSkill!=null?s.techSkill:50);
    const minSk = C.RENEWAL_SPECIALIST_MIN_SKILL||68;
    const feeHint = elite>0 ? `専門単価 ×${C.RENEWAL_FEE_MULT_ELITE||1.15}` : `一般単価 ×${C.RENEWAL_FEE_MULT||0.55}`;
    const salesP = renewalSalesPower(s);
    const salesN = s.salesStaff||0;
    const salesSk = Math.round(s.salesSkill!=null?s.salesSkill:50);
    block.appendChild(el('div',{class:'desc'},
      `リニューアルは経過${C.RENEWAL_MIN_AGE_YEARS||30}年超が主対象。平均年齢 ${(s.portfolioAge||4.5).toFixed(1)}年 → 推定対象 ${num(aged)}台。今期候補 ${num(cand)}台／追客キャパ ${num(chase)}台（${feeHint}）。累計 ${num(s.cumulativeRenewalUnits||0)}台。\n獲得の鍵は営業：${salesN}名・技能${salesSk}（提案力指数 ${pct(Math.min(salesP,1),0)}）。技術の専門部隊 ${elite}名（保守定員から除外／配属に熟練${minSk}+、現在 ${skill}）。`));

      else if(chase<=0) why = '施工側の追客キャパ不足。専門部隊の編成か技術熟練の向上が必要。';

      teamRow.appendChild(el('button',{class:'btn btn-small', onclick:()=>doReturnRenewalSpecialists(1)}, '専門部隊から1名を保守へ戻す'));

  // 採用（募集チャネル）
  {

    const growthPct = Math.round(companyGrowthPhase(s)*100);

    block.appendChild(el('div',{class:'desc'},

  {
