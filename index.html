      card.appendChild(el('div',{class:'field-hint'}, '社内昇進（支社長経験）'));
    }
    const ops = el('div',{style:'display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;'});
    if(!vp.delegated){
      ops.appendChild(el('button',{class:'btn btn-small btn-primary', onclick:()=>doSetVpDelegation(true)}, '経営を一任する'));
    } else {
      ops.appendChild(el('button',{class:'btn btn-small', onclick:()=>doSetVpDelegation(false)}, '一任を解除する'));
    }
    const dismissBtn = el('button',{class:'btn btn-small btn-danger', type:'button'}, '解任する');
    const doDismissTap = function(ev){
      try{ if(ev){ ev.preventDefault(); ev.stopPropagation(); } }catch(e){}
      const name = (state.vicePresident && state.vicePresident.name) || vp.name || '副社長';
      showConfirmOverlay(name+'副社長を解任しますか？\n\n一任中なら日常経営の自動運営も停止します。', function(){
        try{ if(typeof removeVpPickOverlay==='function') removeVpPickOverlay(); }catch(e){}
        modal = null;
        try{ document.body.classList.remove('modal-open'); document.body.style.overflow=''; }catch(e){}
        doDismissVicePresident('社長決定');
        if(state && !state.gameOver) startTimer();
      });
    };
    dismissBtn.addEventListener('click', doDismissTap);
    dismissBtn.addEventListener('touchend', doDismissTap, {passive:false});
    ops.appendChild(dismissBtn);
    card.appendChild(ops);
    // 一任範囲
    const scopeBox = el('div',{class:'action-block', style:'margin-top:8px;'});
    scopeBox.appendChild(el('div',{class:'title'}, '一任の範囲'));
    scopeBox.appendChild(el('div',{class:'desc'}, 'ONの分野だけ副社長が動く。全部ONでフル一任。承認制ONなら採用・投資・現場の提案をすべて社長が承認／却下できる。'));
    const scopeRow = el('div',{class:'btn-row'});
    const scopeKeys = (typeof VP_SCOPE_KEYS!=='undefined'?VP_SCOPE_KEYS:[{id:'hire',label:'採用'},{id:'budget',label:'投資配分'},{id:'ops',label:'現場運営'}]);
    scopeKeys.forEach(sk=>{
      const on = !!(vp.scope && vp.scope[sk.id]);
      scopeRow.appendChild(el('button',{
        class:'btn btn-small'+(on?' btn-primary':''),
        onclick:()=>doSetVpScope(sk.id, !on)
      }, on ? (sk.label+' ON') : (sk.label+' OFF')));
    });
    scopeBox.appendChild(scopeRow);
    const allRow = el('div',{class:'btn-row', style:'margin-top:6px;'});
    allRow.appendChild(el('button',{class:'btn btn-small btn-primary', onclick:()=>doSetVpScopeAll(true)}, '全部ON（フル一任）'));
    allRow.appendChild(el('button',{class:'btn btn-small', onclick:()=>doSetVpScopeAll(false)}, '全部OFF'));
    scopeBox.appendChild(allRow);
    scopeBox.appendChild(el('button',{
      class:'btn btn-small'+(vp.approvalMode?' btn-primary':''),
      style:'margin-top:6px;',
      onclick:()=>doSetVpApprovalMode(!vp.approvalMode)
    }, vp.approvalMode ? '承認制 ON（全提案を社長が承認）' : '承認制 OFF（範囲内は自動実行）'));
    card.appendChild(scopeBox);
    // 承認待ち
    if(vp.approvalMode && vp.pendingProposals && vp.pendingProposals.length){
      const pend = el('div',{class:'action-block', style:'margin-top:8px;'});
      pend.appendChild(el('div',{class:'title'}, `承認待ち提案（${vp.pendingProposals.length}）`));
      vp.pendingProposals.forEach(p=>{
        const row = el('div',{style:'margin:6px 0;padding:6px;border:1px solid var(--steel-600);border-radius:6px;'});
        row.appendChild(el('div',{class:'field-hint'}, p.label||p.type));
        const br = el('div',{class:'btn-row'});
        br.appendChild(el('button',{class:'btn btn-small btn-primary', onclick:()=>doResolveVpProposal(p.id, true)}, '承認'));
        br.appendChild(el('button',{class:'btn btn-small', onclick:()=>doResolveVpProposal(p.id, false)}, '却下'));
        row.appendChild(br);
        pend.appendChild(row);
      });
      card.appendChild(pend);
    }

    // 一任中のAI行動可視化
    if(vp.delegated){
      const actBox = el('div',{class:'action-block', style:'margin-top:10px;'});
      actBox.appendChild(el('div',{class:'title'}, '一任中のAI行動'));
      const acts = (vp.lastActions && vp.lastActions.length) ? vp.lastActions
        : (s.vpActionLog||[]).filter(a=>(a.turn==null||a.turn===(s.turn||0)));
      if(acts && acts.length){
        actBox.appendChild(el('div',{class:'desc'}, '直近四半期に副社長が下した判断・指示：'));
        acts.forEach(a=>{
          const raw = (a.text||a||'').replace(/^【副社長一任】/,'').replace(/^【副社長メモ】/,'メモ：');
          actBox.appendChild(el('div',{class:'field-hint', style:'border-left:3px solid var(--amber);padding-left:8px;margin:4px 0;'}, raw));
        });
      } else {
        actBox.appendChild(el('div',{class:'field-hint'},
          '今期は大きな指示なし（予算の微調整のみの四半期）。次の四半期進行後に行動ログがここに残る。'));
      }
      // 直近履歴
      const hist = (s.vpActionLog||[]).slice(-8);
      if(hist.length){
        actBox.appendChild(el('div',{class:'field-hint', style:'margin-top:8px;font-weight:700;'}, '最近の一任ログ'));
        hist.slice().reverse().forEach(a=>{
          const raw = (a.text||'').replace(/^【副社長一任】/,'').replace(/^【副社長メモ】/,'メモ：');
          actBox.appendChild(el('div',{class:'field-hint', style:'font-size:10px;opacity:0.9;'}, raw));
        });
      }
      card.appendChild(actBox);
    }

    panel.appendChild(card);
  }
  panel.appendChild(el('h2',{}, '経営幹部（買い切り招聘＋継続給与）', el('span',{class:'eyebrow'}, '専門役員')));
  EXECUTIVES.forEach(ex=>{
    const owned = !!s.executives[ex.id];
    const card = el('div',{class:'mand-a-card'});
    card.appendChild(el('div',{style:'font-weight:700;margin-bottom:4px;'}, ex.name + (owned?'（在籍中）':'')));
    card.appendChild(el('div',{class:'desc', style:'margin-bottom:6px;'}, ex.desc));
    if(!owned){
      card.appendChild(el('div',{class:'mline'}, el('span',{class:'k'},'招聘費用'), el('span',{class:'v'}, yen(ex.hireCost))));
      card.appendChild(el('div',{class:'mline'}, el('span',{class:'k'},'年間給与'), el('span',{class:'v'}, yen(ex.salary))));
      card.appendChild(el('button',{class:'btn btn-small', onclick:()=>doHireExecutive(ex.id)}, '招聘する'));
    } else {
      card.appendChild(el('div',{class:'field-hint'}, `年間給与 ${yen(ex.salary)}（固定費として毎期発生）`));
    }
    panel.appendChild(card);
  });
  
  // ---- キーマン ----
  ensureTalentState(s);
  panel.appendChild(el('h2',{}, 'キーマン', el('span',{class:'eyebrow'}, `最大${typeof KEY_PERSON_MAX!=='undefined'?KEY_PERSON_MAX:8}名`)));
  panel.appendChild(el('div',{class:'desc', style:'font-size:11px;line-height:1.55;'},
    '熟練技術者・エース営業など個人が台頭する。品質・営業にボーナス。忠誠が下がると引き抜きや独立の危機が来る。待遇改善・役職抜擢で引き留められる。独立を認めると顧客の一部が流出する。'));

  // 引き留めキュー
  const qlist = s.keyRetentionQueue || [];
  if(qlist.length){
    const box = el('div',{class:'action-block', style:'border-color:var(--amber);margin-bottom:10px;'});
    box.appendChild(el('div',{class:'title'}, `引き留め案件（${qlist.length}）`));
    qlist.forEach(q=>{
      const left = Math.max(0, (q.expiresTurn||0) - (s.turn||0));
      const line = q.kind==='independent'
        ? `${q.name}（${q.roleLabel}）が独立を検討中 — 残${left}四半期`
        : `${q.name}（${q.roleLabel}）に引き抜き接触${q.rivalName?'（'+q.rivalName+'）':''} — 残${left}四半期`;
      box.appendChild(el('div',{class:'field-hint', style:'margin:6px 0;'}, line));
      const br = el('div',{class:'btn-row'});
      br.appendChild(el('button',{class:'btn btn-small btn-primary', onclick:()=>openKeyRetentionModal(q.id)}, '対応する'));
      box.appendChild(br);
    });
    panel.appendChild(box);
  }

  if(!(s.keyPeople||[]).length){
    panel.appendChild(el('div',{class:'field-hint'}, 'まだキーマンはいない。規模と熟練が上がると自然発生しやすい。'));
  } else {
    (s.keyPeople||[]).forEach(k=>{
      const row = el('div',{class:'mand-a-card', style:'margin-bottom:6px;'});
      const threat = k.threatened ? ' 【危機】' : '';
      const title = k.title ? '・'+k.title : '';
      row.appendChild(el('div',{style:'font-weight:700;'}, `${k.name}（${k.roleLabel||k.role}${title}）${threat}`));
      row.appendChild(el('div',{class:'mline'}, el('span',{class:'k'},'技能'), el('span',{class:'v'}, Math.round(k.skill||0)+'/100')));
      row.appendChild(el('div',{class:'mline'}, el('span',{class:'k'},'忠誠'), el('span',{class:'v'}, Math.round(k.loyalty||0)+'/100')));
      if(k.raiseQ) row.appendChild(el('div',{class:'mline'}, el('span',{class:'k'},'特別手当'), el('span',{class:'v'}, yen(k.raiseQ)+'/四半期')));
      panel.appendChild(row);
    });
  }
  // 独立スピンオフ履歴
  if((s.independentSpinoffs||[]).length){
    panel.appendChild(el('div',{class:'field-hint', style:'margin-top:8px;'},
      '独立した元キーマン: ' + s.independentSpinoffs.slice(-5).map(x=>x.name+`（${num(x.units)}台）`).join('、')));
  }

  // ---- 研修トラック ----
  panel.appendChild(el('h2',{}, '研修・資格', el('span',{class:'eyebrow'}, '人材への投資')));
  panel.appendChild(el('div',{class:'desc', style:'font-size:11px;line-height:1.55;'},
    '検査員講習に加え、リニューアル・メーカー別保全・法人営業の研修を実施できる。累計人数が技能に効く。'));
  if(typeof TRAIN_TRACKS!=='undefined'){
    Object.keys(TRAIN_TRACKS).forEach(tid=>{
      const tr = TRAIN_TRACKS[tid];
      if(tid==='inspector'){
        panel.appendChild(el('div',{class:'field-hint'}, `検査員：経営タブ「採用・人事」の講習フローを使用。`));
        return;
      }
      const n = (s.trainCounts&&s.trainCounts[tid])||0;
      const row = el('div',{class:'action-block', style:'margin-bottom:6px;'});
      row.appendChild(el('div',{class:'title'}, tr.label));
      row.appendChild(el('div',{class:'desc'}, tr.blurb+` 累計研修 ${n}名。`));
      row.appendChild(el('button',{
        class:'btn btn-small',
        disabled: (s.cash||0)<(tr.cost||0),
        onclick:()=>doTrainTrack(tid)
      }, `1名研修（${yen(tr.cost||0)}）`));
      panel.appendChild(row);
    });
  }

return panel;
}

function renderBoardPanel(){
  const s = state;
  const panel = el('div',{class:'panel'});
  panel.appendChild(el('h2',{}, '取締役会', el('span',{class:'eyebrow'}, `独立社外取締役比率 ${pct(independentRatio(s),0)}`)));
  panel.appendChild(el('div',{class:'desc', style:'font-size:11px;line-height:1.7;margin-bottom:10px;'},
    `社内取締役 ${s.board.insiders}名／社外取締役 ${s.board.outsiders}名。` +
    (s.board.insiders<=1 && !s.isListed
      ? '創業期は代表取締役（社長）1名が自然。従業員や幹部が育ってから社内取締役を増員する。上場時は取締役会設置（社内3名以上）へ移行する。'
      : '独立社外取締役比率1/3がコーポレートガバナンス・コードの目安。規模拡大後は投資家が注視し、未達だと株価評価にわずかな割引。') +
    `社外1名あたり年間報酬 ${yen(BOARD_OUTSIDER_COMP)}。社外を置くと個別助言が届く。`
  ));
  const staff = (s.techs||0)+(s.admins||0)+(s.salesStaff||0);
  const canInside = !s.isListed && s.board.insiders < 3 && staff >= 3;
  panel.appendChild(el('div',{class:'field-hint'},
    canInside
      ? `社内取締役を増員できる（現在の従業員 ${staff}名）。上場前に最大3名まで。`
      : (s.board.insiders>=3 || s.isListed)
        ? `社内取締役は${s.isListed?'上場に伴う取締役会体制':'当面の上限'}に達している。`
        : `社内取締役の増員には従業員がもう少し必要（目安3名以上）。`));
  panel.appendChild(el('button',{
    class:'btn btn-small',
    disabled: !canInside,
    onclick:doAppointInsideDirector
  }, '社内取締役を1名増員する'));
  const nextCost = 15000000 + s.board.outsiders*5000000;
  panel.appendChild(el('div',{class:'field-hint', style:'margin-top:8px;'}, `社外取締役の次の1名を招聘する費用: ${yen(nextCost)}`));
  panel.appendChild(el('button',{class:'btn btn-small', disabled: s.board.outsiders>=5, onclick:doAppointOutsideDirector}, '社外取締役を招聘する'));
  return panel;
}

function renderShikihoPanel(){
  const s = state;

  const sel = el('select',{onchange:(ev)=>{ shikihoScope = ev.target.value; render(); }});
  sel.appendChild(el('option',{value:'me'}, s.companyName.replace('株式会社','')+'（自社）'));

  panel.appendChild(el('div',{class:'field-row'}, el('label',{},'銘柄選択'), sel));
  sel.value = (shikihoScope==='me' || s.rivals.find(r=>r.id===shikihoScope)) ? shikihoScope : 'me';

  let entity;
  const rival = s.rivals.find(r=>r.id===shikihoScope);
  if(shikihoScope==='me' || !rival){
    entity = {
      isPlayer:true, name:s.companyName, ceoName:s.ceoName, hq:'kanto',
      history:s.history, shareholders:playerShareholderStructure(s),
      style:null,
    };
  } else {
    entity = {
      isPlayer:false, name:rival.name, ceoName:rival.ceoName, hq:rival.hq,

      rivalId:rival.id, subsidiaries:rival.subsidiaries||[],
    };
  }

  const hqRegion = REGIONS.find(rg=>rg.id===(entity.hq||'kanto'));
  const card = el('div',{class:'paper-strip'});

  card.appendChild(el('div',{style:'font-size:12px;line-height:1.7;margin-bottom:10px;'}, `【特色】${companyBlurb(s, entity)}`));

  if(entity.isPlayer){
    const execNames = EXECUTIVES.filter(ex=>s.executives[ex.id]).map(ex=>ex.name);
    card.appendChild(el('div',{style:'font-size:11px;color:#555;margin-bottom:8px;'},
      `【役員】取締役 社内${s.board.insiders}名・社外${s.board.outsiders}名${execNames.length?'／執行役員: '+execNames.join('、'):''}`));
  } else {
    const vit = entity.vitality!=null ? entity.vitality : 60;
    const vitLabel = vit>=65 ? '好調' : vit>=35 ? '普通' : '不振';
    const costWhy = typeof explainTakeover==='function' ? explainTakeover(s, r) : '';
    card.appendChild(el('div',{style:'font-size:11px;color:#555;margin-bottom:8px;'}, `【経営状態】${vitLabel}（社内評価指数 ${Math.round(vit)}/100）${(s.alliances&&entity.rivalId&&s.alliances[entity.rivalId])?'／【自社と業務提携中】':''}`));
    if(entity.subsidiaries && entity.subsidiaries.length>0){
      const names = entity.subsidiaries.map(sub=>sub.name).join('、');
      card.appendChild(el('div',{style:'font-size:11px;color:#555;margin-bottom:8px;'}, `【グループ会社】${names}`));
    }
  }

  const table = el('table',{class:'kessan'});
  table.appendChild(el('tr',{}, el('th',{},'期'), el('th',{},'売上高'), el('th',{},entity.isPlayer?'営業利益':'営業利益(推定)'), el('th',{},'保有台数')));
  const rows = entity.history.slice(-8);
  rows.forEach(f=>{
    table.appendChild(el('tr',{},
      el('td',{}, f.label),
      el('td',{}, yen(f.revenue)),
      el('td',{class: f.opProfit>=0?'pos':'neg'}, yen(f.opProfit)),
      el('td',{}, num(f.units)+'台'),
    ));
  });
  if(rows.length===0) table.appendChild(el('tr',{}, el('td',{colspan:'4'},'データなし（創業まもなく）')));
  card.appendChild(table);

  card.appendChild(el('div',{style:'font-size:11px;color:#555;margin-top:10px;'},
    `【株主】${entity.shareholders.map(x=>`${x.name} ${pct(x.pct,1)}`).join('　')}`));
  card.appendChild(el('div',{style:'font-size:11px;color:#555;margin-top:6px;'},
    `【比較会社】${[s.companyName.replace('株式会社',''), ...s.rivals.map(r=>r.name)].filter(n=>n!==entity.name.replace('株式会社','')).join('　')}`));
  card.appendChild(el('div',{style:'font-size:12px;color:#1c7a4d;margin-top:10px;font-weight:700;'},
    `【コメント】${entity.isPlayer ? companyOutlookComment(entity) + (s.isListed?` PSR${s.psr?s.psr.toFixed(2):'-'}倍で市場評価。`:'') : companyOutlookComment(entity)}`));

  panel.appendChild(card);
  return panel;
}

  }

  panel.appendChild(el('div',{style:'font-size:11px;color:var(--amber);letter-spacing:.5px;margin:14px 0 6px;padding-top:10px;border-top:1px solid var(--steel-700);'}, '経営者長者番付（推定個人資産）'));
  const entries = [{name:s.ceoName, company:s.companyName.replace('株式会社',''), worth: playerNetWorth(s), me:true}]
    .concat(s.rivals.map(r=>({name:r.ceoName, company:r.name, worth: rivalNetWorth(r)})));
  entries.sort((a,b)=> (b.worth!=null?b.worth:-1) - (a.worth!=null?a.worth:-1));
  entries.forEach((e,i)=>{
    const row = el('div',{style:'display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:5px 0;border-bottom:1px solid var(--steel-700);'});

function listingMaintainFeeAnnual(s){

  listedMarkets(s).forEach(k=>{

    if(ex) fee += (ex.maintainFee||5000000);
  });
  return fee;

function primaryExchangeKey(s){
  return s.exchange || (listedMarkets(s)[0]||null);
}
function yearsInBusiness(s){
  return Math.max(0, (s.year - 1) + (s.quarter/4));
}
function impliedIpoMarketCap(s){
  // 上場申請時の想定時価総額（売上×市場の標準PSR）
  return annualRevenue(s) * 0.95;
}
function exchangeListingCheck(s, exchangeKey){
  const ex = EXCHANGES[exchangeKey];
  if(!ex) return {ok:false, reasons:['不明な市場']};
  const reasons = [];
  const rev = annualRevenue(s);
  const profitQ = (s.history||[]).slice(-4).reduce((a,f)=>a+(f.netProfit||0),0);
  const floatR = freeFloatRatio(s);
  // 上場前は創業社長100%なので、上場時の希薄化を見込む（公募で流通確保）
  const projectedFloat = s.isListed ? floatR : Math.max(floatR, 0.30);
  const mcap = s.isListed && s.stockPrice ? s.stockPrice * s.shares : impliedIpoMarketCap(s);
  const floatMcap = mcap * projectedFloat;
  s._ipoPreview = true;
  const shCount = estimatedShareholderCount(s);
  delete s._ipoPreview;

  if(yearsInBusiness(s) < (ex.minYears||0)) reasons.push(`事業継続 ${yearsInBusiness(s).toFixed(1)}年 < ${ex.minYears}年`);
  if(shCount < (ex.minShareholders||0)) reasons.push(`株主数 ${num(shCount)}人 < ${num(ex.minShareholders)}人（知名度・流通株・IRで増加）`);
  if(projectedFloat + 1e-9 < (ex.minFloatRatio||0)) reasons.push(`流通株式比率 ${pct(projectedFloat,0)} < ${pct(ex.minFloatRatio,0)}`);
  if(ex.minMarketCap && mcap < ex.minMarketCap) reasons.push(`時価総額 ${yen(mcap)} < ${yen(ex.minMarketCap)}`);
  if(ex.minFloatMktCap && floatMcap < ex.minFloatMktCap) reasons.push(`流通株式時価総額 ${yen(floatMcap)} < ${yen(ex.minFloatMktCap)}`);
  if(ex.requireProfit){
    if(ex.minProfit2y){
      // プライム近似: 直近黒字継続と規模
      if(s.profitStreak < 4 || profitQ * 2 < ex.minProfit2y * 0.5) reasons.push('収益基盤（黒字継続・利益規模）がプライム目安に未達');
    } else if(ex.minProfitAnnual){
      if(profitQ < ex.minProfitAnnual || s.profitStreak < 2) reasons.push(`利益目安 ${yen(ex.minProfitAnnual)}/年相当・黒字継続が不足（直近4Q利益 ${yen(profitQ)}）`);
    }
  }
  if(ex.minNetAssets){
    const equity = (s.retainedEarnings||0) + (s.cash||0) - (s.debt||0);
    if(equity < ex.minNetAssets) reasons.push(`純資産目安 ${yen(ex.minNetAssets)} 未達`);
  }
  // 地方取引所: 関連地域に拠点があると審査が通りやすい（ゲーム上の緩和）
  if(ex.regionHint && (s.regionBranches[ex.regionHint]||0) === 0 && (s.regionUnits[ex.regionHint]||0) < 30){
    reasons.push(`${ex.short}は地域関連性（${ex.regionHint==='hokkaido'?'北海道':'九州'}の拠点・契約）が弱い`);
  }
  if(s.cash < C.IPO_LISTING_COST) reasons.push(`上場費用 ${yen(C.IPO_LISTING_COST)} の現金不足`);
  return {ok: reasons.length===0, reasons, shCount, projectedFloat, mcap, floatMcap};
}
function ipoEligible(s){
  return IPO_SELECTABLE_EXCHANGES.some(k => exchangeListingCheck(s,k).ok);
}
function ipoEligibleFor(s, key){
  return exchangeListingCheck(s, key).ok;
}

function doGrantSo(grantPct){
  const s = state;
  if(!s.soPlanYear){
    pushLog(s, '先にストックオプション制度（発行枠）を導入してほしい。', 'warn');
    render(); return;

  grantPct = clamp(Number(grantPct)||0.01, 0.005, 0.05);

    render(); return;
  }
  const oldG = s.soGrantedPct||0;
  const oldStrike = s.soStrike||0;
  let newStrike;

  } else {
    newStrike = Math.max(oldStrike||100, Math.round((annualRevenue(s)*1.2)/s.shares));

/* ---- エリア密度・出動 ---- */
function regionCoverage(s, rid){
  const units = s.regionUnits[rid]||0;
  const branches = s.regionBranches[rid]||0;
  const hasBranch = branches > 0;
  // 拠点あたり台数。適正帯は 80〜220 程度を想定
  const upb = hasBranch ? units / branches : (units > 0 ? units * 2.5 : 0);
  return {units, branches, hasBranch, unitsPerBranch: upb};
}
/** 全国の出動対応力 0〜100（高いほど到着が速い） */
function dispatchScore(s){
  let score = 55;
  let covered = 0, total = 0, sparsePenalty = 0, denseBonus = 0, remoteUnits = 0;
  REGIONS.forEach(rg=>{
    const c = regionCoverage(s, rg.id);
    if(c.units <= 0) return;
    total += c.units;
    if(!c.hasBranch){ remoteUnits += c.units; return; }
    covered += c.units;
    if(c.unitsPerBranch >= 90 && c.unitsPerBranch <= 240) denseBonus += c.units;
    else if(c.unitsPerBranch > 320) sparsePenalty += c.units * 0.5; // 過密で到着遅延
    else if(c.unitsPerBranch < 50) sparsePenalty += c.units * 0.25; // 薄く広い
  });
  if(total > 0){
    score += (covered/total) * 18;
    score += (denseBonus/total) * 12;
    score -= (sparsePenalty/total) * 22;
    score -= (remoteUnits/total) * 28; // 拠点なし地方の保有は出動が遅い
  }
  // 技術余力
  const util = baseCapacity(s)>0 ? s.units/baseCapacity(s) : 1.2;
  if(util > 1.0) score -= Math.min(18, (util-1)*40);
  if(util < 0.75) score += 4;
  if(s.upgrades && s.upgrades.iot) score += 6;
  return clamp(score, 12, 96);
}
function dispatchChurnAdj(s){
  const d = dispatchScore(s);
  // 遅いと解約増、速いと減
  return clamp((55 - d) * 0.00012, -0.004, 0.008);
}

function makerRelationAvg(s){
  if(!s.makerRelations) return 50;
  let sum=0, n=0;
  MAKER_IDS.forEach(id=>{ sum += (s.makerRelations[id]||50); n++; });
  return n? sum/n : 50;
}
function normalizeMakerMix(s){
  if(!s.makerMix) s.makerMix = {};
  let t = 0;
  MAKER_IDS.forEach(id=>{ t += Math.max(0, s.makerMix[id]||0); });
  if(t <= 0){ MAKER_IDS.forEach(id=>{ s.makerMix[id] = MAKER_BRANDS[id].weight; }); return; }
  MAKER_IDS.forEach(id=>{ s.makerMix[id] = Math.max(0, s.makerMix[id]||0)/t; });
}

/* ---- リニューアル受注の内訳（フィードバック用） ---- */
function renewalWinBreakdown(s){
  const salesP = renewalSalesPower(s);
  const elite = Math.max(0, s.renewalSpecialists||0);
  const sSkill = s.salesSkill!=null ? s.salesSkill : 50;
  const factors = [];
  let winChance = 0.10 + salesP * 0.38;
  factors.push({k:'営業提案力', v: salesP * 0.38, note: `指数 ${pct(Math.min(salesP,1.5),0)}（人数${s.salesStaff||0}・技能${Math.round(sSkill)}）`});
  const repB = (s.reputation-50)*0.0035;
  winChance += repB; factors.push({k:'評判', v:repB, note:`${Math.round(s.reputation||50)}`});
  const qB = (s.quality-50)*0.0025;
  winChance += qB; factors.push({k:'品質', v:qB, note:`${Math.round(s.quality||50)}`});
  const tB = (s.techSkill-50)*0.002;
  winChance += tB; factors.push({k:'技術熟練', v:tB, note:`${Math.round(s.techSkill||50)}`});
  const aB = (adminProposalMult(s)-1)*0.15;
  winChance += aB; factors.push({k:'事務提案力', v:aB, note:''});
  if(elite > 0){
    const eB = 0.08 + Math.min(0.08, elite * 0.015);
    winChance += eB; factors.push({k:'専門部隊', v:eB, note:`${elite}名`});
  } else {
    winChance -= 0.06; factors.push({k:'専門部隊なし', v:-0.06, note:'施工裏付けが弱い'});
  }
  let mult = 1;
  if(sSkill < 40){ mult *= 0.65; factors.push({k:'営業技能不足', v:0, note:'×0.65'}); }
  else if(sSkill >= 65){ winChance += 0.06; factors.push({k:'営業技能高い', v:0.06, note:''}); }
  if(typeof salesLoad==='function' && salesLoad(s) > 1.4){ mult *= 0.8; factors.push({k:'営業過負荷', v:0, note:'×0.8'}); }
  const disp = dispatchScore(s);
  if(disp < 40){ mult *= 0.85; factors.push({k:'出動遅延の印象', v:0, note:`対応力${Math.round(disp)}→×0.85`}); }
  else if(disp >= 70){ winChance += 0.04; factors.push({k:'迅速対応の実績', v:0.04, note:`対応力${Math.round(disp)}`}); }
  winChance = clamp(winChance * mult, 0.04, 0.88);
  const reasons = factors.filter(f=>f.v < -0.02 || (f.note&&f.note.indexOf('×')>=0) || f.k.indexOf('不足')>=0 || f.k.indexOf('なし')>=0 || f.k.indexOf('過負荷')>=0 || f.k.indexOf('遅延')>=0)
    .map(f=> f.note ? `${f.k}（${f.note}）` : f.k);
  const strengths = factors.filter(f=>f.v > 0.03).map(f=>f.k);
  return {winChance, factors, reasons, strengths, salesP, elite};
}

/* ---- 即時実行アクション（リアルタイム中いつでも実行可） ---- */
function doPursueRenewal(units){
  const s = state;
  units = Math.max(0, Math.round(units||0));
  if(units <= 0){ pushLog(s,'リニューアル工事の対象がない。','info'); render(); return; }
  const aged = unitsAgedForRenewal(s);
  const pipeline = Math.max(0, Math.round(s.renewalPipeline||0));
  const chaseCap = renewalChaseCapacity(s);
  const maxUnits = Math.min(units, pipeline, aged, chaseCap);
  if(maxUnits <= 0){
    if(aged <= 0){
      pushLog(s, `リニューアルは経過${C.RENEWAL_MIN_AGE_YEARS||30}年超の昇降機が主対象。現在の推定対象台数はほぼゼロ（契約平均年齢 ${(s.portfolioAge||0).toFixed(1)}年）。`, 'warn');
    } else if(chaseCap <= 0){
      const sp = renewalSalesPower(s);
      if((s.salesStaff||0)<=0 || sp < 0.12){
        pushLog(s, '【受注不可】営業の人数または質が不足。リニューアルは営業が提案・合意形成できなければ取れない（技術部隊だけでは不足）。', 'warn');
      } else {
        pushLog(s, '【受注不可】施工側の追客キャパ不足。専門部隊の編成か技術熟練の向上が必要。', 'warn');
      }
    } else {
      pushLog(s, '今期のリニューアル候補パイプラインが空。', 'info');
    }
    render(); return;
  }
  const salesP = renewalSalesPower(s);
  if((s.salesStaff||0) <= 0 || salesP < 0.12){
    pushLog(s, '【受注不可】営業人員とその質が不可欠。現在の営業体制ではリニューアル提案を開始できない。', 'warn');
    render(); return;
  }
  // 施工中の拘束を考慮
  const busy = renewalSpecialistsBusy(s);
  const eliteFree = Math.max(0, (s.renewalSpecialists||0) - busy);
  units = maxUnits;
  const bd = renewalWinBreakdown(s);
  const winChance = bd.winChance;
  const won = Math.round(units * (winChance * (0.85+Math.random()*0.3)));
  s.renewalPipeline = Math.max(0, (s.renewalPipeline||0) - units);
  if(won <= 0){
    const why = bd.reasons.length ? bd.reasons.slice(0,4).join('、') : '総合的に競争力不足';
    pushLog(s, `リニューアル提案は競合に敗れた（提案${num(units)}台・受注率目安${pct(winChance,0)}）。主因: ${why}。`, 'warn');
    render(); autoSave(); return;
  }
  const elite = Math.max(0, s.renewalSpecialists||0);
  const feeMult = elite > 0 ? (C.RENEWAL_FEE_MULT_ELITE||1.15) : (C.RENEWAL_FEE_MULT||0.55);
  const feePer = s.price * feeMult;
  const ticks = C.RENEWAL_BUILD_TICKS || 2;
  // 契約金（着手金）を一部先に計上、残は完工時
  const totalRev = Math.round(won * feePer);
  const costRatio = elite > 0 ? 0.38 : 0.48;
  const totalCost = Math.round(totalRev * costRatio);
  const advance = Math.round(totalRev * 0.35);
  const advanceCost = Math.round(totalCost * 0.35);
  s.cash += (advance - advanceCost);
  if(!s.renewalJobs) s.renewalJobs = [];
  s.renewalJobs.push({
    id: 'rj'+Date.now()+Math.floor(Math.random()*99),
    units: won,
    ticksLeft: ticks,
    totalRev, totalCost, advance, advanceCost,
    eliteUsed: Math.min(eliteFree, Math.max(1, Math.ceil(won / ((C.RENEWAL_SPECIALIST_CAP_Q||14)*1.2)))),
    feePer,
  });
  s.cumulativeRenewalUnits = (s.cumulativeRenewalUnits||0) + won;
  const teamNote = elite > 0 ? `専門部隊${elite}名` : '兼務施工';
  const salesNote = `営業${s.salesStaff||0}名・技能${Math.round(s.salesSkill!=null?s.salesSkill:50)}`;
  const strong = bd.strengths.length ? `強み: ${bd.strengths.slice(0,3).join('・')}` : '';
  pushLog(s, `リニューアル ${num(won)}台を受注（${salesNote}／${teamNote}／受注率目安${pct(winChance,0)}）。着手金純額 ${yen(advance-advanceCost)}。施工約${ticks}四半期。完工時に残金と品質向上。${strong}`, 'good');
  render(); autoSave();
}
function renewalSpecialistsBusy(s){
  if(!s.renewalJobs || !s.renewalJobs.length) return 0;
  return s.renewalJobs.reduce((a,j)=>a+(j.eliteUsed||0),0);
}
function processRenewalJobs(s, logs){
  if(!s.renewalJobs || !s.renewalJobs.length) return;
  const remain = [];
  s.renewalJobs.forEach(j=>{
    j.ticksLeft--;
    if(j.ticksLeft > 0){
      remain.push(j);
      return;
    }
    const restRev = (j.totalRev||0) - (j.advance||0);
    const restCost = (j.totalCost||0) - (j.advanceCost||0);
    s.cash += (restRev - restCost);
    s.quality = clamp(s.quality + Math.min(4, (j.units||0)/70), 5, 98);
    s.portfolioAge = Math.max(2, (s.portfolioAge||4.5) - (j.units||0)/Math.max(1,s.units)*4.5);
    if((s.renewalSpecialists||0) > 0){
      s.techSkill = clamp((s.techSkill||50) + Math.min(1.2, (j.units||0)/120), 5, 98);
    }
    const net = (j.totalRev||0) - (j.totalCost||0);
    logs.push({text:`リニューアル工事 ${num(j.units)}台が完工（総粗利 ${yen(net)}）。機器が若返り、信頼性・平均年齢が改善した。`, tag:'good'});
  });
  s.renewalJobs = remain;
}

/** 優秀な技術者をリニューアル専門部隊へ配置 */
function doAssignRenewalSpecialists(count){
  const s = state;
  count = Math.max(1, Math.min(10, Math.round(count||1)));
  const skill = s.techSkill!=null ? s.techSkill : 50;
  const minSkill = C.RENEWAL_SPECIALIST_MIN_SKILL||68;
  if(skill < minSkill){
    pushLog(s, `リニューアル専門部隊には熟練技術者のみ配属できる（必要熟練度 ${minSkill}／現在 ${Math.round(skill)}）。研修・安定稼働で熟練を上げてから編成せよ。`, 'warn');
    render(); return;
  }
  const free = Math.max(0, (s.techs||0) - (s.renewalSpecialists||0));
  if(free < count){
    pushLog(s, `配置できる一般技術者が不足している（空き ${free}名）。`, 'warn');
    render(); return;
  }
  // 定員に余裕がないと日常保守が破綻しやすい
  const afterGeneral = (s.techs||0) - (s.renewalSpecialists||0) - count;
  const afterCap = afterGeneral * techCapacityPerHead(s);
  if(afterCap < (s.units||0) * 0.92){
    pushLog(s, `専門部隊へ回すと日常保守の定員が逼迫する（稼働見込み ${pct((s.units||0)/Math.max(1,afterCap),0)}）。採用か外注枠を確保してからが安全。`, 'warn');
    // 警告のみで続行は可（プレイヤー判断）— ただし強警告なので return せず確認的に続行許可
  }
  const cost = Math.round((C.RENEWAL_SPECIALIST_SETUP||2500000) * count);
  if(cost > s.cash){
    pushLog(s, `専門部隊の編成費用が不足（必要 ${yen(cost)}）。`, 'warn');
    render(); return;
  }
  s.cash -= cost;
  s.renewalSpecialists = (s.renewalSpecialists||0) + count;
  s.reputation = clamp((s.reputation||50)+0.5, 5, 98);
  pushLog(s, `リニューアル専門部隊に技術者${count}名を配置した（編成・工具・研修費 ${yen(cost)}）。日常保守定員は ${num(baseCapacity(s))}台相当に減少。経過${C.RENEWAL_MIN_AGE_YEARS||30}年超物件の高単価工事を追える。`, 'good');
  render(); autoSave();
}
function doReturnRenewalSpecialists(count){
  const s = state;
  count = Math.max(1, Math.min(s.renewalSpecialists||0, Math.round(count||1)));
  if((s.renewalSpecialists||0) <= 0){
    pushLog(s, 'リニューアル専門部隊に配置中の技術者はいない。', 'info');

  }
  s.renewalSpecialists = Math.max(0, (s.renewalSpecialists||0) - count);

}
function doSetPartsPolicy(key){

}


function companyGrowthPhase(s){
  // 0=無名の創業期 〜 1=上場・全国規模の採用力
  // 市場採用の開きやすさ・リファラルの枯れやすさの共通指標
  const years = typeof yearsInBusiness==='function'
    ? yearsInBusiness(s)
    : Math.max(0, (s.year-2026) + (s.quarter-1)/4);
  const units = s.units||0;
  const heads = (s.techs||0)+(s.admins||0)+(s.salesStaff||0);
  const rep = s.reputation!=null ? s.reputation : 50;
  const aware = s.adAwareness!=null ? s.adAwareness : 10;
  let g = 0;
  // 経過年数（約8年で頭打ち）
  g += clamp(years / 8, 0, 1) * 0.28;
  // 契約規模
  g += clamp(units / 2500, 0, 1) * 0.22;
  g += clamp(Math.max(0, units - 2500) / 8000, 0, 1) * 0.08;
  // 人員規模（組織としての「会社らしさ」）
  g += clamp(heads / 40, 0, 1) * 0.12;
  // 評判・認知
  g += clamp((rep - 40) / 50, 0, 1) * 0.12;
  g += clamp(aware / 80, 0, 1) * 0.08;
  // 制度・設備・上場
  if(s.upgrades && s.upgrades.training) g += 0.04;
  if(s.executives && s.executives.hr_dir) g += 0.03;
  if(s.isListed) g += 0.08;
  if(s.exchange==='prime' || (s.listedOn||[]).includes('prime')) g += 0.04;
  return clamp(g, 0, 1);
}
function recruitFillChance(s, typeKey){
  const t = RECRUIT_TYPES[typeKey];
  if(!t) return 0;
  const growth = companyGrowthPhase(s); // 0→1
  const util = baseCapacity(s)>0 ? s.units/baseCapacity(s) : 0;
  const years = typeof yearsInBusiness==='function'
    ? yearsInBusiness(s)
    : Math.max(0, (s.year-2026) + (s.quarter-1)/4);

  // ========== リファラル：創業期は相対的に強いが、難易度で厳しさが変わる ==========
  if(t.referral){
    let p = t.fillBase; // 0.78〜0.84
    // 成長が進むほど紹介の効き目が落ちる（市場採用へ主役交代）
    let phase = 1.15 - growth * 0.83;
    const heads = (s.techs||0)+(s.admins||0)+(s.salesStaff||0);
    if(heads <= 8) phase *= 1.10;
    else if(heads <= 15) phase *= 1.0;
    else if(heads <= 30) phase *= 0.85;
    else phase *= 0.65;
    // 紹介採用の累計で人脈が枯れる
    phase /= (1 + (s.referralHires||0) * 0.09);
    if((s.morale||60) >= 70) phase *= 1.10;
    if((s.morale||60) < 40) phase *= 0.82;
    phase /= Math.pow(Math.max(0.9, s.laborTightness||1), 0.25);
    if(util > 1.08) phase *= 0.9;
    // 難易度：ノーマル／ハードではリファラルも集まりにくい
    const diff = s.difficulty || 'normal';
    if(diff === 'normal'){
      phase *= 0.72; // 充足目安がはっきり下がる
      phase /= (1 + (s.referralHires||0) * 0.04); // 人脈枯れを追加で加速
    } else if(diff === 'hard'){
      phase *= 0.55;
      phase /= (1 + (s.referralHires||0) * 0.07);
    } else {
      phase *= 1.05; // イージーは紹介がやや通りやすい
    }
    p *= phase;
    const floor = diff === 'hard' ? 0.04 : (diff === 'normal' ? 0.05 : 0.06);
    const ceil = diff === 'hard' ? 0.72 : (diff === 'normal' ? 0.82 : 0.94);
    return clamp(p, floor, ceil);
  }

  // ========== 市場採用：創業期はほぼ集まらず、成長で徐々に開ける ==========
  let p = t.fillBase;
  // 創業期ペナルティ（growth=0で大幅減、成長で緩和）
  // growth=0 → ×0.22 / growth=0.5 → ×0.55 / growth=1 → ×1.05
  const openMult = 0.22 + growth * 0.83;
  p *= openMult;
  // 共通の魅力・労働市場
  p /= Math.sqrt(Math.max(0.85, s.laborTightness||1));
  p += (s.reputation - 50) * 0.004;
  p += (s.morale - 50) * 0.002;
  p += Math.min(0.10, (s.welfareBudget||0) / 7000000 * 0.10);
  if(s.upgrades && s.upgrades.training) p += 0.08;
  if(s.executives && s.executives.hr_dir) p += 0.07;
  // 認知（広告・IR）が市場応募に効く
  p += Math.min(0.10, (s.adAwareness||0) / 100 * 0.12);
  // 新卒は Q1–Q2 が本戦。創業期はさらに厳しい
  if(typeKey==='grad_tech' || typeKey==='grad_admin' || typeKey==='grad_sales'){
    if(s.quarter===1 || s.quarter===2) p += 0.10 + growth * 0.08;
    else p -= 0.16;
    if(growth < 0.25) p *= 0.75; // 無名企業の新卒は特に厳しい
  }
  // 中途も創業期は「安定感がない」と見られやすい
  if(typeKey==='mid_tech' || typeKey==='mid_admin' || typeKey==='mid_sales'){
    if(growth < 0.2) p *= 0.85;
  }
  // 経験者は常に取り合い。大所帯・有名化しないと来ない
  if(typeKey==='vet_tech' || typeKey==='vet_sales'){
    if(s.cycle==='boom') p -= 0.05;
    if(s.cycle==='recession') p += 0.04;
    p -= Math.max(0, (s.techs||0) - 15) * 0.003;
    if(growth < 0.35) p *= 0.55; // 創業〜成長初期はほぼ来ない
    else if(growth < 0.6) p *= 0.8;
  }
  // 稼働過密＝ブラック認定
  if(util > 0.95) p -= 0.10;
  if(util > 1.05) p -= 0.10;
  // 上場は市場採用の信用を大きく押し上げる
  if(s.isListed) p += 0.06;
  return clamp(p, 0.02, 0.90);
}
function recruitCostPerHead(s, typeKey){
  const t = RECRUIT_TYPES[typeKey];
  return t.headcost * effHireCostMult(s);
}
/** 募集を出す。delay>0 は内定→翌期入社。充足人数は確率的 */

/* ============================================================
   人材の質・不正・リストラ・懲罰委員会
   ============================================================ */
function staffQualityIndex(s){
  const skill = ((s.techSkill!=null?s.techSkill:50) + (s.salesSkill!=null?s.salesSkill:50)) / 2;
  const morale = s.morale!=null ? s.morale : 60;
  const integ = s.integrity!=null ? s.integrity : 72;
  // 熟練・士気・誠実性の合成（低いと不正・手抜きが蔓延）
  return skill * 0.42 + morale * 0.28 + integ * 0.30;
}
function updateIntegrityDrift(s, logs){
  const sq = staffQualityIndex(s);
  const util = baseCapacity(s)>0 ? s.units/baseCapacity(s) : 0;
  // 質が低いと誠実性が侵食される。過密稼働・低士気で加速
  let drift = 0;
  if(sq < 55) drift -= (55 - sq) * 0.08;
  if(sq < 40) drift -= 0.8;
  if((s.morale||60) < 40) drift -= 0.6;
  if(util > 1.05) drift -= 0.5;
  if((s.welfareBudget||0) > 1500000) drift += 0.25;
  if(s.executives && s.executives.hr_dir) drift += 0.2;
  if(s.executives && s.executives.quality_officer) drift += 0.15;
  // 未処理の懲罰案件が残るとさらに悪化
  const pending = (s.discCases||[]).filter(c=>c.status==='pending').length;
  if(pending > 0) drift -= pending * 0.35;
  s.integrity = clamp((s.integrity!=null?s.integrity:72) + drift, 5, 98);
  // 不正圧力の蓄積
  let pressureGain = 0;
  if(sq < 50) pressureGain += (50 - sq) * 0.04;
  if(s.integrity < 50) pressureGain += (50 - s.integrity) * 0.05;
  if(util > 1.0) pressureGain += (util - 1.0) * 2;
  s.fraudPressure = clamp((s.fraudPressure||0) * 0.92 + pressureGain, 0, 100);
}

const MISCONDUCT_TYPES = [
  {id:'pad_hours', label:'虚偽の点検記録', role:'tech', severity:2,
   text:'点検未実施のまま完了記録が作成されていた疑いが浮上した。'},
  {id:'kickback', label:'業者からのリベート', role:'tech', severity:3,
   text:'部品発注で特定業者からリベートを受け取っていた疑いが発覚した。'},
  {id:'expense', label:'経費の私的流用', role:'admin', severity:2,
   text:'出張・交際費の私的流用が内部通報で明るみに出た。'},
  {id:'data_leak', label:'顧客情報の不適切な持ち出し', role:'admin', severity:3,
   text:'顧客名簿が私用端末に持ち出されていた可能性が指摘された。'},
  {id:'ghost_visit', label:'架空の営業報告', role:'sales', severity:2,
   text:'未訪問のまま「訪問済み」と報告する営業が複数見つかった。'},
  {id:'bribe_bid', label:'入札・契約の不正関与', role:'sales', severity:4,
   text:'管理会社担当者への不適切な接待・供与の疑いが外部から指摘された。'},
];

function processMisconduct(s, logs){
  if(!s.discCases) s.discCases = [];
  const pressure = s.fraudPressure||0;
  const integ = s.integrity!=null?s.integrity:72;
  // 圧力と誠実性から発生確率
  let chance = clamp(pressure / 120 + (55 - integ) * 0.004, 0, 0.55);
  if(chance < 0.05) return;
  if(Math.random() > chance) return;

  const t = MISCONDUCT_TYPES[Math.floor(Math.random()*MISCONDUCT_TYPES.length)];
  // 該当職種がいない場合はスキップ気味に別タイプへ
  if(t.role==='tech' && (s.techs||0)<1) return;
  if(t.role==='admin' && (s.admins||0)<1) return;
  if(t.role==='sales' && (s.salesStaff||0)<1) return;

  const caseId = 'dc'+Date.now()+Math.floor(Math.random()*999);
  s.discCases.push({
    id: caseId, type: t.id, label: t.label, role: t.role,
    severity: t.severity, status: 'pending',
    turn: s.turn, text: t.text,
  });
  s.misconductCount = (s.misconductCount||0) + 1;
  s.fraudPressure = Math.max(0, pressure - 8);
  // 発覚時点での即時ダメージ（軽微）
  const softDmg = 400000 * t.severity;
  s.cash -= softDmg;
  s.reputation = clamp(s.reputation - 1 - t.severity*0.5, 5, 98);
  s.integrity = clamp(s.integrity - 1.5, 5, 98);
  logs.push({text:`【不正の疑い】${t.label} — ${t.text} 懲罰委員会での対応が必要（調査費用 ${yen(softDmg)}）。`, tag:'warn'});
}

function doRestructure(role, count){
  const s = state;
  count = Math.max(1, Math.min(30, Math.round(count||1)));
  let pool = role==='tech' ? (s.techs||0) : role==='sales' ? (s.salesStaff||0) : (s.admins||0);
  if(pool <= 0){ pushLog(s,'対象となる従業員がいない。','warn'); render(); return; }
  count = Math.min(count, pool);
  // 最低1人は残す（本社機能）
  if(role==='admin' && pool - count < 1) count = Math.max(0, pool - 1);
  if(count <= 0){ pushLog(s,'これ以上削減できない。','warn'); render(); return; }

  // 退職金・割増：年収の1/4相当 × 人数
  const sal = role==='tech' ? C.TECH_SALARY : role==='sales' ? (C.SALES_SALARY||5200000) : C.ADMIN_SALARY;
  const sever = Math.round(sal * 0.28 * count);
  if(sever > s.cash){
    pushLog(s, `退職金・手続き費用が不足している（必要 ${yen(sever)}）。`, 'warn');
    render(); return;
  }
  s.cash -= sever;
  if(role==='tech'){
    s.techs -= count;
    // 低パフォーマンス層を切る想定で熟練はわずかに上がるが、士気・誠実性は傷つく
    s.techSkill = clamp((s.techSkill||50) + Math.min(3, count*0.4), 5, 95);
  } else if(role==='sales'){
    s.salesStaff -= count;
    s.salesSkill = clamp((s.salesSkill||50) + Math.min(2.5, count*0.35), 5, 95);
  } else {
    s.admins -= count;
  }
  // 会社ダメージ
  const moraleHit = 4 + count * 1.8 + (count >= 5 ? 4 : 0);
  s.morale = clamp((s.morale||60) - moraleHit, 5, 95);
  s.integrity = clamp((s.integrity!=null?s.integrity:72) - (2 + count * 0.4), 5, 98);
  s.reputation = clamp(s.reputation - (count >= 3 ? 2 : 1), 5, 98);
  // 大量リストラは不正圧力を一時的に上げる（恨み・荒廃）
  s.fraudPressure = clamp((s.fraudPressure||0) + count * 1.5, 0, 100);
  s.laborTightness = Math.max(0.85, (s.laborTightness||1) - count * 0.008);

  const roleLabel = role==='tech'?'技術者':role==='sales'?'営業':'事務員';
  pushLog(s, `リストラにより${roleLabel}${count}名を削減した（退職金等 ${yen(sever)}）。士気・組織風土に打撃。熟練の底上げは限定的。`, 'warn');
  render(); autoSave();
}

function doDiscipline(caseId, action){
  // action: 'fire' | 'warn' | 'acquit'
  const s = state;
  const c = (s.discCases||[]).find(x=>x.id===caseId);
  if(!c || c.status!=='pending'){ pushLog(s,'案件が見つからない。','info'); render(); return; }

  const sev = c.severity||2;
  if(action==='fire'){
    // 懲戒解雇：退職金ほぼなし、該当職種1名減、誠実性回復、残存士気は微妙
    if(c.role==='tech' && (s.techs||0)>0) s.techs = Math.max(0, s.techs-1);
    else if(c.role==='sales' && (s.salesStaff||0)>0) s.salesStaff = Math.max(0, s.salesStaff-1);
    else if(c.role==='admin' && (s.admins||0)>0) s.admins = Math.max(0, s.admins-1);
    s.integrity = clamp((s.integrity||72) + 3 + sev, 5, 98);
    s.fraudPressure = Math.max(0, (s.fraudPressure||0) - 6 - sev*2);
    s.morale = clamp((s.morale||60) - 2, 5, 95); // 厳しさへの畏怖と不安
    s.reputation = clamp(s.reputation + 0.5, 5, 98); // ガバナンス評価
    c.status = 'fired';
    pushLog(s, `懲罰委員会：${c.label}について懲戒解雇とした。不正圧力は低下したが、現場には緊張が残る。`, 'info');
  } else if(action==='warn'){
    // 譴責・減給相当：現金わずかに、誠実性少し回復、再発リスク残
    const fine = 200000 * sev;
    s.cash -= fine;
    s.integrity = clamp((s.integrity||72) + 1.2, 5, 98);
    s.fraudPressure = Math.max(0, (s.fraudPressure||0) - 3);
    s.morale = clamp((s.morale||60) - 1, 5, 95);
    c.status = 'warned';
    pushLog(s, `懲罰委員会：${c.label}に譴責・処分を行った（社内処分コスト ${yen(fine)}）。再発監視が必要。`, 'info');
  } else {
    // 不起訴・不問：短期的に士気は守るが誠実性と評判が傷つく
    s.integrity = clamp((s.integrity||72) - 4 - sev, 5, 98);
    s.fraudPressure = clamp((s.fraudPressure||0) + 5 + sev, 0, 100);
    s.reputation = clamp(s.reputation - 2 - sev*0.5, 5, 98);
    s.morale = clamp((s.morale||60) + 1, 5, 95);
    // 不問が続くと実害（隠蔽が常態化）
    const dmg = 800000 * sev;
    s.cash -= dmg;
    s.quality = clamp(s.quality - sev * 0.8, 5, 98);
    c.status = 'acquitted';
    pushLog(s, `懲罰委員会：${c.label}を不問とした。現場の安堵はあるが、組織の緩みと信用・品質への打撃が大きい（対応・逸失 ${yen(dmg)}）。`, 'warn');
  }
  // 古い解決済み案件は整理
  s.discCases = (s.discCases||[]).filter(x=>x.status==='pending' || s.turn - (x.turn||0) < 8);
  render(); autoSave();
}

function processFraudAndDiscipline(s, logs){
  updateIntegrityDrift(s, logs);
  processMisconduct(s, logs);
  // 未処理案件の放置ペナルティ
  const pending = (s.discCases||[]).filter(c=>c.status==='pending');
  if(pending.length >= 2){
    s.reputation = clamp(s.reputation - 1.5, 5, 98);
    s.integrity = clamp((s.integrity||72) - 1, 5, 98);
    logs.push({text:`懲罰委員会の未処理案件が${pending.length}件残っている。ガバナンス不全として内外の信用が傷ついている。`, tag:'warn'});
  }
}


function doTrainInspector(count){
  const s = state;
  ensureInspectors(s);
  count = Math.max(1, Math.min(10, Math.round(count||1)));
  const pending = (s.inspectorPipeline||[]).reduce((a,p)=>a+(p.n||0),0);
  const uncertified = Math.max(0, (s.techs||0) - (s.inspectors||0) - pending);
  if(uncertified <= 0){
    pushLog(s, '講習に送れる無資格の技術者がいない（全員が既に検査員か講習中）。', 'warn');
    render(); return;
  }
  count = Math.min(count, uncertified);
  const cost = Math.round(C.INSPECTOR_TRAIN_COST * count);
  if(cost > s.cash){
    pushLog(s, `検査員講習の費用が不足している（必要 ${yen(cost)}）。`, 'warn');
    render(); return;
  }
  s.cash -= cost;
  s.inspectorPipeline = s.inspectorPipeline || [];
  s.inspectorPipeline.push({
    id: 'insp'+Date.now()+Math.floor(Math.random()*99),
    n: count,
    resolveTurn: s.turn + (C.INSPECTOR_TRAIN_DELAY||1),
  });
  pushLog(s, `技術者${count}名を昇降機等検査員講習へ送った（費用 ${yen(cost)}）。修了まで約${C.INSPECTOR_TRAIN_DELAY||1}四半期。官公庁・公共の保守には有資格者が必須。`, 'info');
  render(); autoSave();
}
function resolveInspectorPipeline(s, logs){
  ensureInspectors(s);
  if(!s.inspectorPipeline || !s.inspectorPipeline.length) return;
  const remain = [];
  s.inspectorPipeline.forEach(job=>{
    if(job.resolveTurn > s.turn){ remain.push(job); return; }
    let passRate = 0.78;
    if(s.upgrades && s.upgrades.training) passRate += 0.08;
    if((s.qualityBudget||0) > 2000000) passRate += 0.04;
    passRate = clamp(passRate, 0.55, 0.95);
    let passed = 0;
    for(let i=0;i<(job.n||0);i++){ if(Math.random() < passRate) passed++; }
    if(passed > 0){
      s.inspectors = Math.min((s.techs||0), (s.inspectors||0) + passed);
      const line = `昇降機等検査員講習の結果、${passed}名が資格者証を取得した（有資格 ${s.inspectors}/${s.techs}名）。`;
      if(logs) logs.push({text:line, tag:'good'});
      else pushLog(s, line, 'good');
    }
    const failed = (job.n||0) - passed;
    if(failed > 0){
      const line = `検査員講習・修了考査で${failed}名が不合格となった。再受講が必要。`;
      if(logs) logs.push({text:line, tag:'warn'});
      else pushLog(s, line, 'warn');
    }
  });
  s.inspectorPipeline = remain;
  ensureInspectors(s);
}
function processPublicInspectorConstraint(s, logs){
  ensureInspectors(s);
  const pub = (s.segmentUnits && s.segmentUnits.public) || 0;
  if(pub <= 0) return;
  const cap = publicCapacity(s);
  if(pub <= cap) return;
  const lost = Math.max(1, Math.round(pub - cap));
  s.segmentUnits.public = Math.max(0, pub - lost);
  const totalBefore = Math.max(1, s.units);
  const ratio = lost / totalBefore;
  REGIONS.forEach(rg=>{
    const u = s.regionUnits[rg.id]||0;
    if(u > 0) s.regionUnits[rg.id] = u - Math.min(u, Math.round(u * ratio));
  });
  let ru = Object.values(s.regionUnits).reduce((a,b)=>a+b,0);
  let su = SEGMENT_IDS.reduce((a,id)=>a+(s.segmentUnits[id]||0),0);
  if(ru !== su && su > 0){
    const scale = su / Math.max(1, ru);
    REGIONS.forEach(rg=>{ s.regionUnits[rg.id] = Math.max(0, Math.round((s.regionUnits[rg.id]||0)*scale)); });
    ru = Object.values(s.regionUnits).reduce((a,b)=>a+b,0);
    const diff = su - ru;
    if(diff !== 0){
      const top = REGIONS.slice().sort((a,b)=>(s.regionUnits[b.id]||0)-(s.regionUnits[a.id]||0))[0];
      s.regionUnits[top.id] = Math.max(0, (s.regionUnits[top.id]||0) + diff);
    }
  }
  s.units = Object.values(s.regionUnits).reduce((a,b)=>a+b,0);
  s.reputation = clamp(s.reputation - 2 - Math.min(5, lost/20), 5, 98);
  const line = `昇降機等検査員の不足により、官公庁・公共案件 ${num(lost)}台の保守を継続できず解約された（有資格者定員 ${num(cap)}台）。官公庁は検査資格者でしか保守できない。`;
  if(logs) logs.push({text:line, tag:'warn'});
  else pushLog(s, line, 'warn');
}

function doRecruit(typeKey, count){
  const s = state;
  const t = RECRUIT_TYPES[typeKey];
  if(!t) return;
  count = Math.max(1, Math.min(10, Math.round(count||1)));
  const unit = recruitCostPerHead(s, typeKey);
  // 大量募集は広告・面接負荷で割増
  const bulk = 1 + Math.max(0, count - 2) * 0.06;
  const cost = Math.round(unit * count * bulk);
  if(cost > s.cash){
    pushLog(s, `採用予算が不足している（必要 ${yen(cost)}）。`, 'warn');
    render(); return;
  }
  s.cash -= cost;
  s.recruitPipeline = s.recruitPipeline || [];
  const resolveTurn = s.turn + (t.delay||0);
  s.recruitPipeline.push({
    id: 'rq'+Date.now()+Math.floor(Math.random()*999),
    type: typeKey,
    requested: count,
    resolveTurn,
    costPaid: cost,
  });
  const when = t.delay > 0 ? `入社予定は次四半期以降（内定・研修期間）` : `今期中に合否・入社が判明`;
  pushLog(s, `「${t.label}」を${count}名分募集した（募集・紹介・研修費 ${yen(cost)}）。${when}。充足は労働市場と会社の魅力次第。`, 'info');
  // 即時解決（中途・経験者）
  if((t.delay||0) === 0){
    resolveRecruitPipeline(s, null);
  }
  render(); autoSave();
}
function applyHires(s, role, n, skill, earlyQuit, logs, certChance){
  if(n <= 0) return;
  if(role === 'tech'){
    ensureInspectors(s);
    const oldT = s.techs;
    const curSkill = (s.techSkill!=null ? s.techSkill : 50);
    s.techSkill = (curSkill * oldT + skill * n) / Math.max(1, oldT + n);
    s.techs += n;
    s.laborTightness = Math.min(2.8, (s.laborTightness||1) + n * 0.012);
    const cc = certChance != null ? certChance : 0.2;
    let certified = 0;
    for(let i=0;i<n;i++){ if(Math.random() < cc) certified++; }
    if(certified > 0){
      s.inspectors = (s.inspectors||0) + certified;
      const line = `入社した技術者のうち${certified}名が昇降機等検査員資格を保有（官公庁・公共の保守に必要）。`;
      if(logs) logs.push({text:line, tag:'good'});
      else pushLog(s, line, 'good');
    }
  } else if(role === 'sales'){
    const oldS = Math.max(0, s.salesStaff||0);
    const cur = (s.salesSkill!=null ? s.salesSkill : 50);
    s.salesSkill = (cur * oldS + skill * n) / Math.max(1, oldS + n);
    s.salesStaff = oldS + n;
    s.laborTightness = Math.min(2.8, (s.laborTightness||1) + n * 0.008);
  } else {
    s.admins += n;
  }
  s.newHireCohorts = s.newHireCohorts || [];
  s.newHireCohorts.push({
    role, n, skill, earlyQuit: earlyQuit||0.05, turnsLeft: 4,
  });
}
function resolveRecruitPipeline(s, logs){
  if(!s.recruitPipeline || !s.recruitPipeline.length) return;
  const remain = [];
  s.recruitPipeline.forEach(job=>{
    if(job.resolveTurn > s.turn){ remain.push(job); return; }
    const t = RECRUIT_TYPES[job.type];
    if(!t) return;
    const chance = recruitFillChance(s, job.type);
    // 各枠を独立に抽選（集まらないことがある）
    let filled = 0;
    for(let i=0;i<job.requested;i++){
      if(Math.random() < chance) filled++;
    }
    // ゼロのときもごく稀に1人（縁故など）— しない方が現実的なのでそのまま
    const msgLogs = logs || { push(x){ pushLog(s, x.text, x.tag); } };
    if(filled <= 0){
      const line = `「${t.label}」${job.requested}名募集は十分な応募を得られず、今期の採用はゼロに終わった（投下費用 ${yen(job.costPaid)} は回収不能）。`;
      if(logs) logs.push({text:line, tag:'warn'});
      else pushLog(s, line, 'warn');
      s.morale = clamp((s.morale||60) - 1, 5, 95);
    } else {
      applyHires(s, t.role, filled, t.skill, t.earlyQuit, logs, t.certChance);
      if(t.referral) s.referralHires = (s.referralHires||0) + filled;
      const miss = job.requested - filled;
      let line = `「${t.label}」募集の結果、${filled}/${job.requested}名が入社した。`;
      if(miss > 0) line += `（${miss}名分は辞退・競合他社へ）`;
      if(t.role==='tech') line += ` 平均熟練は新人の影響を受ける。`;
      if(t.role==='sales') line += ` 営業の手数が増え、新規開拓力が上がる。`;
      if(t.referral) line += `（紹介経由）`;
      if(logs) logs.push({text:line, tag: filled>=job.requested?'good':'info'});
      else pushLog(s, line, filled>=job.requested?'good':'info');
      if(t.role==='tech' && adminLoad(s) > 1.1){
        const w = '人員は増えたが事務負荷が高く、オンボーディングと顧客対応が滞るリスクがある。';
        if(logs) logs.push({text:w, tag:'warn'});
        else pushLog(s, w, 'warn');
      }
    }
  });
  s.recruitPipeline = remain;
}
function processNewHireCohorts(s, logs){
  if(!s.newHireCohorts || !s.newHireCohorts.length) return;
  const util = baseCapacity(s)>0 ? s.units/baseCapacity(s) : 0;
  const next = [];
  s.newHireCohorts.forEach(c=>{
    let rate = c.earlyQuit || 0.05;
    if((s.morale||60) < 40) rate *= 1.6;
    else if((s.morale||60) < 50) rate *= 1.25;
    if(util > 1.0) rate *= 1.35;
    if(util > 1.1) rate *= 1.2;
    if((s.welfareBudget||0) > 2000000) rate *= 0.85;
    if(s.upgrades && s.upgrades.training) rate *= 0.8;
    const quit = Math.min(c.n, Math.round(c.n * rate * (0.6 + Math.random()*0.8)));
    if(quit > 0){
      if(c.role==='tech'){
        s.techs = Math.max(0, s.techs - quit);
      } else if(c.role==='sales'){
        s.salesStaff = Math.max(0, (s.salesStaff||0) - quit);
      } else {
        s.admins = Math.max(0, s.admins - quit);
      }
      c.n -= quit;
      const who = c.role==='tech' ? '技術者' : (c.role==='sales' ? '営業' : '事務員');
      const line = `入社間もない${who}のうち${quit}名が離職した（試用・適応の失敗、条件面のギャップなど）。`;
      if(logs) logs.push({text:line, tag:'warn'});
      else pushLog(s, line, 'warn');
    }
    c.turnsLeft--;
    if(c.n > 0 && c.turnsLeft > 0) next.push(c);
  });
  s.newHireCohorts = next;
}
/** 後方互換: 旧UI・助言からの呼び出しは中途採用にマップ */
function doHire(techN, adminN, salesN){

function ensureBranchManagerFields(mgr){
  if(!mgr) return;
  if(!mgr.aiType || !BRANCH_AI_ARCHETYPES[mgr.aiType]){
    const keys = Object.keys(BRANCH_AI_ARCHETYPES);
    mgr.aiType = keys[Math.floor(Math.random()*keys.length)];
  }
  if(mgr.initiativeCooldown==null) mgr.initiativeCooldown = 0;
  if(mgr.lastMove==null) mgr.lastMove = null;
}
function branchManagerBidMult(s, rid){
  const mgr = s.branchManagers && s.branchManagers[rid];
  if(!mgr) return 1;
  ensureBranchManagerFields(mgr);
  const arch = BRANCH_AI_ARCHETYPES[mgr.aiType] || BRANCH_AI_ARCHETYPES.hunter;
  let mult = clamp(0.85 + (mgr.skill||50)*0.003, 0.85, 1.15);
  mult *= (arch.bidMult || 1);
  // 集中応援キャンペーン
  if(s.branchCampaign && s.branchCampaign.regionId===rid && (s.branchCampaign.ticksLeft||0)>0){
    mult *= (s.branchCampaign.bidMult || 1.25);
  }
  // 他地方がキャンペーン対象のとき、応援元はわずかに低下
  if(s.branchCampaign && s.branchCampaign.regionId!==rid && (s.branchCampaign.ticksLeft||0)>0){
    mult *= 0.94;
  }
  return mult;
}
function doStartBranchCampaign(regionId){
  const s = state;
  const region = REGIONS.find(r=>r.id===regionId);
  if(!region || (s.regionBranches[regionId]||0)<=0) return;
  if(s.branchCampaign && (s.branchCampaign.ticksLeft||0)>0){

    render(); return;
  }
  const mgr = s.branchManagers[regionId];
  const skill = mgr ? (mgr.skill||50) : 40;
  const cost = Math.round(BRANCH_CAMPAIGN_COST_BASE * (0.85 + skill/100));
  if(cost > s.cash){
    pushLog(s, `集中応援キャンペーンの費用が不足（必要 ${yen(cost)}）。`, 'warn');
    render(); return;
  }
  s.cash -= cost;
  s.branchCampaign = {
    regionId,
    ticksLeft: BRANCH_CAMPAIGN_DURATION,
    bidMult: clamp(1.18 + skill*0.002, 1.18, 1.35),
    costPaid: cost,
    label: `${region.name}集中応援`,
  };
  const who = mgr ? `${mgr.name}支社長のもと` : '本社主導で';

  pushCompanyChronicle(s, `${region.name}支社へ集中応援キャンペーン`, 'info');
  render(); autoSave();
}
function processBranchManagerAI(s, logs){
  if(!s.branchManagers) return;
  // キャンペーン進行
  if(s.branchCampaign && (s.branchCampaign.ticksLeft||0)>0){
    s.branchCampaign.ticksLeft--;
    const rid = s.branchCampaign.regionId;
    const region = REGIONS.find(r=>r.id===rid);
    // 毎期わずかに品質・満足
    s.satisfaction = clamp((s.satisfaction||60)+0.3, 5, 98);
    if(s.branchCampaign.ticksLeft<=0){
      logs.push({text:`${region?region.name:rid}向け集中応援キャンペーンが終了した。`, tag:'info'});
      s.branchCampaign = null;
    } else {
      logs.push({text:`【キャンペーン】${region?region.name:rid}集中応援 残り${s.branchCampaign.ticksLeft}四半期。`, tag:'info'});
    }
  }

  Object.keys(s.branchManagers).forEach(rid=>{
    const mgr = s.branchManagers[rid];
    ensureBranchManagerFields(mgr);
    const arch = BRANCH_AI_ARCHETYPES[mgr.aiType];
    const region = REGIONS.find(r=>r.id===rid);
    if(!arch || !region) return;
    if((mgr.initiativeCooldown||0)>0){
      mgr.initiativeCooldown--;
      return;
    }
    // 手腕が高いほど独自施策を打ちやすい
    const chance = 0.12 + (mgr.skill||50)/400;
    if(Math.random() > chance) return;

    const cost = Math.round((arch.costQ||100000) * (0.8 + (mgr.skill||50)/100));
    if(cost > s.cash * 0.02 && cost > s.cash) return; // 軽く抑制
    const paid = Math.min(Math.max(0,s.cash), cost);
    s.cash -= paid;

    // 効果
    if(arch.qualityDelta){
      s.quality = clamp((s.quality||50) + arch.qualityDelta * (0.6 + (mgr.skill||50)/100), 5, 98);
    }
    // 地方の一時ブースト（AI施策）
    if(arch.id==='hunter' || arch.id==='networker'){
      s.regionBoost = s.regionBoost || {};

function dealConsiderationEligible(s, methodKey){
  const m = DEAL_CONSIDERATION[methodKey] || DEAL_CONSIDERATION.cash;
  if(m.needListed && !(s.isListed && s.stockPrice)){
    return {ok:false, reason:'この対価方法は上場後（株価算定が可能）に限る'};
  }
  return {ok:true};
}
/** 買収対価の支払い。costは持分比率反映後のベース額 */
function applyDealPayment(s, cost, methodKey){
  const m = DEAL_CONSIDERATION[methodKey] || DEAL_CONSIDERATION.cash;
  const elig = dealConsiderationEligible(s, methodKey);
  if(!elig.ok) return {ok:false, reason:elig.reason};
  const total = Math.round(cost * (1 + (m.premium||0)));
  const deferred = Math.round(total * (m.deferredRatio||0));
  const payableNow = total - deferred;
  const cashPart = Math.round(payableNow * m.cashRatio);
  const sharePart = Math.max(0, payableNow - cashPart);
  if(sharePart > 0 && !(s.isListed && s.stockPrice)){
    return {ok:false, reason:'株式対価には上場と株価が必要'};
  }
  if(cashPart > s.cash){
    return {ok:false, reason:`現金が不足（必要 ${yen(cashPart)}／保有 ${yen(s.cash)}）
${pmiSection}`};
  }
  s.cash -= cashPart;
  let newShares = 0;
  if(sharePart > 0){
    newShares = sharePart / s.stockPrice;
    s.shares += newShares;
    s.paidInCapital = (s.paidInCapital||0) + sharePart;
  }
  if(deferred > 0){
    // 簡易アーンアウト負債（2年・8四半期で均等払い）
    s.earnoutLiabilities = s.earnoutLiabilities || [];
    s.earnoutLiabilities.push({
      id: 'eo'+Date.now(),
      remaining: deferred,
      perQuarter: Math.round(deferred / 8),
      ticksLeft: 8,
    });
  }
  // 吸収合併は統合コスト
  let integrationCost = 0;
  if(methodKey === 'merger'){
    integrationCost = Math.round(total * 0.03);
    s.cash -= integrationCost;
    s.quality = clamp((s.quality||50)-1, 5, 98);
  }
  return {
    ok:true, total, cashPart, sharePart, deferred, newShares, integrationCost,
    label: m.label, methodKey,
  };
}
function formatDealPayment(pay){
  if(!pay || !pay.ok) return '';
  const parts = [];
  if(pay.cashPart>0) parts.push(`現金 ${yen(pay.cashPart)}`);
  if(pay.sharePart>0) parts.push(`株式交付 約${num(Math.round(pay.newShares))}株（${yen(pay.sharePart)}相当）`);
  if(pay.deferred>0) parts.push(`アーンアウト ${yen(pay.deferred)}（分割後払い）`);
  if(pay.integrationCost>0) parts.push(`統合費用 ${yen(pay.integrationCost)}`);
  return parts.join('／');
}
function considerationOptionsFor(s){
  return Object.entries(DEAL_CONSIDERATION).filter(([k,m])=>{
    if(m.needListed && !(s.isListed && s.stockPrice)) return false;
    return true;
  });
}

function doHostileTakeover(rivalId, typeKey, methodKey){
  const s = state;
  const rival = s.rivals.find(r=>r.id===rivalId);
  if(!rival) return;
  if(typeof isAlliedWith==='function' ? isAlliedWith(s, rivalId) : (s.alliances && s.alliances[rivalId])){ pushLog(s, `業務提携中の${rival.name}を買収するには、先に提携を解消する必要がある。`, 'warn'); render(); return; }
  if(!takeoverEligible(s, rival)){ pushLog(s, `${rival.name}は現時点では買収の実効性が低い（自社規模がさらに優位である必要がある）。`, 'warn'); render(); return; }
  const ot = OWNERSHIP_TYPES[typeKey] || OWNERSHIP_TYPES.full;
  const fullCost = takeoverCost(s, rival);
  const cost = Math.round(fullCost * ot.pct/100);
  methodKey = methodKey || 'cash';
  const pay = applyDealPayment(s, cost, methodKey);
  if(!pay.ok){
    pushLog(s, `${rival.name}の取得を実行できない（${pay.reason}）。`, 'warn');
    render(); return;
  }
  pushLog(s, `${rival.name}を${pay.label}により${ot.label}化した（${formatDealPayment(pay)}）。`, 'good');

  if(typeKey==='equity'){
    // 持分法適用会社：同一ライバルは合算（重複エントリ防止）
    s.equityMethodHoldings = s.equityMethodHoldings || [];
    const existing = s.equityMethodHoldings.find(x=>x.rivalId===rival.id || x.name===rival.name);
    if(existing){
      existing.ownershipPct = Math.min(49, (existing.ownershipPct||0) + ot.pct);
      existing.units = rival.units;
      existing.president = rival.ceoName || existing.president;
      existing.rivalId = rival.id;
      pushLog(s, `${rival.name}の持分を追加取得し、持分法適用比率が${existing.ownershipPct}%になった（重複登録は統合）。`, 'good');
      modal = {type:'event', title:'持分の追加取得', body:`${rival.name}の持分法適用比率が${existing.ownershipPct}%になった。49%超は連結子会社化の画面から引き上げる。`};
    } else {
      s.equityMethodHoldings.push({
        id: 'eq'+Date.now()+Math.floor(Math.random()*999),
        name: rival.name,
        regionName: '全国',
        units: rival.units,
        ownershipPct: ot.pct,
        acquiredYear: s.year,
        president: rival.ceoName,
        rivalId: rival.id,
      });
      modal = {type:'event', title:'資本業務提携（持分法適用会社化）成立', body:`${rival.name}の株式${ot.pct}%を取得し、持分法適用会社とした。保有台数・売上は自社に計上されないが、持分に応じた投資利益を得る。${rival.name}は引き続き競合として市場に残る。`};
    }
    render(); autoSave();
    return;
  }

  REGIONS.forEach(rg=>{
    const u = rival.regionUnits[rg.id]||0;
    if(u>0){
      s.regionUnits[rg.id] = (s.regionUnits[rg.id]||0) + u;
      if((s.regionBranches[rg.id]||0)===0) s.regionBranches[rg.id] = 1;
    }
  });
  s.units = Object.values(s.regionUnits).reduce((a,b)=>a+b,0);
  const gainedTechs1 = Math.round(rival.units / C.TECH_CAPACITY * 0.9);
  s.techs += gainedTechs1;
  ensureInspectors(s);
  s.inspectors = Math.min(s.techs, (s.inspectors||0) + Math.round(gainedTechs1 * 0.4));
  s.branches += 1;
  const hostileSub = {
    id: 'sub'+Date.now()+Math.floor(Math.random()*999),
    name: rival.name,
    regionId: null,
    regionName: '全国',
    units: rival.units,
    acquiredYear: s.year,
    president: rival.ceoName,
    ownershipType: typeKey,
    ownershipPct: ot.pct,
  };
  s.subsidiaries.push(hostileSub);
  if(typeof addGoodwillFromDeal==='function') addGoodwillFromDeal(s, cost, rival.units||0, null);
  const hostilePmi = createPmiJob(s, hostileSub, {techsGained: gainedTechs1, hostile:true});
  s.rivals = s.rivals.filter(r=>r.id!==rivalId);

` + (modal.body||'');
  } else {

}

function buildDivestDemand(s){
  const activeRegions = REGIONS.filter(rg=>(s.regionBranches[rg.id]||0)>0);
  if(activeRegions.length<=1) return buildBuybackDemand(s);
  let weakest = activeRegions[0];
  activeRegions.forEach(rg=>{
    if((s.regionUnits[rg.id]||0) < (s.regionUnits[weakest.id]||0)) weakest = rg;
  });
  const proceeds = Math.round((s.regionUnits[weakest.id]||0) * s.price * 0.9);
  return {
    type:'choice',
    title:'アクティビスト株主からの提案（非中核事業の売却要求）',
    body:`選択と集中の観点から、シェアの低い${weakest.name}事業の売却を求める提案が届いた。売却すれば${yen(proceeds)}を得られるが、同地方の契約と拠点を手放すことになる。`,

        state.regionBranches[weakest.id] = 0;
        state.branches = Math.max(1, state.branches-1);
        state.cash += proceeds;
        state.reputation = clamp(state.reputation+4, 5, 98);
        if(state.psr) state.psr *= 1.04;
        pushLog(state, `${weakest.name}事業を売却し${yen(proceeds)}を獲得した。選択と集中が評価された。`, 'good');
        modal = null; if(!state.gameOver) startTimer(); render();
      }},
      {label:'拒否する', onClick:()=>{
        if(state.psr) state.psr *= 0.94;
        state.reputation = clamp(state.reputation-3, 5, 98);
        pushLog(state, '事業売却要求を拒否し、独自路線を貫いた。', 'warn');
        modal = null; if(!state.gameOver) startTimer(); render();
      }},
    ]
  };

/* ---- 株主総会（年次） ---- */
function computeApprovalRate(s, favorable){
  // 創業社長が議決権の過半を握る場合、通常決議は実質的に社長の意思で決まる
  const own = founderOwnershipPct(s);
  if(own >= 0.90) return 100;
  if(own >= 0.50){
    const base = 50 + (s.reputation-50)*0.25 + favorable*8;
    return clamp(Math.max(base, 50 + own*40), 55, 99);
  }
  const rate = 50 + (s.reputation-50)*0.5 + (independentRatio(s)-0.2)*40 + favorable*15;
  const floatPenalty = Math.max(0, 0.45 - own) * 30;
  return clamp(rate - floatPenalty, 5, 95);
}
/** 第3号議案の採決結果を明示してから次へ */
function showAgmVoteResult(opts){
  const name = opts.name || '第3号議案';
  const approval = Math.round(opts.approval);
  const passed = !!opts.passed;
  const stance = opts.stance || '';
  const detail = opts.detail || '';
  let body = `【採決結果】${name}\n\n`;
  body += `経営陣の方針: ${stance}\n`;
  body += `賛成 ${approval}％ ／ 反対 ${Math.max(0, 100-approval)}％\n`;
  body += `結果: ${passed ? '可決' : '否決'}（可決ライン 50％）\n`;
  if(detail) body += `\n${detail}`;
  modal = {
    type: 'choice',
    title: passed ? '第3号議案：可決' : '第3号議案：否決',
    body,
    options: [{
      label: '続けて技術質疑へ',
      onClick: ()=>{
        if(typeof opts.after === 'function'){
          try{ opts.after(); }catch(e){}
        }
        afterAgmContinue();
      }
    }]
  };
  render();
  autoSave();
}
function buildAgmModal(s){
  s.lastAgmYear = s.year;
  const fiscalTerm = Math.max(1, s.year - 2025);
  const own = founderOwnershipPct(s);

  if(own >= 0.95){
    let body = `【第${fiscalTerm}期 定時株主総会】\n`;
    body += `創業社長（${s.ceoName||'社長'}）が議決権の${pct(own,1)}を保有しており、株主は実質的に社長のみである。\n`;
    body += `このため議案の賛否採決は行わず、会社法上の「書面決議」に近い形で、社長の意思決定として確定した。\n\n`;
    body += `・剰余金処分（配当性向 ${Math.round((s.dividendPayoutRatio||0)*100)}%）… 社長決定どおり\n`;
    body += `・取締役選任（社内${s.board.insiders}名・社外${s.board.outsiders}名）… 社長決定どおり\n`;
    body += `\n外部株主がいない段階では、総会は「経営の区切りを確認する場」であり、賛否で否決される構造にはならない。`;
    return {
      type:'choice',
      title:`${s.year}年 定時株主総会（社長決議）`,
      body,
      options:[{label:'確認して中期計画へ', onClick:()=>afterAgmContinue()}]
    };
  }

  const divApproval = Math.round(computeApprovalRate(s, s.dividendPayoutRatio>0 ? 1 : 0.2));
  const boardApproval = Math.round(computeApprovalRate(s, independentRatio(s)>=(1/3) ? 1 : 0.3));
  const divPassed = own >= 0.50 ? true : divApproval >= 50;
  const boardPassed = own >= 0.50 ? true : boardApproval >= 50;
  if(!divPassed){
    s.dividendPayoutRatio = 0;
    s.reputation = clamp(s.reputation-2, 5, 98);
  }
  if(!boardPassed){
    s.reputation = clamp(s.reputation-3, 5, 98);
  }

  let body = `【第${fiscalTerm}期 定時株主総会】\n創業社長持分 ${pct(own,1)}\n`;
  if(own >= 0.50){
    body += `第1号議案 剰余金処分の件（配当性向${Math.round((s.dividendPayoutRatio||0)*100)}%）: 社長の議決権により可決\n`;
    body += `第2号議案 取締役選任の件（社内${s.board.insiders}名・社外${s.board.outsiders}名）: 社長の議決権により可決\n`;
    body += `※通常決議は議決権の過半で足りるため、社長が過半を持つ限り否決されない。`;
  } else {
    body += `第1号議案 剰余金処分の件（配当性向${Math.round((s.dividendPayoutRatio||0)*100)}%）: 賛成${divApproval}％ → ${divPassed?'可決':'否決'}\n`;
    body += `第2号議案 取締役選任の件（社内${s.board.insiders}名・社外${s.board.outsiders}名）: 賛成${boardApproval}％ → ${boardPassed?'可決':'否決'}`;
    if(!divPassed) body += '\n※配当議案の否決を受け、配当性向は0%にリセットされた。';
    if(!boardPassed) body += '\n※取締役選任議案が否決され、経営の求心力に疑問符がついた。';
  }

  const direConditions = own <= 0.30;
  const canHaveProposal = s.isListed && own < 0.90;
  let hasProposal = canHaveProposal && Math.random() < (own < 0.50 ? 0.55 : 0.25);
  // 上場かつ中期未策定なら第3号議案として策定要求が出やすい
  if(canHaveProposal && typeof needsMidtermShareholderDemand==='function' && needsMidtermShareholderDemand(s)){
    if(own < 0.50) hasProposal = true;
    else if(own < 0.90 && Math.random() < 0.55) hasProposal = true;
  }

  if(!hasProposal){
    body += own >= 0.50
      ? '\n\n外部株主からの株主提案はなかった（社長が議決権の過半を維持）。'
      : '\n\n今期、株主提案の上程はなかった。';
    return {
      type:'choice', title:`${s.year}年 定時株主総会`, body,
      options:[{label:'閉じる（中期計画へ）', onClick:()=>afterAgmContinue()}]
    };
  }

  if(direConditions && Math.random()<0.5 && !(typeof needsMidtermShareholderDemand==='function' && needsMidtermShareholderDemand(s) && Math.random()<0.7)){
    body += `\n\n第3号議案（株主提案） ${s.ceoName}社長 解任の件\n創業社長の持株比率は${pct(own,1)}まで低下しており、可決される可能性がある。\n採決前に方針を選んでください。結果は賛成％とともに表示されます。`;
    return {
      type:'choice', title:`${s.year}年 定時株主総会`, body,
      options:[
        {label:'委任状争奪戦で徹底抗戦する（コスト発生）', onClick:()=>resolveCeoDismissalVote(true)},
        {label:'静観する（コストは抑えられるが可決されやすい）', onClick:()=>resolveCeoDismissalVote(false)},
      ]
    };
  }

  let proposal;
  if(typeof needsMidtermShareholderDemand==='function' && needsMidtermShareholderDemand(s) && Math.random() < 0.85){
    proposal = buildMidtermDemand(s);
  } else if(s.vicePresident && Math.random() < 0.32){
    proposal = buildVpDismissalProposal(s) || buildBuybackDemand(s);
  } else {
    const builders = [buildBuybackDemand, buildDividendDemand, buildBoardDemand, buildDivestDemand, buildFreezeDemand];
    if(typeof needsMidtermShareholderDemand==='function' && needsMidtermShareholderDemand(s)) builders.unshift(buildMidtermDemand);
    if(s.vicePresident) builders.push(buildVpDismissalProposal);
    const pick = builders[Math.floor(Math.random()*builders.length)];
    proposal = pick(s) || buildBuybackDemand(s);
  }
  const proposalName = proposal.title.replace('アクティビスト株主からの提案（','').replace('）','');
  body += `\n\n第3号議案（株主提案） ${proposalName}\n${proposal.body}`;
  body += '\n\n方針を選ぶと、賛成・反対の比率と可決／否決が明示されます。';

  if(own >= 0.50){
    return {
      type:'choice',
      title:`${s.year}年 定時株主総会`,
      body: body + '\n※社長が議決権の過半を持つため、反対すれば株主提案は否決できる。',
      options:[
        {label:'提案を受け入れて可決する', onClick:()=>{
          const approval = Math.round(clamp(80 + founderOwnershipPct(state)*20 + Math.random()*5, 85, 99));
          showAgmVoteResult({
            name: proposalName,
            stance: '受け入れ（賛成）',
            approval,
            passed: true,
            detail: '社長の議決権が賛成に回ったため、可決された。',
            after: ()=> proposal.options[0].onClick(),
          });
        }},
        {label:'社長の議決権で否決する', onClick:()=>{
          const ownNow = founderOwnershipPct(state);
          const approval = Math.round(clamp((1-ownNow)*100 * (0.35 + Math.random()*0.35), 5, 49));
          state.reputation = clamp(state.reputation+1, 5, 98);
          showAgmVoteResult({
            name: proposalName,
            stance: '反対（社長議決権で否決）',
            approval,
            passed: false,
            detail: `創業社長持分 ${pct(ownNow,1)} が反対に回ったため、可決ラインに届かなかった。`,
            after: ()=>{},
          });
        }},
      ]
    };
  }

  return {
    type:'choice',
    title:`${s.year}年 定時株主総会`,
    body,
    options:[
      {label:'経営陣として支持し、可決を目指す', onClick:()=>{
        let approval = computeApprovalRate(state, 1.2);
        approval = Math.round(clamp(approval + 8 + Math.random()*6, 55, 96));
        const passed = approval >= 50;
        showAgmVoteResult({
          name: proposalName,
          stance: '経営陣として支持',
          approval,
          passed,
          detail: passed
            ? '経営陣の推奨が一定の支持を集め、可決された。'
            : '経営陣は支持したが、賛成が過半に届かず否決された。',
          after: ()=>{ if(passed) proposal.options[0].onClick(); },
        });
      }},
      {label:'経営陣として反対を推奨する', onClick:()=>{
        let approval = computeApprovalRate(state, 0.35);
        approval = Math.round(clamp(approval - 5 + (Math.random()*24 - 8), 8, 88));
        const passed = approval >= 50;
        if(!passed) state.reputation = clamp(state.reputation+1, 5, 98);
        showAgmVoteResult({
          name: proposalName,
          stance: '経営陣として反対を推奨',
          approval,
          passed,
          detail: passed
            ? '経営陣は反対したが、株主の賛成が過半に達し可決された。提案内容が実行される。'
            : '経営陣の反対推奨が奏功し、賛成は過半に届かず否決された。',
          after: ()=>{ if(passed) proposal.options[0].onClick(); },
        });
      }},
    ]
  };
}

  let body = '定時株主総会を終え、中期経営計画を確認する。\n計画は株主総会後にのみ策定・改定できる。';
  if(active){

    body += '\n\n現在、有効な中期計画はない。';
    if(s.isListed) body += (typeof needsMidtermShareholderDemand==='function' && needsMidtermShareholderDemand(s) ? '\n上場会社として中期計画の未策定は、株主・アクティビストから指摘されやすい。' : '');
  }
  const options = [];
  options.push({
    label: active ? '計画を改定する' : '中期経営計画を策定する',

function goToQuiz(){

  if(!s.isListed){ goToGuidance(); return; }

  const indices = [];
  while(indices.length < 2 && indices.length < pool){
    const idx = Math.floor(Math.random()*pool);
    if(!indices.includes(idx)) indices.push(idx);
  }

function buildQuizQuestionModal(indices, qNum, correctCount){

function resolveQuizAnswer(indices, qNum, correctCount, chosenIdx){
  const s = state;
  const q = QUIZ_QUESTIONS[indices[qNum]];
  const correct = chosenIdx === q.correct;
  if(correct){
    correctCount++;
    pushLog(s, `技術質問に的確に回答した（正解: ${q.choices[q.correct]}）。`, 'good');
  } else {
    s.reputation = clamp(s.reputation-4, 5, 98);
    s.marketTrust = clamp(s.marketTrust-3, 5, 98);
    pushLog(s, `技術質問に誤答した（正解は「${q.choices[q.correct]}」）。経営陣の専門性に疑念を持たれた。`, 'warn');
  }
  if(qNum+1 < indices.length){
    modal = buildQuizQuestionModal(indices, qNum+1, correctCount);
    render();
  } else {
    const total = indices.length;
    let resultLine;
    if(correctCount === total){
      s.reputation = clamp(s.reputation+3, 5, 98);
      s.marketTrust = clamp(s.marketTrust+3, 5, 98);
      resultLine = '全問正解。経営陣の技術的知見の高さが評価され、信頼が高まった。';
    } else if(correctCount === 0){
      s.reputation = clamp(s.reputation-3, 5, 98);
      s.marketTrust = clamp(s.marketTrust-2, 5, 98);
      resultLine = '全問不正解。経営陣の技術的知見への疑念が強まった。';
    } else {
      resultLine = `${correctCount}／${total}問正解。無難に切り抜けた。`;
    }
    modal = {
      type:'choice',
      title:'技術質疑応答 結果',
      body:`株主総会での技術質問${total}問中${correctCount}問正解。${resultLine}`,
      options:[{label:'次へ', onClick:()=>goToGuidance()}]
    };
    render(); autoSave();
  }
}

function resolveDeal(regionId, dealSize, stance){
  const s = state;
  const region = REGIONS.find(r=>r.id===regionId);
  const branchOk = (s.regionBranches[regionId]||0) > 0;
  const coolerPerUnit = 180000; // カゴ内クーラー無料取付の台あたり経費
  // 通常 / 3ヶ月無料 / 3ヶ月無料+クーラー
  let winChance = branchOk ? 0.28 : 0.10;
  winChance += (s.reputation-50)*0.004;
  winChance += (s.quality-50)*0.002;
  let freeYears = 0;
  let withCooler = false;
  let stanceLabel = '通常条件';
  if(stance==='free3m' || stance==='free6m' || stance==='low'){
    winChance += 0.16;
    freeYears = 0.25; // 3ヶ月
    stanceLabel = '保守料金・3ヶ月無料';
  } else if(stance==='free3m_cooler' || stance==='free12m'){
    winChance += 0.28;
    freeYears = 0.25;
    withCooler = true;
    stanceLabel = '3ヶ月無料＋カゴ内クーラー無料取付';
  } else if(stance==='high'){
    winChance -= 0.10;
    stanceLabel = '高価格';
  }
  winChance = clamp(winChance, 0.05, 0.92);
  const win = Math.random() < winChance;
  if(win){
    const actualUnits = branchOk ? dealSize : Math.round(dealSize*0.6);
    s.regionUnits[regionId] = (s.regionUnits[regionId]||0) + actualUnits;
    s.units += actualUnits;
    if(s.segmentUnits){
      const half = Math.floor(actualUnits/2);
      s.segmentUnits.mgmt_company = (s.segmentUnits.mgmt_company||0) + half;
      s.segmentUnits.commercial = (s.segmentUnits.commercial||0) + (actualUnits - half);
    }
    let freeCost = 0;
    let coolerCost = 0;
    if(freeYears > 0){
      freeCost = Math.round(actualUnits * (s.price||C.UNIT_FEE_ANNUAL) * freeYears);
      s.cash -= freeCost;
      s.satisfaction = clamp((s.satisfaction||50)+2, 5, 98);
    } else {
      s.reputation = clamp((s.reputation||50)+1, 5, 98);
    }
    if(withCooler){
      coolerCost = Math.round(actualUnits * coolerPerUnit);
      s.cash -= coolerCost;
      s.satisfaction = clamp((s.satisfaction||50)+3, 5, 98);
      s.quality = clamp((s.quality||50)+1, 5, 98);
    }
    const costBits = [];
    if(freeCost>0) costBits.push(`無料期間相当 ${yen(freeCost)}`);
    if(coolerCost>0) costBits.push(`クーラー取付経費 ${yen(coolerCost)}`);
    pushLog(s,
      `${region.name}の大型商談を獲得した（${stanceLabel}・+${num(actualUnits)}台` +
      (costBits.length ? `／${costBits.join('・')}` : '') +
      `）。${!branchOk?'（現地拠点なしのため一部のみ対応）':''}`,
      'good');
  } else {
    pushLog(s, `${region.name}の大型商談は競合に競り負けた（${stanceLabel}で提案・受注確率目安 ${Math.round(winChance*100)}%）。`, 'warn');
  }
  modal = null;
  if(!s.gameOver) startTimer();
  render(); autoSave();
}
function baseLoanRate(s){
  const cycleAdj = s.cycle==='boom' ? -0.004 : s.cycle==='recession' ? 0.006 : 0;
  return C.LOAN_RATE + (s.rateAdj||0) + cycleAdj + loanRateExecAdj(s) + creditRatingInfo(s).adj + mainBankRateAdj(s);
}
function bankBorrowingLimit(s){
  const rev = Math.max(0, annualRevenue(s));
  const eq = Math.max(0, equityValue(s));
  const rating = creditRatingInfo(s);
  let mult = 0.55;
  const lab = rating.label||'';
  if(lab==='AAA'||lab==='AA') mult = 0.85;
  else if(lab==='A') mult = 0.70;
  else if(lab==='BBB') mult = 0.55;
  else if(lab==='BB') mult = 0.40;
  else mult = 0.28;
  const rel = (s.mainBankRelationship||50)/100;
  mult *= (0.75 + rel * 0.45);
  if(s.cycle==='recession') mult *= 0.82;
  if(s.cycle==='boom') mult *= 1.08;
  let limit = rev * mult + eq * 0.35;
  if(s.isListed) limit *= 1.12;
  return Math.max(0, limit);
}

function weightedDebtUsed(s){
  ensureLoanBook(s);
  let w = 0;
  (s.loans||[]).forEach(L=>{
    const p = LOAN_PRODUCTS[L.type] || LOAN_PRODUCTS.term;
    w += (L.principal||0) * (p.capacityWeight!=null ? p.capacityWeight : 1);
  });
  (s.bonds||[]).forEach(b=>{
    const bp = BOND_PRODUCTS[b.product||'straight'] || BOND_PRODUCTS.straight;
    w += (b.principalRemaining||0) * (bp.capacityWeight!=null ? bp.capacityWeight : 0.9);
  });
  return w;
}
function bankBorrowingHeadroom(s){
  return Math.max(0, bankBorrowingLimit(s) - weightedDebtUsed(s));
}
function loanProductEligible(s, key){
  const p = LOAN_PRODUCTS[key];
  if(!p) return {ok:false, reason:'不明な商品'};
  if(p.minRev && annualRevenue(s) < p.minRev) return {ok:false, reason:`年換算売上 ${yen(p.minRev)} 以上が必要`};
  if(p.minUnits && (s.units||0) < p.minUnits) return {ok:false, reason:`保守台数 ${num(p.minUnits)}台以上が必要`};
  if(p.minRel && (s.mainBankRelationship||0) < p.minRel) return {ok:false, reason:`メインバンク関係 ${p.minRel} 以上が必要`};
  return {ok:true};
}

  if(p.capacityWeight) why += `、枠消費ウェイト${p.capacityWeight}`;

}

function maxLoanForProduct(s, key){
  const p = LOAN_PRODUCTS[key];
  if(!p) return 0;
  const limit = bankBorrowingLimit(s);
  const head = bankBorrowingHeadroom(s);
  const weight = Math.max(0.25, p.capacityWeight||1);
  // 余力を商品の枠消費ウェイトで割った「実行可能元本」
  const byHead = head / weight;
  const byFrac = limit * (p.maxFrac||0.5);
  let maxAmt = Math.max(0, Math.min(byHead, byFrac));
  // シンジケート等：複数行協調でプロパーを超える大型枠
  if(p.amountMult && p.amountMult > 1){
    const boosted = Math.min(byHead * p.amountMult, limit * (p.maxFrac||0.95) * p.amountMult);
    maxAmt = Math.max(maxAmt, boosted);
    // 総枠の暴走防止（加重債務ベースで上限）
    maxAmt = Math.min(maxAmt, head / weight * p.amountMult, limit * 1.6);
  }
  // 最低実行額に届かないなら「使えない」扱い（0）
  if(p.minDraw && maxAmt < p.minDraw) return 0;
  return Math.max(0, Math.floor(maxAmt));
}
function bondProductEligible(s, key){

  if(p.requiresListed && !s.isListed) return {ok:false, reason:'上場後に利用可能'};
  if(p.minRev && annualRevenue(s) < p.minRev) return {ok:false, reason:`年換算売上 ${yen(p.minRev)} 以上`};
  return {ok:true};
}
function doIssueBond(amount, productKey){

function doLoan(amount, productKey){

function doOwnerSubscribe(amount){

function doOffering(amount, productKey){

  productKey = productKey || 'public';

  if(s.offeringFrozenTicksLeft>0){ pushLog(s, `資本政策のクールダウン中（あと${s.offeringFrozenTicksLeft}四半期）。`, 'warn'); render(); return; }
  const issuePrice = Math.max(1, s.stockPrice * (1 - (ep.discount||0)));

  if(ep.dilutFounder === false){
    const addFounder = Math.round(newShares * founderBefore);
    s.shares += newShares;
    s.founderShares = (s.founderShares||0) + addFounder;
  } else {
    s.shares += newShares;
  }
  s.cash += proceeds;
  s.paidInCapital = (s.paidInCapital||0) + proceeds;
  s.offeringFrozenTicksLeft = ep.freezeTicks!=null ? ep.freezeTicks : 3;
  if(ep.strategicBump){
    s.reputation = clamp(s.reputation+1.5, 5, 98);
    s.adAwareness = Math.min(100, (s.adAwareness||0)+3);
  }
  if(productKey==='public') s.adAwareness = Math.min(100, (s.adAwareness||0)+4);
  pushLog(s, `${ep.label}により ${yen(proceeds)} を調達（+${num(newShares)}株／発行価格 ${num(Math.round(issuePrice))}円）。創業社長持株 ${pct(founderOwnershipPct(s),1)}。`, 'info');
  render(); autoSave();
}
function doStockSplit(ratio){
  const s = state;
  if(!s.isListed || !s.stockPrice || !ratio || ratio<=1) return;
  ratio = Math.round(ratio);
  if(s.shareActionCooldown>0){
    pushLog(s, `株式分割・併合のクールダウン中（あと${s.shareActionCooldown}四半期）。頻繁な変更は市場の信認を損なう。`, 'warn');
    render(); return;
  }
  const priceBefore = s.stockPrice;
  const shBefore = estimatedShareholderCount(s);
  const accessBefore = priceAccessibilityScore(s);

  s.shares = Math.round(s.shares * ratio);
  s.founderShares = Math.round((s.founderShares||0) * ratio);
  s.stockPrice = Math.max(1, s.stockPrice / ratio);
  // SO行使価格も理論調整
  if(s.soStrike > 0) s.soStrike = Math.max(1, Math.round(s.soStrike / ratio));

  // --- 現実的効果 ---
  // 高位株を買いやすい帯へ落とすほど効果大。既に安い株の分割は効果が薄い
  const accessAfter = priceAccessibilityScore(s);
  const accessGain = Math.max(0, accessAfter - accessBefore);
  const ratioBoost = Math.min(0.28, 0.06 * Math.log2(ratio));
  const biasAdd = ratioBoost + accessGain * 0.35;
  s.shareLiquidityBias = clamp((s.shareLiquidityBias||0) + biasAdd, -0.45, 0.55);
  // 個人の買いやすさ向上 → 認知・信認の小幅改善（一時）
  s.adAwareness = clamp((s.adAwareness||10) + 2 + ratioBoost * 20 + accessGain * 8, 0, 100);
  s.marketTrust = clamp((s.marketTrust||50) + 1.5 + accessGain * 4, 5, 98);
  // 事務・証券代行コスト
  const adminCost = Math.round(800000 + s.shares * 0.4);
  s.cash -= adminCost;
  s.shareActionCooldown = 3;

  const shAfter = estimatedShareholderCount(s);
  pushLog(s,
    `1株を${ratio}株に分割する株式分割を実施した（${num(priceBefore)}円→${num(s.stockPrice)}円、発行済 ${num(s.shares)}株）。`+
    `最低投資額が下がり個人が入りやすくなった（推定株主 約${num(shBefore)}人→約${num(shAfter)}人）。`+
    `証券代行・事務コスト ${yen(adminCost)}。`,
    'good');
  render(); autoSave();
}
function doStockConsolidation(ratio){
  const s = state;
  if(!s.isListed || !s.stockPrice || !ratio || ratio<=1) return;
  ratio = Math.round(ratio);
  if(s.shareActionCooldown>0){
    pushLog(s, `株式分割・併合のクールダウン中（あと${s.shareActionCooldown}四半期）。`, 'warn');
    render(); return;
  }
  const priceBefore = s.stockPrice;
  const shBefore = estimatedShareholderCount(s);
  const accessBefore = priceAccessibilityScore(s);
  const wasPenny = priceBefore < 100;
  const wasDistressed = priceBefore < 50;

  s.shares = Math.max(1, Math.round(s.shares / ratio));
  s.founderShares = Math.max(1, Math.round((s.founderShares||0) / ratio));
  s.stockPrice = Math.max(1, s.stockPrice * ratio);
  if(s.soStrike > 0) s.soStrike = Math.max(1, Math.round(s.soStrike * ratio));

  // --- 現実的効果 ---
  const accessAfter = priceAccessibilityScore(s);
  const accessLoss = Math.max(0, accessBefore - accessAfter);
  // 低位株是正なら信認回復、そうでなければ「見栄えの操作」と見られやすい
  let trustDelta, biasAdd, tag, note;
  if(wasDistressed){
    trustDelta = 3.5;
    biasAdd = -0.04; // 併合自体の流動性マイナスは小さい
    tag = 'good';
    note = '著しい低位株を是正し、信用不安の緩和が期待される。';
  } else if(wasPenny){
    trustDelta = 1.5;
    biasAdd = -0.08 - accessLoss * 0.15;
    tag = 'info';
    note = '低位株水準を是正した。投資しやすさは一部低下する可能性がある。';
  } else {
    trustDelta = -2.5 - Math.min(3, Math.log2(ratio));
    biasAdd = -0.14 - accessLoss * 0.25 - Math.min(0.12, 0.04 * Math.log2(ratio));
    tag = 'warn';
    note = '株価水準に余裕がある中での併合は、市場からネガティブに解釈されやすい。';
  }
  s.shareLiquidityBias = clamp((s.shareLiquidityBias||0) + biasAdd, -0.45, 0.55);
  s.marketTrust = clamp((s.marketTrust||50) + trustDelta, 5, 98);
  s.adAwareness = clamp((s.adAwareness||10) - accessLoss * 6 - (wasPenny?0:3), 0, 100);
  if(s.psr && !wasPenny){
    s.psr = Math.max(0.2, s.psr * (1 - 0.02 * Math.min(3, Math.log2(ratio))));
  } else if(s.psr && wasDistressed){
    s.psr = Math.min(s.psr * 1.03, s.psr + 0.04);
  }
  const adminCost = Math.round(1200000 + (s.shares||0) * 0.5);
  s.cash -= adminCost;
  s.shareActionCooldown = 4;

  const shAfter = estimatedShareholderCount(s);
  pushLog(s,
    `${ratio}株を1株に併合する株式併合を実施した（${num(priceBefore)}円→${num(s.stockPrice)}円、発行済 ${num(s.shares)}株）。`+
    note +
    `推定株主 約${num(shBefore)}人→約${num(shAfter)}人。事務コスト ${yen(adminCost)}。`,
    tag);
  render(); autoSave();
}

function ensurePmiState(s){
