function repairGameState(s){
  if(!s || typeof s!=='object') return s;
  // 基本配列・オブジェクト
  if(!s.rivals) s.rivals = [];
  if(!s.subsidiaries) s.subsidiaries = [];
  if(!s.equityMethodHoldings) s.equityMethodHoldings = [];
  if(!s.regionUnits) s.regionUnits = {};
  if(!s.regionBranches) s.regionBranches = {};
  if(!s.segmentUnits) s.segmentUnits = {};
  if(!s.history) s.history = [];
  if(!s.logs) s.logs = [];
  if(!s.keyPeople) s.keyPeople = [];
  if(!s.keyRetentionQueue) s.keyRetentionQueue = [];
  if(!s.independentSpinoffs) s.independentSpinoffs = [];
  if(!s.loans) s.loans = [];
  if(!s.bonds) s.bonds = [];
  if(!s.listedOn) s.listedOn = s.isListed && s.exchange ? [s.exchange] : (s.listedOn||[]);
  if(!s.makerRelations) s.makerRelations = {};
  if(!s.lateGame) s.lateGame = {antitrustHeat:0, instHeat:0, postClear:false, regionFlags:{}, lastInstDemandTurn:-99, dividendPolicy:0, regionLeads:0};
  if(s.diffFixedMult == null) s.diffFixedMult = 1;
  if(s.diffLaborMult == null) s.diffLaborMult = 1;
  if(s.diffChurnMult == null) s.diffChurnMult = 1;
  if(s.diffMaintMult == null) s.diffMaintMult = 1;
  if(s.inspectors == null) s.inspectors = Math.min(1, s.techs||0);
  if(!s.inspectorPipeline) s.inspectorPipeline = [];
  if(s.marketResearchBudget == null) s.marketResearchBudget = 0;
  if(s.mainBankRelationship == null) s.mainBankRelationship = 50;
  // 地域キー補完
  REGIONS.forEach(rg=>{
    if(s.regionUnits[rg.id]==null) s.regionUnits[rg.id]=0;
    if(s.regionBranches[rg.id]==null) s.regionBranches[rg.id]=0;
  });
  // 台数整合
  const sumRU = Object.values(s.regionUnits).reduce((a,b)=>a+(b||0),0);
  if(sumRU > 0 && Math.abs(sumRU - (s.units||0)) > 2){
    s.units = sumRU;
  }
  // 持分法重複除去
  if(typeof dedupeEquityHoldings==='function') dedupeEquityHoldings(s);
  else {
    const map = {}; const out = [];
    (s.equityMethodHoldings||[]).forEach(eq=>{
      const key = eq.rivalId || ('name:'+eq.name);
      if(map[key]){
        map[key].ownershipPct = Math.min(49, (map[key].ownershipPct||0)+(eq.ownershipPct||0));
        map[key].units = Math.max(map[key].units||0, eq.units||0);
      } else { map[key]=eq; out.push(eq); }
    });
    s.equityMethodHoldings = out;
  }
  // 消えたライバルへの持分参照を掃除
  const rivalIds = new Set((s.rivals||[]).map(r=>r.id));
  (s.equityMethodHoldings||[]).forEach(eq=>{
    if(eq.rivalId && !rivalIds.has(eq.rivalId)){
      // 競合退場済みなら rivalId を外し、台数は維持（オフバランスのまま）
      eq.rivalId = null;
    }
  });
  // 子会社フィールド
  if(typeof ensureAllSubsidiaries==='function') ensureAllSubsidiaries(s);
  if(typeof ensureTalentState==='function') ensureTalentState(s);
  if(typeof ensureLateGameState==='function') ensureLateGameState(s);
  if(typeof ensureEduState==='function') ensureEduState(s);
  if(typeof ensureVicePresidentFields==='function' && s.vicePresident) ensureVicePresidentFields(s.vicePresident);
  // キーマンの欠損
  (s.keyPeople||[]).forEach(k=>{
    if(k.loyalty==null) k.loyalty=60;
    if(k.skill==null) k.skill=55;
    if(k.raiseQ==null) k.raiseQ=0;
  });
  // 引き留めキューの期限切れ掃除（ロード時点）
  s.keyRetentionQueue = (s.keyRetentionQueue||[]).filter(q=>q && q.personId && (s.keyPeople||[]).some(k=>k.id===q.personId));
  // 現金・数値の NaN 防止
  ['cash','units','price','quality','morale','reputation','techs','salesStaff','admins','retainedEarnings'].forEach(k=>{
    if(s[k]!=null && !isFinite(s[k])) s[k]=0;
  });
  if(s.cash < 0) s.cash = 0;
  return s;
}

async function doLoad(slot){
  slot = (slot == null) ? 1 : Math.max(0, Math.min(SAVE_SLOT_COUNT, Math.round(slot)));
  stopTimer();
  try{
    const parsed = await readSaveFromSlot(slot);
    if(parsed && parsed.state){
      state = parsed.state;
      mandaOffers = parsed.mandaOffers || [];
      if(typeof repairGameState==='function') repairGameState(state);
      modal = null;
      gameStarted = true;
      activeTab = 'overview';
      pushLog(state, `スロット${slot===0?'（オート）':slot}から読み込みました（状態を修復）。`, 'good');
      render();
      if(!state.gameOver) startTimer();
      else stopTimer();
    } else {
      if(gameStarted && state){
        pushLog(state, '保存データが見つかりませんでした。', 'warn');
        render();
        if(!state.gameOver) startTimer();
      } else {
        alert('このスロットに保存データはありません。');
        render();
      }
    }
  }catch(e){
    if(gameStarted && state){
      pushLog(state, '読込中にエラーが発生しました。', 'warn');
      render();
      if(!state.gameOver) startTimer();
    } else {
      alert('読込中にエラーが発生しました。');
      render();
    }
  }
}

function isIOSDevice(){
  const ua = navigator.userAgent || '';
  return /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}

function buildExportPayload(){
  return {
    version: 2,
    exportedAt: new Date().toISOString(),
    state, mandaOffers,
    meta: buildSaveMeta(state),
  };
}

function buildExportFileName(){
  const name = (state.companyName||'mercury').replace(/[\\/:*?"<>|]/g,'_');
  return `${name}_${state.year}Q${state.quarter}_save.json`;
}

/** セーブデータをJSONファイルとして保存（iPhoneは共有シート対応） */
async function doExportSave(){
  if(!state){ alert('書き出すゲームがありません。'); return; }
  const fileName = buildExportFileName();
  const jsonText = JSON.stringify(buildExportPayload());
  const blob = new Blob([jsonText], {type:'application/json'});

  // 1) Web Share API（iPhone/iPad で「ファイルに保存」「AirDrop」などが使える）
  try{
    if(navigator.share && navigator.canShare){
      const file = new File([blob], fileName, {type:'application/json'});
      if(navigator.canShare({ files: [file] })){
        await navigator.share({
          files: [file],
          title: 'エレベーター経営セーブ',
          text: `${state.companyName||''} ${state.year}年Q${state.quarter}`,
        });
        if(gameStarted) pushLog(state, '共有シートを開きました。「ファイルに保存」でiPhoneに残してください。', 'good');
        render();
        return;
      }
    }
  }catch(e){
    // ユーザーが共有をキャンセルした場合は何もしない
    if(e && (e.name === 'AbortError' || e.name === 'NotAllowedError')) return;
  }

  // 2) 通常のダウンロード（PC・Android）
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{ try{ document.body.removeChild(a); URL.revokeObjectURL(url); }catch(e){} }, 800);
    if(gameStarted) pushLog(state, 'セーブデータをダウンロードしました。', 'good');
  }catch(e){}

  // 3) iOSフォールバック: モーダルでコピー／別タブ表示
  if(isIOSDevice()){
    openExportFallbackModal(jsonText, fileName);
    return;
  }
  render();
}

function openExportFallbackModal(jsonText, fileName){
  stopTimer();
  modal = {
    type: 'export_ios',
    title: 'iPhoneへの保存',
    fileName,
    jsonText,
  };
  render();
}

async function shareExportFromModal(){
  if(!modal || modal.type !== 'export_ios') return;
  const fileName = modal.fileName || 'mercury_save.json';
  const jsonText = modal.jsonText || '';
  const blob = new Blob([jsonText], {type:'application/json'});
  try{
    if(navigator.share){
      const file = new File([blob], fileName, {type:'application/json'});
      const data = navigator.canShare && navigator.canShare({files:[file]})
        ? { files:[file], title:'エレベーター経営セーブ' }
        : { text: jsonText, title:'エレベーター経営セーブ' };
      await navigator.share(data);
      return;
    }
  }catch(e){
    if(e && e.name === 'AbortError') return;
  }
  // テキスト共有もだめならコピー
  try{
    await navigator.clipboard.writeText(jsonText);
    alert('セーブ内容をクリップボードにコピーしました。\nメモアプリやファイルアプリに貼り付けて保存してください。');
  }catch(e){
    alert('共有に失敗しました。下のテキストを長押ししてコピーしてください。');
  }
}

async function copyExportText(){
  if(!modal || !modal.jsonText) return;
  try{
    await navigator.clipboard.writeText(modal.jsonText);
    alert('コピーしました。メモやファイルに貼り付けて保存してください。');
  }catch(e){
    // 古いWebView向け: 選択させる
    const ta = document.getElementById('export-json-ta');
    if(ta){ ta.focus(); ta.select(); alert('テキストを選択したので、コピーしてください。'); }
  }
}

/** JSONファイルから読込 */
function doImportSave(){
  stopTimer();
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json,.json';
  input.onchange = async function(){
    const file = input.files && input.files[0];
    if(!file){ if(gameStarted && state && !state.gameOver) startTimer(); return; }
    try{
      const text = await file.text();
      const parsed = JSON.parse(text);
      if(!parsed || !parsed.state){
        alert('このファイルは有効なセーブデータではありません。');
        if(gameStarted && state && !state.gameOver) startTimer();
        return;
      }
      state = parsed.state;
      mandaOffers = parsed.mandaOffers || [];
      if(state.diffFixedMult == null) state.diffFixedMult = 1;
      if(state.diffLaborMult == null) state.diffLaborMult = 1;
      if(state.diffChurnMult == null) state.diffChurnMult = 1;
      if(state.diffMaintMult == null) state.diffMaintMult = 1;
      if(state.inspectors == null) state.inspectors = Math.min(1, state.techs||0);
      if(!state.inspectorPipeline) state.inspectorPipeline = [];
      modal = null;
      gameStarted = true;
      activeTab = 'overview';
      pushLog(state, `ファイル「${file.name}」から読み込みました。`, 'good');
      // ブラウザ側にも複数箇所へ保存を試みる
      const ok1 = await writeSaveToSlot(1, state, mandaOffers);
      const ok0 = await writeSaveToSlot(0, state, mandaOffers);
      try{
        await StorageAPI.set(SAVE_LEGACY_KEY, JSON.stringify({version:2, state, mandaOffers, meta:buildSaveMeta(state)}), false);
      }catch(e){}
      const persisted = StorageAPI.canPersist() && (ok1 || ok0);
      if(!persisted){
        alert('読み込みは成功しましたが、この環境ではブラウザへの保存ができません。\n\nブラウザを閉じると消えます。\n必ずヘッダーの「書出」でJSONファイルを保存してください。');
        pushLog(state, '警告: ブラウザ保存不可。必ず「書出」でファイルバックアップを取ってください。', 'warn');
      } else {
        pushLog(state, 'ブラウザにも保存しました（スロット1／オート）。', 'good');
      }
      render();
      if(!state.gameOver) startTimer();
    }catch(e){
      alert('ファイルの読み込みに失敗しました。');
      if(gameStarted && state && !state.gameOver) startTimer();
    }
  };
  input.click();
}

async function openSaveModal(){
  stopTimer();
  const meta = await readSaveMetaAll();
  // スロット実在チェック
  const slots = [];
  for(let i=0;i<=SAVE_SLOT_COUNT;i++){
    const data = await readSaveFromSlot(i);
    slots.push({
      slot: i,
      label: i===0 ? 'オートセーブ' : `スロット ${i}`,
      meta: (data && data.meta) || meta[String(i)] || (data && data.state ? buildSaveMeta(data.state) : null),
      has: !!(data && data.state),
    });
  }
  modal = {
    type:'save',
    title:'セーブ / ロード',
    slots,
  };
  render();
}
function doReset(){
  stopTimer();
  gameStarted = false;
  mandaOffers = [];
  modal = null;
  speed = 1;
  render();
}
function doStartGame(name, difficultyKey){
  try{
    stopTimer();
    state = freshState(name, difficultyKey);
    mandaOffers = [];
    modal = null;
    speed = 1;
    shareScope = 'national';
    activeTab = 'overview';
    gameStarted = true;
    activeTab = 'overview';
    state.founderName = state.ceoName;
    pushCompanyChronicle(state, `${state.companyName}を設立（代表 ${state.ceoName}）`, 'milestone');
    pushLog(state, `${state.companyName}を設立した。まずは一時停止のまま「取締役会からの助言」と「学習」タブで方針を確認し、準備ができたら ▶ 再開しよう。`, 'good');
    render();
    // 学習しやすくするため、開始直後は一時停止
    stopTimer();
    autoSave();
  }catch(err){
    console.error(err);
    alert('ゲーム開始時にエラー: '+(err && err.message ? err.message : err));
  }
}

/* ============================================================
   起動
   ============================================================ */
function boot(){
  try{
    const ts = parseFloat(localStorage.getItem('mercury-ticker-speed'));
    if(isFinite(ts) && ts >= 0.12 && ts <= 3) tickerSpeed = ts;
  }catch(e){}
  gameStarted = false;
  render();
  // 保存データがあれば自動読込を試みる
  (async ()=>{
    try{
      // オート → スロット1 → 旧キーの順で自動復帰を試行（タイトルは出すがデータ有無を内部確認）
      let parsed = await readSaveFromSlot(0);
      if(!parsed) parsed = await readSaveFromSlot(1);
      // メタだけ先に読んでタイトルに「再開可」を出す用途にも使えるが、ここでは自動開始しない
      // 自動でゲームに入らずタイトルを優先（誤ロード防止）。ユーザーが「再開」を押す。
    }catch(e){ /* セーブデータなし */ }
    render();
  })();
}

boot();

})();
