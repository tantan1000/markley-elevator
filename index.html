function doSuccession(mode){
  const s = state;
  ensureSuccessionState(s);
  const oldName = s.ceoName;
  s._pendingSuccessionModal = false;
  s.successionReady = false;
  s.successionDone = true;

  if(mode==='internal'){
    const ks = (typeof listKeyStaff==='function' ? listKeyStaff(s) : [])[0];
    const newName = ks ? ks.name : randomPersonName();
    s.ceoName = newName;
    s.isFounderCeo = false;
    s.ceoAge = 48 + Math.floor(Math.random()*10);
    s.ceoHealth = 70 + Math.floor(Math.random()*15);
    s.morale = clamp((s.morale||60)+4, 5, 95);
    s.reputation = clamp((s.reputation||50)+1, 5, 98);
    if(ks){ // キー人材枠を空ける
      Object.keys(s.keyStaff||{}).forEach(k=>{ if(s.keyStaff[k] && s.keyStaff[k].name===newName) s.keyStaff[k]=null; });
    }
    pushLog(s, `世代交代：内部から${newName}氏が代表取締役社長に就任。前代表${oldName}氏は第一線を退いた。`, 'good');
    pushCompanyChronicle(s, `社長交代（内部昇格）${oldName} → ${newName}`, 'milestone');
  } else if(mode==='family'){
    const newName = randomPersonName();
    s.ceoName = newName;
    s.isFounderCeo = true; // 創業家として継続
    s.founderName = s.founderName || oldName;
    s.ceoAge = 38 + Math.floor(Math.random()*8);
    s.ceoHealth = 75 + Math.floor(Math.random()*12);
    s.morale = clamp((s.morale||60)-1, 5, 95);
    s.reputation = clamp((s.reputation||50)-1, 5, 98);
    s.marketTrust = clamp((s.marketTrust||60)-2, 5, 98);
    pushLog(s, `世代交代：創業家の${newName}氏が代表に就任。${oldName}体制から一族承継となった。`, 'good');
    pushCompanyChronicle(s, `社長交代（創業家承継）${oldName} → ${newName}`, 'milestone');
  } else if(mode==='external'){
    const newName = randomPersonName();
    s.ceoName = newName;
    s.isFounderCeo = false;
    s.ceoAge = 52 + Math.floor(Math.random()*8);
    s.ceoHealth = 72 + Math.floor(Math.random()*10);
    s.reputation = clamp((s.reputation||50)+2, 5, 98);
    s.marketTrust = clamp((s.marketTrust||60)+3, 5, 98);
    s.morale = clamp((s.morale||60)-3, 5, 95);
    if(s.psr) s.psr *= 1.04;
    pushLog(s, `世代交代：外部から${newName}氏をプロ経営者として招聘した。市場は改革を期待している。`, 'good');
    pushCompanyChronicle(s, `社長交代（外部招聘）${oldName} → ${newName}`, 'milestone');
  } else if(mode==='chairman'){
    const newName = (typeof listKeyStaff==='function' && listKeyStaff(s)[0]) ? listKeyStaff(s)[0].name : randomPersonName();
    s.chairmanName = oldName;
    s.ceoName = newName;
    s.isFounderCeo = false;
    s.ceoAge = 46 + Math.floor(Math.random()*8);
    s.ceoHealth = 74 + Math.floor(Math.random()*10);
    s.reputation = clamp((s.reputation||50)+2, 5, 98);
    s.morale = clamp((s.morale||60)+2, 5, 95);
    pushLog(s, `${oldName}氏が代表を退き会長に就任。新社長は${newName}氏。`, 'good');
    pushCompanyChronicle(s, `${oldName}会長就任／新社長 ${newName}`, 'milestone');
  }
  modal = null;
  if(!s.gameOver) startTimer();
  render(); autoSave();
}

function collectDecisionItems(s){
  const items = [];
  (computeAlerts(s)||[]).forEach(a=>{
    items.push({sev:a.sev||'info', text:a.text, group:'alert'});
  });
  (s.rivals||[]).forEach(r=>{
    (r.pendingPlans||[]).forEach(p=>{
      const lab = (typeof rivalPlanLabel==='function') ? rivalPlanLabel(p) : p.type;
      items.push({sev:'warn', text:`予兆 ${r.name}: ${lab}（あと${p.ticksLeft}Q）`, group:'rival'});
    });
  });
  (s.pmiJobs||[]).filter(j=>j.status==='active').forEach(j=>{
    items.push({sev:'warn', text:`PMI ${j.name}: 進捗${typeof pmiProgressPct==='function'?pmiProgressPct(j):'?'}%／残${j.ticksLeft}Q`, group:'pmi'});
  });
  if((s.recallTicks||0)>0){
    items.push({sev:'warn', text:`メーカー実務: リコール対応 残${s.recallTicks}Q`, group:'maker'});
  }
  if(s.makerCertHold && (s.makerCertHold.ticksLeft||0)>0){
    items.push({sev:'warn', text:`メーカー実務: ${s.makerCertHold.label||'供給・認定'} 残${s.makerCertHold.ticksLeft}Q`, group:'maker'});
  }
  // 重複テキスト除去
  const seen = {};
  return items.filter(it=>{
    const k = it.text;
    if(seen[k]) return false;
    seen[k] = 1;
    return true;
  }).slice(0, 12);
}
function renderDecisionTray(compact){
  const s = state;
  const items = collectDecisionItems(s);
  const panel = el('div',{class:'decision-tray'});
  const crit = items.filter(i=>i.sev==='crit').length;
  const warn = items.filter(i=>i.sev==='warn').length;
  panel.appendChild(el('h2',{}, '対応トレイ',
    el('span',{class:'eyebrow', style:'float:right;font-weight:400;color:var(--paper-dim);'},
      crit?`重大 ${crit}`:(warn?`注意 ${warn}`:'安定'))));
  if(!items.length){
    panel.appendChild(el('div',{class:'alert-item ok'},
      el('span',{class:'sev'}, '良好'),
      el('span',{}, '重大な対応事項はありません。')));
    return panel;
  }
  const show = compact ? items.slice(0, 5) : items;
  show.forEach(a=>{
    const sev = a.sev==='ok'?'ok':(a.sev==='crit'?'crit':(a.sev==='info'?'info':'warn'));
    const sevLabel = sev==='crit'?'重大':sev==='warn'?'注意':sev==='ok'?'良好':'情報';
    const item = el('div',{class:'alert-item '+sev});
    item.appendChild(el('span',{class:'sev'}, sevLabel));
    item.appendChild(el('span',{}, a.text));
    panel.appendChild(item);
  });
  if(compact && items.length > show.length){
    panel.appendChild(el('div',{class:'field-hint'}, `他 ${items.length-show.length} 件 → 概況タブの対応トレイで全件`));
  }
  return panel;
}

function buildQuarterHighlights(s, logs){
  const pri = {bad:100, warn:80, good:60, info:30};
  const scored = (logs||[]).map(l=>{
    const t = l.text||'';
    let score = pri[l.tag]||20;
    if(/【他社】|弱点|攻勢|奪取/.test(t)) score += 25;
    if(/【人材】|キーマン|引き留め|独立|移籍/.test(t)) score += 22;
    if(/【副社長|一任/.test(t)) score += 12;
    if(/【外交】|休戦|提携/.test(t)) score += 18;
    if(/M&A|買収|PMI|持分/.test(t)) score += 20;
    if(/資金|借入|倒産|現金化が|不足/.test(t)) score += 24;
    if(/事故|解約|品質/.test(t)) score += 16;
    if(/上場|株主|中期/.test(t)) score += 15;
    return {text:t, tag:l.tag||'info', score};
  }).filter(x=>x.text && x.text.length>4);
  scored.sort((a,b)=>b.score-a.score);
  const out = [];
  scored.forEach(x=>{
    if(out.length >= 5) return;
    if(out.some(y=>y.text.slice(0,18)===x.text.slice(0,18))) return;
    out.push({text:x.text, tag:x.tag});
  });
  if(s.lastKeyword){
    out.unshift({text:`【学習】キーワード「${s.lastKeyword}」— 学習タブで定義を確認。`, tag:'info'});
  }
  if(out.length < 3){
    const util = (typeof baseCapacity==='function' && baseCapacity(s)>0) ? s.units/baseCapacity(s) : 0;
    if(util > 1.05) out.push({text:`稼働率が${pct(util,0)}と高く、採用・外注の判断が必要な局面。`, tag:'warn'});
    if((s.cash||0) < 5000000) out.push({text:`手元現金が薄い（${yen(s.cash||0)}）。資金繰りを優先。`, tag:'warn'});
    if((s.keyRetentionQueue||[]).length) out.push({text:`キーマンの引き留め案件が${s.keyRetentionQueue.length}件、対応待ち。`, tag:'warn'});
    if(typeof mandaOffers!=='undefined' && (mandaOffers||[]).length) out.push({text:`M&A候補が${mandaOffers.length}件提示中。`, tag:'info'});
  }
  return out.slice(0,5);
}
function buildQuarterActions(s){
  const acts = [];
  const util = (typeof baseCapacity==='function' && baseCapacity(s)>0) ? s.units/baseCapacity(s) : 0;
  if((s.keyRetentionQueue||[]).length) acts.push({label:'キーマン引き留め', tab:'org', detail:'組織タブで対応'});
  if(util > 1.02) acts.push({label:'採用・残業の検討', tab:'management', detail:'稼働超過'});
  if((s.cash||0) < 8000000) acts.push({label:'資金調達の確認', tab:'finance', detail:'手元薄め'});
  if(typeof mandaOffers!=='undefined' && (mandaOffers||[]).length && (s.cash||0) > 20000000){
    acts.push({label:'M&A案件の検討', tab:'manda', detail:`${mandaOffers.length}件`});
  }
  if(s.vicePresident && s.vicePresident.pendingProposals && s.vicePresident.pendingProposals.length){
    acts.push({label:'副社長提案の承認', tab:'org', detail:`${s.vicePresident.pendingProposals.length}件`});
  }
  if((s.quality||50) < 48) acts.push({label:'品質投資', tab:'management', detail:'品質が低め'});
  return acts.slice(0,3);
}
function buildQuarterSummaryModal(s){
  const b = s.lastBriefing;
  if(!b) return null;
  const lines = (b.highlights||[]).map((h,i)=>`${i+1}. ${h.text}`).join('\n');
  const acts = (b.nextActions||[]).map(a=>`・${a.label}（${a.detail||''}）`).join('\n');
  let body = `【${b.label} 経営サマリー】\n\n売上 ${yen(b.revenue)}／営業利益 ${yen(b.opProfit)}／現金 ${yen(b.cash!=null?b.cash:s.cash)}／台数 ${num(b.units!=null?b.units:s.units)}\n\n■ 今期の要点\n${lines||'特記事項なし'}`;
  if(acts) body += `\n\n■ 次に検討したいこと\n${acts}`;
  return {
    type:'event',
    title:`四半期経営サマリー ${b.label}`,
    body,
  };
}

function renderMidtermPanel(){
  const s = state;
  const panel = el('div',{class:'panel'});
  panel.appendChild(el('h2',{}, '中期経営計画', el('span',{class:'eyebrow'}, `5年・${C.MIDTERM_HORIZON_Q}四半期`)));
  if(!s.midterm || s.midterm.closed){
    panel.appendChild(el('div',{class:'desc', style:'font-size:12px;color:var(--paper-dim);margin-bottom:8px;'},
      '中期経営計画（5年）の策定・改定は定時株主総会の直後に行う。計画期間中は通期業績予想を出さない。達成／未達は計画期末に判定される。'));
    if(s.midterm && s.midterm.closed){
      panel.appendChild(el('div',{class:'field-hint', style:'color:'+(s.midterm.achieved?'var(--green)':'var(--amber)')+';'},
        '直近計画: '+midtermResultLabel(s.midterm)));
    }
    if((s.midtermHistory||[]).length){
      panel.appendChild(el('div',{style:'font-size:11px;color:var(--amber);margin:8px 0 4px;'}, '過去の中期計画'));
      (s.midtermHistory||[]).slice(0,4).forEach(h=>{
        panel.appendChild(el('div',{class:'field-hint'},
          `${h.year}年: ${h.achieved?'達成':'未達'} — ${h.detail||''}`));
      });
    } else {
      panel.appendChild(el('div',{class:'field-hint'}, '年次レポート → 株主総会 → 中期計画の順で設定できる。'));
    }
    return panel;
  }
  const m = s.midterm;
  const left = Math.max(0, m.endTurn - s.turn);
  // 途中経過の達成状況
  m.unitsHit = m.unitsHit || (s.units >= m.targetUnits);
  m.shareHit = m.shareHit || (marketShare(s.units,s) >= m.targetShare);
  if(m.targetIpo && s.isListed) m.ipoHit = true;
  panel.appendChild(el('div',{class:'field-hint', style:'margin-bottom:8px;'},
    `達成状況（暫定）: 台数${m.unitsHit?'○':'×'} ${num(s.units)}/${num(m.targetUnits)} ／ シェア${m.shareHit?'○':'×'} ${pct(marketShare(s.units,s),1)}/${pct(m.targetShare,1)}`+(m.targetIpo?` ／上場${m.ipoHit?'○':'×'}`:'')+` ／ 残${left}四半期`));
  const uProg = clamp(s.units / m.targetUnits, 0, 1.2);
  const sProg = clamp(marketShare(s.units,s) / m.targetShare, 0, 1.2);
  panel.appendChild(el('div',{class:'desc', style:'font-size:12px;margin-bottom:8px;'},
    m.closed
      ? `計画期間終了。結果: 台数${m.unitsHit?'達成':'未達'}／シェア${m.shareHit?'達成':'未達'}${m.targetIpo?('／上場'+(m.ipoHit?'達成':'未達')):''}`
      : `残 ${left} 四半期（〜${m.endTurn}ターン）。コミットメント中。`));
  const rowU = el('div',{style:'margin-bottom:8px;font-size:12px;'});
  rowU.appendChild(el('div',{}, `台数 ${num(s.units)} / ${num(m.targetUnits)} ${m.unitsHit?'✓':''}`));
  rowU.appendChild(el('div',{class:'plan-bar'}, el('div',{style:`width:${Math.min(100,uProg*100)}%;`})));
  panel.appendChild(rowU);
  const rowS = el('div',{style:'margin-bottom:8px;font-size:12px;'});
  rowS.appendChild(el('div',{}, `シェア ${pct(marketShare(s.units,s),2)} / ${pct(m.targetShare,1)} ${m.shareHit?'✓':''}`));
  rowS.appendChild(el('div',{class:'plan-bar'}, el('div',{style:`width:${Math.min(100,sProg*100)}%;`})));
  panel.appendChild(rowS);
  if(m.targetIpo){
    panel.appendChild(el('div',{style:'font-size:12px;margin-bottom:6px;'}, `上場目標: ${m.ipoHit||s.isListed?'達成済':'未達'}`));
  }
  if(m.closed){
    panel.appendChild(el('button',{class:'btn btn-small', onclick:()=>{ state.midterm=null; render(); autoSave(); }}, '新しい計画を立てる'));
  }
  return panel;
}

function field(label, inputEl, hint){
  const row = el('div',{class:'field-row'}, el('label',{}, label), inputEl);
  const wrap = el('div',{});
  wrap.appendChild(row);
  if(hint) wrap.appendChild(el('div',{class:'field-hint'}, hint));
  return wrap;
}

function numberInput(value, min, max, step, onChange){
  const inp = el('input',{type:'number', value:String(Math.round(value)), min:String(min), max:String(max), step:String(step)});
  inp.addEventListener('input', ()=>{ onChange(Number(inp.value)||0); });
  return inp;
}

    block.appendChild(el('div',{class:'title'}, '賠償責任保険'));
    const premiumAtCurrent = Math.round(s.units * s.insuranceCoverage * INSURANCE_PREMIUM_PER_UNIT);
    block.appendChild(el('div',{class:'desc'}, `重大インシデントや緊急対応の対応費用を軽減する保険。付保率を上げるほど保険料(年間 ${yen(premiumAtCurrent)})は増えるが、事故発生時の自己負担は最大${Math.round(INSURANCE_MAX_COVERAGE*100)}%まで軽減される。`));
    const insInp = numberInput(Math.round(s.insuranceCoverage*100),0,100,5,v=>{ s.insuranceCoverage = clamp(v,0,100)/100; });
    insInp.dataset.field = 'insuranceCoverage';
    block.appendChild(field('付保率（%）', insInp));
    panel.appendChild(block);
  }

  // 契約セグメント配分（目標値。実際の構成比へ緩やかに移行する）
  {
  const block = el('div',{class:'action-block mgmt-sec', 'data-mgmt-sub':'policy'});
    block.appendChild(el('div',{class:'title'}, '契約ポートフォリオの目標配分'));
    block.appendChild(el('div',{class:'desc'}, 'オフィスビル系は高単価・低解約、商業/公共施設系は単価が安く価格競争も激しい。営業方針として時間をかけて構成比が移行する。'));
    const officeInp = numberInput(Math.round(s.segmentTarget.office*100),0,90,1,v=>{
      const office = clamp(v,0,90)/100;
      const resid = s.segmentTarget.residential;
      const remain = Math.max(0, 1-office);
      const residAdj = Math.min(resid, remain);
      s.segmentTarget.office = office;
      s.segmentTarget.residential = residAdj;
      s.segmentTarget.commercial = Math.max(0, 1-office-residAdj);
    });
    officeInp.dataset.field = 'segOffice';
    block.appendChild(field('オフィスビル系（%）', officeInp));
    const residInp = numberInput(Math.round(s.segmentTarget.residential*100),0,90,1,v=>{
      const resid = clamp(v,0,90)/100;
      const office = s.segmentTarget.office;
      const remain = Math.max(0, 1-resid);
      const officeAdj = Math.min(office, remain);
      s.segmentTarget.residential = resid;
      s.segmentTarget.office = officeAdj;
      s.segmentTarget.commercial = Math.max(0, 1-resid-officeAdj);
    });
    residInp.dataset.field = 'segResid';
    block.appendChild(field('分譲マンション系（%）', residInp));
    block.appendChild(el('div',{class:'field-hint'}, `商業・公共施設系（残余）: ${Math.round(s.segmentTarget.commercial*100)}%　／　現在の実構成比: オフィス${Math.round(s.segmentMix.office*100)}% マンション${Math.round(s.segmentMix.residential*100)}% 商業${Math.round(s.segmentMix.commercial*100)}%`));
    panel.appendChild(block);
  }

  // 保守契約タイプ（POG／フルメンテナンス）の目標配分
  {
  const block = el('div',{class:'action-block mgmt-sec', 'data-mgmt-sub':'ops'});
    block.appendChild(el('div',{class:'title'}, '保守契約タイプの目標配分'));
    block.appendChild(el('div',{class:'desc'}, `${CONTRACT_TYPES.full.desc}\n${CONTRACT_TYPES.pog.desc}`.replace(/\n/g,'　')));
    const fullInp = numberInput(Math.round(s.contractTarget.full*100),0,100,1,v=>{
      s.contractTarget.full = clamp(v,0,100)/100;
    });
    fullInp.dataset.field = 'contractFull';
    block.appendChild(field('フルメンテナンス契約（%）', fullInp));
    block.appendChild(el('div',{class:'field-hint'}, `POG契約（残余）: ${Math.round((1-s.contractTarget.full)*100)}%　／　現在の実構成比: フルメン${Math.round(s.contractMix.full*100)}% POG${Math.round(s.contractMix.pog*100)}%`));
    panel.appendChild(block);
  }

  // 通期業績予想（中期計画期間中はなし）
  {
  const block = el('div',{class:'action-block mgmt-sec', 'data-mgmt-sub':'policy'});
    block.appendChild(el('div',{class:'title'}, '通期業績予想'));
    if(typeof hasActiveMidterm==='function' && hasActiveMidterm(s)){
      const left = Math.max(0, (s.midterm.endTurn||0) - (s.turn||0));
      block.appendChild(el('div',{class:'desc'},
        `中期経営計画（5年）の期間中のため、単年の通期業績予想は発表しない。計画残 ${left} 四半期。達成可否は計画期末に判定。`));
    } else if(s.guidance.target && s.guidance.setYear===s.year){
      const stanceInfo = GUIDANCE_STANCES[s.guidance.stance];
      block.appendChild(el('div',{class:'desc'}, `${s.year}年度予想: 売上高 ${yen(s.guidance.target)}（${stanceInfo?stanceInfo.label:'発表済み'}）。本決算で達成度が評価される。`));
    } else {
      block.appendChild(el('div',{class:'desc'}, `中期計画が未策定のため、通期業績予想を株主総会後に発表できる。現時点では未発表。`));
    }
    panel.appendChild(block);
  }

  // 配当政策
  if(s.isListed){
  const block = el('div',{class:'action-block mgmt-sec', 'data-mgmt-sub':'policy'});
    block.appendChild(el('div',{class:'title'}, '配当政策'));
    block.appendChild(el('div',{class:'desc'}, `当期純利益のうち配当に回す割合。配当利回り(実績) ${pct(dividendYield(s),2)}。`));
    const divInp = numberInput(Math.round(s.dividendPayoutRatio*100),0,50,1,v=>{ s.dividendPayoutRatio = clamp(v,0,50)/100; });
    divInp.dataset.field = 'dividendPayout';
    block.appendChild(field('配当性向（%）', divInp));
    panel.appendChild(block);
  }

  // 勇退（自主引退エンディング）
  if(s.year - 2026 >= 3){
  const block = el('div',{class:'action-block mgmt-sec', 'data-mgmt-sub':'ops'});
    block.appendChild(el('div',{class:'title'}, '勇退（引退）'));
    block.appendChild(el('div',{class:'desc'}, `在任${(s.year-2026)+(s.quarter-1)/4}年。いつでも経営から勇退し、ここまでの実績で経営者人生を締めくくることができる。`));
    block.appendChild(el('button',{class:'btn btn-full', onclick:()=>{
      modal = {
        type:'choice',
        title:'勇退の確認',
        body:`${s.ceoName}氏として${s.companyName}を経営してきたが、ここで勇退するか？　一度勇退すると経営を続けることはできない。`,
        options:[
          {label:'勇退する', onClick:doRetire},
          {label:'続投する', onClick:()=>{ modal=null; if(!state.gameOver) startTimer(); render(); }},
        ]
      };
      render();
    }}, '勇退を検討する'));
    panel.appendChild(block);
  } // end 勇退 if(year)

  // サブタブ表示切替（managementSubTab を直接参照）
  const activeSub = managementSubTab || sub || 'policy';
  const nodes = panel.querySelectorAll ? panel.querySelectorAll('.mgmt-sec') : [];
  for(let i=0;i<nodes.length;i++){
    const sec = nodes[i];
    const want = (sec.getAttribute && sec.getAttribute('data-mgmt-sub')) || 'policy';
    const on = (String(want) === String(activeSub));
    sec.style.display = on ? '' : 'none';
  }
  // 方針タブの先頭フィールド（営業投資・単価など）
  const kids = panel.children || [];
  for(let i=0;i<kids.length;i++){
    const ch = kids[i];
    if(!ch) continue;
    const cls = String(ch.className||'');
    if(cls.indexOf('mgmt-sec')>=0) continue;
    if(ch.tagName==='H2') continue;
    if(cls.indexOf('field-hint')>=0) continue;
    ch.style.display = (String(activeSub)==='policy') ? '' : 'none';
  }
  return panel;
}

function renderFinancingPanel(){
  const s = state;
  const panel = el('div',{class:'panel'});
  panel.appendChild(el('h2',{}, '資金調達・資本政策', el('span',{class:'eyebrow'}, `現金 ${yen(s.cash)}`)));

  // ---- 借入余力 ----
  ensureLoanBook(s);
  const lim = bankBorrowingLimit(s);
  const used = weightedDebtUsed(s);
  const head = bankBorrowingHeadroom(s);
  const baseR = baseLoanRate(s);
  {
    const block = el('div',{class:'action-block'});
    block.appendChild(el('div',{class:'title'}, '銀行借入余力'));
    block.appendChild(el('div',{class:'desc'},
      `与信枠の概算。売上・自己資本・信用格付・メインバンク関係・景気で変動する。`+
      `枠上限 ${yen(Math.floor(lim))}／使用（加重） ${yen(Math.floor(used))}／余力 ${yen(Math.floor(head))}。基準金利 ${(baseR*100).toFixed(2)}%/年。`));
    if(s.loans && s.loans.length){
      const lines = s.loans.map(L=>{
        const p = LOAN_PRODUCTS[L.type]||{label:L.type};
        return `${p.label} ${yen(L.principal)}（${((L.rate||0)*100).toFixed(2)}%）`;
      }).join('／');
      block.appendChild(el('div',{class:'field-hint'}, `借入内訳: ${lines}`));
    }
    panel.appendChild(block);
  }

  // ---- デット：銀行借入の種類 ----
  {
    const block = el('div',{class:'action-block'});
    block.appendChild(el('div',{class:'title'}, 'デット・ファイナンス（銀行借入）'));
    block.appendChild(el('div',{class:'desc'}, '商品ごとに金利・余力への食い込み・要件が異なる。'));
    Object.keys(LOAN_PRODUCTS).forEach(key=>{
      const p = LOAN_PRODUCTS[key];
      const elig = loanProductEligible(s, key);
      const cap = Math.floor(maxLoanForProduct(s, key));
      const rate = baseR + (p.rateSpread||0);
      const row = el('div',{style:'margin:10px 0;padding-bottom:8px;border-bottom:1px solid var(--steel-700);'});
      row.appendChild(el('div',{style:'font-weight:700;'}, p.label));
      row.appendChild(el('div',{class:'field-hint'}, `${p.blurb} 金利 ${(rate*100).toFixed(2)}%/年／この商品の余力目安 ${yen(cap)}`));
      if(!elig.ok) row.appendChild(el('div',{class:'field-hint', style:'color:var(--red);'}, elig.reason));
      // 商品ごとに初期金額を変える（全部1000万で同じに見えないように）
      let suggest = 0;
      if(cap > 0){
        if(p.minDraw) suggest = Math.min(cap, Math.max(p.minDraw, Math.floor(cap * (p.suggestFrac||0.5))));
        else suggest = Math.min(cap, Math.max(1000000, Math.floor(cap * (p.suggestFrac!=null?p.suggestFrac:0.25))));
        suggest = Math.floor(suggest / 1000000) * 1000000; // 100万単位
        if(suggest > cap) suggest = Math.floor(cap / 1000000) * 1000000;
        if(suggest <= 0 && cap > 0) suggest = Math.min(cap, 1000000);
      }
      const hintExtra = p.minDraw ? `／最低実行 ${yen(p.minDraw)}` : '';
      const multHint = (p.amountMult && p.amountMult>1) ? `／大型枠（目安 プロパー比×${p.amountMult}）` : '';
      row.appendChild(el('div',{class:'field-hint'}, `この商品の借入上限 ${yen(cap)}${hintExtra}${multHint}`));
      const inp = el('input',{type:'number', value:String(Math.max(0,suggest)), min:'0', step:'1000000'});
      row.appendChild(el('div',{class:'field-row'}, el('label',{},'金額'), inp, el('span',{class:'unit'},'円')));
      row.appendChild(el('button',{class:'btn btn-small', disabled:!elig.ok || cap<=0, onclick:()=>doLoan(Number(inp.value)||0, key)}, '借り入れる'));
      block.appendChild(row);
    });
    panel.appendChild(block);
  }

  // ---- オーナー増資（未上場でも可） ----
  {
    const block = el('div',{class:'action-block'});
    block.appendChild(el('div',{class:'title'}, 'オーナー増資（社長引受）'));
    const liquid = founderLiquidCap(s);
    const price = ownerIssuePrice(s);
    block.appendChild(el('div',{class:'desc'},
      '創業社長が個人の流動資産で新株を引き受ける増資。制度上は第三者割当の一形態で、会社に現金が入り社長の持株比率は薄まりにくい。'));
    block.appendChild(el('div',{class:'field-hint'},
      `社長個人の流動資産 ${yen(liquid)}／引受価格目安 1株${num(price)}円` +
      (s.offeringFrozenTicksLeft>0 ? `／クールダウン残り${s.offeringFrozenTicksLeft}四半期` : '') +
      `／社長持分 ${pct(founderOwnershipPct(s),1)}`));
    const inp = el('input',{type:'number', value: String(Math.min(30000000, Math.max(1000000, Math.floor(liquid/2)||1000000))), min:'1000000', step:'1000000'});
    block.appendChild(el('div',{class:'field-row'}, el('label',{},'引受額'), inp, el('span',{class:'unit'},'円')));
    block.appendChild(el('button',{
      class:'btn btn-small btn-primary',
      disabled: s.offeringFrozenTicksLeft>0 || liquid < 1000000,
      onclick:()=>doOwnerSubscribe(Number(inp.value)||0)
    }, '社長が引き受ける'));
    block.appendChild(el('button',{
      class:'btn btn-small', style:'margin-left:6px;',
      disabled: s.offeringFrozenTicksLeft>0 || liquid < 10000000,
      onclick:()=>doOwnerSubscribe(Math.min(liquid, 10000000))
    }, '1,000万円'));
    block.appendChild(el('button',{
      class:'btn btn-small', style:'margin-left:6px;',
      disabled: s.offeringFrozenTicksLeft>0 || liquid < 30000000,
      onclick:()=>doOwnerSubscribe(Math.min(liquid, 30000000))
    }, '3,000万円'));
    panel.appendChild(block);
  }

  // ---- エクイティ（上場後） ----
  if(s.isListed){
    const block = el('div',{class:'action-block'});
    block.appendChild(el('div',{class:'title'}, 'エクイティ・ファイナンス'));
    block.appendChild(el('div',{class:'desc'},
      s.offeringFrozenTicksLeft>0
        ? `資本政策クールダウン中（あと${s.offeringFrozenTicksLeft}四半期）。現在株価 ${s.stockPrice?num(s.stockPrice):'-'}円。`
        : `現在株価 ${s.stockPrice?num(s.stockPrice):'-'}円。希薄化の仕方は商品により異なる。`));
    Object.keys(EQUITY_PRODUCTS).forEach(key=>{
      if(key === 'owner') return; // 上の専用UIで扱う
      const ep = EQUITY_PRODUCTS[key];
      const row = el('div',{style:'margin:10px 0;padding-bottom:8px;border-bottom:1px solid var(--steel-700);'});
      row.appendChild(el('div',{style:'font-weight:700;'}, ep.label));
      row.appendChild(el('div',{class:'field-hint'}, ep.blurb + (ep.discount?` 発行ディスカウント約${Math.round(ep.discount*100)}%。`:'')));
      const inp = el('input',{type:'number', value:'50000000', min:'0', step:'1000000'});
      row.appendChild(el('div',{class:'field-row'}, el('label',{},'調達額'), inp, el('span',{class:'unit'},'円')));
      row.appendChild(el('button',{class:'btn btn-small', disabled:s.offeringFrozenTicksLeft>0, onclick:()=>doOffering(Number(inp.value)||0, key)}, '実行する'));
      block.appendChild(row);
    });
    panel.appendChild(block);
  }

  // 従業員持株会の奨励（会社補助）
  if(s.isListed){
    const block = el('div',{class:'action-block'});
    block.appendChild(el('div',{class:'title'}, '従業員持株会'));
    block.appendChild(el('div',{class:'desc'},
      `現在の持株会比率 ${pct(esopOwnershipPct(s),1)}。社員の自社株取得を会社が奨励・補助すると、比率が上振れしやすく、定着にも寄与する（希薄化は創業社長以外の流通側で吸収する簡易モデル）。`));
    block.appendChild(el('button',{class:'btn btn-small', onclick:()=>doEsopBoost(5000000)}, '奨励金 500万円を拠出'));
    block.appendChild(el('button',{class:'btn btn-small', style:'margin-left:6px;', onclick:()=>doEsopBoost(15000000)}, '奨励金 1,500万円を拠出'));
    panel.appendChild(block);
  }

  {
    const block = el('div',{class:'action-block'});
    block.appendChild(el('div',{class:'title'}, 'ストックオプション（SO）'));
    if(!s.soPlanYear){
      block.appendChild(el('div',{class:'desc'},
        '取締役会決議でSO発行枠を設定し、幹部・キー人材に新株予約権を付与できる。権利確定後、株価が行使価格を上回ると行使され、希薄化と払込金が発生する。未上場でも導入可能。'));
      block.appendChild(el('button',{class:'btn btn-small', onclick:()=>doEstablishSoPlan(0.05)}, '制度導入（枠5%）'));
      block.appendChild(el('button',{class:'btn btn-small', style:'margin-left:6px;', onclick:()=>doEstablishSoPlan(0.10)}, '制度導入（枠10%）'));
    } else {
      block.appendChild(el('div',{class:'desc'},
        `枠 ${pct(s.soPoolPct||0,0)}／付与済 ${pct(s.soGrantedPct||0,1)}／権利確定 ${pct(s.soVestedPct||0,1)}／残枠 ${pct(soRemainingPool(s),1)}／行使価格目安 ${num(s.soStrike||0)}円${s.isListed && s.stockPrice?`（株価 ${num(s.stockPrice)}円）`:''}。`));
      block.appendChild(el('button',{class:'btn btn-small', onclick:()=>doGrantSo(0.01)}, '1%分を付与'));
      block.appendChild(el('button',{class:'btn btn-small', style:'margin-left:6px;', onclick:()=>doGrantSo(0.02)}, '2%分を付与'));
      block.appendChild(el('button',{class:'btn btn-small', style:'margin-left:6px;', onclick:()=>doEstablishSoPlan(Math.min(0.15,(s.soPoolPct||0.05)+0.05))}, '枠を+5%拡大'));
    }
    panel.appendChild(block);
  }

  // 株式分割・株式併合
  if(s.isListed){

    const block = el('div',{class:'action-block'});
    block.appendChild(el('div',{class:'title'}, '株式分割・株式併合'));
    const access = priceAccessibilityScore(s);
    const liq = shareLiquidityBias(s);
    const shN = estimatedShareholderCount(s);
    let hint = '時価総額は理論上不変。分割は最低投資額を下げ個人株主・流動性を増やしやすい。併合は低位株是正に有効だが、不要な併合は信認を損ないやすい。';
    if(s.stockPrice>3000) hint = '株価が高位。分割で買いやすい価格帯へ落とすと株主数・流動性の改善が見込める。';
    else if(s.stockPrice<50) hint = '株価が著しく低い。併合による是正で信用不安の緩和が期待できる。';
    else if(s.stockPrice<100) hint = '低位株帯。併合での是正を検討できるが、流動性は一部低下しうる。';
    block.appendChild(el('div',{class:'desc'},
      `発行済 ${num(s.shares)}株／株価 ${s.stockPrice?num(s.stockPrice):'-'}円／推定株主 約${num(shN)}人／買いやすさ ${Math.round(access*100)}／流動性バイアス ${liq>=0?'+':''}${(liq*100).toFixed(0)}%。`+hint+
      (s.shareActionCooldown>0?` クールダウン残り${s.shareActionCooldown}四半期。`:'')));
    const splitSel = el('select',{});
    [2,3,5,10].forEach(r=> splitSel.appendChild(el('option',{value:String(r)}, `1株を${r}株に分割`)));
    block.appendChild(el('div',{class:'field-row'}, el('label',{},'株式分割'), splitSel));
    const cd = (s.shareActionCooldown||0)>0;
    block.appendChild(el('button',{class:'btn btn-small', disabled:cd, onclick:()=>doStockSplit(Number(splitSel.value))}, '分割を実施する'));
    const consSel = el('select',{});
    [2,5,10,20].forEach(r=> consSel.appendChild(el('option',{value:String(r)}, `${r}株を1株に併合`)));
    block.appendChild(el('div',{class:'field-row', style:'margin-top:8px;'}, el('label',{},'株式併合'), consSel));
    block.appendChild(el('button',{class:'btn btn-small', disabled:cd, onclick:()=>doStockConsolidation(Number(consSel.value))}, '併合を実施する'));
    panel.appendChild(block);
  }

  // 社債（デット）
  {
    const block = el('div',{class:'action-block'});
    block.appendChild(el('div',{class:'title'}, 'デット・ファイナンス（社債）'));
    block.appendChild(el('div',{class:'desc'}, '普通社債と転換社債。加重債務として借入余力を消費する。'));
    if(s.bonds.length>0){
      block.appendChild(el('div',{class:'field-hint'}, `発行済み ${s.bonds.length}件／残高 ${yen(s.bonds.reduce((a,b)=>a+b.principalRemaining,0))}`));
    }
    Object.keys(BOND_PRODUCTS).forEach(key=>{
      const p = BOND_PRODUCTS[key];
      const elig = bondProductEligible(s, key);
      const row = el('div',{style:'margin:10px 0;padding-bottom:8px;border-bottom:1px solid var(--steel-700);'});
      row.appendChild(el('div',{style:'font-weight:700;'}, p.label));
      const coupon = baseLoanRate(s) + (p.couponSpread!=null?p.couponSpread:BOND_COUPON_SPREAD);
      row.appendChild(el('div',{class:'field-hint'}, `${p.blurb} 利率目安 ${(coupon*100).toFixed(2)}%／償還 ${p.termTicks||BOND_TERM_TICKS}四半期`));
      if(!elig.ok) row.appendChild(el('div',{class:'field-hint', style:'color:var(--red);'}, elig.reason));
      const inp = el('input',{type:'number', value:'30000000', min:'0', step:'1000000'});
      row.appendChild(el('div',{class:'field-row'}, el('label',{},'発行額'), inp, el('span',{class:'unit'},'円')));
      row.appendChild(el('button',{class:'btn btn-small', disabled:!elig.ok, onclick:()=>doIssueBond(Number(inp.value)||0, key)}, '発行する'));
      block.appendChild(row);
    });
    panel.appendChild(block);
  }

  // IPOアクション
  if(!s.isListed){
    const elig = ipoEligible(s);
    const block = el('div',{class:'action-block'});
    block.appendChild(el('div',{class:'title'}, '新規上場（IPO）'));
    block.appendChild(el('div',{class:'desc'},

    ));
    IPO_SELECTABLE_EXCHANGES.forEach(key=>{
      const ex = EXCHANGES[key];
      const chk = exchangeListingCheck(s, key);
      const row = el('div',{style:'margin:8px 0;padding-bottom:8px;border-bottom:1px solid var(--steel-700);'});
      row.appendChild(el('button',{
        class:'btn btn-small'+(chk.ok?' btn-primary':''),
        disabled: !chk.ok,
        onclick:()=>doIpo(key)
      }, `${ex.short}に上場`));
      row.appendChild(el('div',{class:'field-hint'}, ex.label));
      row.appendChild(el('div',{class:'field-hint'},
        chk.ok
          ? `要件充足 — 推定株主 ${num(chk.shCount)}人／流通 ${pct(chk.projectedFloat,0)}／想定時価総額 ${yen(chk.mcap)}`
          : `未充足 — ${chk.reasons.slice(0,3).join('／')}`
      ));
      block.appendChild(row);
    });
    if(!elig){
      block.appendChild(el('div',{class:'field-hint'}, 'ヒント: 広告・説明会・IRで知名度を上げると株主数が増える。地方取引所は拠点・契約の地域関連性も見られる。'));
    }
    panel.appendChild(block);
  }

  // 重複上場
  if(s.isListed){
    const block = el('div',{class:'action-block'});
    block.appendChild(el('div',{class:'title'}, '重複上場'));
    block.appendChild(el('div',{class:'desc'},
      `現在の上場: ${listedMarkets(s).map(k=>EXCHANGES[k]?EXCHANGES[k].name:k).join('、')}。追加上場で認知・流動性が上がるが、上場維持費用も増える。費用 ${yen(DUAL_LIST_COST)}。年次維持費合計 ${yen(listingMaintainFeeAnnual(s))}。`));
    const candidates = ['sapporo','fukuoka','nagoya_next','nagoya_main','nagoya_premier','growth','standard','prime'].filter(k=>!listedMarkets(s).includes(k));
    candidates.forEach(key=>{
      const ex = EXCHANGES[key];
      if(!ex) return;
      // プライム／プレミアへの重複は厳しいので要件チェック
      const chk = exchangeListingCheck(s, key);
      const can = chk.ok && s.cash >= DUAL_LIST_COST;
      block.appendChild(el('button',{
        class:'btn btn-small',
        disabled: !can,
        style:'margin:3px 4px 3px 0;',
        onclick:()=>doDualList(key)
      }, `${ex.short}へ重複`));
    });
    panel.appendChild(block);
  }

  // 市場区分変更（東証プライムへ）
  if(s.isListed && s.exchange!=='prime'){
    const elig = primeEligible(s);
    const block = el('div',{class:'action-block'});
    block.appendChild(el('div',{class:'title'}, '市場区分変更（東証プライムへ）'));
    block.appendChild(el('div',{class:'desc'},
      elig ? '基準を満たしています。市場区分変更を申請できます。'
           : `必要条件（簡略）: 流通比率35%・株主800人・時価総額250億目安／独立社外取締役1/3以上／創業社長持株30%以下 など。`
    ));
    block.appendChild(el('div',{class:'field-hint'},
      `現在: 年換算売上 ${yen(annualRevenue(s))}／黒字継続 ${s.profitStreak}四半期／独立社外取締役比率 ${pct(independentRatio(s),0)}／創業社長持株比率 ${pct(founderOwnershipPct(s),1)}`
    ));
    block.appendChild(el('button',{class:'btn btn-primary btn-full', disabled: !elig, onclick:doUpgradeToPrime}, '市場区分変更を申請する'));
    panel.appendChild(block);
  }

  return panel;
}

function ensureVicePresidentFields(vp){
  if(!vp) return;
  if(vp.delegated==null) vp.delegated = false;
  if(vp.skill==null) vp.skill = 55;
  if(!vp.style || !VP_STYLES[vp.style]) vp.style = 'growth';
  if(vp.style2 && !VP_STYLES[vp.style2]) vp.style2 = null;
  if(vp.style2 === vp.style) vp.style2 = null;
  if(vp.hybridWeight==null) vp.hybridWeight = vp.style2 ? 0.35 : 0;
  if(!vp.scope || typeof vp.scope!=='object') vp.scope = {hire:true, budget:true, ops:true};
  ['hire','budget','ops'].forEach(k=>{ if(vp.scope[k]!==true && vp.scope[k]!==false) vp.scope[k]=true; });
  if(vp.approvalMode==null) vp.approvalMode = false;
  if(!vp.pendingProposals) vp.pendingProposals = [];
  if(!vp.lastActions) vp.lastActions = [];
  if(vp.fromInternal==null) vp.fromInternal = false;
}
function vpSalaryAnnual(vp){
  if(!vp) return 0;
  return Math.round(VP_SALARY_BASE * (0.85 + (vp.skill||55)/100));
}
function generateVpCandidates(s){
  const names = [];
  const used = {};
  const styles = Object.keys(VP_STYLES);
  const internal = [];
  const bms = s.branchManagers || {};
  Object.keys(bms).forEach(rid=>{
    const m = bms[rid];
    if(!m || !m.name) return;
    const tenure = (s.turn||0) - (m.appointedTurn||0);
    const sk = Math.round(m.skill||50);
    if(sk >= 62 && tenure >= 4){
      let style = 'ma';
      if(m.aiType==='hunter'||m.aiType==='expander') style = 'growth';
      else if(m.aiType==='guardian') style = 'quality';
      else if(m.aiType==='financier') style = 'finance';
      let style2 = Math.random()<0.5 ? styles[Math.floor(Math.random()*styles.length)] : null;
      if(style2===style) style2 = null;
      internal.push({
        id: 'vpi'+rid+(s.turn||0),
        name: m.name,
        skill: Math.min(92, sk + Math.round(tenure*0.4)),
        style, style2, hybridWeight: 0.3,
        salary: Math.round(VP_SALARY_BASE * (0.85 + sk/100)),
        fromInternal: true, fromRegion: rid,
      });
    }
  });
  internal.sort((a,b)=>b.skill-a.skill);
  internal.slice(0,2).forEach(c=>{ if(!used[c.name]){ used[c.name]=1; names.push(c); } });
  // 候補の層：エース（勝てる判断）／並／粗玉 — 人選が勝敗を分ける
  const tiers = [
    {min:78, max:94, w:1}, // エース
    {min:55, max:72, w:1}, // 並
    {min:40, max:54, w:1}, // 粗玉
  ];
  let ti = 0;
  while(names.length < 4){
    const n = randomPersonName();
    if(used[n]) continue;
    used[n] = 1;
    const style = styles[Math.floor(Math.random()*styles.length)];
    let style2 = Math.random()<0.55 ? styles[Math.floor(Math.random()*styles.length)] : null;
    if(style2===style) style2 = null;
    const tier = tiers[Math.min(ti, tiers.length-1)];
    ti++;
    const skill = Math.round(tier.min + Math.random()*(tier.max-tier.min));
    names.push({
      id: 'vpc'+Date.now()+Math.floor(Math.random()*999)+names.length,

      hybridWeight: style2 ? 0.3+Math.random()*0.25 : 0,
      salary: Math.round(VP_SALARY_BASE * (0.85 + skill/100)),
      fromInternal: false,

  }

}
function doAppointVicePresident(cand){

function doSetVpDelegation(on){
  const s = state;
  if(!s.vicePresident){ pushLog(s, '副社長がいない。', 'warn'); render(); return; }
  ensureVicePresidentFields(s.vicePresident);
  s.vicePresident.delegated = !!on;
  if(on){
    ensureVicePresidentFields(s.vicePresident);
    const sc = s.vicePresident.scope||{};
    // 全部OFFのまま一任すると何も起きないので、未設定相当ならフル一任
    if(sc.hire!==true && sc.budget!==true && sc.ops!==true){
      s.vicePresident.scope = {hire:true, budget:true, ops:true};
    }
    const sc2 = s.vicePresident.scope;
    const parts = [];
    if(sc2.hire) parts.push('採用');
    if(sc2.budget) parts.push('投資');
    if(sc2.ops) parts.push('現場');
    const mode = s.vicePresident.approvalMode ? '（承認制：全提案を社長が承認）' : '（範囲内は自動実行）';
    pushLog(s, `${s.vicePresident.name}副社長に一任した［${parts.join('・')||'範囲なし'}］${mode}。`, 'good');
  } else {
    pushLog(s, '副社長への経営一任を解除し、社長が日常経営に戻った。', 'info');
    s.vicePresident.pendingProposals = [];
  }
  render(); autoSave();
}
function doSetVpScope(key, on, silent){

  if(!s.vicePresident.scope) s.vicePresident.scope = {hire:true, budget:true, ops:true};

function doSetVpScopeAll(on){

function doSetVpApprovalMode(on){

    s.vicePresident.pendingProposals = [];
  }
  pushLog(s, on ? '副社長を承認制にした。重要施策は社長の承認後に実行される。' : '副社長を自動実行モードに戻した。', 'info');

function doResolveVpProposal(id, accept){
  const s = state;
  const vp = s.vicePresident;
  if(!vp || !vp.pendingProposals) return;
  const idx = vp.pendingProposals.findIndex(p=>p.id===id);
  if(idx<0) return;
  const p = vp.pendingProposals[idx];
  vp.pendingProposals.splice(idx,1);
  if(!accept){
    pushLog(s, `社長が副社長提案を却下：${p.label}`, 'warn');
    render(); autoSave(); return;
  }
  // 適用
  if(p.type==='budget' && p.field){
    s[p.field] = p.value;
    pushLog(s, `社長が承認：${p.label}`, 'good');
  } else if(p.type==='recruit' && p.recruit){
    const r = p.recruit;
    const cost = r.cost||0;
    if(cost > s.cash){
      pushLog(s, `承認したが資金不足で実行できず：${p.label}`, 'warn');
    } else {
      s.cash -= cost;
      s.recruitPipeline = s.recruitPipeline||[];
      s.recruitPipeline.push(r.job);
      pushLog(s, `社長が承認し募集を実行：${p.label}`, 'good');
    }
  } else if(p.type==='ops' && p.apply){
    try{ p.apply(s); }catch(e){}
    pushLog(s, `社長が承認：${p.label}`, 'good');
  } else {
    pushLog(s, `社長が承認：${p.label}`, 'good');
  }
  render(); autoSave();
}

function ensureTalentState(s){
  if(!s.keyPeople) s.keyPeople = [];
  if(!s.trainCounts) s.trainCounts = {renewal:0, maker:0, sales_corp:0};
  if(s.laborEventCooldown==null) s.laborEventCooldown = 0;
  if(!s.keyRetentionQueue) s.keyRetentionQueue = [];
  if(!s.independentSpinoffs) s.independentSpinoffs = [];
}
function processKeyPeople(s, logs){
  ensureTalentState(s);
  s.keyRetentionQueue = s.keyRetentionQueue || [];
  // 手当（基本＋引き留め後の上乗せ）
  let pay = 0;
  (s.keyPeople||[]).forEach(k=>{
    pay += (typeof KEY_PERSON_SALARY_Q!=='undefined'?KEY_PERSON_SALARY_Q:450000) + (k.raiseQ||0);
  });
  if(pay>0) s.cash -= Math.min(s.cash, pay);
  // 効果
  let qBoost = 0, sBoost = 0;
  (s.keyPeople||[]).forEach(k=>{
    if(k.role==='tech') qBoost += 0.12 + (k.skill||50)/400;
    if(k.role==='sales') sBoost += 0.01 + (k.skill||50)/5000;
    if(k.role==='admin') qBoost += 0.04;
    // 忠誠の自然変動
    if(Math.random() < 0.04 + (s.laborTightness||1)*0.02){
      k.loyalty = clamp((k.loyalty||70) - (2+Math.random()*4), 5, 98);
    }
    if((s.morale||60) >= 70 && Math.random() < 0.08){
      k.loyalty = clamp((k.loyalty||70) + 1.5, 5, 98);
    }
    if((s.morale||60) < 40 && Math.random() < 0.1){
      k.loyalty = clamp((k.loyalty||70) - 2, 5, 98);
    }
    // 高忠誠は成長
    if((k.loyalty||70) >= 70 && Math.random() < 0.06){
      k.skill = clamp((k.skill||50)+1, 20, 98);
    }
    // 危機：即流出ではなく引き留めキューへ
    const already = (s.keyRetentionQueue||[]).some(q=>q.personId===k.id);
    if(!already && (k.loyalty||70) < 38 && Math.random() < 0.18){
      const kind = Math.random() < 0.45 ? 'independent' : 'poach';
      const rival = (s.rivals||[]).length ? s.rivals[Math.floor(Math.random()*s.rivals.length)] : null;
      s.keyRetentionQueue.push({
        id: 'kr'+Date.now()+Math.floor(Math.random()*99),
        personId: k.id,
        name: k.name,
        role: k.role,
        roleLabel: k.roleLabel||k.role,
        skill: k.skill,
        kind, // poach | independent
        rivalName: rival ? rival.name : null,
        expiresTurn: (s.turn||0) + 2,
        raiseCost: Math.round((typeof KEY_RETAIN_RAISE!=='undefined'?KEY_RETAIN_RAISE:1200000) * (0.8 + (k.skill||50)/100)),
      });
      k.threatened = true;
      if(kind==='independent'){
        logs.push({text:`【人材】キーマン「${k.name}」（${k.roleLabel||k.role}）が独立を検討している。引き留めか送り出すか、組織タブで対応を。`, tag:'warn'});
      } else {
        logs.push({text:`【人材】キーマン「${k.name}」に${rival?rival.name+'など':''}他社から接触。引き抜きの危機（組織タブで対応）。`, tag:'warn'});
      }
    }
  });
  // 期限切れの未対応 → 流出確定
  const keptQ = [];
  (s.keyRetentionQueue||[]).forEach(q=>{
    if((s.turn||0) > (q.expiresTurn||0)){
      const k = (s.keyPeople||[]).find(p=>p.id===q.personId);
      if(k){
        resolveKeyPersonExit(s, k, q.kind||'poach', q.rivalName, logs, false);
        k._gone = true;
      }
    } else keptQ.push(q);
  });
  s.keyRetentionQueue = keptQ;
  s.keyPeople = (s.keyPeople||[]).filter(k=>!k._gone);
  if(qBoost) s.quality = clamp((s.quality||50)+qBoost, 5, 98);
  if(sBoost) s._keySalesBoost = sBoost;
  else s._keySalesBoost = 0;
  // 新規キーマン
  if((s.keyPeople||[]).length < (typeof KEY_PERSON_MAX!=='undefined'?KEY_PERSON_MAX:8)
      && (s.techSkill||50) >= 58 && Math.random() < 0.08){
    const role = Math.random()<0.55 ? 'tech' : (Math.random()<0.5?'sales':'admin');
    const labels = {tech:'熟練技術者', sales:'エース営業', admin:'管理の要'};
    const person = {
      id: 'kp'+Date.now()+Math.floor(Math.random()*99),
      name: randomPersonName(),
      role,
      roleLabel: labels[role],
      skill: Math.round(60+Math.random()*25),
      loyalty: Math.round(55+Math.random()*30),
      sinceTurn: s.turn||0,
      raiseQ: 0,
      title: null,
      threatened: false,
    };
    s.keyPeople.push(person);
    logs.push({text:`キーマン「${person.name}」（${person.roleLabel}・技能${person.skill}）が社内で頭角を現した。`, tag:'good'});
  }
}
function resolveKeyPersonExit(s, k, kind, rivalName, logs, voluntary){
  // voluntary=false: 引き留め失敗・期限切れ
  const skill = k.skill||50;
  if(kind==='independent'){
    // 独立：顧客の一部を持ち出し、将来の競合の芽
    const frac = typeof KEY_INDEP_UNIT_FRAC!=='undefined' ? KEY_INDEP_UNIT_FRAC : 0.012;
    let lost = Math.max(2, Math.round((s.units||0) * frac * (0.6 + skill/100)));
    lost = Math.min(lost, Math.max(5, Math.round((s.units||0)*0.04)));
    if(typeof removeUnitsFromPortfolio==='function') removeUnitsFromPortfolio(s, lost, null);
    else {
      // fallback
      const rid = REGIONS[0].id;
      const take = Math.min(lost, s.regionUnits[rid]||0);
      s.regionUnits[rid] = (s.regionUnits[rid]||0) - take;
      s.units = Object.values(s.regionUnits).reduce((a,b)=>a+b,0);
      lost = take;
    }
    s.morale = clamp((s.morale||60)-3, 5, 95);
    s.reputation = clamp((s.reputation||50)-1, 5, 98);
    // 独立会社をM&A候補や小型脅威として記録
    s.independentSpinoffs = s.independentSpinoffs || [];
    s.independentSpinoffs.push({
      name: k.name+'事務所',
      founder: k.name,
      role: k.role,
      units: lost,
      turn: s.turn||0,
    });
    // 低確率で小型ライバル的な地域侵食フラグ
    s._indepPressure = (s._indepPressure||0) + 1;
    if(logs) logs.push({text:`キーマン「${k.name}」が独立し、「${k.name}事務所」を立ち上げた。顧客 約${num(lost)}台が流出した。`, tag:'bad'});
    if(typeof pushCompanyChronicle==='function') pushCompanyChronicle(s, `${k.name}が独立`, 'warn');
  } else {
    // 引き抜き
    if(k.role==='tech' && (s.techs||0)>1){
      s.techs = Math.max(1, (s.techs||1)-1);
      if(typeof ensureInspectors==='function') ensureInspectors(s);
    }
    if(k.role==='sales' && (s.salesStaff||0)>0) s.salesStaff = Math.max(0, (s.salesStaff||0)-1);
    if(k.role==='admin' && (s.admins||0)>0) s.admins = Math.max(0, (s.admins||0)-1);
    s.morale = clamp((s.morale||60)-2, 5, 95);
    s.hireCostMult = Math.min(1.8, (s.hireCostMult||1)*1.04);
    const who = rivalName ? rivalName : '他社';
    if(logs) logs.push({text:`キーマン「${k.name}」（${k.roleLabel||k.role}）が${who}へ移籍した。`, tag:'bad'});
    if(typeof pushCompanyChronicle==='function') pushCompanyChronicle(s, `${k.name}が移籍`, 'warn');
  }
}
function doRetainKeyPerson(queueId, mode){
  // mode: raise | promote | letgo | refuse
  const s = state;
  s.keyRetentionQueue = s.keyRetentionQueue || [];
  const q = s.keyRetentionQueue.find(x=>x.id===queueId);
  if(!q){ pushLog(s,'対象の引き留め案件がない。','info'); render(); return; }
  const k = (s.keyPeople||[]).find(p=>p.id===q.personId);
  if(!k){
    s.keyRetentionQueue = s.keyRetentionQueue.filter(x=>x.id!==queueId);
    pushLog(s,'キーマンは既に在籍していない。','info'); render(); return;
  }
  if(mode==='raise'){
    const cost = q.raiseCost || (typeof KEY_RETAIN_RAISE!=='undefined'?KEY_RETAIN_RAISE:1200000);
    if(cost > s.cash){ pushLog(s, `引き留め一時金が不足（必要 ${yen(cost)}）。`, 'warn'); render(); return; }
    s.cash -= cost;
    k.loyalty = clamp((k.loyalty||50) + 18 + Math.random()*8, 5, 98);
    k.raiseQ = (k.raiseQ||0) + (typeof KEY_RETAIN_RAISE_Q!=='undefined'?KEY_RETAIN_RAISE_Q:200000);
    k.threatened = false;
    s.keyRetentionQueue = s.keyRetentionQueue.filter(x=>x.id!==queueId);
    pushLog(s, `「${k.name}」に一時金 ${yen(cost)} と待遇改善で引き留めた（忠誠 ${Math.round(k.loyalty)}）。`, 'good');
  } else if(mode==='promote'){
    // 役職・裁量（現金少、忠誠中）
    k.title = k.role==='tech' ? '技術統括' : k.role==='sales' ? '営業統括' : '管理統括';
    k.loyalty = clamp((k.loyalty||50) + 12 + Math.random()*6, 5, 98);
    k.skill = clamp((k.skill||50)+2, 20, 98);
    k.threatened = false;
    s.morale = clamp((s.morale||60)+1, 5, 95);
    s.keyRetentionQueue = s.keyRetentionQueue.filter(x=>x.id!==queueId);
    pushLog(s, `「${k.name}」を${k.title}に抜擢し引き留めた（忠誠 ${Math.round(k.loyalty)}）。`, 'good');
  } else if(mode==='letgo' || mode==='refuse'){
    // 送り出す／拒否 → 即退出
    resolveKeyPersonExit(s, k, q.kind||'poach', q.rivalName, null, true);
    k._gone = true;
    s.keyPeople = (s.keyPeople||[]).filter(p=>!p._gone);
    s.keyRetentionQueue = s.keyRetentionQueue.filter(x=>x.id!==queueId);
    const msg = q.kind==='independent'
      ? `「${k.name}」の独立を認め、送り出した。`
      : `「${k.name}」の引き留めをせず、移籍を受け入れた。`;
    pushLog(s, msg, 'warn');
    // letgo 時は独立の持ち出しをやや抑える（円満）
    if(mode==='letgo' && q.kind==='independent'){
      s.reputation = clamp((s.reputation||50)+0.5, 5, 98);
    }
  }
  render(); autoSave();
}

function doTrainTrack(trackId){
  const s = state;
  ensureTalentState(s);
  const tr = TRAIN_TRACKS[trackId];
  if(!tr || trackId==='inspector') return;
  const cost = tr.cost||0;
  if(cost > s.cash){ pushLog(s, '研修費用が不足している。', 'warn'); render(); return; }
  if((s.techs||0)+(s.salesStaff||0) < 2){ pushLog(s, '研修に送る人員が不足している。', 'warn'); render(); return; }
  s.cash -= cost;
  s.trainCounts[trackId] = (s.trainCounts[trackId]||0)+1;
  if(trackId==='renewal' || trackId==='maker'){
    s.techSkill = clamp((s.techSkill||50)+(tr.skillGain||3), 5, 98);
  }
  if(trackId==='sales_corp'){
    s.salesSkill = clamp((s.salesSkill!=null?s.salesSkill:50)+(tr.skillGain||3), 5, 98);
  }
  if(trackId==='maker'){
    s._makerTrainBoost = clamp((s._makerTrainBoost||0)+0.02, 0, 0.2);
  }
  if(trackId==='renewal'){
    s._renewalTrainBoost = clamp((s._renewalTrainBoost||0)+0.03, 0, 0.25);
  }
  pushLog(s, `「${tr.label}」研修を1名分実施した（${yen(cost)}）。累計 ${s.trainCounts[trackId]}名。`, 'good');
  render(); autoSave();
}
function processLaborMarket(s, logs){
  ensureTalentState(s);
  if((s.laborEventCooldown||0)>0){ s.laborEventCooldown--; return; }
  if(Math.random() > 0.22) return;
  const roll = Math.random();
  if(roll < 0.28){
    s.laborTightness = Math.min(2.8, (s.laborTightness||1)+0.08+Math.random()*0.1);
    s.laborEventCooldown = 2;
    logs.push({text:'【労働市場】同業他社の大量採用で技術者マーケットが逼迫している。充足率が下がる見込み。', tag:'warn'});
  } else if(roll < 0.5){
    s.laborTightness = Math.max(0.75, (s.laborTightness||1)-0.06);
    s.laborEventCooldown = 1;
    logs.push({text:'【労働市場】地方の求人市況が一時的に緩和。紹介・中途がやや集まりやすい。', tag:'good'});
  } else if(roll < 0.7){
    s.laborTightness = Math.min(2.8, (s.laborTightness||1)+0.04);
    logs.push({text:'【労働市場】春季・年度替わりの採用競争が過熱している。', tag:'info'});
    s.laborEventCooldown = 1;
  } else if(roll < 0.85){
    // キーマン引き抜き圧力
    if((s.keyPeople||[]).length){
      const k = s.keyPeople[Math.floor(Math.random()*s.keyPeople.length)];
      k.loyalty = clamp((k.loyalty||70)-8, 5, 98);
      logs.push({text:`【労働市場】キーマン「${k.name}」に他社から接触があった（忠誠度 ${Math.round(k.loyalty)}）。`, tag:'warn'});
      s.laborEventCooldown = 1;
    }
  } else {
    logs.push({text:'【労働市場】業界団体が人材育成の共同研修を呼びかけている。研修実施が技能向上に有利。', tag:'info'});
    s.laborEventCooldown = 1;
  }
}
function vpStyleBlend(vp){
  ensureVicePresidentFields(vp);
  const primary = vp.style||'growth';
  const secondary = vp.style2 && vp.style2!==primary ? vp.style2 : null;
  const w = secondary ? clamp(vp.hybridWeight!=null?vp.hybridWeight:0.35, 0.15, 0.5) : 0;
  return {primary, secondary, w};
}

function processVicePresident(s, logs){
  s._vpBidMult = 1; s._vpChurnMult = 1;
  const vp = s.vicePresident;
  if(!vp) return;
  ensureVicePresidentFields(vp);
  // 任期満了
  if(vp.expiresTurn!=null && (s.turn||0) > vp.expiresTurn){
    if(!s.isListed){
      vp.expiresTurn = (s.turn||0) + (typeof VP_TERM_Q!=='undefined' ? VP_TERM_Q : 20);
      logs.push({text:`${vp.name}副社長の任期（5年）が満了したが、未上場のため契約を5年自動更新した。`, tag:'info'});
      pushCompanyChronicle(s, `${vp.name}副社長の任期を自動更新（未上場）`, 'info');
    } else {
      logs.push({text:`${vp.name}副社長の任期（5年）が満了した。再任するか後任を選ぶ必要がある。`, tag:'info'});
      pushCompanyChronicle(s, `${vp.name}副社長が任期満了`, 'info');
      s.vicePresident = null;
      return;
    }
  }
  // 報酬（年額の1/4）
  const sal = Math.round(vpSalaryAnnual(vp) / 4);
  s.cash -= Math.min(Math.max(0,s.cash), sal);

  if(!vp.delegated){
    s._vpBidMult = 1; s._vpChurnMult = 1;
    vp.lastActions = [];
    return;
  }

  // ========== 経営一任中：局面認識＋志向別AI（毎期必ず行動を残す） ==========
  const vpActions = [];
  const vpLog = (msg, tag)=>{
    const line = {text: msg, tag: tag||'info'};
    vpActions.push(line);
    logs.push(line);
  };
  const skill = vp.skill||55;
  const st = VP_STYLES[vp.style] || VP_STYLES.growth;
  const power = clamp((skill - 50) / 50, -0.6, 0.9);
  const growth = typeof companyGrowthPhase==='function' ? companyGrowthPhase(s) : 0.2;
  const util = typeof baseCapacity==='function' && baseCapacity(s)>0 ? s.units/baseCapacity(s) : 1;
  const cash = s.cash||0;
  const phaseLabel = growth < 0.28 ? '創業期' : growth < 0.5 ? '成長初期' : growth < 0.72 ? '成長期' : '成熟期';
  const adminL = typeof adminLoad==='function' ? adminLoad(s) : 1;
  const beforeSales = s.salesBudget||0;
  const beforeQual = s.qualityBudget||0;
  const beforeWelfare = s.welfareBudget||0;
  const blend = typeof vpStyleBlend==='function' ? vpStyleBlend(vp) : {primary:st.id, secondary:null, w:0};
  const scope = vp.scope || {hire:true, budget:true, ops:true};
  const canHire = scope.hire !== false;
  const canBudget = scope.budget !== false;
  const canOps = scope.ops !== false;
  const needApprove = !!vp.approvalMode;
  // ハイブリッド：一定確率で副志向を主として振る
  let activeStyle = blend.primary;
  if(blend.secondary && Math.random() < blend.w){
    activeStyle = blend.secondary;
    vpLog(`【副社長一任】ハイブリッド志向：今期は副志向「${(VP_STYLES[activeStyle]||{}).label||activeStyle}」を前面に出す。`, 'info');
  }
  // st を activeStyle に差し替え
  const stActive = VP_STYLES[activeStyle] || st;
  const proposeOrApplyBudget = (field, value, label)=>{
    if(!canBudget){
      vpLog(`【副社長一任】投資配分は一任範囲外のため${label}は見送り。`, 'info');
      return;
    }
    if(needApprove){
      vp.pendingProposals = vp.pendingProposals||[];
      if(vp.pendingProposals.length >= 5) return;
      vp.pendingProposals.push({id:'vpp'+Date.now()+Math.floor(Math.random()*99), type:'budget', field, value, label});
      vpLog(`【副社長一任】承認待ち提案：${label}`, 'info');
    } else {
      s[field] = value;
      vpLog(`【副社長一任】${label}`, 'info');
    }
  };
  const origTryRecruit = vpTryRecruit;
  // wrap defined after vpTryRecruit - will patch calls instead


  function vpPickRecruitType(role){
    if(skill < 48 && growth < 0.4 && Math.random() < 0.45){
      if(role==='tech') return 'mid_tech';
      if(role==='sales') return 'mid_sales';
      return 'mid_admin';
    }
    if(growth < 0.32){
      if(role==='tech') return 'ref_tech';
      if(role==='sales') return 'ref_sales';
      return 'ref_admin';
    }
    if(growth < 0.55){
      if(Math.random() < 0.62 + (skill>=70?0.1:0)){
        if(role==='tech') return 'ref_tech';
        if(role==='sales') return 'ref_sales';
        return 'ref_admin';
      }
      if(role==='tech') return skill>=72 ? 'mid_tech' : 'grad_tech';
      if(role==='sales') return 'mid_sales';
      return 'mid_admin';
    }
    if(Math.random() < 0.18){
      if(role==='tech') return 'ref_tech';
      if(role==='sales') return 'ref_sales';
      return 'ref_admin';
    }
    if(role==='tech'){
      if(skill>=78 && Math.random()<0.25) return 'vet_tech';
      return Math.random()<0.45 ? 'mid_tech' : 'grad_tech';
    }
    if(role==='sales'){
      if(skill>=78 && Math.random()<0.2) return 'vet_sales';
      return Math.random()<0.5 ? 'mid_sales' : 'grad_sales';
    }
    return Math.random()<0.5 ? 'mid_admin' : 'grad_admin';
  }

  function vpTryRecruit(role, n, reason){
    if(!canHire){
      vpLog(`【副社長一任】採用は一任範囲外のため「${reason}」の補充は見送り。`, 'info');
      return false;
    }
    n = Math.max(1, Math.min(3, n||1));
    const typeKey = vpPickRecruitType(role);
    const t = RECRUIT_TYPES[typeKey];
    if(!t) return false;
    const pending = (s.recruitPipeline||[]).filter(j=>j.type===typeKey).length;
    if(pending >= 2) return false;
    const unit = typeof recruitCostPerHead==='function' ? recruitCostPerHead(s, typeKey) : (t.headcost||500000);
    const cost = Math.round(unit * n * (1 + Math.max(0, n-2)*0.06));
    if(cost > cash * 0.14 || cost > s.cash){
      vpLog(`【副社長一任】${vp.name}は${reason}だが手元資金の制約で採用を見送った。`, 'info');
      return false;
    }
    const chance = typeof recruitFillChance==='function' ? recruitFillChance(s, typeKey) : 0.4;
    if(chance < 0.18 && skill >= 60 && Math.random() < 0.7){
      vpLog(`【副社長一任】${vp.name}は「${t.label}」の充足見込みが低いと判断し募集を見送った（${phaseLabel}）。`, 'info');
      return false;
    }
    const note = t.referral
      ? (growth < 0.35 ? '創業期は市場採用が集まらないためリファラル' : '紹介経由で確実性を優先')
      : (growth < 0.4 ? '※創業期の市場採用は充足しにくい' : '市場採用');
    const label = `「${t.label}」${n}名募集（${yen(cost)}）— ${reason}／${note}`;
    const job = {
      id: 'vp'+Date.now()+Math.floor(Math.random()*999),
      type: typeKey, requested: n,
      resolveTurn: (s.turn||0) + (t.delay||0),
      costPaid: cost, byVp: true,
    };
    if(needApprove){
      vp.pendingProposals = vp.pendingProposals||[];
      if(vp.pendingProposals.length >= 5){
        vpLog(`【副社長一任】承認待ちが上限のため募集提案を抑制。`, 'info');
        return false;
      }
      vp.pendingProposals.push({id:'vpr'+Date.now()+Math.floor(Math.random()*99), type:'recruit', label, recruit:{cost, job}});
      vpLog(`【副社長一任】承認待ち提案：${label}`, 'info');
      return true;
    }
    s.cash -= cost;
    s.recruitPipeline = s.recruitPipeline || [];
    s.recruitPipeline.push(job);
    vpLog(`【副社長一任】${vp.name}が${label}`, t.referral || chance>=0.35 ? 'info' : 'warn');
    return true;
  }

  // 毎期の局面サマリー（必ず1件）
  vpLog(`【副社長一任】${vp.name}（${st.label}・手腕${Math.round(skill)}）が${phaseLabel}の運営方針を確定。稼働${pct(util,0)}／現金${yen(cash)}。`, 'info');

  // ========== 志向別の本動作（毎期必ず具体策） ==========
  if(!canBudget && !canHire && !canOps){
    vpLog(`【副社長一任】一任範囲がすべて停止されている。指示なし。`, 'warn');
  }
  if(stActive.id==='growth'){
    // 営業強化
    const salesTarget = Math.round(Math.max(beforeSales, 800000) * (1.04 + power*0.05));
    if(canBudget){
      if(needApprove) proposeOrApplyBudget('salesBudget', salesTarget, `成長方針：営業投資を${yen(beforeSales)}→${yen(salesTarget)}`);
      else {
        s.salesBudget = salesTarget;
        if(salesTarget > beforeSales) vpLog(`【副社長一任】成長方針：営業投資を${yen(beforeSales)}→${yen(salesTarget)}へ増額。`, 'info');
      }
    }
    // 品質は二の次になりがち
    if(power < 0.2 && (s.qualityBudget||0) > 500000){
      s.qualityBudget = Math.round((s.qualityBudget||0) * 0.97);
      vpLog(`【副社長一任】成長優先のため品質投資をわずかに抑制。`, 'info');
    }
    // 広告
    if(cash > 18000000 && s.adActive && AD_CHANNELS){
      const off = Object.keys(AD_CHANNELS).filter(id=>!s.adActive[id] && !(AD_CHANNELS[id].listedOnly && !s.isListed));
      if(off.length && Math.random() < 0.35 + Math.max(0,power)*0.2){
        const id = off[Math.floor(Math.random()*off.length)];
        s.adActive[id] = true;
        vpLog(`【副社長一任】成長加速のため「${AD_CHANNELS[id].label}」をON。`, 'info');
      }
    }
    // 採用：稼働がそこそこでも動く
    if(util > 0.82){
      if(Math.random() < 0.55 + power*0.2) vpTryRecruit('tech', util>1.0?2:1, util>1.0?'定員超過':'成長に合わせた戦力確保');
    } else if(util > 0.7 && skill >= 65 && Math.random() < 0.3){
      vpTryRecruit('tech', 1, '需要増を見越した先行補充');
    }
    if((s.salesStaff||0) < Math.max(1, Math.round((s.techs||1)*0.3)) && Math.random() < 0.4){
      vpTryRecruit('sales', 1, '営業が手薄');
    }
  } else if(stActive.id==='quality'){
    const qTarget = Math.round(Math.max(beforeQual, 600000) * (1.05 + Math.max(0,power)*0.06));
    if(canBudget){
      if(needApprove) proposeOrApplyBudget('qualityBudget', qTarget, `品質方針：品質投資 ${yen(beforeQual)}→${yen(qTarget)}`);
      else {
        s.qualityBudget = qTarget;
        vpLog(`【副社長一任】品質方針：品質投資を${yen(beforeQual)}→${yen(qTarget)}へ${qTarget>=beforeQual?'増額':'調整'}。`, 'info');
      }
    }
    if(canBudget && (s.quality||50) < 60){
      const qmin = Math.max(s.qualityBudget||0, 1000000);
      proposeOrApplyBudget('qualityBudget', qmin, '品質スコア低めのため最低品質予算を確保');
    }
    if(canBudget && (s.morale||60) < 58 && cash > 5000000){
      const w = Math.max(beforeWelfare, Math.round(700000 + power*250000));
      proposeOrApplyBudget('welfareBudget', w, `定着のため福利厚生を${yen(w)}に設定`);
    }
    // 稼働が高いときのみ慎重採用（即戦力寄り）
    if(util > 0.98){
      if(Math.random() < 0.4 + power*0.15) vpTryRecruit('tech', 1, '品質維持のための最小補充');
    } else {
      vpLog(`【副社長一任】無理な拡大採用は避け、既存班の品質を優先。`, 'info');
    }
    s.quality = clamp((s.quality||50) + 0.2 + Math.max(0,power)*0.25, 5, 98);
  } else if(stActive.id==='finance'){
    // 財務は毎期「どこを締めるか」を明示
    const moves = [];
    if(canBudget && beforeSales > 1200000){
      const nv = Math.round(beforeSales * (0.94 - Math.max(0,-power)*0.02));
      if(needApprove) proposeOrApplyBudget('salesBudget', nv, `財務：営業投資 ${yen(beforeSales)}→${yen(nv)}`);
      else { s.salesBudget = nv; moves.push(`営業投資 ${yen(beforeSales)}→${yen(nv)}`); }
    } else if(canBudget && beforeSales < 400000 && cash > 30000000 && skill >= 70){
      const nv = Math.round(500000 + power*100000);
      if(needApprove) proposeOrApplyBudget('salesBudget', nv, `財務：営業投資を${yen(nv)}まで戻す`);
      else { s.salesBudget = nv; moves.push(`過少だった営業投資を${yen(nv)}まで戻す`); }
    }
    if(canBudget && beforeQual > 2000000 && (s.quality||50) > 62){
      const nv = Math.round(beforeQual * 0.95);
      if(needApprove) proposeOrApplyBudget('qualityBudget', nv, `財務：品質投資を${yen(nv)}に圧縮`);
      else { s.qualityBudget = nv; moves.push(`品質投資を${yen(nv)}に圧縮`); }
    }
    if(canBudget && beforeWelfare > 400000 && cash < 25000000){
      const nv = Math.round(beforeWelfare * 0.9);
      if(needApprove) proposeOrApplyBudget('welfareBudget', nv, '財務：福利厚生を抑制');
      else { s.welfareBudget = nv; moves.push(`福利厚生を抑制`); }
    }
    if(!canBudget) moves.push('投資配分は一任範囲外');
    // 広告の一部OFF
    if(s.adActive && cash < 20000000){
      const on = Object.keys(s.adActive).filter(k=>s.adActive[k]);
      if(on.length >= 2 && Math.random() < 0.5){
        const id = on[Math.floor(Math.random()*on.length)];
        s.adActive[id] = false;
        const lab = (AD_CHANNELS && AD_CHANNELS[id]) ? AD_CHANNELS[id].label : id;
        moves.push(`広告「${lab}」を停止`);
      }
    }
    // 残業でしのぐ／採用抑制コメント
    if(canOps && util > 0.92 && util < 1.15){
      s.overtimeUnits = Math.min(3000, (s.overtimeUnits||0) + Math.round(25 + util*40));
      moves.push(`採用より残業枠を${Math.round(s.overtimeUnits)}台相当まで拡大`);
    } else if(util > 0.92 && util < 1.15 && !canOps){
      moves.push('現場運営は一任範囲外（残業枠は触らない）');
    } else if(util >= 1.15){
      // 流石に採用
      vpTryRecruit('tech', 1, '稼働が危険域のため最小採用');
    } else {
      moves.push(`人員は現状維持（採用凍結気味）`);
    }
    if(adminL > 1.15){
      if(Math.random() < 0.4) vpTryRecruit('admin', 1, '事務負荷が限界');
      else moves.push(`事務負荷は残業・優先順位で凌ぐ`);
    }
    if(cash < 15000000){
      moves.push(`手元流動性薄め — 拡大投資を抑制`);
      s.mainBankRelationship = clamp((s.mainBankRelationship||50)+0.1, 5, 98);
    } else if(skill >= 70){
      s.mainBankRelationship = clamp((s.mainBankRelationship||50)+0.2, 5, 98);
      moves.push(`銀行関係の維持を優先`);
    }
    if(moves.length){
      vpLog(`【副社長一任】財務方針：${moves.slice(0,4).join('／')}。`, 'info');
    } else {
      vpLog(`【副社長一任】財務方針：今期はコスト構造を維持し、無駄な拡大を避ける。`, 'info');
    }
  } else if(stActive.id==='ma'){
    const pmiActive = (s.pmiJobs||[]).filter(j=>j.status==='active');
    if(pmiActive.length){
      if(canBudget){
        const nv = Math.round(Math.max(beforeQual, 700000) * 1.04);
        if(needApprove) proposeOrApplyBudget('qualityBudget', nv, `再編：PMI優先で品質予算 ${yen(nv)}`);
        else s.qualityBudget = nv;
      }
      if(canOps) s.pmiChurnAdd = clamp((s.pmiChurnAdd||0) * (1 - 0.06*Math.max(0,power)), 0, 0.03);
      vpLog(`【副社長一任】再編方針：PMI案件${pmiActive.length}件を優先。品質予算を厚くし統合離反を抑制。`, 'info');
      if(util > 1.0 && Math.random() < 0.45){
        vpTryRecruit('tech', 1, '統合後の保守余力確保');
      } else {
        vpLog(`【副社長一任】新規拡大より統合の穴埋めを優先し、攻勢採用は抑制。`, 'info');
      }
    } else {
      // 買収候補の準備：現金温存＋品質維持
      if(canBudget && beforeSales > 1500000){
        const nv = Math.round(beforeSales * 0.96);
        if(needApprove) proposeOrApplyBudget('salesBudget', nv, '再編：営業抑制');
        else s.salesBudget = nv;
      }
      if(canBudget){
        const nq = Math.max(beforeQual, Math.round(beforeQual * 1.01));
        if(needApprove) proposeOrApplyBudget('qualityBudget', nq, '再編：品質維持');
        else s.qualityBudget = nq;
      }
      vpLog(`【副社長一任】再編方針：M&A余力確保のため営業は抑制、品質と手元現金を維持（現金${yen(cash)}）。`, 'info');
      if(cash > 80000000 && skill >= 65 && Math.random() < 0.25){
        vpLog(`【副社長一任】買収・提携の機会を探るよう指示（市場・ライバル監視を強化）。`, 'info');
        if(typeof s.marketResearchBudget==='number'){
          const prev = s.marketResearchBudget||0;
          s.marketResearchBudget = Math.max(prev, 500000);
          if(s.marketResearchBudget > prev){
            vpLog(`【副社長一任】マーケット調査班の予算を${yen(s.marketResearchBudget)}に設定。`, 'info');
          }
        }
      }
      if(util > 1.08 && Math.random() < 0.35){
        vpTryRecruit('tech', 1, '本業の余力不足');
      }
    }
  }

  // 共通：定員逼迫時は志向に関わらず採用する（成長以外も使えるように）
  // 財務はまず残業、それでも危険なら採用。品質・再編は最小補充。
  if(canHire){
    if(util >= 1.12){
      const n = skill >= 70 ? 2 : 1;
      if(stActive.id==='finance' && (s.overtimeUnits||0) < 800 && canOps){
        s.overtimeUnits = Math.min(3000, (s.overtimeUnits||0) + 80);
        vpLog(`【副社長一任】稼働危険域のため残業枠を拡大したうえで採用も検討。`, 'warn');
      }
      vpTryRecruit('tech', n, '定員超過（全志向共通の安全弁）');
    } else if(util >= 1.0){
      const p = stActive.id==='growth' ? 0.7 : stActive.id==='finance' ? 0.4 : 0.5;
      if(Math.random() < p + Math.max(0,power)*0.15){
        vpTryRecruit('tech', 1, stActive.id==='growth' ? '成長に合わせた補充' : '稼働逼迫の最小補充');
      } else if(stActive.id==='finance' && canOps){
        s.overtimeUnits = Math.min(3000, (s.overtimeUnits||0) + Math.round(30+util*20));
        vpLog(`【副社長一任】財務方針：採用を見送り残業枠で凌ぐ（稼働${pct(util,0)}）。`, 'info');
      }
    } else if(util >= 0.88 && stActive.id!=='growth' && skill >= 60 && Math.random() < 0.22){
      // 成長以外も「やや高め」なら先手が打てる
      vpTryRecruit('tech', 1, '余力低下の予防補充');
    }
  }

  // 共通：事務過負荷のフォールバック
  if(canHire && adminL > 1.15 && Math.random() < (stActive.id==='finance'?0.25:0.4)){
    vpTryRecruit('admin', 1, '事務負荷が限界');
  } else if(adminL > 1.15 && stActive.id==='finance'){
    vpLog(`【副社長一任】事務負荷は高いが、財務方針で採用を抑制中。`, 'info');
  }

  // 低手腕の失策
  if(skill < 48 && growth < 0.35 && Math.random() < 0.14){
    const wasteType = Math.random()<0.5 ? 'mid_tech' : 'grad_tech';
    const t = RECRUIT_TYPES[wasteType];
    if(t){
      const cost = Math.round((typeof recruitCostPerHead==='function' ? recruitCostPerHead(s, wasteType) : t.headcost) * 2);
      if(cost < s.cash * 0.12){
        s.cash -= cost;
        s.recruitPipeline = s.recruitPipeline || [];
        s.recruitPipeline.push({
          id:'vpw'+Date.now(), type:wasteType, requested:2,
          resolveTurn:(s.turn||0)+(t.delay||0), costPaid:cost, byVp:true,
        });
        vpLog(`【副社長一任】${vp.name}が創業期にもかかわらず「${t.label}」を2名募集した。無名の段階では集まりにくい。`, 'warn');
      }
    }
  }
  if(skill < 48 && Math.random() < 0.12){
    const lost = Math.max(1, Math.round((s.units||0)*0.002));
    if(typeof removeUnitsFromPortfolio==='function') removeUnitsFromPortfolio(s, lost, null);
    vpLog(`【副社長一任】${vp.name}の判断ミスで約${num(lost)}台の契約に影響。`, 'warn');
  }

  // ========== エース級（手腕高）の「勝てる判断」パッケージ ==========
  if(skill >= 72 && canBudget){
    // 現金が厚いのに営業が薄い → 機会損失を嫌う
    if(cash > 35000000 && (s.salesBudget||0) < 2000000 && stActive.id!=='finance'){
      const nv = Math.round(Math.max(s.salesBudget||0, 1800000) * (1.05+power*0.04));
      if(needApprove) proposeOrApplyBudget('salesBudget', nv, `エース判断：余資を営業へ（→${yen(nv)}）`);
      else { s.salesBudget = nv; vpLog(`【副社長一任】エース判断：手元余資を営業投資へ振った（${yen(nv)}）。`, 'good'); }
    }
    // 品質が危険域なら成長志向でも最低限守る
    if((s.quality||50) < 48 && (s.qualityBudget||0) < 1200000){
      const nv = 1200000;
      if(needApprove) proposeOrApplyBudget('qualityBudget', nv, 'エース判断：品質下限の確保');
      else { s.qualityBudget = nv; vpLog(`【副社長一任】エース判断：品質が危険なため品質投資を下限まで引き上げ。`, 'good'); }
    }
  }
  if(skill >= 75 && canHire && util > 0.85 && util < 1.0 && Math.random() < 0.45){
    vpTryRecruit('tech', 1, 'エース判断：需要前の先行採用');
  }
  if(skill >= 78 && canOps){
    // 解約・品質の底上げ
    s.quality = clamp((s.quality||50) + 0.25 + power*0.2, 5, 98);
    if((s.morale||60) < 55 && cash > 8000000 && canBudget){
      const w = Math.max(s.welfareBudget||0, 900000);
      if(needApprove) proposeOrApplyBudget('welfareBudget', w, 'エース判断：士気の下支え');
      else { s.welfareBudget = w; vpLog(`【副社長一任】エース判断：離職防止のため福利を厚くした。`, 'good'); }
    }
    // 調査予算（競合の予兆を取る）
    if(typeof s.marketResearchBudget==='number' && cash > 20000000){
      const prev = s.marketResearchBudget||0;
      const target = skill >= 85 ? 1500000 : 500000;
      if(prev < target){
        s.marketResearchBudget = target;
        vpLog(`【副社長一任】エース判断：マーケット調査を${yen(target)}に設定し競合予兆を取る。`, 'good');
      }
    }
  }
  // 価格：過安・過高の是正（高手腕のみ、ops扱い）
  if(skill >= 80 && canOps && (s.units||0) > 80){
    const p0 = s.price||240000;
    // 稼働低く現金も厳しいなら維持単価を意識、稼働過大なら値上げ余地
    if(util > 1.05 && p0 < 320000 && Math.random() < 0.35){
      s.price = Math.round(p0 * 1.02);
      vpLog(`【副社長一任】エース判断：需給がタイトなため保守単価を${yen(s.price)}へ微増。`, 'good');
    } else if(util < 0.7 && p0 > 200000 && (s.reputation||50) < 55 && Math.random() < 0.25){
      s.price = Math.round(p0 * 0.98);
      vpLog(`【副社長一任】エース判断：稼働に余裕があり単価を${yen(s.price)}へ微調整（獲得優先）。`, 'info');
    }
  }

  // 手腕の成長（在任で磨かれる／粗玉は伸びにくい）
  if(skill >= 60 && Math.random() < 0.2){
    vp.skill = clamp((vp.skill||55) + (skill>=75?0.4:0.2), 30, 98);
  } else if(skill < 50 && Math.random() < 0.08){
    vp.skill = clamp((vp.skill||55) - 0.3, 30, 90);
  }

  // 成長への係数（エースは明確に市場で勝つ）
  const bidBase = stActive.id==='growth' ? 0.16 : stActive.id==='ma' ? 0.10 : 0.08;
  const churnBase = stActive.id==='quality' ? 0.12 : stActive.id==='finance' ? 0.05 : 0.06;
  // power -0.6〜0.9 → エースは最大で獲得+約20%、解約抑制
  s._vpBidMult = clamp(1 + power * bidBase + (skill>=80?0.04:0) + (skill>=90?0.03:0), 0.85, 1.28);
  s._vpChurnMult = clamp(1 - power * churnBase - (skill>=80?0.03:0), 0.82, 1.12);
  if(stActive.id==='quality' || skill>=78) s.quality = clamp((s.quality||50) + 0.15 + Math.max(0,power)*0.25, 5, 98);
  if(stActive.id==='growth' && power < 0) s.quality = clamp((s.quality||50) - 0.12, 5, 98);
  if((stActive.id==='finance' || skill>=75) && power > 0){
    s.mainBankRelationship = clamp((s.mainBankRelationship||50)+0.2, 5, 98);
  }

  if(skill >= 78){
    vpLog(`【副社長一任】${vp.name}の市場効果：獲得×${(s._vpBidMult).toFixed(2)}／解約×${(s._vpChurnMult).toFixed(2)}（エース級）。`, 'good');
  } else if(skill >= 60 && Math.random() < 0.2){
    vpLog(`【副社長一任】${vp.name}の手腕により現場運営が安定（${phaseLabel}）。`, 'good');
  } else if(skill < 48 && Math.random() < 0.2){
    vpLog(`【副社長一任】${vp.name}の判断は場当たり的で、勝ち筋が見えにくい。`, 'warn');
  }

  vpActions.forEach(a=>{ a.turn = s.turn||0; });
  vp.lastActions = vpActions;
  s.vpActionLog = (s.vpActionLog||[]).concat(vpActions).slice(-16);
}


/**
 * window.confirm() の代替。一部のWebView／サンドボックス環境ではネイティブの
 * confirm()/alert() が正しく表示・応答されず、呼び出し側が「押しても反応しない」
 * ように見えてしまう（副社長解任ボタン等で発生していた不具合）。
 * 自前のDOMオーバーレイで代替し、タイマーの一時停止・再開も必ず対称にする。
 */
function showConfirmOverlay(message, onConfirm){
  let wasRunning = false;
  try{
    wasRunning = !!isRunning;
    stopTimer();
    const ov = document.createElement('div');
    ov.className = 'confirm-overlay';
    ov.setAttribute('role','dialog');
    ov.style.cssText = [
      'position:fixed','left:0','top:0','right:0','bottom:0',
      'z-index:2147483647','background:rgba(8,10,14,0.92)',
      'display:flex','align-items:center','justify-content:center',
      'padding:16px','box-sizing:border-box'
    ].join(';');

    const box = document.createElement('div');
    box.style.cssText = [
      'background:#1a2030','border:1px solid #3a4558','border-radius:10px',
      'width:100%','max-width:380px','padding:16px 14px 14px',
      'color:#e8ecf4','box-sizing:border-box'
    ].join(';');

    const msg = document.createElement('div');
    msg.style.cssText = 'font-size:13px;line-height:1.6;white-space:pre-wrap;margin-bottom:14px;';
    msg.textContent = message;
    box.appendChild(msg);

    const row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:8px;';

    function cleanup(){
      try{ if(ov.parentNode) ov.parentNode.removeChild(ov); }catch(e){}
      try{
        if(!modal && !document.querySelector('.vp-pick-overlay') && !document.querySelector('.confirm-overlay')){
          document.body.classList.remove('modal-open');
          document.body.style.overflow = '';
        }
      }catch(e){}
    }

    const cancelBtn = document.createElement('button');
    cancelBtn.type = 'button';
    cancelBtn.textContent = 'キャンセル';
    cancelBtn.style.cssText = 'flex:1;padding:10px;border-radius:6px;border:1px solid #3a4558;background:transparent;color:#e8ecf4;font-size:14px;';
    const onCancelTap = function(ev){
      try{ if(ev){ ev.preventDefault(); ev.stopPropagation(); } }catch(e){}
      cleanup();
      if(wasRunning && state && !state.gameOver) startTimer();
    };
    cancelBtn.addEventListener('click', onCancelTap);
    cancelBtn.addEventListener('touchend', onCancelTap, {passive:false});

    const okBtn = document.createElement('button');
    okBtn.type = 'button';
    okBtn.textContent = 'OK';
    okBtn.style.cssText = 'flex:1;padding:10px;border-radius:6px;border:none;font-weight:700;font-size:14px;background:#ffb020;color:#111;';
    const onOkTap = function(ev){
      try{ if(ev){ ev.preventDefault(); ev.stopPropagation(); } }catch(e){}
      cleanup();
      try{
        if(typeof onConfirm==='function') onConfirm();
      }catch(e){
        console.error(e);
        // onConfirm内で例外が起きてもタイマーが止まったままにならないようにする
        if(wasRunning && state && !state.gameOver) startTimer();
      }
    };
    okBtn.addEventListener('click', onOkTap);
    okBtn.addEventListener('touchend', onOkTap, {passive:false});

    row.appendChild(cancelBtn);
    row.appendChild(okBtn);
    box.appendChild(row);
    ov.appendChild(box);
    ov.addEventListener('click', function(ev){ if(ev.target===ov){ /* 背景タップでは閉じない（誤操作防止） */ } });
    document.body.appendChild(ov);
    document.body.classList.add('modal-open');
    try{ box.scrollTop = 0; }catch(e){}
  }catch(err){
    console.error(err);
    // オーバーレイ自体の生成に失敗した場合の最終フォールバック。
    // タイマーを必ず元の状態へ戻してから、ネイティブconfirmを試す。
    if(wasRunning && state && !state.gameOver) startTimer();
    try{
      if(window.confirm(message)){ if(typeof onConfirm==='function') onConfirm(); }
    }catch(e){}
  }
}

  try{

      document.body.style.overflow = '';
    }
  }catch(e){}
}

      card.appendChild(title);

      card.appendChild(meta);
      const blurb = document.createElement('div');
      blurb.style.cssText = 'font-size:11px;line-height:1.45;opacity:0.8;margin-bottom:8px;';
      blurb.textContent = st.blurb || '';
      card.appendChild(blurb);
      const btn = document.createElement('button');
      btn.type = 'button';
      const canPay = (state.cash||0) >= VP_APPOINT_COST;
      btn.textContent = canPay ? (c.name+'を任命する') : ('資金不足（必要 '+yen(VP_APPOINT_COST)+'）');
      btn.disabled = !canPay;
      btn.style.cssText = 'width:100%;padding:10px;border-radius:6px;border:none;font-weight:700;font-size:14px;'+(canPay?'background:#ffb020;color:#111;':'background:#333;color:#888;');
      btn.addEventListener('click', function(ev){
        if(ev){ ev.preventDefault(); ev.stopPropagation(); }
        if(!canPay) return;
        removeVpPickOverlay();
        modal = null;
        doAppointVicePresident(c);
      });
      // iOS: touchend でも発火
      btn.addEventListener('touchend', function(ev){
        if(ev){ ev.preventDefault(); }
        if(!canPay) return;
        removeVpPickOverlay();
        modal = null;
        doAppointVicePresident(c);
      }, {passive:false});
      card.appendChild(btn);
      box.appendChild(card);
    });

    const cancel = document.createElement('button');
    cancel.type = 'button';
    cancel.textContent = '閉じる';
    cancel.style.cssText = 'width:100%;padding:10px;margin-top:6px;border-radius:6px;border:1px solid #3a4558;background:transparent;color:#e8ecf4;font-size:14px;';
    function closePick(){
      removeVpPickOverlay();
      state._vpCandidates = null;
      modal = null;
      if(state && !state.gameOver) startTimer();

    // 同上：例外発生時もタイマーを元の状態へ確実に戻す
    if(wasRunning && state && !state.gameOver) startTimer();
  }
}

function buildVpAppointmentModal(s){
  const cands = s._vpCandidates || generateVpCandidates(s);
  s._vpCandidates = cands;
  const lines = cands.map((c,i)=>{
    const st = VP_STYLES[c.style] || VP_STYLES.growth;
    return `${i+1}. ${c.name} — 手腕 ${c.skill}/100・${st.label}\n　${st.blurb}\n　想定年俸 ${yen(c.salary)}`;
  }).join('\n\n');
  const options = cands.map(c=>({
    label:`${c.name}を任命（手腕${c.skill}・${(VP_STYLES[c.style]||VP_STYLES.growth).label}）`,
    onClick:()=>{
      modal = null;
      doAppointVicePresident(c);
    },
  }));
  options.push({label:'今は見送る', onClick:()=>{
    s._vpCandidates=null;
    modal=null;
    if(!s.gameOver) startTimer();
    render();
  }});
  return {
    type:'choice',
    title:'副社長の人選',
    body:`副社長を任命する（費用 ${yen(VP_APPOINT_COST)}／任期5年）。人選によって会社の伸びが大きく変わる。\n\n${lines}\n\n任命後、「経営一任」をオンにすると日常の営業・採用・投資配分を副社長が回し、社長は買収・株主総会・市場分析に集中できる。`,
    options,
  };
}
function buildVpDismissalProposal(s){
  const vp = s.vicePresident;
  if(!vp) return null;
  if(!s.isListed) return null; // 未上場に株主解任決議はない
  const left = vp.expiresTurn!=null ? Math.max(0, vp.expiresTurn - (s.turn||0)) : 0;
  return {
    type:'choice',
    title:'アクティビスト株主からの提案（副社長解任要求）',
    body:`一部株主から、${vp.name}副社長（手腕${Math.round(vp.skill)}／${(VP_STYLES[vp.style]||{}).label||'—'}／任期残約${left}四半期）の解任を求める動議が出された。\n\n解任すれば一任体制は崩れ、後任選びまで日常経営の負荷が社長に戻る。拒否すれば株主との摩擦が残る。`,
    options:[
      {label:'解任要求を受け入れる', onClick:()=>{
        doDismissVicePresident('株主提案');
        state.reputation = clamp(state.reputation-1, 5, 98);
        modal = null; if(!state.gameOver) startTimer(); render();
      }},
      {label:'拒否する', onClick:()=>{
        if(state.psr) state.psr *= 0.96;
        state.reputation = clamp(state.reputation-2, 5, 98);
        if(state.marketTrust!=null) state.marketTrust = clamp(state.marketTrust-2, 5, 98);
        pushLog(state, '副社長解任要求を拒否した。', 'warn');
        modal = null; if(!state.gameOver) startTimer(); render();
      }},
    ]
  };
}
