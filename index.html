<!DOCTYPE html>
<html lang="ja" style="background-color:#12161b;color-scheme:dark;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#12161b">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MARKLEY ELEVATORの野望</title>
<!-- フォント読込前の白フラッシュ防止（クラウド／Files／iOS Safari 向け） -->
<style>html,body{background-color:#12161b!important;color-scheme:dark;margin:0;padding:0;}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --steel-900:#12161b;
    --steel-800:#1b212a;
    --steel-700:#262e39;
    --steel-600:#3a4451;
    --steel-500:#525f6f;
    --paper:#e8e2d0;
    --paper-dim:#c9c2ab;
    --amber:#ffb020;
    --amber-dim:#7a5518;
    --red:#e0524f;
    --red-dim:#5a2523;
    --green:#4fae7d;
    --green-dim:#245038;
    --ink:#181c22;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{
    background:#12161b;
    background-color:#12161b !important;
    color-scheme: dark;
    /* iOS Safari等はバウンス（慣性）スクロール時にhtml要素の背景色が
       一瞬見える。bodyだけでなくhtmlにも同じ背景色を明示しないと、
       そこだけ白（デフォルト）のまま見えてしまう。
       クラウド／Files経由でも白くならないよう hex 直指定 + color-scheme。 */
  }
  body{
    background:#12161b;
    background-color:#12161b !important;
    color:var(--paper);
    color-scheme: dark;
    font-family:'Noto Sans JP',sans-serif;
    min-height:100vh;
    min-height:100dvh;
    min-height:-webkit-fill-available;
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  ::selection{background:var(--amber);color:var(--ink);}
  .mono{font-family:'JetBrains Mono',monospace;}
  .dot{font-family:'DotGothic16',monospace;}

  a,button{font-family:inherit;}
  button{cursor:pointer;}
  input[type=number]{font-family:'JetBrains Mono',monospace;}
  /* iOS／クラウドビューアでフォームが白背景になるのを防ぐ */
  input, textarea, select{
    color-scheme: dark;
    background-color: #12161b;
    color: #e8e2d0;
  }

  /* ===== layout shell ===== */
  #app{
    max-width:1180px;margin:0 auto;padding:14px 16px 60px;
    background-color:#12161b;
    min-height:100vh;
    min-height:100dvh;
  }

  /* ===== header (mobile-first, clear hierarchy) ===== */
  .shaft-header{
    display:flex;
    flex-direction:column;
    gap:10px;
    background:linear-gradient(180deg,var(--steel-800),var(--steel-900));
    border:1px solid var(--steel-600);
    border-radius:8px;
    padding:12px 14px;
    margin-bottom:12px;
    position:relative;
  }
  .header-top{
    display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
  }
  .company-name{
    font-family:'DotGothic16',monospace;
    font-size:18px;
    letter-spacing:0.5px;
    color:var(--amber);
    text-shadow:0 0 8px rgba(255,176,32,.35);
    line-height:1.25;
    word-break:break-all;
  }
  .company-sub{font-size:11px;color:var(--paper-dim);margin-top:4px;line-height:1.4;}
  .status-pill{
    flex:none;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    padding:6px 10px;
    border-radius:999px;
    border:1px solid var(--steel-600);
    background:var(--steel-900);
    color:var(--paper-dim);
    white-space:nowrap;
  }
  .status-pill.run{color:var(--green);border-color:var(--green-dim);}
  .status-pill.pause{color:var(--amber);border-color:var(--amber-dim);}
  .status-pill.over{color:var(--red);border-color:var(--red-dim);}

  .header-meta{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .meta-card{
    background:var(--steel-900);
    border:1px solid var(--steel-700);
    border-radius:6px;
    padding:8px 10px;
  }
  .meta-card .k{font-size:10px;color:var(--paper-dim);margin-bottom:2px;}
  .meta-card .v{
    font-family:'JetBrains Mono',monospace;
    font-size:15px;font-weight:700;color:var(--paper);
  }
  .meta-card .v.amber{color:var(--amber);}

  .header-controls{
    display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  }
  .header-controls .btn-play{
    flex:1 1 auto;
    min-width:120px;
    padding:12px 14px;
    font-size:14px;font-weight:700;
  }
  .header-controls .speed-group{
    display:flex;gap:4px;
  }
  .header-controls .util-group{
    display:flex;gap:4px;flex-wrap:wrap;
    width:100%;
  }
  @media (min-width:720px){
    .company-name{font-size:22px;}
    .header-meta{grid-template-columns:repeat(4,1fr);}
    .header-controls .util-group{width:auto;margin-left:auto;}
  }

  /* legacy names kept so old class refs don't break */
  .shaft-left{min-width:0;}
  .indicator-panel,.quarter-badge,.floor-digits,.floor-label,.shaft-track,.shaft-car{display:none;}
  .toplinks{display:contents;}

  /* ===== kpi strip ===== */
  .kpi-strip{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
    margin-bottom:14px;
  }
  @media (min-width:600px){
    .kpi-strip{grid-template-columns:repeat(4,1fr);}
  }
  @media (min-width:1000px){
    .kpi-strip{grid-template-columns:repeat(4,1fr);}
  }

  .alert-panel{
    background:var(--steel-800);
    border:1px solid var(--steel-700);
    border-radius:6px;
    padding:12px 14px;
    margin-bottom:14px;
  }
  .alert-panel h2{font-size:13px;letter-spacing:1px;color:var(--amber);margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid var(--steel-700);}
  .alert-item{
    display:flex;gap:10px;align-items:flex-start;
    font-size:12px;padding:8px 10px;margin-bottom:6px;
    background:var(--steel-900);border-radius:4px;border-left:3px solid var(--steel-600);
  }
  .alert-item.crit{border-left-color:var(--red);}
  .alert-item.warn{border-left-color:var(--amber);}
  .alert-item.ok{border-left-color:var(--green);}
  .alert-item .sev{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--paper-dim);min-width:42px;}
  .alert-item.info{border-left-color:#5a8fc9;}
  .decision-tray{
    background:var(--steel-800);border:1px solid var(--steel-700);border-radius:8px;
    padding:12px 14px;margin-bottom:12px;
  }
  .decision-tray h2{font-size:13px;letter-spacing:1px;color:var(--amber);margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid var(--steel-700);}
  .decision-tray .tray-section{margin-top:8px;}
  .decision-tray .tray-label{font-size:10px;color:var(--paper-dim);letter-spacing:.5px;margin-bottom:4px;}
  .tab-summary{
    background:linear-gradient(135deg,rgba(40,50,62,.95),rgba(24,30,38,.98));
    border:1px solid var(--steel-700);border-radius:8px;padding:10px 14px;margin-bottom:12px;
    font-size:12px;line-height:1.65;color:var(--paper-dim);
  }
  .tab-summary .sum-title{color:var(--amber);font-weight:700;font-size:11px;letter-spacing:.5px;margin-bottom:4px;}
  .tab-summary .sum-line{margin:2px 0;}
  .tab-summary .sum-line b{color:var(--paper);font-weight:600;}
  .tab-summary .num-pos{color:var(--green);}
  .tab-summary .num-neg{color:var(--red);}
  .quarter-card{
    background:linear-gradient(135deg,rgba(255,176,32,.08),rgba(30,40,50,.95));
    border:1px solid var(--amber-dim);border-radius:8px;padding:12px 14px;margin-bottom:12px;
  }
  .quarter-card h3{margin:0 0 8px;font-size:13px;color:var(--amber);letter-spacing:.5px;}
  .quarter-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 12px;font-size:12px;}
  @media(min-width:700px){ .quarter-grid{grid-template-columns:repeat(4,1fr);} }
  .quarter-grid .qg-k{color:var(--paper-dim);font-size:10px;}
  .quarter-grid .qg-v{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--paper);}
  .panel details.panel-fold{margin:0;}
  .panel details.panel-fold > summary{
    cursor:pointer;list-style:none;font-size:13px;letter-spacing:1px;color:var(--amber);
    padding-bottom:8px;border-bottom:1px solid var(--steel-700);margin-bottom:10px;
  }
  .panel details.panel-fold > summary::-webkit-details-marker{display:none;}
  .panel details.panel-fold > summary::after{content:' ▼';font-size:9px;opacity:.6;}
  .panel details.panel-fold[open] > summary::after{content:' ▲';}

  .plan-bar{height:6px;background:var(--steel-900);border-radius:3px;overflow:hidden;margin-top:4px;}
  .plan-bar > div{height:100%;background:var(--amber);border-radius:3px;transition:width .4s;}

  .kpi{
    background:var(--steel-800);
    border:1px solid var(--steel-700);
    border-radius:6px;
    padding:10px 12px;
  }
  .kpi-label{font-size:10px;color:var(--paper-dim);letter-spacing:.5px;margin-bottom:4px;}
  .kpi-value{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;color:var(--paper);}
  .kpi-value.up{color:var(--green);}
  .kpi-value.down{color:var(--red);}
  .kpi-sub{font-size:10px;color:var(--paper-dim);margin-top:2px;}

  /* kpi responsive handled above */

  /* ===== main grid ===== */
  .main-grid{
    display:grid;
    grid-template-columns:1.15fr .85fr;
    gap:14px;
    align-items:start;
  }
  @media (max-width:860px){
    .main-grid{grid-template-columns:1fr;}
  }

  .panel{
    background:var(--steel-800);
    border:1px solid var(--steel-700);
    border-radius:6px;
    padding:16px;
    margin-bottom:14px;
  }
  .panel h2{
    font-size:13px;letter-spacing:1px;color:var(--amber);
    margin:0 0 12px;padding-bottom:8px;
    border-bottom:1px solid var(--steel-700);
    display:flex;align-items:center;justify-content:space-between;
  }
  .panel h2 .eyebrow{font-size:10px;color:var(--paper-dim);letter-spacing:.5px;}

  .field-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .field-row label{flex:0 0 132px;font-size:12px;color:var(--paper-dim);}
  .field-row input[type=number]{
    flex:1;background:var(--steel-900);border:1px solid var(--steel-600);
    color:var(--paper);border-radius:4px;padding:7px 9px;font-size:13px;width:100%;
  }
  .field-row .unit{font-size:11px;color:var(--paper-dim);width:34px;}
  .field-hint{font-size:10px;color:var(--steel-500);margin:-6px 0 10px 142px;}

  .btn{
    background:var(--steel-700);border:1px solid var(--steel-600);
    color:var(--paper);border-radius:4px;padding:9px 14px;
    font-size:13px;font-weight:500;transition:.15s;
  }
  .btn:hover{background:var(--steel-600);}
  .btn:disabled{opacity:.35;cursor:not-allowed;}
  .btn-primary{background:var(--amber);color:var(--ink);border-color:var(--amber);font-weight:700;}
  .btn-primary:hover{background:#ffc04d;}
  .btn-primary:disabled{background:var(--amber-dim);color:var(--paper-dim);border-color:var(--amber-dim);}
  .btn-danger{background:var(--red-dim);border-color:var(--red);}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
  .btn-small{padding:6px 10px;font-size:11px;}
  .btn-full{width:100%;padding:12px;font-size:14px;margin-top:6px;}

  .action-block{
    border:1px dashed var(--steel-600);border-radius:5px;
    padding:10px 12px;margin-top:10px;
   }
  .action-block .title{font-size:11px;color:var(--amber);letter-spacing:.5px;margin-bottom:6px;}
  .action-block .desc{font-size:11px;color:var(--paper-dim);margin-bottom:8px;line-height:1.5;}

  /* market share bars */
  .share-row{margin-bottom:10px;}
  .share-row .top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;}
  .share-row .top .name{color:var(--paper);}
  .share-row .top .name.me{color:var(--amber);font-weight:700;}
  .share-row .top .pct{font-family:'JetBrains Mono',monospace;color:var(--paper-dim);}
  .bar-track{height:8px;background:var(--steel-900);border-radius:4px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:4px;transition:width .5s ease;}

  /* financial statement */
  table.kessan{width:100%;border-collapse:collapse;font-size:12px;}
  table.kessan th,table.kessan td{
    padding:6px 8px;text-align:right;border-bottom:1px solid var(--steel-700);
    font-family:'JetBrains Mono',monospace;
  }
  table.kessan th:first-child,table.kessan td:first-child{text-align:left;font-family:'Noto Sans JP',sans-serif;color:var(--paper-dim);}
  table.kessan th{color:var(--paper-dim);font-weight:500;font-size:11px;}
  table.kessan td.pos{color:var(--green);}
  table.kessan td.neg{color:var(--red);}
  .paper-strip{
    background:var(--paper);color:var(--ink);border-radius:5px;padding:12px 14px;margin-top:10px;
  }
  .paper-strip .stitle{font-size:11px;letter-spacing:.5px;color:var(--steel-700);margin-bottom:8px;font-weight:700;}
  .paper-strip table.kessan td,.paper-strip table.kessan th{border-bottom:1px solid var(--paper-dim);}
  .paper-strip table.kessan td:first-child{color:#555;}
  .paper-strip table.kessan td.pos{color:#1c7a4d;}
  .paper-strip table.kessan td.neg{color:#b3312e;}

  /* event log */
  .log{max-height:230px;overflow-y:auto;padding-right:4px;}
  .log-entry{
    font-size:12px;padding:8px 10px;border-radius:4px;margin-bottom:6px;
    background:var(--steel-900);border-left:3px solid var(--steel-600);
  }
  .log-entry.warn{border-left-color:var(--red);}
  .log-entry.good{border-left-color:var(--green);}
  .log-entry .qtag{color:var(--paper-dim);font-family:'JetBrains Mono',monospace;font-size:10px;margin-right:6px;}

  /* 常時表示イベントティッカー */
  .event-ticker{
    position:fixed; left:0; right:0; bottom:0; z-index:40;
    height:36px;
    background:linear-gradient(180deg, rgba(18,22,28,.92), rgba(12,14,18,.97));
    border-top:1px solid var(--steel-600);
    box-shadow: 0 -4px 20px rgba(0,0,0,.35);
    display:flex; align-items:center;
    overflow:hidden;
    pointer-events:none;
  }
  .event-ticker .ticker-label{
    flex:0 0 auto;
    padding:0 10px;
    font-size:10px; font-weight:700; letter-spacing:0.08em;
    color:var(--amber);
    border-right:1px solid var(--steel-600);
    height:100%; display:flex; align-items:center;
    background:rgba(255,176,32,.08);
    pointer-events:none;
  }
  .event-ticker .ticker-speed{
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    padding:0 8px;
    border-right:1px solid var(--steel-600);
    height:100%;
    pointer-events:auto;
    gap:4px;
  }
  .event-ticker .ticker-knob-wrap{
    position:relative;
    width:28px; height:28px;
    flex-shrink:0;
  }
  .event-ticker .ticker-knob{
    width:28px; height:28px; border-radius:50%;
    background: conic-gradient(var(--amber) var(--knob-ang, 90deg), var(--steel-600) 0);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow: inset 0 0 0 2px var(--steel-800), 0 1px 3px rgba(0,0,0,.4);
    touch-action:none;
    user-select:none; -webkit-user-select:none;
  }
  .event-ticker .ticker-knob-inner{
    width:18px; height:18px; border-radius:50%;
    background:var(--steel-800);
    display:flex; align-items:center; justify-content:center;
    font-size:8px; font-weight:700; color:var(--amber);
    line-height:1;
    pointer-events:none;
  }
  .event-ticker .ticker-knob-hint{
    font-size:8px; color:var(--paper-dim); letter-spacing:0;
    line-height:1; white-space:nowrap;
  }
  .event-ticker .ticker-track{
    flex:1; overflow:hidden; height:100%;
    mask-image: linear-gradient(90deg, transparent, #000 3%, #000 97%, transparent);
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 3%, #000 97%, transparent);
  }
  .event-ticker .ticker-move{
    display:inline-flex; align-items:center; gap:28px;
    height:100%; white-space:nowrap;
    padding-left:100%;
    animation: tickerScroll 90s linear infinite;
  }
  .event-ticker .ticker-move:hover{
    animation-play-state: paused;
  }
  .event-ticker .ticker-item{
    display:inline-flex; align-items:center; gap:8px;
    font-size:12px; color:var(--paper);
    pointer-events:auto;
  }
  .event-ticker .ticker-item .tq{
    color:var(--paper-dim); font-size:10px;
    padding:1px 5px; border-radius:3px;
    background:rgba(255,255,255,.06);
  }
  .event-ticker .ticker-item.warn{ color:#f0a8a8; }
  .event-ticker .ticker-item.good{ color:#a8e0b8; }
  .event-ticker .ticker-item.warn .tq{ background:rgba(200,60,60,.25); color:#f0c0c0; }
  .event-ticker .ticker-item.good .tq{ background:rgba(60,140,80,.25); color:#c0f0d0; }
  .event-ticker .ticker-empty{
    font-size:12px; color:var(--paper-dim); padding-left:12px;
  }
  @keyframes tickerScroll{
    0%{ transform: translateX(0); }
    100%{ transform: translateX(-100%); }
  }
  /* ティッカー分の余白 */
  body.has-ticker #app{
    padding-bottom: 44px;
  }
  @media (prefers-reduced-motion: reduce){
    .event-ticker .ticker-move{
      animation: none;
      padding-left: 12px;
      flex-wrap: nowrap;
      overflow-x: auto;
    }
  }


  /* modal */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(10,12,15,.82);
    display:flex;align-items:center;justify-content:center;z-index:10000;padding:20px;
    animation: modalOverlayIn .28s ease-out both;
    overflow-y:auto;-webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
  }
  .modal{
    background:var(--steel-800);border:1px solid var(--steel-600);border-radius:8px;
    max-width:480px;width:100%;padding:22px;
    max-height:min(90vh, 720px); overflow-y:auto;
    position:relative; z-index:10001;
    animation: modalPop .42s cubic-bezier(.22,1.4,.36,1) both;
    transform-origin: center center;
    box-shadow: 0 12px 40px rgba(0,0,0,.45);
    margin:auto 0; /* 短い内容は上下中央寄せ、長い内容は上からスクロール */
    max-height:none;
  }
  body.modal-open{
    overflow:hidden !important;
    position:relative;
  }
  body.modal-open #app{
    /* 背景への誤タップ・誤スクロールを防ぐ */
    pointer-events:none;
  }
  body:not(.modal-open){
    overflow:auto !important;
  }
  body:not(.modal-open) #app{
    pointer-events:auto !important;
  }
  body.modal-open .modal-overlay{
    pointer-events:auto;
  }
  .modal h3{margin:0 0 10px;color:var(--amber);font-size:16px;}
  .modal p{font-size:13px;line-height:1.7;color:var(--paper);margin:0 0 14px;white-space:pre-line;}
  .modal.victory{
    border-color:var(--amber);
    box-shadow: 0 0 0 1px rgba(232,185,74,.35), 0 16px 48px rgba(232,185,74,.25), 0 0 60px rgba(232,185,74,.12);
    animation: modalPopVictory .7s cubic-bezier(.22,1.5,.36,1) both;
  }
  .modal.victory h3{font-size:20px; animation: titleGlow 1.6s ease-in-out infinite alternate;}
  .modal.over{
    border-color:var(--red);
    box-shadow: 0 0 0 1px rgba(220,80,80,.4), 0 16px 48px rgba(180,40,40,.3);
    animation: modalShakeIn .55s cubic-bezier(.36,.07,.19,.97) both;
  }
  .modal.retire{
    border-color:#6bcb8a;
    box-shadow: 0 0 0 1px rgba(107,203,138,.35), 0 16px 48px rgba(60,140,90,.25);
    animation: modalPopVictory .65s cubic-bezier(.22,1.5,.36,1) both;
  }
  .modal.event-critical{
    border-color:var(--amber);
    animation: modalPopBig .5s cubic-bezier(.22,1.45,.36,1) both;
  }
  .modal.event-warn{
    border-color:#e8a05c;
    animation: modalPopWarn .48s cubic-bezier(.22,1.3,.36,1) both;
  }
  .modal.event-good{
    border-color:#6bcb8a;
    animation: modalPop .45s cubic-bezier(.22,1.4,.36,1) both;
  }

  @keyframes modalOverlayIn{
    from{ opacity:0; }
    to{ opacity:1; }
  }
  @keyframes modalPop{
    0%{ opacity:0; transform: scale(.86) translateY(18px); }
    70%{ opacity:1; transform: scale(1.03) translateY(-2px); }
    100%{ opacity:1; transform: scale(1) translateY(0); }
  }
  @keyframes modalPopBig{
    0%{ opacity:0; transform: scale(.7) translateY(28px); filter:blur(2px); }
    60%{ opacity:1; transform: scale(1.06) translateY(-4px); filter:blur(0); }
    100%{ opacity:1; transform: scale(1) translateY(0); }
  }
  @keyframes modalPopVictory{
    0%{ opacity:0; transform: scale(.55) rotate(-2deg); filter:brightness(1.4); }
    55%{ opacity:1; transform: scale(1.08) rotate(1deg); }
    75%{ transform: scale(.98) rotate(-.5deg); }
    100%{ opacity:1; transform: scale(1) rotate(0); filter:brightness(1); }
  }
  @keyframes modalShakeIn{
    0%{ opacity:0; transform: scale(.9) translateX(0); }
    20%{ opacity:1; transform: scale(1.04) translateX(-10px); }
    40%{ transform: scale(1.02) translateX(10px); }
    55%{ transform: scale(1.01) translateX(-6px); }
    70%{ transform: translateX(4px); }
    100%{ transform: scale(1) translateX(0); }
  }
  @keyframes modalPopWarn{
    0%{ opacity:0; transform: scale(.8) translateY(-12px); }
    50%{ transform: scale(1.05) translateY(2px); }
    100%{ opacity:1; transform: scale(1) translateY(0); }
  }
  @keyframes titleGlow{
    from{ text-shadow: 0 0 4px rgba(232,185,74,.3); }
    to{ text-shadow: 0 0 14px rgba(232,185,74,.85), 0 0 28px rgba(232,185,74,.35); }
  }
  /* 重要イベント時の背景パルス */
  .modal-overlay.critical-bg{
    animation: modalOverlayIn .28s ease-out both, criticalPulse 2.4s ease-in-out infinite;
  }
  @keyframes criticalPulse{
    0%,100%{ background:rgba(10,12,15,.82); }
    50%{ background:rgba(30,18,8,.88); }
  }
  .modal-overlay.danger-bg{
    animation: modalOverlayIn .28s ease-out both, dangerPulse 1.8s ease-in-out infinite;
  }
  @keyframes dangerPulse{
    0%,100%{ background:rgba(10,12,15,.82); }
    50%{ background:rgba(40,10,12,.9); }
  }
  .modal-overlay.victory-bg{
    animation: modalOverlayIn .28s ease-out both, victoryPulse 2.2s ease-in-out infinite;
  }
  @keyframes victoryPulse{
    0%,100%{ background:rgba(10,12,15,.82); }
    50%{ background:rgba(28,24,8,.9); }
  }

  /* ボタンも少し遅れて出現 */
  .modal .btn{
    animation: btnFadeUp .35s ease-out both;
    animation-delay: .18s;
  }
  .modal .btn:nth-of-type(2){ animation-delay: .26s; }
  .modal .btn:nth-of-type(3){ animation-delay: .32s; }
  .modal .btn:nth-of-type(4){ animation-delay: .38s; }
  @keyframes btnFadeUp{
    from{ opacity:0; transform: translateY(8px); }
    to{ opacity:1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    .modal-overlay, .modal, .modal.victory, .modal.over, .modal.retire,
    .modal.event-critical, .modal.event-warn, .modal.event-good,
    .modal h3, .modal .btn{
      animation: none !important;
    }
    .person-stage, .person, .person *{
      animation: none !important;
    }
  }

  /* ========== 人物アニメ ========== */
  .person-stage{
    display:flex; align-items:flex-end; justify-content:center;
    gap:10px; height:72px; margin:8px 0 4px; pointer-events:none;
    overflow:hidden;
  }
  .person-stage.sm{ height:48px; gap:6px; }
  .person-stage.lg{ height:96px; gap:14px; }
  .person-stage.header-stage{
    height:40px; margin:0 8px 0 0; flex-shrink:0;
  }
  .person{
    position:relative; width:28px; height:56px;
    transform-origin: 50% 100%;
  }
  .person-stage.sm .person{ width:20px; height:40px; }
  .person-stage.lg .person{ width:36px; height:72px; }
  .person-stage.header-stage .person{ width:18px; height:36px; }

  .person .p-head{
    position:absolute; left:50%; top:0; width:12px; height:12px;
    margin-left:-6px; border-radius:50%;
    background:#e8d5b0; border:1px solid rgba(0,0,0,.15);
  }
  .person-stage.sm .person .p-head{ width:9px; height:9px; margin-left:-4.5px; }
  .person-stage.header-stage .person .p-head{ width:8px; height:8px; margin-left:-4px; }
  .person .p-body{
    position:absolute; left:50%; top:12px; width:14px; height:18px;
    margin-left:-7px; border-radius:4px 4px 3px 3px;
    background:var(--steel-500, #5a6a7a);
  }
  .person-stage.sm .person .p-body{ top:9px; width:11px; height:13px; margin-left:-5.5px; }
  .person-stage.header-stage .person .p-body{ top:8px; width:10px; height:12px; margin-left:-5px; }
  .person .p-arm-l, .person .p-arm-r{
    position:absolute; top:13px; width:4px; height:12px; border-radius:2px;
    background:var(--steel-400, #6a7a8a); transform-origin: top center;
  }
  .person .p-arm-l{ left:2px; }
  .person .p-arm-r{ right:2px; }
  .person-stage.sm .person .p-arm-l, .person-stage.sm .person .p-arm-r{ top:10px; height:9px; width:3px; }
  .person-stage.header-stage .person .p-arm-l,
  .person-stage.header-stage .person .p-arm-r{ top:9px; height:8px; width:3px; }
  .person .p-leg-l, .person .p-leg-r{
    position:absolute; bottom:0; width:5px; height:14px; border-radius:2px;
    background:#3a4550; transform-origin: top center;
  }
  .person .p-leg-l{ left:6px; }
  .person .p-leg-r{ right:6px; }
  .person-stage.sm .person .p-leg-l, .person-stage.sm .person .p-leg-r{ height:10px; width:4px; }
  .person-stage.sm .person .p-leg-l{ left:4px; }
  .person-stage.sm .person .p-leg-r{ right:4px; }
  .person-stage.header-stage .person .p-leg-l,
  .person-stage.header-stage .person .p-leg-r{ height:9px; width:3px; }
  .person-stage.header-stage .person .p-leg-l{ left:4px; }
  .person-stage.header-stage .person .p-leg-r{ right:4px; }

  /* 職種別カラー */
  .person.tech .p-body{ background:#3d7ea6; }
  .person.tech .p-arm-l, .person.tech .p-arm-r{ background:#2f6a8c; }
  .person.sales .p-body{ background:#c4a035; }
  .person.sales .p-arm-l, .person.sales .p-arm-r{ background:#a88828; }
  .person.admin .p-body{ background:#6b7c8f; }
  .person.ceo .p-body{ background:#2c3e50; }
  .person.ceo .p-head{ background:#d4b896; }
  .person.inspector .p-body{ background:#5b8c5a; }
  .person.inspector .p-arm-l, .person.inspector .p-arm-r{ background:#4a7549; }

  /* ヘルメット */
  .person.tech .p-head::after,
  .person.inspector .p-head::after{
    content:''; position:absolute; left:-2px; top:-4px; width:16px; height:6px;
    background:#f0c040; border-radius:6px 6px 1px 1px;
    box-shadow: inset 0 -1px 0 rgba(0,0,0,.15);
  }
  .person-stage.sm .person.tech .p-head::after,
  .person-stage.sm .person.inspector .p-head::after{ left:-1px; top:-3px; width:11px; height:4px; }
  .person-stage.header-stage .person.tech .p-head::after,
  .person-stage.header-stage .person.inspector .p-head::after{ left:-1px; top:-3px; width:10px; height:4px; }
  .person.inspector .p-head::after{ background:#4caf70; }

  /* ツール（レンチ） */
  .person .p-tool{
    position:absolute; right:-2px; top:18px; width:10px; height:3px;
    background:#c0c8d0; border-radius:1px;
    transform-origin: left center;
  }
  .person-stage.sm .person .p-tool{ top:13px; width:8px; }
  .person-stage.header-stage .person .p-tool{ top:12px; width:7px; height:2px; }

  /* --- アニメーション種類 --- */
  .person.idle{
    animation: personBob 2.4s ease-in-out infinite;
  }
  .person.walk{
    animation: personBob 0.7s ease-in-out infinite;
  }
  .person.walk .p-leg-l{ animation: legL 0.7s ease-in-out infinite; }
  .person.walk .p-leg-r{ animation: legR 0.7s ease-in-out infinite; }
  .person.walk .p-arm-l{ animation: armL 0.7s ease-in-out infinite; }
  .person.walk .p-arm-r{ animation: armR 0.7s ease-in-out infinite; }

  .person.repair .p-arm-r{ animation: repairArm 0.55s ease-in-out infinite; }
  .person.repair .p-tool{ animation: repairTool 0.55s ease-in-out infinite; }
  .person.repair{ animation: personBob 1.6s ease-in-out infinite; }

  .person.cheer{
    animation: cheerJump 0.7s ease-in-out infinite;
  }
  .person.cheer .p-arm-l, .person.cheer .p-arm-r{
    animation: armsUp 0.7s ease-in-out infinite;
  }

  .person.panic{
    animation: panicShake 0.35s ease-in-out infinite;
  }
  .person.panic .p-arm-l, .person.panic .p-arm-r{
    animation: armsUp 0.35s ease-in-out infinite;
  }

  .person.wave .p-arm-r{
    animation: waveArm 0.8s ease-in-out infinite;
    transform-origin: top center;
  }

  .person.phone .p-arm-r{
    transform: rotate(-120deg);
  }
  .person.phone::after{
    content:''; position:absolute; right:0; top:10px; width:5px; height:8px;
    background:#222; border-radius:1px; border:1px solid #888;
  }

  @keyframes personBob{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(-2px); }
  }
  @keyframes legL{
    0%,100%{ transform: rotate(18deg); }
    50%{ transform: rotate(-18deg); }
  }
  @keyframes legR{
    0%,100%{ transform: rotate(-18deg); }
    50%{ transform: rotate(18deg); }
  }
  @keyframes armL{
    0%,100%{ transform: rotate(-16deg); }
    50%{ transform: rotate(16deg); }
  }
  @keyframes armR{
    0%,100%{ transform: rotate(16deg); }
    50%{ transform: rotate(-16deg); }
  }
  @keyframes repairArm{
    0%,100%{ transform: rotate(20deg); }
    50%{ transform: rotate(-50deg); }
  }
  @keyframes repairTool{
    0%,100%{ transform: rotate(10deg); }
    50%{ transform: rotate(-40deg); }
  }
  @keyframes cheerJump{
    0%,100%{ transform: translateY(0); }
    40%{ transform: translateY(-10px); }
    60%{ transform: translateY(-8px); }
  }
  @keyframes armsUp{
    0%,100%{ transform: rotate(-150deg); }
    50%{ transform: rotate(-170deg); }
  }
  @keyframes panicShake{
    0%,100%{ transform: translateX(0) rotate(0); }
    25%{ transform: translateX(-3px) rotate(-4deg); }
    75%{ transform: translateX(3px) rotate(4deg); }
  }
  @keyframes waveArm{
    0%,100%{ transform: rotate(-20deg); }
    50%{ transform: rotate(-100deg); }
  }

  /* ステージ全体の横断移動（タイトル用） */
  .person-stage.parade .person{
    animation: paradeWalk 6s linear infinite;
  }
  .person-stage.parade .person:nth-child(2){ animation-delay: -2s; }
  .person-stage.parade .person:nth-child(3){ animation-delay: -4s; }
  @keyframes paradeWalk{
    0%{ transform: translateX(-80px); }
    100%{ transform: translateX(80px); }
  }

  /* エレベーターシャフト風背景（タイトル） */
  .person-stage.shaft-bg{
    background: linear-gradient(90deg, transparent, rgba(255,176,32,.06), transparent);
    border-radius: 8px;
    position: relative;
  }
  .person-stage.shaft-bg::before{
    content:''; position:absolute; left:50%; top:0; bottom:0; width:2px;
    background: repeating-linear-gradient(to bottom, var(--amber), var(--amber) 4px, transparent 4px, transparent 10px);
    opacity:.35; transform:translateX(-50%);
  }

  @media (prefers-reduced-motion: reduce){
    .person.idle, .person.walk, .person.repair, .person.cheer, .person.panic, .person.wave,
    .person.walk .p-leg-l, .person.walk .p-leg-r, .person.walk .p-arm-l, .person.walk .p-arm-r,
    .person.repair .p-arm-r, .person.repair .p-tool,
    .person.cheer .p-arm-l, .person.cheer .p-arm-r,
    .person.panic .p-arm-l, .person.panic .p-arm-r,
    .person.wave .p-arm-r,
    .person-stage.parade .person{
      animation: none !important;
    }
  }

  .toplinks{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end;}

  .tab-bar{
    display:flex;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;
    margin-bottom:14px;padding-bottom:2px;
  }
  .tab-btn{
    flex:1 0 auto;white-space:nowrap;
    background:var(--steel-800);border:1px solid var(--steel-700);color:var(--paper-dim);
    border-radius:6px;padding:10px 14px;font-size:13px;font-weight:500;
  }
  .tab-btn.active{
    background:var(--amber);color:var(--ink);border-color:var(--amber);font-weight:700;
  }

  select{
    background:var(--steel-900);border:1px solid var(--steel-600);color:var(--paper);

  .mand-a-card{

  /* ===== 組織図 ===== */

/* ============================================================
   グローバルエラー捕捉：モバイルでは開発者コンソールを見られないため、
   捕捉されなかった例外・Promise rejection は画面上のバナーに出す。
   ============================================================ */
window.addEventListener('error', function(ev){
  try{
    const msg = (ev && ev.message) ? ev.message : 'unknown error';
    const detail = (ev && ev.filename) ? ` (${ev.filename}:${ev.lineno||'?'}:${ev.colno||'?'})` : '';
    if(typeof showErrorBanner==='function') showErrorBanner(msg+detail);
    if(typeof state!=='undefined' && state && !state.gameOver && typeof startTimer==='function') startTimer();
  }catch(e){}
});
window.addEventListener('unhandledrejection', function(ev){
  try{
    const reason = ev && ev.reason;
    const msg = (reason && reason.message) ? reason.message : String(reason);
    if(typeof showErrorBanner==='function') showErrorBanner('未処理のPromiseエラー: '+msg);
    if(typeof state!=='undefined' && state && !state.gameOver && typeof startTimer==='function') startTimer();
  }catch(e){}
});

/* ============================================================
   ストレージ（window.storage が無い環境では localStorage にフォールバック）
   ============================================================ */
const StorageAPI = {
  // チャット埋め込みの window.storage はセッション限定のことがあるため、
  // 永続化の本命は常に localStorage。両方に書いて読める方を使う。
  async get(key, _flag){
    // 1) localStorage 優先
    try{
      const raw = localStorage.getItem(key);
      if(raw != null) return { value: raw };
    }catch(e){}
    // 2) ホスト storage フォールバック
    try{
      if(window.storage && typeof window.storage.get === 'function'){
        const res = await window.storage.get(key, _flag);
        if(res && res.value != null) return res;
      }
    }catch(e){}
    return null;
  },
  async set(key, value, _flag){
    let ok = false;
    try{
      localStorage.setItem(key, value);
      // 書き込み検証
      if(localStorage.getItem(key) === value) ok = true;
    }catch(e){ ok = false; }
    try{
      if(window.storage && typeof window.storage.set === 'function'){
        await window.storage.set(key, value, _flag);
      }
    }catch(e){}
    return ok;
  },
  async remove(key){
    try{ localStorage.removeItem(key); }catch(e){}
    try{
      if(window.storage && typeof window.storage.remove === 'function'){
        await window.storage.remove(key);
      }
    }catch(e){}
    return true;
  },
  /** localStorage が使えるか簡易チェック */
  canPersist(){
    try{
      const k = '__mercury_probe__';
      localStorage.setItem(k, '1');
      const ok = localStorage.getItem(k) === '1';
      localStorage.removeItem(k);
      return ok;
    }catch(e){ return false; }
  }
};

/* セーブスロット（0=オートセーブ, 1〜3=手動） */
const SAVE_SLOT_COUNT = 3;
const SAVE_KEY_PREFIX = 'mercury-save-slot-';
const SAVE_META_KEY = 'mercury-save-meta';
const SAVE_LEGACY_KEY = 'mercury-save'; // 旧単一セーブ互換

function saveSlotKey(slot){ return SAVE_KEY_PREFIX + String(slot); }

function buildSaveMeta(s){
  if(!s) return null;
  return {
    companyName: s.companyName || '',
    difficulty: s.difficulty || 'normal',
    year: s.year, quarter: s.quarter, turn: s.turn,
    units: s.units, cash: s.cash, techs: s.techs,
    isListed: !!s.isListed, gameOver: !!s.gameOver,
    savedAt: Date.now(),
  };
}

async function readSaveMetaAll(){
  try{
    const res = await StorageAPI.get(SAVE_META_KEY, false);
    if(res && res.value){
      const m = JSON.parse(res.value);
      if(m && typeof m === 'object') return m;
    }
  }catch(e){}
  return {};
}

async function writeSaveMetaAll(meta){
  try{
    await StorageAPI.set(SAVE_META_KEY, JSON.stringify(meta), false);
  }catch(e){}
}

async function writeSaveToSlot(slot, st, offers){
  const payload = JSON.stringify({
    version: 2,
    state: st,
    mandaOffers: offers || [],
    meta: buildSaveMeta(st),
  });
  const ok = await StorageAPI.set(saveSlotKey(slot), payload, false);
  if(ok){
    const all = await readSaveMetaAll();
    all[String(slot)] = buildSaveMeta(st);
    await writeSaveMetaAll(all);
  }
  return ok;
}

async function readSaveFromSlot(slot){
  try{
    let res = await StorageAPI.get(saveSlotKey(slot), false);
    // スロット1が空なら旧キーを互換読込
    if((!res || !res.value) && slot === 1){
      res = await StorageAPI.get(SAVE_LEGACY_KEY, false);
    }
    if(!res || !res.value) return null;
    const parsed = JSON.parse(res.value);
    if(!parsed || !parsed.state) return null;
    return parsed;
  }catch(e){ return null; }
}

async function deleteSaveSlot(slot){
  await StorageAPI.remove(saveSlotKey(slot));
  const all = await readSaveMetaAll();
  delete all[String(slot)];
  await writeSaveMetaAll(all);
  // 旧キーもスロット1削除時に消す
  if(slot === 1) await StorageAPI.remove(SAVE_LEGACY_KEY);
}

function formatSaveMetaLine(meta){
  if(!meta) return '（空）';
  const d = meta.savedAt ? new Date(meta.savedAt) : null;
  const when = d ? `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}` : '—';
  const diff = (DIFFICULTIES[meta.difficulty]||{}).label || meta.difficulty || '';
  const cash = typeof yen==='function' ? yen(meta.cash||0) : (meta.cash||0);
  return `${meta.companyName||'無題'}  ${meta.year||'?'}年Q${meta.quarter||'?'}  ${num(meta.units||0)}台  現金${cash}  ${diff}  [${when}]`;
}

function regionPersonality(rid){
  const rg = REGIONS.find(r=>r.id===rid);
  if(!rg) return {labor:1, price:1, competition:1, referral:1, win:1, blurb:''};
  return {
    labor: rg.labor!=null?rg.labor:1,
    price: rg.price!=null?rg.price:1,
    competition: rg.competition!=null?rg.competition:1,
    referral: rg.referral!=null?rg.referral:1,
    win: rg.win!=null?rg.win:1,
    blurb: rg.blurb||'',
  };
}
function regionAvgPersonality(s){
  // 自社台数加重の平均特性
  let w=0, labor=0, price=0, comp=0, ref=0, win=0;
  REGIONS.forEach(rg=>{
    const u = (s.regionUnits&&s.regionUnits[rg.id])||0;
    if(u<=0) return;
    const p = regionPersonality(rg.id);
    labor += p.labor*u; price += p.price*u; comp += p.competition*u;
    ref += p.referral*u; win += p.win*u; w += u;
  });
  if(w<=0) return regionPersonality('kanto');
  return {labor:labor/w, price:price/w, competition:comp/w, referral:ref/w, win:win/w, blurb:''};
}

function genRivalShareholders(){
  const founderPct = 0.15 + Math.random()*0.32;
  const esopPct = 0.02 + Math.random()*0.06;
  const bankPct = 0.04 + Math.random()*0.12;
  const instPct = Math.max(0, 0.12 + Math.random()*0.22);
  let retailPct = 1 - founderPct - esopPct - bankPct - instPct;
  if(retailPct < 0.05){
    retailPct = 0.05;
  }
  // 正規化
  const raw = [founderPct, esopPct, bankPct, instPct, retailPct];
  const sum = raw.reduce((a,b)=>a+b,0);
  const n = raw.map(x=>x/sum);
  return [
    {name:'創業家', pct:n[0]},
    {name:'従業員持株会', pct:n[1]},
    {name:'メインバンク', pct:n[2]},
    {name:'機関投資家', pct:n[3]},
    {name:'個人株主・その他', pct:n[4]},
  ];
}

  return table[name];
}

let bgmTrackIndex = 0; // デフォルトは億万長者の道
function bgmCurrentScore(){
  const t = BGM_TRACKS[bgmTrackIndex % BGM_TRACKS.length];
  return t ? t.bars : BGM_TRACKS[0].bars;
}
function bgmCurrentName(){
  const t = BGM_TRACKS[bgmTrackIndex % BGM_TRACKS.length];
  return t ? t.name : '';
}

function ensureAudio(){
  if(!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
    bgmMaster = audioCtx.createGain();
    bgmMaster.gain.value = 1;
    bgmMaster.connect(audioCtx.destination);
  }
  if(!bgmHooked){
    bgmHooked = true;
    const kick = ()=>{
      if(!audioCtx) return;
      if(audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
      if(bgmOn) bgmFillSchedule();
    };
    document.addEventListener('visibilitychange', kick);
    window.addEventListener('focus', kick);
  }
}

/**
 * BGMバスを作り直す。既にスケジュールされた音は古いバスに繋がったまま無音化され、
 * 新しいバスだけが出力される（曲切替時の音の重なり防止）。
 */
function bgmResetBus(fadeIn){
  ensureAudio();
  if(bgmTimerId){ clearInterval(bgmTimerId); bgmTimerId = null; }
  try{
    if(bgmMaster){
      bgmMaster.gain.cancelScheduledValues(audioCtx.currentTime);
      bgmMaster.gain.value = 0;
      bgmMaster.disconnect();
    }
  }catch(_e){}
  bgmMaster = audioCtx.createGain();
  bgmMaster.gain.value = fadeIn ? 0.001 : 1;
  bgmMaster.connect(audioCtx.destination);
  if(fadeIn){
    const t = audioCtx.currentTime;
    bgmMaster.gain.setValueAtTime(0.001, t);
    bgmMaster.gain.linearRampToValueAtTime(1, t + 0.2);
  }
  bgmBarIndex = 0;
  bgmNextTime = audioCtx.currentTime + 0.05;
}

/** 木琴1音：基音+倍音、短い減衰 */
function bgmXylo(freq, when, vol, sustainSec){
  if(!audioCtx || !bgmMaster || !freq) return;
  const dur = sustainSec || 0.55;
  const partials = [
    { f: freq,       a: 1.0,  type: 'sine' },
    { f: freq * 3.0, a: 0.28, type: 'sine' },
    { f: freq * 5.1, a: 0.08, type: 'triangle' },
  ];
  partials.forEach(p=>{
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = p.type;
    osc.frequency.value = p.f;
    const peak = Math.max(0.0001, vol * p.a);
    g.gain.setValueAtTime(0.0001, when);
    g.gain.linearRampToValueAtTime(peak, when + 0.008);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0001, peak * 0.22), when + 0.11);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    osc.connect(g);
    g.connect(bgmMaster);
    osc.start(when);
    osc.stop(when + dur + 0.03);
  });
}

/** 鉄琴（グロッケン）: より高く・硬く・キラッと短く */
function bgmGlock(freq, when, vol, sustainSec){
  if(!audioCtx || !bgmMaster || !freq) return;
  const dur = sustainSec || 0.7;
  const partials = [
    { f: freq,       a: 1.0,  type: 'sine' },
    { f: freq * 2.0, a: 0.45, type: 'sine' },
    { f: freq * 4.0, a: 0.18, type: 'sine' },
    { f: freq * 6.2, a: 0.06, type: 'triangle' },
  ];
  partials.forEach(p=>{
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = p.type;
    osc.frequency.value = p.f;
    const peak = Math.max(0.0001, vol * p.a);
    g.gain.setValueAtTime(0.0001, when);
    g.gain.linearRampToValueAtTime(peak, when + 0.004); // より鋭いアタック
    g.gain.exponentialRampToValueAtTime(Math.max(0.0001, peak * 0.35), when + 0.08);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    osc.connect(g);
    g.connect(bgmMaster);
    osc.start(when);
    osc.stop(when + dur + 0.03);
  });
}

/** ストリングス風パッド: 遅いアタック・長い持続（saw + わずかなデチューン） */
function bgmStrings(freqs, when, dur, vol){
  if(!audioCtx || !bgmMaster || !freqs || !freqs.length) return;
  freqs.forEach((freq, idx)=>{
    // 2本デチューンで厚み
    [1, 1.004].forEach((det, di)=>{
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      const filt = audioCtx.createBiquadFilter();
      osc.type = 'sawtooth';
      osc.frequency.value = freq * det;
      filt.type = 'lowpass';
      filt.frequency.setValueAtTime(900 + vol * 2000, when);
      filt.frequency.linearRampToValueAtTime(1400 + vol * 2500, when + dur * 0.5);
      filt.Q.value = 0.7;
      const peak = vol * (0.55 + (idx === 0 ? 0.15 : 0.08)) * (di === 0 ? 1 : 0.7);
      g.gain.setValueAtTime(0.0001, when);
      g.gain.linearRampToValueAtTime(peak, when + 0.35); // 遅いアタック
      g.gain.setValueAtTime(peak, when + Math.max(0.4, dur - 0.4));
      g.gain.linearRampToValueAtTime(0.0001, when + dur);
      osc.connect(filt);
      filt.connect(g);
      g.connect(bgmMaster);
      osc.start(when);
      osc.stop(when + dur + 0.05);
    });
  });
}

function bgmPlayPulse(freq, when, vol){
  if(!audioCtx || !bgmMaster || !freq) return;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  g.gain.setValueAtTime(0.001, when);
  g.gain.linearRampToValueAtTime(vol, when + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, when + 0.2);
  osc.connect(g);
  g.connect(bgmMaster);
  osc.start(when);
  osc.stop(when + 0.24);
}

/* ---- ドラム（Web Audioで合成）---- */
function bgmKick(when, vol){
  if(!audioCtx || !bgmMaster) return;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(150, when);
  osc.frequency.exponentialRampToValueAtTime(45, when + 0.12);
  g.gain.setValueAtTime(0.0001, when);
  g.gain.linearRampToValueAtTime(vol, when + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, when + 0.28);
  osc.connect(g);
  g.connect(bgmMaster);
  osc.start(when);
  osc.stop(when + 0.32);
}
function bgmSnare(when, vol){
  if(!audioCtx || !bgmMaster) return;
  const len = Math.max(1, Math.floor(audioCtx.sampleRate * 0.12));
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<len;i++) data[i] = Math.random()*2 - 1;
  const noise = audioCtx.createBufferSource();
  noise.buffer = buf;
  const ng = audioCtx.createGain();
  const filt = audioCtx.createBiquadFilter();
  filt.type = 'highpass';
  filt.frequency.value = 1200;
  ng.gain.setValueAtTime(0.0001, when);
  ng.gain.linearRampToValueAtTime(vol, when + 0.008);
  ng.gain.exponentialRampToValueAtTime(0.0001, when + 0.1);
  noise.connect(filt);
  filt.connect(ng);
  ng.connect(bgmMaster);
  noise.start(when);
  noise.stop(when + 0.12);
  const osc = audioCtx.createOscillator();
  const og = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.value = 180;
  og.gain.setValueAtTime(0.0001, when);
  og.gain.linearRampToValueAtTime(vol * 0.45, when + 0.005);
  og.gain.exponentialRampToValueAtTime(0.0001, when + 0.08);
  osc.connect(og);
  og.connect(bgmMaster);
  osc.start(when);
  osc.stop(when + 0.1);
}
function bgmHat(when, vol, open){
  if(!audioCtx || !bgmMaster) return;
  const dur = open ? 0.14 : 0.045;
  const len = Math.max(1, Math.floor(audioCtx.sampleRate * dur));
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<len;i++) data[i] = Math.random()*2 - 1;
  const noise = audioCtx.createBufferSource();
  noise.buffer = buf;
  const filt = audioCtx.createBiquadFilter();
  filt.type = 'highpass';
  filt.frequency.value = open ? 6000 : 8000;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, when);
  g.gain.linearRampToValueAtTime(vol, when + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  noise.connect(filt);
  filt.connect(g);
  g.connect(bgmMaster);
  noise.start(when);
  noise.stop(when + dur + 0.02);
}

function bgmScheduleDrums(when, section, dens){
  const step = BGM_BAR_SEC / 8;
  const kVol = 0.11 * dens;
  const sVol = 0.07 * dens;
  const hVol = 0.028 * dens;

  if(section === 'A'){
    [0, 4].forEach(i => bgmKick(when + i*step, kVol));
    [2, 6].forEach(i => bgmSnare(when + i*step, sVol * 0.85));
    for(let i=0;i<8;i++) bgmHat(when + i*step, hVol * (i%2?0.7:1), false);
  } else if(section === 'B'){
    [0, 3, 4, 6].forEach(i => bgmKick(when + i*step, kVol * (i===0||i===4?1:0.75)));
    [2, 6].forEach(i => bgmSnare(when + i*step, sVol));
    for(let i=0;i<8;i++) bgmHat(when + i*step, hVol, false);
    bgmHat(when + 7*step, hVol * 1.2, true);
  } else if(section === 'S'){
    [0, 2, 4, 6].forEach(i => bgmKick(when + i*step, kVol * 1.05));
    [2, 6].forEach(i => bgmSnare(when + i*step, sVol * 1.15));
    [1, 3, 5, 7].forEach(i => bgmHat(when + i*step, hVol * 0.9, false));
    [0, 2, 4, 6].forEach(i => bgmHat(when + i*step, hVol * 1.1, false));
    bgmHat(when + 7*step, hVol * 1.4, true);
  } else {
    [0, 4].forEach(i => bgmKick(when + i*step, kVol * 0.7));
    [2, 6].forEach(i => bgmSnare(when + i*step, sVol * 0.55));
    for(let i=0;i<8;i+=2) bgmHat(when + i*step, hVol * 0.6, false);
  }
}

function bgmScheduleOneBar(when){
  const score = bgmCurrentScore();
  const bar = score[bgmBarIndex % score.length];
  bgmBarIndex++;
  const step = BGM_BAR_SEC / 4;
  const dens = bar.dens;
  const pulse = bar.pulse;
  const sec = bar.section;

  // ドラム（癒し曲はほぼ無し）
  if(sec !== 'H'){
    bgmScheduleDrums(when, sec, dens);
  } else if(dens > 0.4){
    // ごく薄いハイハットだけ
    bgmHat(when, 0.012, false);
    bgmHat(when + BGM_BAR_SEC * 0.5, 0.008, false);
  }

  // ストリングス：サビ、または癒し曲は薄いパッド
  if(sec === 'S'){
    const strFreqs = bar.chord.map(f => f * 0.5);
    bgmStrings(strFreqs, when, BGM_BAR_SEC + 0.15, 0.024);
  } else if(sec === 'H'){
    const strFreqs = bar.chord.map(f => f * 0.5);
    bgmStrings(strFreqs, when, BGM_BAR_SEC + 0.25, 0.014);
  }

  // 木琴：コードの土台（癒しはさらに小さく・長め）
  const chordVol = sec === 'H' ? 0.007 + dens * 0.004 : 0.010 + dens * 0.006;
  const chordSus = sec === 'H' ? 0.75 + dens * 0.15 : 0.55 + dens * 0.12;
  bar.chord.forEach((f, i)=>{
    bgmXylo(f, when + i * 0.03, chordVol, chordSus);
  });

  // 木琴メロディ
  bar.mel.forEach((f, i)=>{
    const melVol = sec === 'H' ? 0.012 + dens * 0.008 : 0.018 + dens * 0.012;
    const sus = sec === 'S' ? 0.55 : (sec === 'H' ? 0.65 : 0.45);
    bgmXylo(f, when + i * step, melVol, sus);
  });

  // 鉄琴
  if(sec === 'H'){
    // まばらなきらめきだけ
    bgmGlock(bar.mel[0] * 2, when + 0.04, 0.008, 0.85);
    if(dens > 0.35) bgmGlock(bar.mel[2] * 2, when + step * 2 + 0.05, 0.006, 0.7);
  } else if(sec === 'A'){
    bgmGlock(bar.mel[0] * 2, when, 0.012, 0.6);
    bgmGlock(bar.mel[2] * 2, when + step * 2, 0.010, 0.5);
  } else if(sec === 'B'){
    bar.mel.forEach((f, i)=>{
      if(i % 2 === 0) bgmGlock(f * 2, when + i * step + 0.03, 0.014, 0.55);
    });
  } else if(sec === 'S'){
    bar.mel.forEach((f, i)=>{
      bgmGlock(f * 2, when + i * step, 0.018 + dens * 0.006, 0.65);
    });
    const top = Math.max(...bar.chord);
    bgmGlock(top * 2, when + 0.05, 0.012, 0.7);
  } else {
    bgmGlock(bar.mel[0] * 2, when, 0.008, 0.5);
  }

  // 低音パルス（癒しはごく弱く）
  for(let i = 0; i < 4; i++){
    const base = sec === 'H' ? (i === 0 ? 0.016 : 0.008) : (i === 0 ? 0.032 : 0.018);
    bgmPlayPulse(bar.bass, when + i * step, base * pulse);
  }
}

function bgmFillSchedule(){
  if(!bgmOn || !audioCtx) return;
  if(audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
  const now = audioCtx.currentTime;
  if(bgmNextTime < now + 0.05) bgmNextTime = now + 0.08;
  let n = 0;
  while(bgmNextTime < now + BGM_AHEAD_SEC && n < 20){
    bgmScheduleOneBar(bgmNextTime);
    bgmNextTime += BGM_BAR_SEC;
    n++;
  }
}

function bgmStart(){
  if(bgmTimerId){ clearInterval(bgmTimerId); bgmTimerId = null; }
  bgmBarIndex = 0; // 曲の先頭から
  if(audioCtx){
    const now = audioCtx.currentTime;
    if(!bgmNextTime || bgmNextTime < now + 0.02 || bgmNextTime > now + BGM_AHEAD_SEC + 1){
      bgmNextTime = now + 0.05;
    }
  }
  bgmFillSchedule();
  bgmTimerId = setInterval(()=>{
    if(!bgmOn){
      if(bgmTimerId){ clearInterval(bgmTimerId); bgmTimerId = null; }
      return;
    }
    bgmFillSchedule();
  }, 400);
}

function bgmStop(){
  if(bgmTimerId){ clearInterval(bgmTimerId); bgmTimerId = null; }
  if(bgmMaster && audioCtx){
    const t = audioCtx.currentTime;
    bgmMaster.gain.cancelScheduledValues(t);
    bgmMaster.gain.setValueAtTime(bgmMaster.gain.value, t);
    bgmMaster.gain.linearRampToValueAtTime(0.001, t + 0.12);
  }
}

function cycleBgmTrack(){
  if(bgmToggleLock) return;
  bgmToggleLock = true;
  setTimeout(()=>{ bgmToggleLock = false; }, 280);

  ensureAudio();
  if(audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});

  bgmTrackIndex = (bgmTrackIndex + 1) % BGM_TRACKS.length;

  if(bgmOn){
    bgmResetBus(true);
    bgmStart();
  } else {
    bgmBarIndex = 0;
    bgmNextTime = 0;
  }
  try { render(); } catch(_e) {}
}
function toggleBgm(){
  if(bgmToggleLock) return;
  bgmToggleLock = true;
  setTimeout(()=>{ bgmToggleLock = false; }, 300);

  ensureAudio();
  if(audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});

  bgmOn = !bgmOn;
  if(bgmOn){
    bgmResetBus(true);
    bgmStart();
  } else {
    bgmStop();
    // 停止時もバスを切って予約音を無効化
    try{
      if(bgmMaster){
        bgmMaster.gain.value = 0;
        bgmMaster.disconnect();
      }
    }catch(_e){}
    bgmMaster = audioCtx.createGain();
    bgmMaster.gain.value = 0;
    bgmMaster.connect(audioCtx.destination);
    bgmNextTime = 0;
    bgmBarIndex = 0;
  }
  try { render(); } catch(_e) {}
}
